<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supporter Wall — Hookitlingo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="support-widget.css">
<script src="support-widget.js"></script>

<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --patron:#b98af0; --patron-dim:#3a2c50;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --kr:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",sans-serif;
  --maxw:1080px;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
  --patron:#8f5ac8; --patron-dim:#ecdcfa;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:16px; line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
  min-height:100vh;
}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .4em;}
a{color:inherit;}

/* Cherry blossom petals — identical to the rest of the site */
.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

#topbar{
  position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; max-width:var(--maxw); margin:0 auto; gap:16px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-block.kr{
  width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--vermilion),var(--gold));
  display:flex; align-items:center; justify-content:center; font-family:var(--kr); font-weight:700; color:#fff; font-size:1.1em;
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.05em;}
.brand-txt span{display:block; font-size:.75em; color:var(--text-faint);}
.top-actions{display:flex; gap:8px; flex-wrap:wrap;}
.topbtn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:999px;
  padding:9px 16px; font-size:.85em; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--sans); transition:filter .15s;
}
.topbtn:hover{filter:brightness(1.12);}
.topbtn-support{background:linear-gradient(135deg,var(--vermilion),var(--gold)); border:none; color:#fff; font-weight:600;}

.hero{position:relative; z-index:2; max-width:var(--maxw); margin:40px auto 20px; padding:0 28px; text-align:center;}
.eyebrow{font-size:.78em; letter-spacing:.2em; text-transform:uppercase; color:var(--text-faint); margin-bottom:10px; font-weight:600;}
.hero h1{
  font-size:2.3em; margin:0 0 14px;
  background:linear-gradient(120deg, var(--gold) 0%, #f6e2ac 30%, var(--vermilion) 65%, var(--gold) 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; display:inline-block;
}
.hero .sub{color:var(--text-dim); max-width:560px; margin:0 auto; font-size:1.02em;}

.stats-row{
  position:relative; z-index:2; max-width:var(--maxw); margin:28px auto; padding:0 28px;
  display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
}
.stat-pill{
  background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:10px 20px;
  font-size:.85em; color:var(--text-dim); display:flex; align-items:center; gap:8px;
}
.stat-pill b{color:var(--gold); font-family:var(--serif); font-size:1.15em;}

.wall{
  position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:20px 28px 60px;
  display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:18px;
}

.blossom-card{
  position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px 22px 20px; overflow:hidden; transition:transform .2s, border-color .2s;
}
.blossom-card:hover{transform:translateY(-3px); border-color:var(--card-accent, var(--gold));}
.blossom-card::before{
  content:""; position:absolute; top:0; left:0; right:0; height:4px; background:var(--card-accent, var(--gold));
}
.card-top{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.card-icon{width:34px; height:34px; flex:none;}
.card-name{font-family:var(--serif); font-weight:600; font-size:1.15em; line-height:1.2;}
.card-tier{
  font-size:.68em; letter-spacing:.1em; text-transform:uppercase; font-weight:700;
  color:var(--card-accent, var(--gold)); margin-top:2px;
}
.card-msg{
  font-family:var(--serif); font-style:italic; color:var(--text-dim); font-size:1.02em; line-height:1.6;
  position:relative; padding-left:18px;
}
.card-msg::before{content:"\201C"; position:absolute; left:-4px; top:-6px; font-size:1.8em; color:var(--card-accent, var(--gold)); opacity:.5; font-family:var(--serif);}
.card-date{font-size:.72em; color:var(--text-faint); margin-top:14px;}

.empty-state, .load-state{
  grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-dim);
}
.empty-state h3{color:var(--text);}
.cta-btn{
  display:inline-block; margin-top:14px; background:linear-gradient(135deg,var(--vermilion),var(--gold));
  color:#fff; border:none; border-radius:999px; padding:12px 26px; font-weight:600; cursor:pointer; font-size:.95em;
}

footer{position:relative; z-index:2; text-align:center; padding:30px 20px 50px; color:var(--text-faint); font-size:.82em;}
footer a{color:var(--gold); text-decoration:none;}
</style>
</head>
<body>

<div class="petals no-print" id="petals" aria-hidden="true"></div>

<div id="topbar">
  <div class="brand">
    <div class="brand-block kr">虎</div>
    <div class="brand-txt"><strong>Hookitlingo</strong><span>Korean &amp; Japanese, one file at a time</span></div>
  </div>
  <div class="top-actions">
    <a class="topbtn" href="index.html">🏠 Home</a>
    <a class="topbtn" href="feedback.html">💬 Feedback</a>
    <button class="topbtn topbtn-support" id="supportBtn">💛 Support</button>
    <button class="topbtn" id="themeBtn">☾ Dark</button>
  </div>
</div>

<div class="hero">
  <div class="eyebrow">Hookitlingo</div>
  <h1>The Supporter Wall</h1>
  <p class="sub">Every name here helped keep Japanese &amp; Korean learning free for someone else. Thank you for being part of it.</p>
</div>

<div class="stats-row" id="statsRow"></div>

<div class="wall" id="wall">
  <div class="load-state" id="loadState">Loading supporters…</div>
</div>

<footer>
  Want your name up here? <a href="#" id="footerSupportLink">Become a Supporter →</a>
</footer>

<script>
const TIER_META = {
  supporter: { label:'Supporter', accentVar:'--vermilion' },
  founding:  { label:'Founding Supporter', accentVar:'--gold' },
  patron:    { label:'Patron', accentVar:'--patron' },
};

function blossomIcon(accentVar){
  return `<svg viewBox="0 0 100 100" class="card-icon">
    <g transform="translate(50,50)">
      ${[0,72,144,216,288].map(a=>`<g transform="rotate(${a}) translate(0,-16)">
        <path d="M46 52c6 6 6 14 0 20-6-6-6-14 0-20Z" fill="var(${accentVar})" opacity="0.85" transform="translate(-46,-62) scale(0.62)"/>
      </g>`).join('')}
      <circle cx="0" cy="0" r="4.5" fill="var(--surface)"/>
    </g>
  </svg>`;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeAgo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined, {year:'numeric', month:'long'});
}

function render(items){
  const wall = document.getElementById('wall');
  const stats = document.getElementById('statsRow');

  if(!items.length){
    wall.innerHTML = `<div class="empty-state">
      <h3>Be the first blossom on the wall 🌸</h3>
      <p>No supporters yet — this could be the first name people see.</p>
      <button class="cta-btn" onclick="HookitSupport.open()">Become a Supporter</button>
    </div>`;
    stats.innerHTML = '';
    return;
  }

  const counts = { supporter:0, founding:0, patron:0 };
  items.forEach(it => { if(counts[it.tier] !== undefined) counts[it.tier]++; });

  stats.innerHTML = `
    <div class="stat-pill"><b>${items.length}</b>&nbsp;supporters</div>
    <div class="stat-pill"><b>${counts.founding}</b>&nbsp;founding</div>
    <div class="stat-pill"><b>${counts.patron}</b>&nbsp;patrons</div>
  `;

  wall.innerHTML = items.map(it => {
    const meta = TIER_META[it.tier] || TIER_META.supporter;
    return `<div class="blossom-card" style="--card-accent:var(${meta.accentVar})">
      <div class="card-top">
        ${blossomIcon(meta.accentVar)}
        <div>
          <div class="card-name">${escapeHtml(it.name)}</div>
          <div class="card-tier">${meta.label}</div>
        </div>
      </div>
      ${it.message ? `<div class="card-msg">${escapeHtml(it.message)}</div>` : ''}
      <div class="card-date">${timeAgo(it.created)}</div>
    </div>`;
  }).join('');
}

fetch('/api/supporters')
  .then(r => r.json())
  .then(data => {
    if(data.error){ throw new Error(data.error); }
    render(data.items || []);
  })
  .catch(err => {
    console.error(err);
    document.getElementById('wall').innerHTML = `<div class="empty-state">
      <h3>Couldn't load the wall right now</h3>
      <p>Please try again in a moment.</p>
    </div>`;
  });

document.getElementById('supportBtn').onclick = () => HookitSupport.open();
document.getElementById('footerSupportLink').onclick = (e) => { e.preventDefault(); HookitSupport.open(); };

/* Theme toggle — identical to the rest of the site */
const ThemeState = { theme: localStorage.getItem('hkl_site_theme') || 'dark' };
function applyTheme(){
  document.documentElement.setAttribute('data-theme', ThemeState.theme);
  document.getElementById('themeBtn').textContent = ThemeState.theme === 'dark' ? '☾ Dark' : '☀ Light';
}
document.getElementById('themeBtn').onclick = () => {
  ThemeState.theme = ThemeState.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('hkl_site_theme', ThemeState.theme);
  applyTheme();
};
applyTheme();

/* Drifting cherry blossom petals — identical to the rest of the site */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
</body>
</html>
