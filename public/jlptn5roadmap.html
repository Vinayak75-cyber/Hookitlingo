<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --maxw:720px;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans); line-height:1.65;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed; min-height:100vh;
}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .4em;}
p{margin:0 0 1em;}
a{color:var(--celadon); text-decoration:none;}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}

/* Petals */
.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{0%{transform:translate(0,-10vh) rotate(0deg);} 100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} .reveal{opacity:1 !important; transform:none !important;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

/* Top bar */
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:16px 5vw 20px; max-width:1080px; margin:0 auto;
}
#topbar::before{
  content:""; position:absolute; left:0; right:0; top:0;
  height:100%; padding-bottom:36px; margin-bottom:-36px;
  background-color:color-mix(in srgb, var(--ink) 72%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%);
  -webkit-mask-image:linear-gradient(to bottom, #000 58%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 58%, transparent 100%);
  opacity:0; pointer-events:none; z-index:-1;
  transition:opacity .35s ease;
}
#topbar.is-scrolled::before{ opacity:1; }
#topbar.is-scrolled{ padding-top:10px; padding-bottom:20px; }
#topbar .brand, #topbar .top-actions{ position:relative; z-index:1; }
.brand{display:flex; align-items:center; gap:12px;}
.brand-block{
  width:42px;height:42px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:18px; color:#fff9f7;
  transform:rotate(-7deg); box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.15em;}
.brand-txt span{display:block; font-size:.66em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}
.top-actions{display:flex; gap:8px; align-items:center;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:7px 14px; font-size:.85em;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn-support{
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  border:1px solid transparent; color:#fff; font-weight:600;
}
.topbtn-support:hover{filter:brightness(1.07); color:#fff;}

/* Hero */
.hero{position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:20px 5vw 10px; text-align:center;}
.eyebrow{font-size:.78em; letter-spacing:.16em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:14px;}
.hero h1{font-size:clamp(1.9em,5vw,3em); margin-bottom:14px;}
.hero .sub{color:var(--text-dim); font-size:1.08em; max-width:560px; margin:0 auto 22px;}
.hero-cta{
  display:inline-block; padding:12px 26px; border-radius:999px; font-weight:700; font-size:.92em;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff; box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 40%, transparent);
}
.hero-cta:hover{filter:brightness(1.06); color:#fff;}

/* Overall progress strip */
.overall-progress{
  position:relative; z-index:2; max-width:560px; margin:34px auto 44px; padding:22px 26px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.overall-progress .op-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
.overall-progress .op-row b{font-family:var(--serif); font-size:1.6em; color:var(--gold);}
.overall-progress .op-row span{color:var(--text-faint); font-size:.82em;}
.op-track{height:10px; background:var(--surface2); border-radius:6px; overflow:hidden;}
.op-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--vermilion),var(--gold)); transition:width 1.2s cubic-bezier(.2,.9,.2,1);}
.op-note{margin-top:14px; font-size:.8em; color:var(--text-faint); text-align:center;}
.op-note a{color:var(--gold); font-weight:600;}

/* Lesson list */
.lessons{position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:0 5vw 100px; display:flex; flex-direction:column; gap:12px;}

.rcard{
  position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:16px; transition:border-color .2s, transform .2s;
  opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease, border-color .2s;
}
.rcard.in-view{opacity:1; transform:translateY(0);}
.rcard.open{border-color:color-mix(in srgb, var(--celadon) 50%, var(--border));}
.rcard.open:hover{border-color:var(--celadon); transform:translateX(4px) translateY(0);}
.rcard.locked{opacity:.85;}

.rcard-badge{
  width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:700; font-size:1.15em; color:#fff;
}
.rcard.open .rcard-badge{background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--celadon) 88%, #fff 12%), var(--celadon) 72%);}
.rcard.locked .rcard-badge{background:var(--surface3); color:var(--text-faint);}

.rcard-body{flex:1; min-width:0;}
.rc-title{font-size:1.02em; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.rc-desc{color:var(--text-dim); font-size:.84em; margin-top:3px;}
.rc-free-tag{font-size:.6em; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:2px 9px; border-radius:10px; background:var(--celadon-dim); color:var(--celadon);}
.rc-locked-tag{font-size:.6em; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:2px 9px; border-radius:10px; background:var(--surface2); color:var(--text-faint); border:1px solid var(--border); display:inline-flex; align-items:center; gap:4px;}

.rcard-actions{flex:none;}
.rc-btn{font-size:.8em; font-weight:600; padding:9px 16px; border-radius:999px; white-space:nowrap; border:none; display:inline-block;}
.rc-btn.open-btn{background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%)); color:#fff;}
.rc-btn.open-btn:hover{filter:brightness(1.06); color:#fff;}
.rc-btn.support-btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff;}
.rc-btn.support-btn:hover{filter:brightness(1.06); color:#fff;}

@media(max-width:520px){
  .rcard{flex-wrap:wrap;}
  .rcard-actions{width:100%;}
  .rc-btn{width:100%; text-align:center;}
}
</style>
</head>
<body>

<div class="petals" id="petals"></div>

<div id="topbar">
  <div class="brand">
    <div class="brand-block jp">日</div>
    <div class="brand-txt"><strong>Hookitlingo</strong><span>JLPT N5 Roadmap</span></div>
  </div>
  <div class="top-actions">
    <!-- Replace this href with your Ko-fi goal page URL -->
    <a class="topbtn topbtn-support" href="https://ko-fi.com/hookitlingo/goal?g=26" target="_blank" rel="noopener">Support the Goal</a>
    <button class="topbtn" id="themeBtn">☾ Dark</button>
  </div>
</div>

<div class="hero">
  <div class="eyebrow">Free to Start</div>
  <h1>15 lessons. Zero to <span class="jp" style="color:var(--gold); font-style:italic;">N5</span>-ready.</h1>
  <p class="sub">Try Lesson 1 free right now. Every other lesson unlocks for everyone, no matter how much you gave, once we hit the funding goal together.</p>
  <!-- Replace this href with your Ko-fi goal page URL -->
  <a class="hero-cta" href="https://ko-fi.com/hookitlingo/goal?g=26" target="_blank" rel="noopener">Support the Goal →</a>
</div>

<div class="overall-progress" id="overallProgress"></div>

<div class="lessons" id="lessons"></div>

<script>
/* ============================================================
   LESSON DATA
   status: 'open'   -> free, links straight to the file in
                       /coursesjp on this same site.
           'locked' -> not uploaded yet; button links straight to
                       Ko-fi. No cookies, no unlock codes, no API
                       calls on this page at all.
   Update `file` values to match whatever you actually name the
   files once you upload them to /coursesjp.
   ============================================================ */

// Replace with your real Ko-fi goal page URL. This is used by every locked lesson's button.
const KOFI_URL = 'https://ko-fi.com/hookitlingo/goal?g=26';

const LESSONS = [
  { n:1,  file:'coursesjp/jlpt-n5-s01-l01.html', title:'Hiragana', desc:'Full hiragana chart with reading and listening drills, no-romaji exit test.', status:'open' },
  { n:2,  file:'coursesjp/jlpt-n5-s01-l02.html', title:'Katakana', desc:'Full katakana chart for loanwords and foreign names, with drills and an exit test.', status:'locked' },
  { n:3,  file:'coursesjp/jlpt-n5-s02-l01.html', title:'New Friends', desc:'Xは Yです and its forms, も and の, self-introduction and occupation vocabulary.', status:'locked' },
  { n:4,  file:'coursesjp/jlpt-n5-s03-l01.html', title:'Shopping &amp; School Life', desc:'これ／それ／あれ, どれ／どの, ここ／そこ／あそこ, なに／なん.', status:'locked' },
  { n:5,  file:'coursesjp/jlpt-n5-s04-l01.html', title:'Numbers &amp; Counting', desc:'〜があります／〜がいます, core counters, and numbers 1–10,000.', status:'locked' },
  { n:6,  file:'coursesjp/jlpt-n5-s04-l02.html', title:'Location &amp; Direction', desc:'に vs で, spatial nouns, and へ, through rooms, directions, and landmarks.', status:'locked' },
  { n:7,  file:'coursesjp/jlpt-n5-s05-l01.html', title:'Verbs I', desc:'ます-form present/past, affirmative/negative, を・に・で, intro to 〜ませんか／〜ましょう.', status:'locked' },
  { n:8,  file:'coursesjp/jlpt-n5-s06-l01.html', title:'Adjectives &amp; Preferences', desc:'い- and な-adjective conjugation, 〜が好きです／〜が嫌いです, 〜くて／〜で.', status:'locked' },
  { n:9,  file:'coursesjp/jlpt-n5-s07-l01.html', title:'Verbs II', desc:'て-form for all verb groups, 〜てください, 〜てもいいですか, 〜てはいけません.', status:'locked' },
  { n:10, file:'coursesjp/jlpt-n5-s08-l01.html', title:'Calendar', desc:'Days, months, dates, irregular counters, 〜曜日, 先週／今週／来週.', status:'locked' },
  { n:11, file:'coursesjp/jlpt-n5-s08-l02.html', title:'Clock Time', desc:'Telling time (〜時〜分), から〜まで, and frequency adverbs.', status:'locked' },
  { n:12, file:'coursesjp/jlpt-n5-s09-l01.html', title:'Verbs III &amp; Family', desc:'Plain/dictionary form, 〜ないでください, plain form + と思います, family terms.', status:'locked' },
  { n:13, file:'coursesjp/jlpt-n5-s10-l01.html', title:'Comparisons &amp; Preferences', desc:'AはBより〜, 〜の方が〜, 〜で一番〜, 〜たいです／〜たくないです.', status:'locked' },
  { n:14, file:'coursesjp/jlpt-n5-s11-l01.html', title:'Connecting Ideas &amp; Invitations', desc:'〜から, 〜とき, 〜ましょう, 〜ませんか, そして／それから.', status:'locked' },
  { n:15, file:'coursesjp/jlpt-n5-s12-l01.html', title:'Ability, Experience &amp; Hobbies', desc:'〜ことができます, 〜ことがあります, dictionary form + こと, full past-tense review.', status:'locked' },
];

function renderOverall(){
  const total = LESSONS.length;
  const live = LESSONS.filter(l=>l.status==='open').length;
  const pct = Math.round((live/total)*100);
  document.getElementById('overallProgress').innerHTML = `
    <div class="op-row"><span>Lessons unlocked</span><b>${live} / ${total}</b></div>
    <div class="op-track"><div class="op-fill" style="width:${pct}%"></div></div>
    <div class="op-note">Lessons 2–15 unlock for everyone once the goal is reached. <a href="${KOFI_URL}" target="_blank" rel="noopener">Support it here →</a></div>
  `;
}

function lessonCard(l){
  if(l.status === 'open'){
    return `
    <div class="rcard open">
      <div class="rcard-badge">${l.n}</div>
      <div class="rcard-body">
        <div class="rc-title">Lesson ${l.n}: ${l.title} <span class="rc-free-tag">Free</span></div>
        <div class="rc-desc">${l.desc}</div>
      </div>
      <div class="rcard-actions">
        <a class="rc-btn open-btn" href="${l.file}" target="_blank" rel="noopener">Open</a>
      </div>
    </div>`;
  }
  return `
  <div class="rcard locked">
    <div class="rcard-badge">${l.n}</div>
    <div class="rcard-body">
      <div class="rc-title">Lesson ${l.n}: ${l.title} <span class="rc-locked-tag">🔒 Locked</span></div>
      <div class="rc-desc">${l.desc}</div>
    </div>
    <div class="rcard-actions">
      <a class="rc-btn support-btn" href="${KOFI_URL}" target="_blank" rel="noopener">Support to Unlock</a>
    </div>
  </div>`;
}

function renderLessons(){
  const host = document.getElementById('lessons');
  host.innerHTML = LESSONS.map(lessonCard).join('');

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in-view'); });
  }, {threshold:.1});
  document.querySelectorAll('.rcard').forEach(el=>io.observe(el));
}

renderOverall();
renderLessons();

/* Sticky top bar scroll shadow */
(function(){
  const bar = document.getElementById('topbar');
  const onScroll = () => bar.classList.toggle('is-scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
})();

/* Theme toggle - shares the same key as the rest of the site */
const ThemeState = { theme: localStorage.getItem('hkl_site_theme') || 'dark' };
function applyTheme(){
  document.documentElement.setAttribute('data-theme', ThemeState.theme);
  document.getElementById('themeBtn').textContent = ThemeState.theme === 'dark' ? '☾ Dark' : '☀ Light';
}
document.getElementById('themeBtn').onclick = () => {
  ThemeState.theme = ThemeState.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('hkl_site_theme', ThemeState.theme);
  applyTheme();
};
applyTheme();

/* Petals - same drifting system as every other page */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
</body>
