<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --maxw:720px;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans); line-height:1.65;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed; min-height:100vh;
}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .4em;}
p{margin:0 0 1em;}
a{color:var(--celadon); text-decoration:none;}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}

/* Petals */
.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{0%{transform:translate(0,-10vh) rotate(0deg);} 100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} .reveal{opacity:1 !important; transform:none !important;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

/* Top bar */
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  gap:14px; padding:16px 5vw 20px; max-width:1080px; margin:0 auto;
}
#topbar::before{
  content:""; position:absolute; left:0; right:0; top:0;
  height:100%; padding-bottom:36px; margin-bottom:-36px;
  background-color:color-mix(in srgb, var(--ink) 72%, transparent);
  -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%);
  -webkit-mask-image:linear-gradient(to bottom, #000 58%, transparent 100%);
  mask-image:linear-gradient(to bottom, #000 58%, transparent 100%);
  opacity:0; pointer-events:none; z-index:-1;
  transition:opacity .35s ease;
}
#topbar.is-scrolled::before{ opacity:1; }
#topbar.is-scrolled{ padding-top:10px; padding-bottom:20px; }
#topbar .brand, #topbar .top-actions{ position:relative; z-index:1; }
.brand{display:flex; align-items:center; gap:12px;}
.brand-block{
  width:42px;height:42px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:18px; color:#fff9f7;
  transform:rotate(-7deg); box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.15em;}
.brand-txt span{display:block; font-size:.66em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}
.top-actions{display:flex; gap:8px; align-items:center;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:7px 14px; font-size:.85em;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn-support{
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  border:1px solid transparent; color:#fff; font-weight:600;
}
.topbtn-support:hover{filter:brightness(1.07); color:#fff;}
.topbtn-support.is-unlocked{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%));
  cursor:default;
}
.topbtn-support.is-unlocked:hover{filter:none;}

/* Hero */
.hero{position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:20px 5vw 10px; text-align:center;}
.eyebrow{font-size:.78em; letter-spacing:.16em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:14px;}
.hero h1{font-size:clamp(1.9em,5vw,3em); margin-bottom:14px;}
.hero .sub{color:var(--text-dim); font-size:1.08em; max-width:560px; margin:0 auto 22px;}
.hero-cta{
  display:inline-block; padding:12px 26px; border-radius:999px; font-weight:700; font-size:.92em;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff; box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 40%, transparent);
  border:none; cursor:pointer;
}
.hero-cta:hover{filter:brightness(1.06); color:#fff;}
.hero-cta.is-unlocked{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%));
  box-shadow:0 10px 26px color-mix(in srgb, var(--celadon) 40%, transparent);
  cursor:default;
}
.hero-cta.is-unlocked:hover{filter:none;}
.hero-price{margin-top:12px; font-size:.8em; color:var(--text-faint);}
.hero-price b{color:var(--gold); font-family:var(--serif); font-size:1.15em;}
.hero-price a{color:var(--gold); font-weight:600;}

/* Lesson list */
.lessons{position:relative; z-index:2; max-width:var(--maxw); margin:36px auto 0; padding:0 5vw 100px; display:flex; flex-direction:column; gap:12px;}

.rcard{
  position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; display:flex; align-items:center; gap:16px; transition:border-color .2s, transform .2s;
  opacity:0; transform:translateY(16px); transition:opacity .5s ease, transform .5s ease, border-color .2s;
}
.rcard.in-view{opacity:1; transform:translateY(0);}
.rcard.open{border-color:color-mix(in srgb, var(--celadon) 50%, var(--border));}
.rcard.open:hover{border-color:var(--celadon); transform:translateX(4px) translateY(0);}
.rcard.locked{opacity:.85;}

.rcard-badge{
  width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:700; font-size:1.15em; color:#fff;
}
.rcard.open .rcard-badge{background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--celadon) 88%, #fff 12%), var(--celadon) 72%);}
.rcard.locked .rcard-badge{background:var(--surface3); color:var(--text-faint);}

.rcard-body{flex:1; min-width:0;}
.rc-title{font-size:1.02em; font-weight:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.rc-desc{color:var(--text-dim); font-size:.84em; margin-top:3px;}
.rc-free-tag{font-size:.6em; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:2px 9px; border-radius:10px; background:var(--celadon-dim); color:var(--celadon);}
.rc-locked-tag{font-size:.6em; text-transform:uppercase; letter-spacing:.06em; font-weight:700; padding:2px 9px; border-radius:10px; background:var(--surface2); color:var(--text-faint); border:1px solid var(--border); display:inline-flex; align-items:center; gap:4px;}

.rcard-actions{flex:none;}
.rc-btn{font-size:.8em; font-weight:600; padding:9px 16px; border-radius:999px; white-space:nowrap; border:none; display:inline-block;}
.rc-btn.open-btn{background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%)); color:#fff;}
.rc-btn.open-btn:hover{filter:brightness(1.06); color:#fff;}
.rc-btn.unlock-btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; cursor:pointer;}
.rc-btn.unlock-btn:hover{filter:brightness(1.06); color:#fff;}

/* ===== Auth: topbar controls ===== */
.topbtn-login{
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  border:1px solid transparent; color:#fff; font-weight:600;
}
.topbtn-login:hover{filter:brightness(1.07); color:#fff;}

.profile-menu{position:relative;}
.profile-backdrop{position:fixed; inset:0; z-index:35; background:transparent; display:none;}
.profile-backdrop.show{display:block;}
.profile-trigger{
  display:flex; align-items:center; justify-content:center; background:none;
  border:1px solid var(--border); border-radius:50%; width:34px; height:34px; padding:0; color:var(--text-dim);
}
.profile-trigger:hover{color:var(--text); border-color:var(--celadon);}
.profile-avatar{
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
}
.profile-avatar svg{width:22px; height:22px; display:block;}
.profile-dropdown{
  position:fixed; width:210px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 20px 45px rgba(0,0,0,.35); padding:8px; display:none; z-index:40;
}
.profile-dropdown.show{display:block;}
.profile-dropdown-status{padding:8px 10px; font-size:.74em; color:var(--text-faint); border-bottom:1px solid var(--border); margin-bottom:6px;}
.profile-dropdown-status b{color:var(--gold);}
.pd-item{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 10px; border-radius:8px;
  background:none; border:none; color:var(--text-dim); font-size:.85em;
}
.pd-item:hover{background:var(--surface2); color:var(--text);}

/* Unlock modal */
.modal-overlay{
  position:fixed; inset:0; z-index:80; background:rgba(10,6,12,.6); display:none;
  align-items:center; justify-content:center; padding:20px; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.modal-overlay.show{display:flex;}
.modal-box{
  width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:26px 24px; box-shadow:0 30px 70px rgba(0,0,0,.4); position:relative;
}
.modal-close{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; background:var(--surface2);
  border:1px solid var(--border); color:var(--text-dim); font-size:1em; display:flex; align-items:center; justify-content:center;
}
.modal-close:hover{color:var(--text);}
.modal-box h3{font-size:1.2em; margin-bottom:6px;}
.modal-box .modal-sub{color:var(--text-dim); font-size:.86em; margin-bottom:18px;}
.modal-input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:.95em; font-family:var(--sans); margin-bottom:10px;
}
.modal-input:focus{outline:none; border-color:var(--celadon);}
.modal-submit{
  width:100%; padding:11px 14px; border-radius:10px; border:none; font-weight:700; font-size:.9em; color:#fff;
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%));
}
.modal-submit:hover{filter:brightness(1.06);}
.modal-submit:disabled{opacity:.6; cursor:default;}
.modal-error{color:var(--vermilion); font-size:.82em; margin-top:10px; min-height:1.2em;}
.modal-note{text-align:center; font-size:.8em; color:var(--text-faint); margin-top:16px;}

.modal-icon{font-size:2.2em; text-align:center; margin-bottom:8px;}
.modal-box h3{text-align:center;}
.modal-secondary-link{
  display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-faint);
  font-size:.82em; padding:6px; text-decoration:underline; margin-top:6px;
}
.modal-secondary-link:hover{color:var(--text);}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); z-index:90;
  background:var(--surface3); border:1px solid var(--border); color:var(--text); padding:10px 18px;
  border-radius:999px; font-size:.85em; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

@media(max-width:520px){
  .rcard{flex-wrap:wrap;}
  .rcard-actions{width:100%;}
  .rc-btn{width:100%; text-align:center;}
}

/* Top nav - mobile */
@media(max-width:640px){
  #topbar{flex-wrap:wrap; row-gap:10px; padding:14px 4vw 16px;}
  #topbar.is-scrolled{padding-top:10px; padding-bottom:14px;}
  .brand-txt span{display:none;}
  .top-actions{
    width:100%; justify-content:flex-start; overflow-x:auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; padding-bottom:2px;
  }
  .top-actions::-webkit-scrollbar{display:none;}
  .topbtn{padding:7px 12px; font-size:.8em; flex:none; white-space:nowrap;}
}
@media(max-width:380px){
  .brand-block{width:36px; height:36px; font-size:15px;}
  .brand-txt strong{font-size:1em;}
}
</style>

  <h1>15 lessons. Zero to <span class="jp" style="color:var(--gold); font-style:italic;">N5</span>-ready.</h1>
  <p class="sub">Try Lesson 1 free right now. Ready for the rest? Unlock the full course, no ads, no subscriptions.</p>
  <button class="hero-cta" id="heroUnlockBtn">Unlock Full Course</button>
  <div class="hero-price">One-time <b>$9.99</b> · lifetime access</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   This page talks directly to the existing server.js endpoints:
     GET  /api/my-access?course=jp   -> { all, slugs }
     POST /api/unlock  { code, course:'jp' } -> { ok, all, slugs, error }
     GET  /api/me       -> { loggedIn, name, status, ... }
     POST /api/login    { email, password }
     POST /api/logout
   No server changes needed. Lesson 1 is a static file in
   /public/coursesjp (never gated), lessons 2-15 are served through
   the protected /lesson/jp/<slug> route once unlocked. An Approved
   account for course "jp" is treated by /api/my-access as full
   ("all") access, same as an ALL code — that's how logging in
   unlocks every lesson below.
   ============================================================ */

const LESSONS = [
  { n:1,  slug:'s01-l01', file:'coursesjp/jlpt-n5-s01-l01.html', title:'Hiragana', desc:'Full hiragana chart with reading and listening drills, no-romaji exit test.' },
  { n:2,  slug:'s01-l02', title:'Katakana', desc:'Full katakana chart for loanwords and foreign names, with drills and an exit test.' },
  { n:3,  slug:'s02-l01', title:'New Friends', desc:'Xは Yです and its forms, も and の, self-introduction and occupation vocabulary.' },
  { n:4,  slug:'s03-l01', title:'Shopping &amp; School Life', desc:'これ／それ／あれ, どれ／どの, ここ／そこ／あそこ, なに／なん.' },
  { n:5,  slug:'s04-l01', title:'Numbers &amp; Counting', desc:'〜があります／〜がいます, core counters, and numbers 1–10,000.' },
  { n:6,  slug:'s04-l02', title:'Location &amp; Direction', desc:'に vs で, spatial nouns, and へ, through rooms, directions, and landmarks.' },
  { n:7,  slug:'s05-l01', title:'Verbs I', desc:'ます-form present/past, affirmative/negative, を・に・で, intro to 〜ませんか／〜ましょう.' },
  { n:8,  slug:'s06-l01', title:'Adjectives &amp; Preferences', desc:'い- and な-adjective conjugation, 〜が好きです／〜が嫌いです, 〜くて／〜で.' },
  { n:9,  slug:'s07-l01', title:'Verbs II', desc:'て-form for all verb groups, 〜てください, 〜てもいいですか, 〜てはいけません.' },
  { n:10, slug:'s08-l01', title:'Calendar', desc:'Days, months, dates, irregular counters, 〜曜日, 先週／今週／来週.' },
  { n:11, slug:'s08-l02', title:'Clock Time', desc:'Telling time (〜時〜分), から〜まで, and frequency adverbs.' },
  { n:12, slug:'s09-l01', title:'Verbs III &amp; Family', desc:'Plain/dictionary form, 〜ないでください, plain form + と思います, family terms.' },
  { n:13, slug:'s10-l01', title:'Comparisons &amp; Preferences', desc:'AはBより〜, 〜の方が〜, 〜で一番〜, 〜たいです／〜たくないです.' },
  { n:14, slug:'s11-l01', title:'Connecting Ideas &amp; Invitations', desc:'〜から, 〜とき, 〜ましょう, 〜ませんか, そして／それから.' },
  { n:15, slug:'s12-l01', title:'Ability, Experience &amp; Hobbies', desc:'〜ことができます, 〜ことがあります, dictionary form + こと, full past-tense review.' },
];

let ACCESS = { all: false, slugs: [] };

function isOpen(l, i){
  return i === 0 || ACCESS.all || ACCESS.slugs.includes(l.slug);
}

function lessonHref(l, i){
  return i === 0 ? l.file : `/lesson/jp/${l.slug}`;
}

function lessonCard(l, i){
  if(isOpen(l, i)){
    return `
    <div class="rcard open">
      <div class="rcard-badge">${l.n}</div>
      <div class="rcard-body">
        <div class="rc-title">Lesson ${l.n}: ${l.title} <span class="rc-free-tag">${i === 0 ? 'Free' : 'Unlocked'}</span></div>
        <div class="rc-desc">${l.desc}</div>
      </div>
      <div class="rcard-actions">
        <a class="rc-btn open-btn" href="${lessonHref(l, i)}" target="_blank" rel="noopener">Open</a>
      </div>
    </div>`;
  }
  return `
  <div class="rcard locked">
    <div class="rcard-badge">${l.n}</div>
    <div class="rcard-body">
      <div class="rc-title">Lesson ${l.n}: ${l.title} <span class="rc-locked-tag">🔒 Locked</span></div>
      <div class="rc-desc">${l.desc}</div>
    </div>
    <div class="rcard-actions">
      <button class="rc-btn unlock-btn" onclick="openUnlockModal()">Unlock</button>
    </div>
  </div>`;
}

function renderLessons(){
  const host = document.getElementById('lessons');
  host.innerHTML = LESSONS.map(lessonCard).join('');

  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in-view'); });
  }, {threshold:.1});
  document.querySelectorAll('.rcard').forEach(el=>io.observe(el));
}

async function loadAccess(){
  try {
    const res = await fetch('/api/my-access?course=jp', { credentials: 'include' });
    if(res.ok){
      const data = await res.json();
      ACCESS = { all: !!data.all, slugs: Array.isArray(data.slugs) ? data.slugs : [] };
    }
  } catch (err) {
    // Network hiccup - fall back to nothing-unlocked and let the
    // learner try again via the code modal.
  }
  renderLessons();
  updateUnlockButtons();
}

// Flips the hero/topbar unlock buttons to a green "Course Unlocked"
// state once ACCESS.all is true (whether that came from a code or a
// logged-in Approved account) — same celadon gradient as the other
// unlocked/confirm buttons on the page, so it reads as "done" rather
// than as another call to action.
function updateUnlockButtons(){
  const heroBtn = document.getElementById('heroUnlockBtn');
  const topBtn = document.getElementById('topUnlockBtn');
  [heroBtn, topBtn].forEach(btn => {
    if(!btn) return;
    if(ACCESS.all){
      btn.textContent = 'Course Unlocked';
      btn.classList.add('is-unlocked');
      btn.onclick = null;
    } else {
      btn.textContent = 'Unlock Full Course';
      btn.classList.remove('is-unlocked');
      btn.onclick = openUnlockModal;
    }
  });
}

/* ============================================================
   AUTH — same account system as the community-directory pages
   (japanese-learners.html etc). Logging in here doesn't just show
   a profile icon: an Approved account for course "jp" is exactly
   what unlocks every lesson (see loadAccess() / /api/my-access
   above), so the login step below IS the primary unlock path now.
   ============================================================ */
let AUTH = { loggedIn: false, name: '', status: '' };

// Simple outline "person" glyph shown inside the trigger circle once
// logged in — currentColor so it follows the button's text color
// (and its hover state) automatically, no separate theming needed.
const PROFILE_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"></path></svg>`;

async function checkAuth(){
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();
    AUTH = data && data.loggedIn
      ? { loggedIn: true, name: data.name || '', status: data.status || 'Pending' }
      : { loggedIn: false, name: '', status: '' };
  } catch (err) {
    AUTH = { loggedIn: false, name: '', status: '' };
  }
  renderAuthSlot();
}

async function logout(){
  try { await fetch('/api/logout', { method: 'POST', credentials: 'include' }); } catch (err) {}
  AUTH = { loggedIn: false, name: '', status: '' };
  renderAuthSlot();
  loadAccess(); // drop any account-granted access back to code-only
  showToast('Logged out.');
}

function renderAuthSlot(){
  const slot = document.getElementById('authSlot');
  const dropdown = document.getElementById('profileDropdown');
  const backdrop = document.getElementById('profileBackdrop');
  if(!AUTH.loggedIn){
    slot.innerHTML = `<button class="topbtn topbtn-login" id="loginBtn">Login</button>`;
    document.getElementById('loginBtn').onclick = () => openUnlockModal();
    dropdown.classList.remove('show');
    dropdown.innerHTML = '';
    backdrop.classList.remove('show');
    return;
  }
  const statusLine = AUTH.status === 'Approved'
    ? 'Full course <b>unlocked</b>'
    : AUTH.status === 'Rejected'
      ? 'Account not approved'
      : 'Account <b>pending approval</b>';
  slot.innerHTML = `
    <div class="profile-menu">
      <button class="profile-trigger" id="profileTrigger">
        <span class="profile-avatar">${PROFILE_ICON_SVG}</span>
      </button>
    </div>`;
  dropdown.innerHTML = `
    <div class="profile-dropdown-status">${statusLine}</div>
    <button class="pd-item" id="editProfileBtn">✎ Edit my profile</button>
    <button class="pd-item" id="logoutBtn">↪ Log out</button>
  `;
  const trigger = document.getElementById('profileTrigger');

  function positionDropdown(){
    const r = trigger.getBoundingClientRect();
    dropdown.style.top = (r.bottom + 8) + 'px';
    dropdown.style.right = (window.innerWidth - r.right) + 'px';
  }
  function openMenu(){ positionDropdown(); dropdown.classList.add('show'); backdrop.classList.add('show'); }
  function closeMenu(){ dropdown.classList.remove('show'); backdrop.classList.remove('show'); }

  trigger.onclick = (e) => {
    e.stopPropagation();
    if(dropdown.classList.contains('show')) closeMenu(); else openMenu();
  };
  backdrop.onclick = closeMenu;
  document.getElementById('editProfileBtn').onclick = () => { closeMenu(); window.location.href = 'edit-profile.html'; };
  document.getElementById('logoutBtn').onclick = () => { closeMenu(); logout(); };
}

/* Unlock modal - single step: log in. An Approved account for this
   course unlocks every lesson immediately (see loadAccess()). */
const overlay = document.getElementById('unlockOverlay');
const modalBox = document.getElementById('modalBox');

function openUnlockModal(){
  renderLoginStep();
  overlay.classList.add('show');
}
function closeUnlockModal(){
  overlay.classList.remove('show');
}
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeUnlockModal(); });

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2800);
}

function renderLoginStep(note){
  modalBox.innerHTML = `
    <button class="modal-close" onclick="closeUnlockModal()" aria-label="Close">✕</button>
    <div class="modal-icon">🌸</div>
    <h3>Welcome Back</h3>
    <div class="modal-sub" style="text-align:center;">${note || 'Log in to unlock the full course.'}</div>
    <input type="email" class="modal-input" id="loginEmail" placeholder="Email" autocomplete="email">
    <input type="password" class="modal-input" id="loginPassword" placeholder="Password" autocomplete="current-password">
    <div style="text-align:right; margin:-4px 0 14px;">
      <a href="forgot-password.html" style="color:var(--text-faint); font-size:.82em; text-decoration:underline;">Forgot Password?</a>
    </div>
    <button class="modal-submit" id="loginSubmit">Log In</button>
    <div class="modal-error" id="loginError"></div>
    <button class="modal-secondary-link" onclick="location.href='signup.html'">New here? Create an account</button>
  `;
  const emailInput = document.getElementById('loginEmail');
  const passInput = document.getElementById('loginPassword');
  const submitBtn = document.getElementById('loginSubmit');
  const errorBox = document.getElementById('loginError');
  setTimeout(()=> emailInput.focus(), 50);

  async function submit(){
    const email = emailInput.value.trim();
    const password = passInput.value;
    if(!email || !password){
      errorBox.textContent = 'Please enter your email and password.';
      return;
    }
    errorBox.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(res.ok && data.ok){
        AUTH = { loggedIn: true, name: data.name || '', status: data.status || 'Pending' };
        renderAuthSlot();
        closeUnlockModal();
        await loadAccess(); // pulls fresh /api/my-access - unlocks all lessons if Approved
        showToast(ACCESS.all ? 'Course unlocked, enjoy! 🌸' : `Welcome back, ${data.name || 'there'}! 🌸`);
      } else {
        errorBox.textContent = (data && data.error) ? data.error : 'Invalid email or password.';
      }
    } catch (err) {
      errorBox.textContent = 'Something went wrong logging you in. Please try again.';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  }
  submitBtn.onclick = submit;
  passInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
}

document.getElementById('heroUnlockBtn').onclick = openUnlockModal;
document.getElementById('topUnlockBtn').onclick = openUnlockModal;

loadAccess();
checkAuth();

/* Sticky top bar scroll shadow */
(function(){
  const bar = document.getElementById('topbar');
  const onScroll = () => bar.classList.toggle('is-scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive:true });
  onScroll();
})();

/* Theme toggle */
const ThemeState = { theme: localStorage.getItem('hkl_site_theme') || 'dark' };
function applyTheme(){
  document.documentElement.setAttribute('data-theme', ThemeState.theme);
  document.getElementById('themeBtn').textContent = ThemeState.theme === 'dark' ? '☾ Dark' : '☀ Light';
}
document.getElementById('themeBtn').onclick = () => {
  ThemeState.theme = ThemeState.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('hkl_site_theme', ThemeState.theme);
  applyTheme();
};
applyTheme();

/* Petals */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
