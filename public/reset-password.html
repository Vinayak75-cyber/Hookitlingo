<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Hookitlingo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --gold:#d9ab5c; --celadon:#5fa688;
  --radius:16px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.6;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
}
h3{font-family:var(--serif); font-weight:600; margin:0 0 6px; text-align:center; font-size:1.3em;}
.auth-box{
  width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:30px 26px 26px; box-shadow:0 30px 70px rgba(0,0,0,.4); position:relative;
}
.auth-icon{font-size:2.2em; text-align:center; margin-bottom:8px;}
.auth-sub{color:var(--text-dim); font-size:.86em; margin-bottom:20px; text-align:center;}
.auth-input{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:.95em; font-family:var(--sans); margin-bottom:12px;
}
.auth-input:focus{outline:none; border-color:var(--celadon);}
.auth-submit{
  width:100%; padding:11px 14px; border-radius:10px; border:none; font-weight:700; font-size:.9em; color:#fff;
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%));
}
.auth-submit:hover{filter:brightness(1.06);}
.auth-submit:disabled{opacity:.6; cursor:default;}
.auth-error{color:var(--vermilion); font-size:.82em; margin-top:10px; min-height:1.2em; text-align:center;}
.auth-success{color:var(--celadon); font-size:.9em; margin-top:6px; text-align:center; line-height:1.6;}
.auth-secondary-link{
  display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-faint);
  font-size:.82em; padding:6px; text-decoration:underline; margin-top:14px;
}
.auth-secondary-link:hover{color:var(--text);}
a{color:inherit;}
</style>
</head>
<body>

<div class="auth-box" id="box">
  <div class="auth-icon">🌸</div>
  <h3>Reset Password</h3>
  <div class="auth-sub" id="subText">Enter a new password for your account.</div>

  <div id="formArea">
    <input type="password" class="auth-input" id="newPassword" placeholder="New password" autocomplete="new-password">
    <input type="password" class="auth-input" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
    <button class="auth-submit" id="submitBtn">Reset Password</button>
    <div class="auth-error" id="errorBox"></div>
  </div>

  <a class="auth-secondary-link" href="index.html">Back to home</a>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';

const newPasswordInput = document.getElementById('newPassword');
const confirmPasswordInput = document.getElementById('confirmPassword');
const submitBtn = document.getElementById('submitBtn');
const errorBox = document.getElementById('errorBox');
const formArea = document.getElementById('formArea');
const subText = document.getElementById('subText');

if (!token) {
  subText.textContent = '';
  formArea.innerHTML = '<div class="auth-error" style="margin-top:0;">This reset link is missing its token. Please request a new one from the login screen.</div>';
} else {
  setTimeout(() => newPasswordInput.focus(), 50);
}

async function submit(){
  const password = newPasswordInput.value;
  const confirm = confirmPasswordInput.value;
  if(!password || !confirm){
    errorBox.textContent = 'Please fill in both fields.';
    return;
  }
  if(password.length < 8){
    errorBox.textContent = 'Password must be at least 8 characters.';
    return;
  }
  if(password !== confirm){
    errorBox.textContent = 'Passwords do not match.';
    return;
  }
  errorBox.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Resetting...';
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      subText.textContent = '';
      formArea.innerHTML = '<div class="auth-success">Your password has been reset. You can now log in with your new password.</div><a class="auth-submit" style="display:block; text-align:center; text-decoration:none; margin-top:14px;" href="index.html">Go to login</a>';
    } else {
      errorBox.textContent = (data && data.error) ? data.error : 'Something went wrong. Please try again.';
    }
  } catch (err) {
    errorBox.textContent = 'Something went wrong. Please try again.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Reset Password';
  }
}
submitBtn.onclick = submit;
confirmPasswordInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
</script>
</body>
</html>
