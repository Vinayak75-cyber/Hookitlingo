<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かな — Kana Foundations | Hookitlingo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS  (same sakura theme as the Korean course)
   ============================================================ */
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.2em;} h2{font-size:1.6em;} h3{font-size:1.25em;} h4{font-size:1.05em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:19px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.15em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.7em; color:var(--text-faint); letter-spacing:.12em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group{margin-bottom:6px;}
.nav-group-label{font-size:.68em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.88em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  border:1px solid color-mix(in srgb, var(--vermilion) 30%, var(--border));
  margin-top:4px;
}
.nav-item-support .lbl{color:var(--vermilion); font-weight:600;}
.nav-item-support:hover{border-color:var(--vermilion);}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#topbar::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:7px;
  background-image: radial-gradient(circle at 9px 0, transparent 8px, color-mix(in srgb, var(--vermilion) 45%, var(--border)) 8px, color-mix(in srgb, var(--vermilion) 45%, var(--border)) 9px, transparent 9px);
  background-size:18px 10px; background-repeat:repeat-x; opacity:.55; pointer-events:none;
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}
#searchBox{background:var(--surface2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; font-size:.85em; width:150px;}
#searchResults{position:absolute; top:52px; right:20px; width:320px; max-height:60vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:0 20px 50px rgba(0,0,0,.5); z-index:60;}
#searchResults .sr-item{padding:10px 12px; border-bottom:1px solid var(--border); font-size:.85em; cursor:pointer;}
#searchResults .sr-item:hover{background:var(--surface2);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
main.wide{max-width:1100px;}

.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.eyebrow{font-size:.75em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

/* Cards & callouts */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.hkl-secure-note{margin-top:16px; font-size:.74em; color:var(--text-faint);}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fun{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

/* Letter tile grid */
.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s; cursor:pointer;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile.opened{border-color:var(--vermilion);}
.glyph-pair{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px;}
.glyph-pair .jp.big{font-size:2em; line-height:1; color:var(--text);}
.glyph-pair .jp.kata{color:var(--inkblue);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.05em;}
.letter-tile .spk{margin-top:8px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;}
.tile-detail{margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); text-align:left; font-size:.85em;}
.tile-detail .mnem{color:var(--text-dim); margin-bottom:8px;}
.tile-detail .word{color:var(--text);}
.tile-detail .word .rom{font-size:.85em;}

/* Speaker button */
.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.5; pointer-events:none;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

/* Buttons */
.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

/* Row comparison tables (dakuten etc) */
.pair-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; margin:18px 0;}
.pair-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; text-align:center;}
.pair-card .arrow{color:var(--text-faint); font-size:.8em; margin:2px 0;}
.pair-card .jp{font-size:1.6em;}
.pair-card .from{color:var(--text-faint); font-size:.85em;}
.pair-card .to{color:var(--vermilion); font-weight:600;}

/* Confusable comparison */
.confuse-row{display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin:16px 0;}
.confuse-glyph{font-family:var(--jp); font-size:2.6em; background:var(--surface2); border-radius:var(--radius-sm); padding:10px 18px; min-width:70px; text-align:center;}
.confuse-note{flex:1; min-width:200px; color:var(--text-dim); font-size:.92em;}

/* Flashcards */
.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:3em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

/* Quiz */
.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--sans); font-size:1.05em; margin-bottom:14px;}
.quiz-q .qtext.jp{font-family:var(--jp); font-size:1.5em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt.jp{font-family:var(--jp); font-size:1.2em; text-align:center;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

/* Matching game */
.match-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:20px 0;}
@media(max-width:600px){.match-grid{grid-template-columns:repeat(3,1fr);}}
.match-card{
  aspect-ratio:1; background:var(--surface); border:1px solid var(--border); border-radius:10px;
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-size:1.4em;
  padding:6px; text-align:center;
}
.match-card.flipped{border-color:var(--celadon); background:var(--celadon-dim);}
.match-card.matched{opacity:.35; border-color:var(--gold); pointer-events:none;}
.match-card.wrong{border-color:var(--vermilion); background:var(--vermilion-dim);}
.match-status{text-align:center; color:var(--text-dim); margin:10px 0;}

/* Typing sprint */
.type-wrap{max-width:420px; margin:20px auto; text-align:center;}
.type-glyph{font-family:var(--jp); font-size:4em; margin:20px 0;}
.type-input{width:100%; padding:12px 16px; border-radius:10px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:1.1em; text-align:center;}
.type-stats{display:flex; justify-content:space-between; color:var(--text-faint); font-size:.85em; margin-top:10px;}

/* Certificate */
.cert{background:var(--surface); border:2px solid var(--gold); border-radius:var(--radius); padding:40px; text-align:center; margin:24px 0; position:relative;}
.cert::before{content:''; position:absolute; inset:8px; border:1px solid var(--gold-dim); border-radius:calc(var(--radius) - 4px); pointer-events:none;}
.cert h2{font-size:1.2em; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint);}
.cert .cert-name{font-family:var(--serif); font-style:italic; font-size:2.2em; margin:14px 0; color:var(--vermilion);}
.cert .cert-jp{font-family:var(--jp); font-size:1.4em; margin:10px 0;}
.cert input{background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:1.1em; color:var(--text); text-align:center; width:80%; max-width:320px;}

/* Badges */
.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:14px; margin:18px 0;}
.badge{text-align:center; padding:14px 8px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .icon{font-size:2em;}
.badge .name{font-size:.72em; color:var(--text-dim); margin-top:4px;}

/* Roadmap */
.roadmap-group{margin:18px 0;}
.roadmap-group h3{margin-bottom:8px;}
.roadmap-list{display:flex; flex-direction:column; gap:6px;}
.roadmap-item{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; background:var(--surface); border:1px solid var(--border); cursor:pointer;}
.roadmap-item:hover{border-color:var(--celadon);}
.roadmap-item .dot{width:8px;height:8px;border-radius:50%; background:var(--border); flex:none;}
.roadmap-item.done .dot{background:var(--celadon);}
.roadmap-item .t{flex:1;}

/* Support */
.support-amounts{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:18px 0;}
.support-amt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; text-align:center; font-size:1.1em; font-weight:600;}
.support-amt:hover, .support-amt.sel{border-color:var(--gold); color:var(--gold);}
.support-icon{font-size:2.4em; text-align:center; margin-bottom:10px;}
.support-card{max-width:420px; margin:20px auto; text-align:center;}

/* Petals decoration */
#petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){.petal{display:none;}}
@media(max-width:900px){ #petals .petal:nth-child(even){display:none;} }

@media print{
  #sidebar,#topbar,#petals,.no-print,.btn-row{display:none !important;}
  main{padding:0; max-width:100%;}
  body{background:#fff; color:#111;}
  .cert{border-color:#a4762b;}
}
@media(max-width:860px){
  #sidebar{position:fixed; left:0; top:0; height:100vh; transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #menuBtn{display:inline-flex;}
  main{padding:24px 18px 60px;}
  #searchBox{width:100px;}
}
</style>
</head>
<body>
<div id="petals"></div>
<div id="app">

<nav id="sidebar">
  <div class="brand">
    <div class="brand-block">か</div>
    <div class="brand-txt"><strong>Kana Foundations</strong><span>Hookitlingo</span></div>
  </div>
  <div class="progress-mini">
    <div class="row"><span>Your progress</span><span id="progressPct">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="progressBar"></div></div>
  </div>
  <div id="navHost"></div>
</nav>

<div id="mainWrap">
  <div id="topbar">
    <button id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
    <div class="readbar-track"><div class="readbar-fill" id="readbarFill"></div></div>
    <button class="topbtn" id="themeBtn" onclick="toggleTheme()">🌙 Theme</button>
    <button class="topbtn" onclick="changeFont(-1)">A−</button>
    <button class="topbtn" onclick="changeFont(1)">A+</button>
    <input id="searchBox" type="text" placeholder="Search units…" oninput="doSearch(this.value)">
  </div>
  <div id="searchResults" class="hidden"></div>
  <main id="mainInner"></main>
</div>

</div>

<script>
/* ============================================================
   0. UTIL
   ============================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
function esc(s){ return String(s).replace(/"/g,'&quot;'); }

/* Backend base for the certificate-download and Support widget flows —
   same origin when deployed alongside the Express server. */
const SUPPORT_API_BASE = window.location.hostname === 'localhost'
  ? 'http://localhost:3000'
  : '';

/* ============================================================
   1. STATE
   ============================================================ */
const State = {
  theme: localStorage.getItem('kf_theme') || 'dark',
  fontScale: parseFloat(localStorage.getItem('kf_font')) || 1,
  completed: JSON.parse(localStorage.getItem('kf_completed')||'{}'),
  xp: parseInt(localStorage.getItem('kf_xp')||'0'),
  badges: JSON.parse(localStorage.getItem('kf_badges')||'{}'),
  current: null,
  last: localStorage.getItem('kf_last') || 'cover'
};
function saveState(){

/* ============================================================
   2. AUDIO — same embedded-base64 logic as the Korean course.
   AUDIO_DATA starts empty; fill it in later with Amazon Polly
   output, e.g. AUDIO_DATA['あ'] = 'data:audio/mpeg;base64,....'
   The KEY must exactly match the text passed into spkBtn().
   ============================================================ */
const AUDIO_DATA = {
  /* ---- fill me in with Polly-generated base64 clips ---- */
};

const Audio_ = {
  queue: [], playing: false, currentAudio: null,

  lookup(text){
    if(Object.prototype.hasOwnProperty.call(AUDIO_DATA, text)) return AUDIO_DATA[text];
    return null;
  },

  speak(text, btn){
    if(!text){ return; }
    if(btn){
      if(btn.dataset.busy==='1') return;
      btn.dataset.busy='1';
      btn.classList.add('loading');
    }
    this.queue.push({text, btn});
    this._pump();
  },

  _pump(){
    if(this.playing || !this.queue.length) return;
    const {text, btn} = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    if(btn){ btn.classList.remove('loading'); btn.classList.add('playing'); }

    const done = ()=>{
      this.playing=false; this.currentAudio=null;
      if(btn){ btn.classList.remove('playing'); btn.dataset.busy='0'; }
      setTimeout(()=>this._pump(),120);
    };

    if(!dataUri){
      console.warn('Audio: no embedded clip yet for', text);
      if(btn){
        const orig = btn.innerHTML;
        btn.innerHTML = '❌ Missing';
        setTimeout(()=>btn.innerHTML=orig,1200);
      }
      done();
      return;
    }

    const audio = new Audio();
    this.currentAudio = audio;
    audio.onended = done;
    audio.onerror = ()=>{
      if(btn){ const orig=btn.innerHTML; btn.innerHTML='❌ Missing'; setTimeout(()=>btn.innerHTML=orig,1200); }
      done();
    };
    audio.addEventListener('canplaythrough', ()=>{ audio.play().catch(()=>done()); }, {once:true});
    audio.src = dataUri;
    audio.load();
  }
};
function spkBtn(text, label){
  label = label || '🔊';
  if(!text) return '';
  const safeText = JSON.stringify(text).replace(/"/g,'&quot;');
  return `<button class="spk-btn no-print" onclick="event.stopPropagation(); Audio_.speak(${safeText}, this)">${label}</button>`;
}

/* ============================================================
   4. QUIZ ENGINE
   ============================================================ */
function buildQuiz(id, data, isFinal){
  const wrap = document.createElement('div');
  wrap.className='quiz-host';
  wrap.id = 'quiz-'+id;
  let idx=0, score=0;
  function draw(){
    if(idx>=data.length){
      const pct = data.length ? Math.round((score/data.length)*100) : 0;
      wrap.innerHTML = `
        <div class="quiz-score">Score: ${score} / ${data.length} (${pct}%)</div>
        ${isFinal ? (pct>=70
          ? `<div class="callout"><span class="callout-label">Passed!</span>You have earned your certificate. Great work.
             <div class="btn-row"><button class="btn" onclick="goTo('certificate')">Go to Certificate →</button></div></div>`
          : `<div class="callout warn"><span class="callout-label">Almost there</span>70% is the passing mark — review a unit or two and try again whenever you are ready.</div>`)
          : ''}
        <div class="btn-row"><button class="btn secondary" onclick="goTo(State.current)">Try Again</button></div>
      `;
      addXP(score*2);
      if(isFinal && pct>=70) markComplete('final-exam');
      return;
    }
    const q = data[idx];
    wrap.innerHTML = `
      <div class="quiz-q">
        <div class="qtext ${q.jp?'jp':''}">${q.q}</div>
        <div class="qopts">${q.options.map(o=>`<button class="qopt ${q.optJp?'jp':''}" data-o="${esc(o)}">${o}</button>`).join('')}</div>
        <div class="qfeedback">&nbsp;</div>
        <div style="margin-top:10px;color:var(--text-faint);font-size:.78em">Question ${idx+1} of ${data.length}</div>
      </div>`;
    wrap.querySelectorAll('.qopt').forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll('.qopt').forEach(b=>b.disabled=true);
        const chosen = btn.getAttribute('data-o');
        const correct = chosen === q.answer;
        btn.classList.add(correct?'correct':'wrong');
        if(!correct){
          wrap.querySelectorAll('.qopt').forEach(b=>{ if(b.getAttribute('data-o')===q.answer) b.classList.add('correct'); });
        }
        wrap.querySelector('.qfeedback').textContent = correct ? '✓ Correct!' : `Correct answer: ${q.answer}`;
        if(correct) score++;
        setTimeout(()=>{ idx++; draw(); }, 900);
      };
    });
  }
  draw();
  return wrap;
}

function makeRowQuiz(rows, count){
  count = count || Math.min(6, rows.length*2);
  const qs=[];
  const pool = rows;
  for(let i=0;i<count;i++){
    const r = pool[Math.floor(Math.random()*pool.length)];
    if(i%2===0){
      const wrong = sample(pool.filter(x=>x!==r), Math.min(3,pool.length-1)).map(x=>x.r);
      const opts = shuffle([...wrong, r.r]);
      qs.push({q:r.h, jp:true, options:opts, answer:r.r, optJp:false});
    } else {
      const wrong = sample(pool.filter(x=>x!==r), Math.min(3,pool.length-1)).map(x=>x.k);
      const opts = shuffle([...wrong, r.k]);
      qs.push({q:`Which one says "${r.r}"?`, jp:false, options:opts, answer:r.k, optJp:true});
    }
  }
  return qs;
}

function renderFlashcards(el){
  const all = allBaseKana();
  let mode = 'h'; // h = hiragana front, k = katakana front
  let idx = 0;
  let order = shuffle(all);
  el.innerHTML = `
    <div class="eyebrow">Practice</div>
    <h1>Flashcard Deck</h1>
    <div class="chapter-meta"><span>${all.length} cards</span></div>
    <div class="btn-row">
      <button class="btn secondary" id="fcModeH">Hiragana Front</button>
      <button class="btn secondary" id="fcModeK">Katakana Front</button>
      <button class="btn secondary" id="fcShuffle">🔀 Shuffle</button>
    </div>
    <div class="flash-wrap">
      <div class="flashcard" id="fcCard">
        <div class="fc-front"><div class="fc-face jp"></div><div class="fc-sub">tap to flip</div></div>
        <div class="fc-back"><div class="fc-face"></div><div class="fc-sub"></div></div>
      </div>
      <div class="flash-controls">
        <button class="btn secondary" id="fcPrev">← Prev</button>
        <span class="flash-counter" id="fcCounter"></span>
        <button class="btn secondary" id="fcNext">Next →</button>
      </div>
    </div>
  `;
  const card = el.querySelector('#fcCard');
  function draw(){
    const r = order[idx];
    const front = mode==='h' ? r.h : r.k;
    card.classList.remove('flipped');
    card.querySelector('.fc-front .fc-face').textContent = front;
    card.querySelector('.fc-back .fc-face').textContent = r.r;
    card.querySelector('.fc-back .fc-sub').textContent = (mode==='h'?r.k:r.h);
    el.querySelector('#fcCounter').textContent = `${idx+1} / ${order.length}`;
  }
  card.onclick = ()=>card.classList.toggle('flipped');
  el.querySelector('#fcPrev').onclick = ()=>{ idx=(idx-1+order.length)%order.length; draw(); };
  el.querySelector('#fcNext').onclick = ()=>{ idx=(idx+1)%order.length; draw(); };
  el.querySelector('#fcModeH').onclick = ()=>{ mode='h'; draw(); };
  el.querySelector('#fcModeK').onclick = ()=>{ mode='k'; draw(); };
  el.querySelector('#fcShuffle').onclick = ()=>{ order=shuffle(all); idx=0; draw(); };
  draw();
}

function renderMatching(el){
  const chosen = sample(allBaseKana(), 8);
  let cards = [];
  chosen.forEach((r,i)=>{ cards.push({id:i,txt:r.h,match:i,jp:true}); cards.push({id:i+100,txt:r.k,match:i,jp:true}); });
  cards = shuffle(cards);
  let flipped = [];
  let matchedCount = 0;
  el.innerHTML = `
    <div class="eyebrow">Practice</div>
    <h1>Match the Pairs</h1>
    <div class="chapter-meta"><span>Hiragana ↔ Katakana, same sound</span></div>
    <div class="match-status" id="matchStatus">Find all 8 pairs</div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="btn-row"><button class="btn secondary" onclick="goTo('matching')">🔀 New Game</button></div>
  `;
  const grid = el.querySelector('#matchGrid');
  grid.innerHTML = cards.map(c=>`<div class="match-card" data-id="${c.id}" data-match="${c.match}">${c.txt}</div>`).join('');
  grid.querySelectorAll('.match-card').forEach(cardEl=>{
    cardEl.onclick = ()=>{
      if(cardEl.classList.contains('flipped') || cardEl.classList.contains('matched') || flipped.length>=2) return;
      cardEl.classList.add('flipped');
      flipped.push(cardEl);
      if(flipped.length===2){
        const [a,b] = flipped;
        if(a.dataset.match===b.dataset.match && a.dataset.id!==b.dataset.id){
          setTimeout(()=>{
            a.classList.add('matched'); b.classList.add('matched');
            flipped=[]; matchedCount++;
            el.querySelector('#matchStatus').textContent = matchedCount>=8 ? '🎉 All matched! Nicely done.' : `${matchedCount} / 8 pairs found`;
            if(matchedCount>=8){ markComplete('matching'); }
          },350);
        } else {
          a.classList.add('wrong'); b.classList.add('wrong');
          setTimeout(()=>{
            a.classList.remove('flipped','wrong'); b.classList.remove('flipped','wrong');
            flipped=[];
          },700);
        }
      }
    };
  });
}

function renderTyping(el){
  const all = allBaseKana();
  const deck = shuffle(all).slice(0, 15);
  let idx=0, correct=0, wrong=0;
  const startTime = Date.now();
  el.innerHTML = `
    <div class="eyebrow">Practice</div>
    <h1>Typing &amp; Recall Sprint</h1>
    <div class="chapter-meta"><span>15 kana, type the romaji</span></div>
    <div class="type-wrap">
      <div class="type-glyph" id="typeGlyph"></div>
      <input class="type-input" id="typeInput" autocomplete="off" placeholder="type the romaji…">
      <div class="type-stats"><span id="typeCount"></span><span id="typeTimer">0.0s</span></div>
      <div id="typeFeedback" style="margin-top:10px;color:var(--text-faint)">&nbsp;</div>
    </div>
  `;
  const glyphEl = el.querySelector('#typeGlyph');
  const input = el.querySelector('#typeInput');
  const feedback = el.querySelector('#typeFeedback');
  let timerInt;
  function tick(){ el.querySelector('#typeTimer').textContent = ((Date.now()-startTime)/1000).toFixed(1)+'s'; }
  timerInt = setInterval(tick, 100);
  function draw(){
    if(idx>=deck.length){
      clearInterval(timerInt);
      const secs = ((Date.now()-startTime)/1000).toFixed(1);
      el.querySelector('.type-wrap').innerHTML = `
        <div class="quiz-score">${correct} / ${deck.length} correct in ${secs}s</div>
        <div class="btn-row" style="justify-content:center"><button class="btn secondary" onclick="goTo('typing')">Try Again</button></div>`;
      addXP(correct*2);
      if(correct>=Math.ceil(deck.length*0.7)) markComplete('typing');
      return;
    }
    const r = deck[idx];
    const showKata = Math.random()<0.5;
    glyphEl.textContent = showKata ? r.k : r.h;
    glyphEl.dataset.answer = r.r.split(' ')[0].replace(/[()]/g,'');
    el.querySelector('#typeCount').textContent = `${idx+1} / ${deck.length}`;
    input.value=''; feedback.textContent='\u00a0';
    input.focus();
  }
  input.addEventListener('keydown', (e)=>{
    if(e.key!=='Enter') return;
    const ans = glyphEl.dataset.answer.toLowerCase();
    const val = input.value.trim().toLowerCase();
    if(val===ans){ correct++; feedback.textContent='✓ Correct'; feedback.style.color='var(--celadon)'; }
    else { wrong++; feedback.textContent=`✗ It was "${ans}"`; feedback.style.color='var(--vermilion)'; }
    idx++;
    setTimeout(draw, 450);
  });
  draw();
}

function renderCertificate(el){

  el.innerHTML = `
    <div class="eyebrow">Finish</div>
    <h1>Your Certificate</h1>
    <div class="card">
      <label>Your name: <input type="text" id="certName" placeholder="Enter your name" value="${esc(savedName)}" style="background:var(--surface2); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 10px; margin-left:8px;"></label>
      <button class="btn" style="margin-left:10px" id="certUpdateBtn">Update</button>
      <button class="btn secondary" style="margin-left:6px" id="certDownloadBtn">⬇ Download Certificate PDF</button>
    </div>
    <div class="cert" id="certBody">
      <h2>Certificate of Completion</h2>
      <div class="cert-jp">かな基礎</div>
      <p style="color:var(--text-faint)">This certifies that</p>
      <div class="cert-name" id="certNameDisplay">${esc(savedName)||'Your Name'}</div>
      <p style="color:var(--text-faint)">has completed the Hookitlingo <strong>Kana Foundations</strong> course, mastering hiragana, katakana, and their sound modifiers.</p>
      <p style="color:var(--text-faint); font-size:.85em">${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})} · ${done} / ${CHAPTERS.length} units completed · ${State.xp} XP</p>
      <p style="margin-top:8px; color:var(--celadon); font-size:.8em;">✓ Free — download whenever you like</p>
    </div>
    <p id="certDownloadStatus" class="hkl-secure-note"></p>
    <h3>Badges Earned</h3>
    <div class="badge-grid">${BADGE_DEFS.map(b=>`
      <div class="badge ${State.badges[b.id]?'earned':''}"><div class="icon">${b.icon}</div><div class="name">${b.name}</div></div>`).join('')}</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn secondary" onclick="goTo('next-steps')">What's Next →</button>
    </div>
  `;

  document.getElementById('certUpdateBtn').onclick = () => {
    const v = document.getElementById('certName').value.trim();
    localStorage.setItem('kf_name', v);
    document.getElementById('certNameDisplay').textContent = v || 'Your Name';
  };

  document.getElementById('certDownloadBtn').onclick = async () => {
    const currentName = document.getElementById('certName').value.trim() || savedName;
    const statusEl = document.getElementById('certDownloadStatus');
    statusEl.style.color = '';
    statusEl.textContent = 'Generating your certificate…';
    try{
      const url = `${SUPPORT_API_BASE}/api/certificate?name=${encodeURIComponent(currentName)}&course=kana`;
      const res = await fetch(url);
      if(!res.ok){
        const err = await res.json().catch(()=>({error:'Download failed'}));
        throw new Error(err.error || 'Download failed');
      }
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl; a.download = 'hookitlingo-kana-certificate.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(objUrl);
      statusEl.textContent = '';
    }catch(err){
      console.error('Certificate download failed:', err);
      statusEl.style.color = 'var(--vermilion)';
      statusEl.textContent = err.message;
    }
  };
}

/* ============================================================
   8. NAVIGATION / SIDEBAR / TOPBAR
   ============================================================ */
function buildSidebar(){
  const host = document.getElementById('navHost');
  const groups = {};
  CHAPTERS.forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  host.innerHTML = Object.entries(groups).map(([g,list])=>`
    <div class="nav-group">
      <div class="nav-group-label">${g}</div>
      ${list.map(c=>`
        <button class="nav-item ${State.completed[c.id]?'done':''} ${State.current===c.id?'active':''}" onclick="goTo('${c.id}')">
          <span class="dot"></span><span class="lbl">${c.title}</span>
        </button>${c.id==='final-exam' ? `
        <a class="nav-item nav-item-support" href="../supporters.html" style="text-decoration:none">
          <span class="dot"></span><span class="lbl">💛 Support</span>
        </a>` : ''}`).join('')}
    </div>`).join('');
}

function goTo(id){
  const ch = CHAPTERS.find(c=>c.id===id);
  if(!ch) return;
  const main = document.getElementById('mainInner');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className='chapter active';
  el.id = 'ch-'+id;
  main.appendChild(el);
  ch.render(el);
  State.current = id;
  saveState();
  buildSidebar();
  updateProgressUI();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('searchResults').classList.add('hidden');
  window.scrollTo(0,0);
}

function doSearch(q){
  const box = document.getElementById('searchResults');
  q = q.trim().toLowerCase();
  if(!q){ box.classList.add('hidden'); box.innerHTML=''; return; }
  const hits = CHAPTERS.filter(c=>c.title.toLowerCase().includes(q) || c.group.toLowerCase().includes(q));
  if(!hits.length){ box.innerHTML = `<div class="sr-item">No matches.</div>`; }
  else box.innerHTML = hits.map(c=>`<div class="sr-item" onclick="goTo('${c.id}')">${c.title} <span style="color:var(--text-faint);font-size:.8em">— ${c.group}</span></div>`).join('');
  box.classList.remove('hidden');
}

window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const pct = h.scrollHeight>h.clientHeight ? (h.scrollTop/(h.scrollHeight-h.clientHeight))*100 : 0;
  const fill = document.getElementById('readbarFill');
  if(fill) fill.style.width = pct+'%';
});

/* ============================================================
   9. PETALS DECORATION
   ============================================================ */
function initPetals(){
  const host = document.getElementById('petals');
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const n = window.innerWidth<700 ? 10 : 18;
  let html='';
  for(let i=0;i<n;i++){
    const left = Math.random()*100;
    const size = 10+Math.random()*12;
    const dur = 10+Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    html += `<div class="petal" style="left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);">
      <svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>
    </div>`;
  }
  host.innerHTML = html;
}

   10. BOOT
   ============================================================ */
function boot(){
  applyTheme();
  document.documentElement.style.setProperty('--fs-scale', State.fontScale);
  buildSidebar();
  initPetals();
  const start = CHAPTERS.find(c=>c.id===State.last) ? State.last : 'cover';
  goTo(start);
}
document.addEventListener('DOMContentLoaded', boot);
