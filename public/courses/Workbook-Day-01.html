  Premium printable companion workbook for "TOPIK I · Day 1 — Hangul Foundations".
  Single self-contained file. No frameworks, no external dependencies except the
  optional Google Fonts progressive enhancement below (falls back to system fonts
  offline). Works completely offline. Press Ctrl+P / Cmd+P to save as PDF.
  All student progress is stored in this browser's localStorage under "wbd1_".
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   0. DESIGN TOKENS — reused from the Day 1 lesson's visual identity,
      re-tuned to a light, ink-friendly, print-first palette.
   ============================================================ */
:root{
  --ink:#2a1e26; --text:#2a1e26; --text-dim:#5c4753; --text-faint:#8d7986;
  --paper:#fffdfb; --surface:#faf3ee; --surface2:#f4e9e1;
  --border:#ddc7bb; --border-soft:#ead9cd;
  --vermilion:#a83e58; --vermilion-tint:#f7e3e7;
  --celadon:#3d7a5e; --celadon-tint:#e3efe8;
  --gold:#9c701f; --gold-tint:#f4e7cf;
  --inkblue:#5f4890; --inkblue-tint:#e9e2f4;
  --radius:14px; --radius-sm:8px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --kr:"Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic","Nanum Gothic",sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:#e7ded6; color:var(--text); font-family:var(--sans);
  line-height:1.55; -webkit-font-smoothing:antialiased;
}
body.canvas-dark{background:#231b22;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .45em; color:var(--ink);}
.kr{font-family:var(--kr);}
p{margin:0 0 .9em;}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* ============================================================
   1. TOOLBAR (screen only — never printed)
   ============================================================ */
#toolbar{
  position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px;
  padding:10px 18px; background:rgba(38,25,32,.94); backdrop-filter:blur(8px);
  color:#f6ecec; flex-wrap:wrap;
}
#toolbar .tb-title{font-family:var(--serif); font-weight:600; font-size:1.05em; margin-right:auto; white-space:nowrap;}
#toolbar .tb-title span{display:block; font-size:.62em; letter-spacing:.12em; text-transform:uppercase; color:#c7b2c4; font-family:var(--sans);}
.tbtn{background:#3b2933; border:1px solid #55404b; color:#f0e2e6; border-radius:20px; padding:7px 14px; font-size:.82em; display:flex; align-items:center; gap:6px;}
.tbtn:hover{border-color:var(--vermilion); }
.tbtn.on{background:var(--vermilion); border-color:var(--vermilion); color:#fff;}
.tb-progress{display:flex; align-items:center; gap:8px; font-size:.78em; color:#d8c6cf;}
.tb-track{width:110px; height:6px; background:#4a3540; border-radius:4px; overflow:hidden;}
.tb-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--vermilion),var(--gold));}

/* ============================================================
   2. PAGE FRAME (screen: simulated sheet of paper; print: real page)
   ============================================================ */
#book{max-width:900px; margin:0 auto; padding:26px 0 70px;}
.page{
  background:var(--paper); width:210mm; min-height:250mm; margin:0 auto 26px;
  padding:16mm 15mm 13mm; box-shadow:0 6px 28px rgba(0,0,0,.16); position:relative;
  display:flex; flex-direction:column;
}
.page-header{
  display:flex; justify-content:space-between; font-size:.68em; text-transform:uppercase;
  letter-spacing:.09em; color:var(--text-faint); border-bottom:1px solid var(--border-soft);
  padding-bottom:7px; margin-bottom:16px;
}
.page-body{flex:1;}
.page-title{font-size:1.7em; margin-bottom:.3em;}
.page-kicker{font-size:.72em; letter-spacing:.13em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:6px;}
.teacher-line{font-size:.82em; color:var(--text-faint); border-top:1px dashed var(--border); margin-top:14px; padding-top:8px;}
.page-footer{
  display:flex; justify-content:space-between; align-items:baseline; font-size:.72em; color:var(--text-faint);
  border-top:1px solid var(--border-soft); margin-top:14px; padding-top:8px;
}
.fill{border-bottom:1px solid var(--text-faint); padding:0 4px; font-style:normal;}
.fill.long{display:inline-block; min-width:260px;}

/* ============================================================
   3. TYPOGRAPHIC COMPONENTS
   ============================================================ */
.card{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 18px; margin:14px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-tint); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 16px; margin:14px 0; font-size:.93em;}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-tint);}
.callout.tip{border-color:var(--gold); background:var(--gold-tint);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-tint);}
.callout-label{font-weight:700; font-size:.75em; text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:3px;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.three-col{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
table.sched{width:100%; border-collapse:collapse; margin:12px 0; font-size:.9em;}
table.sched th, table.sched td{border:1px solid var(--border); padding:6px 10px; text-align:left;}
table.sched th{background:var(--surface2);}
.no-break{break-inside:avoid; page-break-inside:avoid;}

/* Ans / answer key toggle */
.ans{display:none;}
body.show-answers .ans{display:inline; color:var(--celadon); font-weight:700;}
.answer-toggle-note{font-size:.72em; color:var(--text-faint); font-style:italic;}

/* Checkbox rows (self-eval, checklists) */
.pchk{display:flex; gap:8px; align-items:flex-start; margin:5px 0; font-size:.92em;}
.pchk input{margin-top:3px;}

/* Writing lines */
.wline{border-bottom:1px solid #c9b6ab; height:32px;}
.wline.dashed{border-bottom-style:dashed;}
.wline-set{margin:8px 0 14px;}

/* Large tracing row */
.trace-row{display:flex; gap:7px; margin:10px 0; flex-wrap:wrap;}
.trace-cell{flex:1; min-width:52px; height:70px; border:1px solid var(--border); border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--kr); font-size:2.15em;}
.trace-cell.ghost{color:#d9c8bd;}
.trace-cell.blank{color:transparent;}

/* 원고지-style guided grid boxes */
.grid-boxes{display:grid; grid-template-columns:repeat(10,1fr); gap:6px; margin:6px 0 16px;}
.gbox{position:relative; aspect-ratio:1/1; border:1px solid var(--border); border-radius:4px;}
.gbox::before,.gbox::after{content:""; position:absolute; background:var(--border-soft);}
.gbox::before{left:50%; top:6%; bottom:6%; width:1px; transform:translateX(-50%);}
.gbox::after{top:50%; left:6%; right:6%; height:1px; transform:translateY(-50%);}
.gbox.ghost{display:flex; align-items:center; justify-content:center; font-family:var(--kr); color:#e3d6cc; font-size:1.5em;}

/* Letter tiles */
.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin:14px 0;}
.letter-tile{border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; text-align:center;}
.letter-tile .glyph{font-family:var(--kr); font-size:1.9em; line-height:1;}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.92em;}

/* Word / vocab cards */
.word-card{border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:10px 12px; margin:8px 0;}
.word-card .wk{font-family:var(--kr); font-size:1.3em;}
.word-card .wr{color:var(--text-faint); font-size:.82em;}

/* Contenteditable "digital ruled paper" for notes / free writing / reflection */
.editable{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;
  background-image:repeating-linear-gradient(transparent, transparent 27px, var(--border-soft) 28px);
  line-height:28px; font-size:.94em; color:var(--text);
}
.editable:empty:before{content:attr(data-ph); color:var(--text-faint);}

/* Picture placeholder box */
.pic-box{border:1.5px dashed var(--border); border-radius:var(--radius-sm); height:70px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); font-size:.78em; margin:6px 0;}
.dp-hero{background:var(--gold-tint); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 20px; margin-bottom:16px; text-align:center;}
.dp-hero-kr{font-family:var(--kr); font-size:2.3em; line-height:1.1; color:var(--ink);}
.dp-hero-meta{font-size:.92em; color:var(--text-faint); margin-top:3px;}
.dp-section{margin-bottom:6px;}
.dp-section .grid-boxes{margin:5px 0 14px; max-width:460px;}
.dp-section.dp-below{background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 18px; margin-top:14px;}
.dp-label{font-size:.83em; font-weight:600; margin:0 0 4px;}

/* Difficulty bubbles */
.diff-row{display:flex; gap:6px; align-items:center; font-size:.82em; margin:4px 0;}
.diff-bub{width:16px; height:16px; border:1px solid var(--text-faint); border-radius:50%; display:inline-block;}

/* Sentence chip boxes (unscramble) */
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
.chip{border:1px solid var(--border); border-radius:20px; padding:5px 14px; font-family:var(--kr);}
.slot-row{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 4px;}
.slot{border-bottom:2px solid var(--text-dim); min-width:70px; height:30px;}

/* Reading comprehension */
.passage{font-family:var(--kr); font-size:1.15em; line-height:1.9; padding:10px 14px; border:1px solid var(--border-soft); border-radius:var(--radius-sm); background:var(--surface);}

/* Badge / stamp for certificate */
.seal{width:150px; height:150px; margin:0 auto; border-radius:50%; border:3px double var(--vermilion); display:flex; align-items:center; justify-content:center; font-family:var(--kr); font-size:3.4em; color:var(--vermilion);}

/* ============================================================
   4. PRINT RULES
   ============================================================ */
@media print{
  @page{ margin:14mm 12mm; }
  body{background:#fff;}
  #toolbar,.no-print{display:none !important;}
  #book{max-width:none; padding:0; margin:0;}
  .page{ box-shadow:none; width:auto; min-height:0; margin:0; padding:0; page-break-after:always; break-after:page; }
  .page:last-of-type{page-break-after:auto;}
  .no-break{page-break-inside:avoid; break-inside:avoid;}
  .editable{background-image:repeating-linear-gradient(transparent, transparent 27px, #ccc 28px);}
}
@media(max-width:820px){
  .page{width:100%; min-height:auto; padding:20px;}
  .two-col,.three-col{grid-template-columns:1fr;}
  #toolbar .tb-title span{display:none;}
}
</style>
</head>

<script>
/* ============================================================

const VOWELS = [
 {ch:'ㅣ', rom:'i', sound:'like "ee" in "see"', mouth:'Lips relaxed and wide, tongue high and forward', memory:'A single upright human — the vertical stroke of 천지인.', ex:[['이','this / tooth']]},
 {ch:'ㅡ', rom:'eu', sound:'like "oo" in "book" but unrounded — smile while saying "uh"', mouth:'Lips flat and wide, do not round them', memory:'A single flat line — the earth stroke.', ex:[['그','that (thing)']]},
 {ch:'ㅏ', rom:'a', sound:'like "a" in "father"', mouth:'Open your jaw wide and relaxed', memory:'Human line (ㅣ) with the sun (dot) rising on the right.', ex:[['아이','child'],['가다','to go']]},

 {ch:'ㅗ', rom:'o', sound:'like "o" in "go"', mouth:'Round your lips forward into a small circle', memory:'Earth line (ㅡ) with the sun rising above it.', ex:[['오다','to come']]},
 {ch:'ㅜ', rom:'u', sound:'like "oo" in "moon"', mouth:'Push your lips further forward than ㅗ', memory:'Earth line (ㅡ) with the sun setting below it.', ex:[['우유','milk']]},
 {ch:'ㅑ', rom:'ya', sound:'"ya" as in "yard"', mouth:'Same as ㅏ but glide into it with a y-sound', memory:'ㅏ with one extra stroke = add a Y glide.', ex:[['야구','baseball']]},
 {ch:'ㅕ', rom:'yeo', sound:'"yuh" — y + eo', mouth:'Same as ㅓ with a y-glide', memory:'ㅓ with one extra stroke.', ex:[['여자','woman']]},
 {ch:'ㅛ', rom:'yo', sound:'"yo" as in "yo-yo"', mouth:'Same as ㅗ with a y-glide', memory:'ㅗ with one extra stroke.', ex:[['교실','classroom']]},
 {ch:'ㅠ', rom:'yu', sound:'"you"', mouth:'Same as ㅜ with a y-glide', memory:'ㅜ with one extra stroke.', ex:[['우유','milk (root 유 = "oil/milk")']]},
];
const CONSONANTS = [
 {ch:'ㄱ', name:'giyeok', rom:'g/k', sound:'between English G and K', mouth:'Back of the tongue touches the soft palate, blocking air briefly', memory:'Traces the side profile of the tongue lifting at the back of the mouth.', ex:[['가다','to go'],['고기','meat']]},
 {ch:'ㄴ', name:'nieun', rom:'n', sound:'like English N', mouth:'Tongue tip touches just behind the upper teeth', memory:'Traces the tongue tip curling up behind the teeth.', ex:[['나','I/me'],['누나','older sister (of a male)']]},
 {ch:'ㄷ', name:'digeut', rom:'d/t', sound:'between English D and T', mouth:'Tongue touches the ridge behind the teeth then releases', memory:'ㄴ + one line on top = the softer n-sound becomes a crisper d/t.', ex:[['다리','leg/bridge']]},
 {ch:'ㄹ', name:'rieul', rom:'r/l', sound:'a light flap, between English R and L', mouth:'Tongue tip taps once against the ridge behind the teeth', memory:'A curved zig-zag, a bit like the number 2 or letter Z.', ex:[['라디오','radio'],['우리','we/us']]},
 {ch:'ㅁ', name:'mieum', rom:'m', sound:'like English M', mouth:'Lips pressed fully closed, sound hums through the nose', memory:'A closed square — your mouth sealed shut on all four sides.', ex:[['엄마','mom'],['마시다','to drink']]},
 {ch:'ㅂ', name:'bieup', rom:'b/p', sound:'between English B and P', mouth:'Lips press shut then release with a small pop', memory:'ㅁ + two short lines on top = the sealed mouth releasing with force.', ex:[['바다','sea'],['비','rain']]},
 {ch:'ㅅ', name:'siot', rom:'s', sound:'a soft "s", slightly softer than English', mouth:'Tongue tip near the ridge behind the teeth, air hisses through', memory:'Two points like the eyes of a smiling face — "smile" starts with S.', ex:[['사람','person'],['시간','time']]},
 {ch:'ㅇ', name:'ieung', rom:'silent/ng', sound:'silent at the start of a syllable; "ng" at the end', mouth:'At the start: no obstruction. At the end: back of tongue touches soft palate, air through the nose', memory:'A circle — an empty, open mouth with nothing blocking it.', ex:[['아이','child (silent ㅇ)'],['사랑','love (final ㅇ = "ng")']]},
 {ch:'ㅈ', name:'jieut', rom:'j', sound:'between English J and CH', mouth:'Tongue blade presses the ridge, releases with light friction', memory:'ㅅ + one line on top = more friction/force.', ex:[['자다','to sleep'],['주스','juice']]},
 {ch:'ㅊ', name:'chieut', rom:'ch', sound:'a strongly aspirated CH, with a puff of air', mouth:'Same as ㅈ, release with extra breath', memory:'ㅈ + one more line = even more air.', ex:[['차','tea/car'],['치마','skirt']]},
 {ch:'ㅋ', name:'kieuk', rom:'k', sound:'a strongly aspirated K, with a puff of air', mouth:'Same tongue position as ㄱ, release with extra breath', memory:'ㄱ + one extra stroke = more air, more force.', ex:[['커피','coffee'],['카드','card']]},
 {ch:'ㅌ', name:'tieut', rom:'t', sound:'a strongly aspirated T, with a puff of air', mouth:'Same position as ㄷ, release with extra breath', memory:'ㄷ + one more line = even more force/air.', ex:[['토끼','rabbit'],['타다','to ride']]},
 {ch:'ㅍ', name:'pieup', rom:'p', sound:'a strongly aspirated P, with a puff of air', mouth:'Same as ㅂ, release with extra breath', memory:'ㅁ with four lines = maximum air release.', ex:[['피아노','piano'],['파티','party']]},
 {ch:'ㅎ', name:'hieut', rom:'h', sound:'like English H', mouth:'Open airflow from the throat, like exhaling', memory:'ㅇ + two strokes on top = the empty circle releases a breath of air.', ex:[['하다','to do'],['한국','Korea']]},
];

 ['거','너','더','러','머','버','서','어','저','허'],

];

const TEACHER_TIPS = ['Do not memorize this. Write it.','Read aloud three times.','Cover the answer before writing.','Check your stroke order.','Do not rush.','Focus on accuracy first.','Repeat until effortless.'];
function tip(i){ return TEACHER_TIPS[i % TEACHER_TIPS.length]; }

/* Batchim helper — determines whether a Korean word ends in a final
   consonant, exactly the rule taught in the lesson's 은/는 and 이에요/예요
   sections. Used to auto-generate linguistically correct fill-in-blank drills. */
function hasBatchim(word){
  const last = word[word.length-1];
  const code = last.codePointAt(0) - 0xAC00;
  if(code<0||code>11171) return null;
  return (code % 28) !== 0;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============================================================
   1. REUSABLE PRINT/PRACTICE COMPONENTS
   ============================================================ */
let CB_COUNTER = 0, ED_COUNTER = 0;
function lines(n){ let h='<div class="wline-set">'; for(let i=0;i<n;i++) h+='<div class="wline"></div>'; return h+'</div>'; }
function dashedLines(n){ let h='<div class="wline-set">'; for(let i=0;i<n;i++) h+='<div class="wline dashed"></div>'; return h+'</div>'; }
function traceRow(ch, ghostCount, blankCount){
  let h='<div class="trace-row">';
  for(let i=0;i<ghostCount;i++) h+=`<div class="trace-cell ghost">${ch}</div>`;
  for(let i=0;i<blankCount;i++) h+=`<div class="trace-cell blank">${ch}</div>`;
  return h+'</div>';
}
function gridBoxes(n, ghostCh){
  let h='<div class="grid-boxes">';
  for(let i=0;i<n;i++) h+= ghostCh && i===0 ? `<div class="gbox ghost">${ghostCh}</div>` : '<div class="gbox"></div>';
  return h+'</div>';
}
function chk(label){ CB_COUNTER++; return `<label class="pchk"><input type="checkbox" class="pcheck" data-key="cb-${CB_COUNTER}"> <span>${label}</span></label>`; }
function editable(placeholder, minLines){ ED_COUNTER++; const h = (minLines||3)*28; return `<div class="editable" contenteditable="true" data-key="ed-${ED_COUNTER}" data-ph="${placeholder}" style="min-height:${h}px"></div>`; }
function ans(text){ return `<span class="ans">${text}</span>`; }

addPage('Syllable Blocks','How Syllable Blocks Work', `
  <p>This is the single most important idea in reading Hangul. Letters are grouped into square syllable blocks — one block per spoken syllable. Every block has at minimum one initial consonant and one vowel; many also have a final consonant, called 받침 (batchim).</p>
  <div class="three-col">
    <div class="card no-break" style="text-align:center"><b>Case 1 — side by side</b><div class="kr" style="font-size:2.4em;margin:10px 0">가</div><p style="font-size:.85em">Tall vowel (ㅏ,ㅓ,ㅣ) → consonant sits to the <b>left</b>.</p></div>
    <div class="card no-break" style="text-align:center"><b>Case 2 — stacked</b><div class="kr" style="font-size:2.4em;margin:10px 0">고</div><p style="font-size:.85em">Wide vowel (ㅗ,ㅜ,ㅡ) → consonant sits <b>on top</b>.</p></div>
    <div class="card no-break" style="text-align:center"><b>Case 3 — with 받침</b><div class="kr" style="font-size:2.4em;margin:10px 0">한</div><p style="font-size:.85em">Final sound drops to the <b>bottom</b> of the block.</p></div>
  </div>
  <div class="callout tip"><span class="callout-label">Teacher's Tip</span>Read every block top-left → top-right (or straight down) → bottom. Same order as English reading — just compressed into a square.</div>
  <h3>Understanding ㅇ</h3>
  <p>At the <b>start</b> of a syllable, ㅇ is silent — 아 is simply "a". At the <b>end</b> of a syllable, ㅇ sounds like "ng" — 방 is roughly "bang".</p>
  <div class="callout warn"><span class="callout-label">Don't Panic</span>You do not need to memorize every batchim rule today — just recognize this pattern exists.</div>
`, {teacher:true});

    html += `<section class="page" data-idx="${i+1}">
      <div class="page-header"><span>TOPIK I · Day 1 Workbook</span><span>${p.section}</span></div>
      <div class="page-body">
        ${p.kicker?`<div class="page-kicker">${p.kicker}</div>`:''}
        <h1 class="page-title">${p.title}</h1>
        ${p.body}
      </div>
      ${p.teacher?`<div class="teacher-line">Teacher's comments: <i class="fill long"></i></div>`:''}
      <div class="page-footer">
        <span>Name: <i class="fill"></i> &nbsp; Date: <i class="fill"></i></span>
        <span class="pnum"></span>
      </div>
    </section>`;
  });
  book.innerHTML = html;
  const total = PAGES.length;
  document.querySelectorAll('.page').forEach((sec,i)=>{
    sec.querySelector('.pnum').textContent = `Page ${i+1} / ${total}`;
  });
  buildTOC();
}
function buildTOC(){
  const groups = [];
  PAGES.forEach((p,i)=>{
    const n=i+1;
    const last = groups[groups.length-1];
    if(last && last.name===p.section){ last.last=n; }
    else groups.push({name:p.section, first:n, last:n});
  });
  const html = groups.map(g=>`<div style="display:flex;justify-content:space-between;border-bottom:1px dotted var(--border);padding:6px 0"><span>${g.name}</span><span>pp. ${g.first}–${g.last}</span></div>`).join('');
  const tocEl = document.querySelector('#toc-list');
  if(tocEl) tocEl.innerHTML = html;
}

/* ============================================================
   4. INTERACTIVITY — progress saving, answer key, notes, reset
   ============================================================ */
const LS_PROGRESS = 'wbd1_progress', LS_NOTES = 'wbd1_notes', LS_ANSWERS='wbd1_answers', LS_DARK='wbd1_dark';

function loadProgress(){
  const saved = JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}');
  document.querySelectorAll('.pcheck').forEach(cb=>{ if(saved[cb.dataset.key]) cb.checked = true; });
}
function saveProgress(){
  const data = {};
  document.querySelectorAll('.pcheck').forEach(cb=>{ if(cb.checked) data[cb.dataset.key]=true; });
  localStorage.setItem(LS_PROGRESS, JSON.stringify(data));
  updateProgressUI();
}
function updateProgressUI(){
  const boxes = document.querySelectorAll('.pcheck');
  const done = document.querySelectorAll('.pcheck:checked').length;
  const pct = boxes.length ? Math.round((done/boxes.length)*100) : 0;
  document.getElementById('pFill').style.width = pct+'%';
  document.getElementById('pctLabel').textContent = pct+'% complete';
}
function loadNotes(){
  const saved = JSON.parse(localStorage.getItem(LS_NOTES)||'{}');
  document.querySelectorAll('.editable').forEach(ed=>{ if(saved[ed.dataset.key]) ed.textContent = saved[ed.dataset.key]; });
}
function saveNotes(){
  const data = {};
  document.querySelectorAll('.editable').forEach(ed=>{ if(ed.textContent.trim()) data[ed.dataset.key]=ed.textContent; });
  localStorage.setItem(LS_NOTES, JSON.stringify(data));
}
function initInteractivity(){
  loadProgress(); loadNotes(); updateProgressUI();
  document.body.addEventListener('change', e=>{ if(e.target.classList.contains('pcheck')) saveProgress(); });
  document.body.addEventListener('input', e=>{ if(e.target.classList.contains('editable')) saveNotes(); });

  const answerOn = localStorage.getItem(LS_ANSWERS)==='1';
  if(answerOn){ document.body.classList.add('show-answers'); document.getElementById('answerBtn').classList.add('on'); document.getElementById('answerBtn').textContent='🔒 Hide Answer Key'; }
  document.getElementById('answerBtn').onclick = ()=>{
    const on = document.body.classList.toggle('show-answers');
    localStorage.setItem(LS_ANSWERS, on?'1':'0');
    document.getElementById('answerBtn').classList.toggle('on', on);
    document.getElementById('answerBtn').textContent = on ? '🔒 Hide Answer Key' : '🔑 Show Answer Key';
  };

  const darkOn = localStorage.getItem(LS_DARK)==='1';
  if(darkOn){ document.body.classList.add('canvas-dark'); document.getElementById('darkBtn').classList.add('on'); }
  document.getElementById('darkBtn').onclick = ()=>{
    const on = document.body.classList.toggle('canvas-dark');
    localStorage.setItem(LS_DARK, on?'1':'0');
    document.getElementById('darkBtn').classList.toggle('on', on);
  };

  document.getElementById('printBtn').onclick = ()=> window.print();
  document.getElementById('resetBtn').onclick = ()=>{
    if(!confirm('Reset all saved progress, checkboxes, and notes in this workbook? This cannot be undone.')) return;
    localStorage.removeItem(LS_PROGRESS); localStorage.removeItem(LS_NOTES);
    document.querySelectorAll('.pcheck').forEach(cb=>cb.checked=false);
    document.querySelectorAll('.editable').forEach(ed=>ed.textContent='');
    updateProgressUI();
  };
}

renderBook();
initInteractivity();
</script>
