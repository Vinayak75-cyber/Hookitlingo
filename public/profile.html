<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | Hookitlingo</title>
<meta name="description" content="A Hookitlingo community profile.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#120c14; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941; --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --petal:#f3b6c6;
  --radius:14px;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",-apple-system,sans-serif; --jp:"Noto Serif JP",serif;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{color:var(--text); font-family:var(--sans); line-height:1.6; background:var(--ink);}
h1{font-family:var(--serif); font-weight:600; margin:0;}
a{color:inherit; text-decoration:none;}

body{
  background:
    radial-gradient(circle at 78% 12%, color-mix(in srgb, var(--vermilion) 20%, transparent), transparent 55%),
    radial-gradient(circle at 12% 88%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 55%),
    var(--ink);
}

/* Petals - fall across the full page, behind the card */
.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; animation:petal-fall linear infinite; opacity:.6;}
@keyframes petal-fall{0%{transform:translate(0,-10vh) rotate(0deg);} 100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }

/* ===== Floating card layout ===== */
.profile-hero{
  position:relative; z-index:2; min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:5vh 24px;
}

.profile-stack{
  width:100%; max-width:900px;
  display:flex; flex-direction:column; align-items:center; gap:18px;
}

.profile-card{
  position:relative; width:100%;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,.55), 0 2px 14px rgba(0,0,0,.4);
}

.outro-bar{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 26px; border-radius:999px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  color:var(--text); font-size:.88em; font-weight:600;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
.outro-bar:hover{background:rgba(255,255,255,.13); border-color:rgba(255,255,255,.26); transform:translateY(-2px);}
.outro-bar .icon-glyph{width:15px; height:15px; display:inline-flex;}
.outro-bar .icon-glyph svg{width:100%; height:100%; fill:none; display:block;}

.card-top{position:relative; padding:44px 26px 16px;}
.profile-bg{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 22%; z-index:0;
  display:block;
}
.profile-bg-fallback{
  position:absolute; inset:0; z-index:0;
  background:radial-gradient(circle at 65% 30%, color-mix(in srgb, var(--vermilion) 45%, transparent), transparent 60%),
             radial-gradient(circle at 25% 75%, color-mix(in srgb, var(--gold) 32%, transparent), transparent 55%),
             var(--surface2);
}
.card-top-scrim{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(180deg, rgba(18,12,20,.12) 0%, rgba(18,12,20,.5) 72%, rgba(18,12,20,.78) 100%);
}
.card-top-frame{
  position:relative; z-index:2;
  padding:24px 18px 8px;
  min-height:360px;
  display:flex; flex-direction:column; justify-content:flex-end;
}

.profile-flag{
  position:absolute; top:0; right:0; z-index:3;
  display:flex; align-items:center; justify-content:center;
  padding:10px 16px 10px 18px; border-bottom-left-radius:16px;
  font-size:1.3em; line-height:1;
  background:color-mix(in srgb, var(--ink) 55%, transparent);
  border-left:1px solid rgba(255,255,255,.22);
  border-bottom:1px solid rgba(255,255,255,.22);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}

.p-badge{
  display:inline-flex; align-items:center; gap:5px; font-size:.68em; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  padding:4px 12px; border-radius:999px; margin-bottom:8px; align-self:flex-start;
}
.p-badge.learner{background:var(--celadon-dim); color:var(--celadon);}
.p-badge.teacher{background:color-mix(in srgb, var(--gold) 24%, transparent); color:var(--gold);}

.profile-card h1{font-size:clamp(2.1em,4.8vw,3em); color:#fff; margin-bottom:2px; text-shadow:0 2px 10px rgba(0,0,0,.4);}
.p-sub{color:rgba(255,255,255,.78); font-size:1.05em; margin-bottom:0; text-shadow:0 1px 6px rgba(0,0,0,.4);}
.p-about{color:rgba(255,255,255,.85); font-size:.96em; line-height:1.6; max-width:540px; margin-top:8px; text-shadow:0 1px 6px rgba(0,0,0,.4);}
.p-about strong{color:#fff;}

.card-divider{height:1px; background:var(--border); margin:0 34px;}

.card-bottom{
  display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:18px 34px 22px;
}

.icon-row{display:flex; flex-wrap:wrap; align-items:center; gap:20px;}
.bottom-inner-divider{display:none;}
.icon-link{
  display:inline-flex; align-items:center; justify-content:center;
  width:26px; height:26px; color:var(--petal); opacity:.9;
  transition:transform .18s ease, opacity .18s ease;
}
.icon-link svg{width:100%; height:100%; fill:currentColor; display:block;}
.icon-link:hover{transform:translateY(-2px); opacity:1;}

.cta-btn{
  display:inline-flex; align-items:center; gap:9px; white-space:nowrap;
  font-size:.92em; font-weight:600; color:#1c1116;
  padding:13px 24px; border-radius:999px;
  background:linear-gradient(90deg, var(--vermilion), var(--gold));
  box-shadow:0 10px 24px rgba(229,138,162,.28);
  transition:transform .18s ease, box-shadow .18s ease;
}
.cta-btn:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(229,138,162,.36);}
.cta-btn .icon-glyph{width:17px; height:17px; display:inline-flex;}
.cta-btn .icon-glyph svg{width:100%; height:100%; fill:currentColor; display:block;}

/* Glassmorphism website link bars — sit above the icon row / CTA, one per
   filled-in Website slot. Three across on desktop, stacked on mobile. */
.link-bars{display:flex; gap:14px; margin:22px 34px 18px;}
.link-bar{
  flex:1; min-width:0;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 18px; border-radius:var(--radius);
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  color:var(--text); font-size:.88em; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:transform .18s ease, background .18s ease, border-color .18s ease;
}
.link-bar:hover{background:rgba(255,255,255,.15); border-color:rgba(255,255,255,.32); transform:translateY(-2px);}
.link-bar .icon-glyph{width:15px; height:15px; flex-shrink:0; display:inline-flex; opacity:.85;}
.link-bar .icon-glyph svg{width:100%; height:100%; fill:none; display:block;}
.link-bar span.link-bar-text{overflow:hidden; text-overflow:ellipsis;}

.site-link{
  display:inline-block; margin:0 34px 26px; font-size:.8em; color:rgba(255,255,255,.55);
  padding:8px 0;
}
.site-link:hover{color:rgba(255,255,255,.85);}

.state-msg{
  position:relative; z-index:2; min-height:100vh; display:flex; align-items:center; justify-content:center;
  text-align:center; color:var(--text-faint); font-size:.95em; padding:0 6vw;
}

/* ===== Mobile: stack the bottom bar, full-width CTA below the icon row ===== */
@media(max-width:640px){
  .profile-hero{padding:max(20px, env(safe-area-inset-top)) 18px 24px; align-items:center;}
  .profile-stack{gap:14px;}
  .profile-card{border-radius:26px;}
  .outro-bar{padding:12px 22px; border-radius:999px; font-size:.85em; max-width:calc(100% - 8px);}
  .card-top{padding:34px 18px 16px;}
  .profile-flag{padding:8px 13px 8px 15px; font-size:1.1em; border-bottom-left-radius:14px;}
  .card-top-frame{padding:20px 14px 8px; min-height:300px;}
  .card-divider{margin:0 24px;}
  .link-bars{flex-direction:column; gap:10px; margin:18px 24px 16px;}
  .card-bottom{flex-direction:column; align-items:stretch; gap:16px; padding:24px 24px 24px;}
  .icon-row{justify-content:center; gap:22px;}
  .bottom-inner-divider{display:block; height:1px; margin:0 8px; background:linear-gradient(90deg, transparent, var(--border) 50%, transparent);}
  .cta-btn{justify-content:center; width:100%;}
  .site-link{margin:0 24px 24px; text-align:center;}
}

/* ===== Pending-approval overlay: profile card renders normally but
   blurred, with a small lock card on top saying it isn't public yet.
   Shown only to the profile's own owner previewing it before
   approval — everyone else already gets redirected/blocked earlier. ===== */
.pending-blur{filter:blur(14px) brightness(.55); pointer-events:none; user-select:none;}
.pending-overlay{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(18,12,20,.35);
}
.pending-card{
  max-width:340px; width:100%; text-align:center; border-radius:var(--radius);
  background:var(--surface2); border:1px solid var(--border);
  padding:28px 26px; box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.pending-icon{font-size:1.8em; margin-bottom:10px;}
.pending-card h2{font-family:var(--serif); font-weight:600; font-size:1.4em; margin:0 0 8px;}
.pending-card p{margin:0; color:var(--text-dim); font-size:.92em;}
</style>

</head>

<div class="petals" id="petals" aria-hidden="true"></div>

<div id="pageHost">
  <div class="state-msg">Loading profile...</div>
</div>

(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 16 : 12;
  for(let i=0;i<count;i++){
    const size = 9 + Math.random()*10, left = Math.random()*100, dur = 12 + Math.random()*12;
    const delay = -(Math.random()*dur), drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)], rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();

const LINK_META = {
  instagram: { icon: ICON_SVG.instagram, label: 'Instagram' },
  discord:   { icon: ICON_SVG.discord, label: 'Discord' },
  whatsapp:  { icon: ICON_SVG.whatsapp, label: 'WhatsApp' },
  telegram:  { icon: ICON_SVG.telegram, label: 'Telegram' },
  line:      { icon: ICON_SVG.line, label: 'LINE' },
  twitter:   { icon: ICON_SVG.twitter, label: 'X (Twitter)' },
  facebook:  { icon: ICON_SVG.facebook, label: 'Facebook' },
  tiktok:    { icon: ICON_SVG.tiktok, label: 'TikTok' },
  youtube:   { icon: ICON_SVG.youtube, label: 'YouTube' }
};
// The three optional website links get their own glassmorphism bars
// (see linkBarsHtml) instead of a small icon in the row above, so each
// can carry its own button text.
const WEBSITE_SLOTS = [
  { urlKey: 'website1', labelKey: 'website1Label', fallback: 'Website 1' },
  { urlKey: 'website2', labelKey: 'website2Label', fallback: 'Website 2' },
  { urlKey: 'website3', labelKey: 'website3Label', fallback: 'Website 3' }
];
// Preference order for the "Get in touch" call-to-action button —
// email comes first since that's the button's whole point; the rest
// are a fallback for when a profile has no Email filled in.
const CONTACT_PRIORITY = ['email', 'whatsapp', 'telegram', 'line', 'instagram', 'discord', 'website1'];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function normalizeUrl(val, platform){
  if(!val) return null;
  const trimmed = String(val).trim();
  if(/^https?:\/\//i.test(trimmed)) return trimmed;

  switch(platform){
    case 'instagram':
      return `https://instagram.com/${trimmed.replace(/^@/, '')}`;
    case 'whatsapp': {
      // Stored as a raw phone number (e.g. "+91 8459444524") -> wa.me deep link
      const digits = trimmed.replace(/[^0-9]/g, '');
      return digits ? `https://wa.me/${digits}` : null;
    }
    case 'website1':
    case 'website2':
    case 'website3':
      // Stored as a bare domain (e.g. "hookit.online") -> add the protocol
      return `https://${trimmed.replace(/^\/+/, '')}`;
    case 'discord':
      // Stored as an invite code/link fragment (e.g. "discord.gg/abc123")
      if (/^discord\.(gg|com)\//i.test(trimmed)) return `https://${trimmed}`;
      // A bare username/tag has no reliable public profile URL on Discord's
      // side, so there's nothing safe to link to — leave it unlinked.
      return null;
    case 'twitter':
      return `https://x.com/${trimmed.replace(/^@/, '')}`;
    case 'facebook':
      return `https://facebook.com/${trimmed.replace(/^@/, '')}`;
    case 'tiktok':
      return `https://tiktok.com/@${trimmed.replace(/^@/, '')}`;
    case 'youtube':
      return `https://youtube.com/@${trimmed.replace(/^@/, '')}`;
    case 'telegram':
      return `https://t.me/${trimmed.replace(/^@/, '')}`;
    case 'line':
      // Stored as a personal LINE ID -> LINE's own add-friend deep link
      return `https://line.me/ti/p/~${trimmed.replace(/^~/, '')}`;
    case 'email':
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed) ? `mailto:${trimmed}` : null;
    default:
      return null;
  }
}

function iconRowHtml(links){
  let html = '';
  Object.keys(LINK_META).forEach(key => {
    const val = links && links[key];
    if(!val) return;
    const meta = LINK_META[key];
    const url = normalizeUrl(val, key);
    if(url){
      html += `<a class="icon-link" href="${url}" target="_blank" rel="noopener" title="${meta.label}">${meta.icon}</a>`;
    } else {
      // No reliable direct link could be built (e.g. a bare Discord tag) —
      // still show the icon, just not clickable.
      html += `<span class="icon-link" title="${meta.label}: ${val}">${meta.icon}</span>`;
    }
  });
  return html;
}

function linkBarsHtml(links){
  let html = '';
  WEBSITE_SLOTS.forEach(slot => {
    const val = links && links[slot.urlKey];
    if(!val) return;
    const url = normalizeUrl(val, slot.urlKey);
    if(!url) return;
    const label = (links && links[slot.labelKey]) ? links[slot.labelKey] : slot.fallback;
    html += `<a class="link-bar" href="${url}" target="_blank" rel="noopener" title="${escapeHtml(label)}"><span class="link-bar-text">${escapeHtml(label)}</span></a>`;
  });
  return html;
}

function contactCtaHtml(links){
  for(const key of CONTACT_PRIORITY){
    const val = links && links[key];
    if(!val) continue;
    const url = normalizeUrl(val, key) || null;
    if(url){
      return `<a class="cta-btn" href="${url}" target="_blank" rel="noopener"><span class="icon-glyph">${ICON_SVG.mail}</span>Get in touch</a>`;
    }
  }
  return `<a class="cta-btn" href="japanese-hub.html"><span class="icon-glyph">${ICON_SVG.mail}</span>Get in touch</a>`;
}

function countryFlagEmoji(countryRaw){
  if(!countryRaw) return '';
  const key = countryRaw.trim().toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ');
  const iso2 = COUNTRY_TO_ISO2[key];
  if(!iso2) return '';
  return String.fromCodePoint(...[...iso2].map(c => 127397 + c.charCodeAt(0)));
}

function renderProfile(p){
  const badgeClass = p.type === 'teacher' ? 'teacher' : 'learner';
  const badgeLabel = p.type === 'teacher' ? 'Teacher / Native Speaker' : 'Learner';
  const sub = p.tagline || p.country || '';

  const bgHtml = p.imageUrl
    ? `<img class="profile-bg" id="profileBg" src="${p.imageUrl}" alt="" onerror="this.remove(); document.getElementById('profileBgFallback')?.style.removeProperty('display');">`
    : '';
  const fallbackHtml = `<div class="profile-bg-fallback" id="profileBgFallback" style="${p.imageUrl ? 'display:none;' : ''}"></div>`;
  const flagEmoji = countryFlagEmoji(p.country);
  const flagHtml = flagEmoji ? `<div class="profile-flag" title="${p.country}">${flagEmoji}</div>` : '';
  const linkBars = linkBarsHtml(p.links);

  document.getElementById('pageHost').innerHTML = `
    <div class="profile-hero">
      <div class="profile-stack">
        <div class="profile-card">
          <div class="card-top">
            ${bgHtml}
            ${fallbackHtml}
            ${flagHtml}
            <div class="card-top-scrim"></div>
            <div class="card-top-frame">
              <div class="p-badge ${badgeClass}">${badgeLabel}</div>
              <h1>${p.name}</h1>
              ${sub ? `<div class="p-sub">${sub}</div>` : ''}
              ${p.about ? `<p class="p-about">${p.about}</p>` : ''}
            </div>
          </div>
          <div class="card-divider"></div>
          ${linkBars ? `<div class="link-bars">${linkBars}</div>` : ''}
          <div class="card-bottom">
            <div class="icon-row">${iconRowHtml(p.links) || ''}</div>
            <div class="bottom-inner-divider"></div>
            ${contactCtaHtml(p.links)}
          </div>
        </div>
        <a class="outro-bar" href="https://hookit.online/" target="_blank" rel="noopener">See more on Hookitlingo<span class="icon-glyph">${ICON_SVG.arrowRight}</span></a>
      </div>
    </div>
  `;
}

function showPendingOverlay(status){
  const hero = document.querySelector('#pageHost .profile-hero');
  if(hero) hero.classList.add('pending-blur');

  const isRejected = status === 'Rejected';
  const overlay = document.createElement('div');
  overlay.className = 'pending-overlay';
  overlay.innerHTML = `
    <div class="pending-card">
      <div class="pending-icon">${isRejected ? '⚠️' : '🔒'}</div>
      <h2>${isRejected ? 'Changes needed' : 'Approval pending'}</h2>
      <p>${isRejected
        ? "This profile wasn't approved as-is. Head to your edit page to update it and resubmit."
        : "This is a preview, your profile isn't public yet. It'll go live once it's been reviewed."}</p>
    </div>
  `;
  document.body.appendChild(overlay);
}

async function loadProfile(){
  const params = new URLSearchParams(window.location.search);
  // New clean links come as /u/<slug>; legacy links come as
  // /profile.html?id=<recordId>. Prefer the path-based slug when
  // present so anyone hitting /u/priya-142 doesn't need a query
  // string at all, but keep the old ?id= working for links already
  // shared or bookmarked before this existed.
  const slugMatch = window.location.pathname.match(/^\/u\/([a-z0-9-]+)$/i);
  const slug = slugMatch ? slugMatch[1] : null;
  const id = params.get('id');
  const pageHost = document.getElementById('pageHost');

  if(!slug && !id){
    pageHost.innerHTML = '<div class="state-msg">Profile not found.</div>';
    return;
  }

  try {
    const lookupParam = slug ? `slug=${encodeURIComponent(slug)}` : `id=${encodeURIComponent(id)}`;
    const res = await fetch(`/api/directory?${lookupParam}`, { credentials: 'include' });
    const data = await res.json();
    if(res.status === 401 && data && data.loginRequired){
      // Not logged in — send them to the listing page (learners or
      // teachers, whichever this card came from) with the login modal
      // pre-opened, then they land right back here once they've
      // logged in (see handleCardClick() there). Clean /u/ links carry
      // no ?type=, so fall back to sniffing document.referrer for
      // which grid they clicked from; default to learners if that's
      // inconclusive too (they still land back on this exact profile
      // right after logging in either way, via ?next=).
      const referrerSaysTeacher = /japanese-teachers\.html/i.test(document.referrer || '');
      const listingPage = (params.get('type') === 'teacher' || referrerSaysTeacher)
        ? 'japanese-teachers.html' : 'japanese-learners.html';
      window.location.href = `${listingPage}?login=1&next=${encodeURIComponent(window.location.href)}`;
      return;
    }
    if(!res.ok || !data.profile){
      pageHost.innerHTML = '<div class="state-msg">This profile could not be found.</div>';
      return;
    }
    renderProfile(data.profile);
    document.title = `${data.profile.name} | Hookitlingo`;
    // This response only ever includes a non-Approved profile at all
    // when the viewer is its own owner previewing it early (anyone
    // else got redirected or 404'd above) — so blur it and cover it
    // with a pending notice instead of showing the raw page as-is.
    if(data.status && data.status !== 'Approved'){
      showPendingOverlay(data.status);
    }
  } catch (err) {
    pageHost.innerHTML = '<div class="state-msg">Could not load this profile right now.</div>';
  }
}

loadProfile();
