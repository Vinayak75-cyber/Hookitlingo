<style>

html{scroll-behavior:smooth;}

body.print-mode{background:#fff;color:#111;}

h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}

button{font-family:var(--sans); cursor:pointer;}

}

.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{

  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);

}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;

}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}

.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;

}

.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}
.spk-btn:disabled{opacity:.45; pointer-events:none;}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qtype-badge{display:inline-block; font-size:.62em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-bottom:10px;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}
.err-item b{font-family:var(--jp); font-size:1.1em;}

.dialogue-line{display:flex; gap:14px; align-items:flex-start; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:10px 0;}

.dialogue-line .dl-jp{flex:1; font-family:var(--jp); font-size:1.15em;}
.dialogue-line .dl-spk{margin-top:8px;}
details.passage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:16px 0;}
details.passage summary{cursor:pointer; color:var(--celadon); font-size:.85em; text-transform:uppercase; letter-spacing:.05em;}
details.passage .passage-en{margin-top:10px; color:var(--text-dim); font-size:.92em;}
.passage-jp{font-family:var(--jp); font-size:1.2em; white-space:pre-line; line-height:2.1;}
.passage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;}

/* Reading & Listening Mastery specific components */
.timer-box{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin:14px 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.timer-num{font-family:var(--serif); font-size:1.3em; color:var(--gold); min-width:56px; text-align:center;}

.pic-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:6px 0 4px;}

.pic-opt:hover{border-color:var(--celadon);}
.pic-opt .pic-emoji{font-size:2.3em; display:block; margin-bottom:8px;}
.pic-opt .pic-label{font-family:var(--jp); font-size:.95em;}
.pic-opt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.pic-opt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}

.stat-block{margin:20px 0;}
.stat-row{display:flex; justify-content:space-between; font-size:.9em; color:var(--text-dim); margin-bottom:6px;}
.stat-row b{color:var(--text); font-family:var(--serif); font-size:1.15em;}
.stat-track{height:10px; background:var(--surface3); border-radius:6px; overflow:hidden; margin-bottom:18px;}
.stat-fill{height:100%; border-radius:6px; transition:width .5s;}
.stat-fill.read{background:linear-gradient(90deg,var(--celadon), var(--inkblue));}
.stat-fill.listen{background:linear-gradient(90deg,var(--vermilion), var(--gold));}
.subtype-row{display:flex; justify-content:space-between; font-size:.8em; color:var(--text-faint); margin:10px 0 4px;}

.subtype-fill{height:100%; border-radius:4px; background:var(--gold);}

const PREFIX = 'tjs13l4_';
function loadState(){
  const defaults = {current:null, last:null, visited:{}, itemResults:{}, listenMode:'once', listenPlayed:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[], furiganaOn:true};
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return Object.assign({}, defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}
function applyFurigana(){
  const on = !!State.furiganaOn;
  document.getElementById('main').classList.toggle('furigana-off', !on);
  const btn = document.getElementById('furiBtn');
  btn.textContent = '🈶 Furigana: ' + (on ? 'On' : 'Off');
  btn.classList.toggle('active-toggle', on);
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  State.theme = State.theme==='light' ? 'dark' : 'light'; saveState(); applyTheme();
});
document.getElementById('furiBtn').addEventListener('click', ()=>{
  State.furiganaOn = !State.furiganaOn; saveState(); applyFurigana();
});

/* ============================================================
   2. AUDIO
   ============================================================ */
/* Left empty on purpose, exactly like every other file in this roadmap.
   Fill this object with "phrase or word": "data:audio/mpeg;base64,...."
   pairs later, using the exact Japanese string as the key, and every
   speaker button and listen control below starts working untouched. */
const AUDIO_DATA = {};

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  const plain = text.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, '');
  const safeText = JSON.stringify(plain).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}

/* listenBtnHtml/playListen: the same Audio_ engine above, wrapped so a
   listening item can be locked to one play in exam mode. Nothing about
   Audio_.speak itself changes, this only tracks whether a given item's
   line has already been played once. */
function listenBtnHtml(id, text){
  const locked = State.listenMode==='once' && !!State.listenPlayed[id];
  const safeText = JSON.stringify(text).replace(/"/g, '&quot;');
  const label = locked ? '✔ Played' : '🔊 Listen';
  return `<div class="listen-box">${spkBtnCustom(id, safeText, label, locked)}<div class="timer-hint">${State.listenMode==='once' ? 'Exam mode: plays once' : 'Practice mode: play as many times as you like'}</div></div>`;
}
function spkBtnCustom(id, safeText, label, locked){
  return `<button class="spk-btn no-print" ${locked?'disabled':''} onclick="playListen('${id}', ${safeText}, this)">${label}</button>`;
}
function playListen(id, text, btn){
  Audio_.speak(text, btn);
  if(State.listenMode==='once'){
    State.listenPlayed[id] = true; saveState();
    setTimeout(()=>{ btn.disabled = true; btn.textContent = '✔ Played'; }, 50);
  }
}
function playDialogue(id){
  const d = DIALOGUES.find(x=>x.id===id);
  if(!d) return;
  d.lines.forEach(l=>Audio_.speak(l.jp.replace(/<rt>[\s\S]*?<\/rt>/g,'').replace(/<[^>]*>/g,''), null));
  if(State.listenMode==='once'){
    State.listenPlayed[id] = true; saveState();
    const btn = document.getElementById('dlgbtn-'+id);
    if(btn){ btn.disabled = true; btn.textContent = '✔ Played'; }
  }
}
function toggleListenMode(){
  State.listenMode = State.listenMode==='once' ? 'unlimited' : 'once';
  saveState();
  goTo(State.current);
}

/* ============================================================
   3. QUIZ / STATS ENGINE
   ============================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function computeStats(track, qtype){
  const items = ALL_ITEMS.filter(i=>i.track===track && (!qtype || i.qtype===qtype));
  const total = items.length;
  const attempted = items.filter(i=>State.itemResults[i.id]!==undefined).length;
  const correct = items.filter(i=>State.itemResults[i.id]===true).length;
  const pct = attempted ? Math.round((correct/attempted)*100) : 0;
  return {total, attempted, correct, pct};
}

/* buildQuizTracked: the same visual quiz engine used across this roadmap
   (same .quiz-q/.qopt classes, same immediate feedback), extended to
   support picture-card options, a per-item listen control, a transcript
   reveal once answered, and per-item logging into State.itemResults so
   the shared results screen can break accuracy down by question type. */
function buildQuizTracked(containerId, items){
  const wrap = document.createElement('div');
  wrap.id = containerId;
  let idx = 0;

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const correctCount = items.filter(it=>State.itemResults[it.id]===true).length;
      const attemptedCount = items.filter(it=>State.itemResults[it.id]!==undefined).length;
      const pct = attemptedCount ? Math.round((correctCount/attemptedCount)*100) : 0;
      wrap.innerHTML = `<div class="quiz-score">${pct}% - ${correctCount}/${items.length} correct ${pct>=70?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="goTo(State.current)">Go Through Again</button></div>`;
      checkBadges(); saveState(); updateProgress();
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const listenHtml = item.audio ? listenBtnHtml(item.id, item.audio) : '';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    const optsClass = item.optionType==='picture' ? 'qopts pic-grid' : 'qopts';
    q.innerHTML = `<div class="qtype-badge">${QTYPE_LABELS[item.qtype]||''}</div>${listenHtml}<div class="${qClass}">${item.prompt}</div><div class="${optsClass}"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    const isPic = item.optionType === 'picture';
    item.options.forEach(opt=>{
      const val = isPic ? opt.label : opt;
      const b = document.createElement('button');
      b.className = isPic ? 'pic-opt' : 'qopt';
      b.innerHTML = isPic ? `<span class="pic-emoji">${opt.emoji}</span><span class="pic-label jp">${opt.label}</span>` : opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        const correct = (val === item.answer);
        State.itemResults[item.id] = correct;
        if(correct){
          b.classList.add('correct');
          fb.innerHTML = 'Correct!';
        } else {
          b.classList.add('wrong');
          [...optsEl.children].forEach(c=>{
            const cv = isPic ? c.querySelector('.pic-label').textContent : c.textContent;
            if(cv===item.answer) c.classList.add('correct');
          });
          fb.innerHTML = 'Not quite. Correct answer: ' + item.answer;
          const existing = State.errorLog.find(e=>e.q===item.prompt);
          if(existing){ existing.count = (existing.count||1)+1; }
          else{ State.errorLog.push({q:item.prompt, correct:item.answer, chapter:QTYPE_LABELS[item.qtype]||item.qtype}); }
        }
        if(item.transcript){
          fb.innerHTML += `<div class="transcript-reveal"><b>Transcript</b>${item.transcript}</div>`;
        }
        saveState(); checkBadges(); updateProgress();
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn secondary';
        nextBtn.style.marginTop = '10px';
        nextBtn.textContent = (idx < items.length-1) ? 'Next Question →' : 'See Score →';
        nextBtn.onclick = ()=>{ idx++; renderQ(); };
        q.appendChild(nextBtn);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

}
let TIMER_HANDLES = {};
function timerHtml(id, seconds){
  const m = Math.floor(seconds/60), s = seconds%60;
  return `<div class="timer-box no-print">
    <button class="btn secondary" onclick="startTimer('${id}', ${seconds})">⏱ Start ${m}:${String(s).padStart(2,'0')} Timer</button>
    <span class="timer-num" id="timer-num-${id}"></span>
    <span class="timer-hint">Optional. Real exam pacing, not a hard cutoff, nothing locks when it hits zero.</span>
  </div>`;
}
function startTimer(id, seconds){
  if(TIMER_HANDLES[id]) clearInterval(TIMER_HANDLES[id]);
  let remaining = seconds;
  const numEl = document.getElementById('timer-num-'+id);
  function tick(){
    if(!numEl) { clearInterval(TIMER_HANDLES[id]); return; }
    if(remaining<=0){
      numEl.textContent = "Time's up";
      clearInterval(TIMER_HANDLES[id]);
      return;
    }
    const m=Math.floor(remaining/60), s=remaining%60;
    numEl.textContent = m+':'+String(s).padStart(2,'0');
    remaining--;
  }
  tick();
  TIMER_HANDLES[id] = setInterval(tick, 1000);
}
function dialogueBlockHtml(d){
  const locked = State.listenMode==='once' && !!State.listenPlayed[d.id];
  return `<div class="card">
    <div class="listen-box">
      <button class="spk-btn no-print" id="dlgbtn-${d.id}" ${locked?'disabled':''} onclick="playDialogue('${d.id}')">${locked?'✔ Played':'🔊 Listen to the Dialogue'}</button>
      <div class="timer-hint">${State.listenMode==='once' ? 'Exam mode: plays once, straight through' : 'Practice mode: play it again as many times as you like'}</div>
    </div>
    <details class="passage">
      <summary>Show Transcript</summary>
      ${d.lines.map(l=>`<div class="dialogue-line"><div class="dl-speaker">${l.speaker}</div><div><div class="dl-jp jp">${l.jp}</div><div class="dl-spk">${spkBtn(l.jp)}</div></div></div>`).join('')}
    </details>
  </div>`;
}

function statBar(label, stats, cls){
  return `<div class="stat-row"><span>${label}</span><b>${stats.attempted ? stats.pct+'%' : 'Not started'}</b></div>

}
function subtypeBar(qtype, track){
  const s = computeStats(track, qtype);
  return `<div class="subtype-row"><span>${QTYPE_LABELS[qtype]}</span><span>${s.attempted ? s.pct+'% ('+s.correct+'/'+s.attempted+')' : 'not attempted'}</span></div>
  <div class="subtype-track"><div class="subtype-fill" style="width:${s.attempted?s.pct:0}%"></div></div>`;
}

function renderResults(el){
  chapterHeader(el, 'Finish', 'Shared Results', 'Reading and Listening, side by side, broken down by question type');
  const read = computeStats('reading');
  const listen = computeStats('listening');
  el.insertAdjacentHTML('beforeend', `<p>This combines every question you've answered across both tracks, however far you've gotten. Come back here any time, it always reflects your latest attempt on each question.</p>`);
  el.insertAdjacentHTML('beforeend', `<div class="card stat-block">
    <h3>Overall Accuracy</h3>
    ${statBar('📖 Reading Track', read, 'read')}
    ${statBar('🎧 Listening Track', listen, 'listen')}
  </div>`);
  el.insertAdjacentHTML('beforeend', `<div class="card">
    <h3>Reading, by Question Type</h3>
    ${READING_QTYPES.map(t=>subtypeBar(t,'reading')).join('')}
  </div>`);
  el.insertAdjacentHTML('beforeend', `<div class="card">
    <h3>Listening, by Question Type</h3>
    ${LISTENING_QTYPES.map(t=>subtypeBar(t,'listening')).join('')}
  </div>`);
  let advice = '';
  if(read.attempted===0 && listen.attempted===0){
    advice = "Nothing recorded yet in either track. Work through a passage or a listening chapter, then come back, this screen fills in as you go.";
  } else if(read.pct < 70 && read.attempted>0 && (listen.attempted===0 || read.pct <= listen.pct)){
    advice = "Reading looks like the track to revisit first. If one question type is dragging the score down more than the others, that's the one worth another pass before moving to the mock exams.";
  } else if(listen.pct < 70 && listen.attempted>0){
    advice = "Listening looks like the track to revisit first, try practice mode so you can replay the lines you're less sure about, then switch back to exam mode for a fair check.";
  } else if(read.attempted>0 && listen.attempted>0){
    advice = "Both tracks are holding up reasonably well. If every subtype above is at 70% or better, you're in good shape for the Mock Exams in the next lesson.";
  }
  if(advice) el.insertAdjacentHTML('beforeend', `<div class="callout tip"><span class="callout-label">Where To Go Next</span>${advice}</div>`);
  el.insertAdjacentHTML('beforeend', noteBox('results'));
  el.insertAdjacentHTML('beforeend', `<div class="btn-row"><button class="btn" onclick="goTo('homework')">Continue to Homework →</button></div>`);
}

function renderHomework(el){
  chapterHeader(el, 'Finish', 'Homework');
  el.insertAdjacentHTML('beforeend', `
  <div class="card">
  <ul>
    <li>Reread all five passages out loud, using the Read Aloud button, without looking at the English gloss until after you've tried to summarize each one in your own words.</li>
    <li>Retake any reading passage where a single question type scored under 70%, then check the results screen again to see if that number moved.</li>
    <li>Switch the listening track to exam mode if you did it in practice mode the first time, and see how the picture-based questions hold up without replays.</li>
    <li>Write one new sentence of your own for each of the four reading question types, main idea, detail, inference, and vocabulary in context, using vocabulary from any earlier section.</li>
    <li>Read both dialogues out loud with a study partner if you have one, one person per speaker, then swap roles and do it again.</li>
  </ul>
  </div>
  <div class="callout"><span class="callout-label">Before You Stop</span>Say out loud, from memory, one full sentence from any passage in this lesson. That's the instinct this whole file was built to strengthen, pulling meaning out of a block of Japanese without translating it word by word first.</div>
  <h3>End-of-Lesson Checklist</h3>
  <div class="card">
  <p>✅ Read all five passages and answered every comprehension question at least once.<br>
  ✅ Completed all three listening chapters, picture, quick-response, and dialogue.<br>
  ✅ Checked the combined results screen and know which track, if either, needs another pass.<br>
  ✅ Reading accuracy at 70% or better across all four question types.<br>
  ✅ Listening accuracy at 70% or better across all three question types.</p>
  </div>
  <div class="btn-row"><button class="btn" onclick="goTo('results')">Back to Results</button></div>
  `);
}

function renderErrorLog(el){
  chapterHeader(el, 'Finish', 'Your Error Log');
  if(!State.errorLog.length){
    el.insertAdjacentHTML('beforeend', `<div class="callout"><span class="callout-label">Nothing here yet</span>Every question you miss across either track gets logged here automatically, so you know exactly what to revisit before the Mock Exams.</div>`);
  } else {
    el.insertAdjacentHTML('beforeend', `<p>These are collected automatically from missed questions across both Reading and Listening. Review these first.</p>`);
    State.errorLog.forEach(e=>{
      el.insertAdjacentHTML('beforeend', `<div class="err-item"><b>${e.q.split('\\n')[0]}</b><br>Correct answer: ${e.correct} <span style="color:var(--text-faint)">· missed ${e.count||1}x · ${e.chapter}</span></div>`);
    });
  }
  el.insertAdjacentHTML('beforeend', `<h3>Additional Notes</h3>` + noteBox('error-log'));
}

function renderLessonComplete(el){
  chapterHeader(el, 'Finish', 'Lesson 4 Complete 🎉');
  const read = computeStats('reading'), listen = computeStats('listening');
  el.insertAdjacentHTML('beforeend', `<p>You've now read five original N5-level passages and listened your way through fourteen questions across three formats, all built from material you'd already met before opening this file. That's the actual shape of the JLPT N5 reading and listening sections, not simplified versions of it. Here's where your badges stand:</p>
  <div class="badge-grid">${BADGE_DEFS.map(b=>`<div class="badge ${State.badges[b.id]?'earned':''}"><div class="bicon">${b.icon}</div><div class="bname">${b.name}</div></div>`).join('')}</div>
  <div class="callout tip"><span class="callout-label">Where This Fits</span>Your current standing: Reading ${read.attempted?read.pct+'%':'not started'}, Listening ${listen.attempted?listen.pct+'%':'not started'}. This was Lesson 4 of Section 13's five-part exam bootcamp. Everything from the grammar recap, the kanji deck, the vocabulary deck, and this reading and listening lesson feeds directly into the next one.</div>
  `);
  el.insertAdjacentHTML('beforeend', `
  <h3>Coming Up in Section 13</h3>
  <div class="callout"><span class="callout-label">Next</span>Lesson 5, the Mock Exams, brings everything together into two or three complete, timed practice tests covering all three real JLPT N5 sections at once, scored against the actual pass logic: 80 out of 180 overall, with at least 19 points required in each section.</div>
  <div class="btn-row"><button class="btn secondary" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('results')">Back to Results</button> <button class="btn secondary" onclick="goTo('cover')">Back to Cover</button></div>
  `);
}

const RENDERERS = {
  'cover': renderCover,
  'intro': renderIntro,
  'read-intro': renderReadIntro,
  'read-p1': (el)=>renderReadingChapter(el,'read-p1'),
  'read-p2': (el)=>renderReadingChapter(el,'read-p2'),
  'read-p3': (el)=>renderReadingChapter(el,'read-p3'),
  'read-p4': (el)=>renderReadingChapter(el,'read-p4'),
  'read-p5': (el)=>renderReadingChapter(el,'read-p5'),
  'listen-intro': renderListenIntro,
  'listen-picture': renderListenPicture,
  'listen-quick': renderListenQuick,
  'listen-dialogue': renderListenDialogue,
  'results': renderResults,
  'homework': renderHomework,
  'error-log': renderErrorLog,
  'lesson-complete': renderLessonComplete,
};

const BADGE_DEFS = [
  {id:'reader', icon:'📖', name:'Reading Track Complete', test:()=>['read-p1','read-p2','read-p3','read-p4','read-p5'].every(id=>State.visited[id])},
  {id:'listener', icon:'🎧', name:'Listening Track Complete', test:()=>['listen-picture','listen-quick','listen-dialogue'].every(id=>State.visited[id])},
  {id:'sharp-reader', icon:'🔍', name:'Reading Accuracy 80%+', test:()=>{const s=computeStats('reading'); return s.attempted>=15 && s.pct>=80;}},
  {id:'good-ear', icon:'👂', name:'Listening Accuracy 80%+', test:()=>{const s=computeStats('listening'); return s.attempted>=10 && s.pct>=80;}},
  {id:'mastery', icon:'🏆', name:'Reading & Listening Mastery', test:()=>{const r=computeStats('reading'), l=computeStats('listening'); return r.attempted===ALL_READING_ITEMS.length && l.attempted===ALL_LISTENING_ITEMS.length && r.pct>=70 && l.pct>=70;}},
  {id:'ready', icon:'🎓', name:'Ready for Mock Exams', test:()=>!!State.visited['results']},
];

/* ============================================================
   6. NAVIGATION
   ============================================================ */
function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'error-log'){
      html += `<a class="nav-item" href="../jlptn5roadmap.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">🗺️ Roadmap</span></a>`;
    }
  });
  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const el = document.getElementById('nav-'+c.id);
    if(el) el.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

/* ============================================================
   7. INIT
   ============================================================ */
applyTheme();
applyFurigana();
document.documentElement.style.setProperty('--fs-scale', State.fontScale);
buildSidebar();
goTo(State.last && CHAPTERS.find(c=>c.id===State.last) ? State.last : 'cover');
window.addEventListener('keydown', e=>{
  const idx = CHAPTERS.findIndex(c=>c.id===State.current);
  if(e.key==='ArrowRight' && idx<CHAPTERS.length-1) goTo(CHAPTERS[idx+1].id);
  if(e.key==='ArrowLeft' && idx>0) goTo(CHAPTERS[idx-1].id);
});

/* Drifting cherry blossom petals, purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
