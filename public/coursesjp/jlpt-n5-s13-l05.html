<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

ruby{ruby-position:over; ruby-align:center;}
rt{font-family:var(--sans); font-size:.52em; font-weight:500; color:var(--text-faint); user-select:none; letter-spacing:0;}
#main.furigana-off rt{display:none;}
.topbtn.furi-btn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.kofi-footer{max-width:var(--maxw); margin:0 auto; padding:8px 20px 40px; text-align:center;}
.support-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.kofi-banner{
  display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff !important; font-weight:600; font-size:.92em; text-decoration:none; border:none;
  box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 35%, transparent); transition:filter .15s;
  font-family:var(--sans);
}
.kofi-banner:hover{filter:brightness(1.07);}
.share-banner{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--inkblue) 45%));
  box-shadow:0 10px 26px color-mix(in srgb, var(--celadon) 30%, transparent);
  min-width:290px; justify-content:center;
}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}
.spk-btn:disabled{opacity:.45; pointer-events:none;}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qtype-badge{display:inline-block; font-size:.62em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-bottom:10px;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}
.err-item b{font-family:var(--jp); font-size:1.1em;}

.dialogue-line{display:flex; gap:14px; align-items:flex-start; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:10px 0;}
.dialogue-line .dl-speaker{flex:none; width:88px; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.9em; padding-top:2px;}
.dialogue-line .dl-jp{flex:1; font-family:var(--jp); font-size:1.15em;}
.dialogue-line .dl-spk{margin-top:8px;}
details.passage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:16px 0;}
details.passage summary{cursor:pointer; color:var(--celadon); font-size:.85em; text-transform:uppercase; letter-spacing:.05em;}
details.passage .passage-en{margin-top:10px; color:var(--text-dim); font-size:.92em;}
.passage-jp{font-family:var(--jp); font-size:1.2em; white-space:pre-line; line-height:2.1;}
.passage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;}

.listen-box{background:var(--surface2); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:14px; margin:6px 0 16px; text-align:center;}
.listen-mode-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0;}
.transcript-reveal{margin-top:12px; padding:12px 14px; background:var(--surface3); border-radius:var(--radius-sm); font-family:var(--jp); font-size:1.02em; line-height:1.8;}
.transcript-reveal b{font-family:var(--sans); font-size:.7em; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); display:block; margin-bottom:4px;}

.pic-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; margin:6px 0 4px;}
.pic-opt{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:18px 10px; text-align:center; color:var(--text);}
.pic-opt:hover{border-color:var(--celadon);}
.pic-opt .pic-emoji{font-size:2.3em; display:block; margin-bottom:8px;}
.pic-opt .pic-label{font-family:var(--jp); font-size:.95em;}
.pic-opt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.pic-opt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.pic-opt:disabled{pointer-events:none;}

.stat-block{margin:20px 0;}
.stat-row{display:flex; justify-content:space-between; font-size:.9em; color:var(--text-dim); margin-bottom:6px;}
.stat-row b{color:var(--text); font-family:var(--serif); font-size:1.15em;}
.stat-track{height:10px; background:var(--surface3); border-radius:6px; overflow:hidden; margin-bottom:18px;}
.stat-fill{height:100%; border-radius:6px; transition:width .5s;}
.stat-fill.read{background:linear-gradient(90deg,var(--celadon), var(--inkblue));}
.stat-fill.listen{background:linear-gradient(90deg,var(--vermilion), var(--gold));}
.stat-fill.vocab{background:linear-gradient(90deg,var(--gold), var(--vermilion));}
.subtype-row{display:flex; justify-content:space-between; font-size:.8em; color:var(--text-faint); margin:10px 0 4px;}
.subtype-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden; margin-bottom:12px;}
.subtype-fill{height:100%; border-radius:4px; background:var(--gold);}

/* Mock Exam specific components */
.timer-box{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; margin:14px 0; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.timer-num{font-family:var(--serif); font-size:1.3em; color:var(--gold); min-width:56px; text-align:center;}
.timer-hint{color:var(--text-faint); font-size:.8em;}

.score-big{font-family:var(--serif); font-size:2.6em; text-align:center; margin:8px 0 2px;}
.score-sub{text-align:center; color:var(--text-faint); font-size:.85em; margin-bottom:16px;}
.pass-pill,.fail-pill{display:inline-block; padding:4px 14px; border-radius:999px; font-size:.72em; font-weight:700; text-transform:uppercase; letter-spacing:.06em;}
.pass-pill{background:var(--celadon-dim); color:var(--celadon); border:1px solid var(--celadon);}

<script>
/* ============================================================
   0. DATA
   ============================================================ */
function R(kanji, kana){ return '<ruby>'+kanji+'<rt>'+kana+'</rt></ruby>'; }
/* plainText: strips ruby/rt markup back down to the plain kanji text, used
   wherever an option string needs to be compared against item.answer or
   logged, so furigana in an option never breaks the answer checker. */
function plainText(str){ return String(str).replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, ''); }

const QTYPE_LABELS = {
  'kanji-reading': 'Kanji Reading',
  'word-usage': 'Word Usage',
  'grammar': 'Grammar',
  'sentence-order': 'Sentence Order',
  'main-idea': 'Main Idea',
  'detail': 'Detail',
  'inference': 'Inference',
  'vocab-context': 'Vocabulary in Context',
  'picture': 'Picture-Based',
  'quick-response': 'Quick Response',
  'dialogue': 'Dialogue Comprehension'
};

/* Every question below carries a fixed points value. Vocabulary and
   Grammar questions are worth 3 points each (20 questions = 60),
   Reading questions are worth 10 points each (6 questions = 60), and
   Listening questions are worth 6 points each (10 questions = 60).
   That 60/60/60 split against a 180 point total is what lets the
   results screens apply the real pass logic, 80 overall with at
   least 19 required in each of the three sections. */

/* ------------------------------------------------------------
   EXAM 1 · Vocabulary & Grammar (20 questions, 3 pts each)
   ------------------------------------------------------------ */
const EXAM1_VOCAB = [

  {id:'e1v7', points:3, qtype:'word-usage', isJp:true,

const PREFIX = 'tjs13l5_';
function loadState(){
  const defaults = {current:null, last:null, visited:{}, itemResults:{}, listenMode:'once', listenPlayed:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[], furiganaOn:true};
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return Object.assign({}, defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}

   2. AUDIO
   ============================================================ */
/* Left empty on purpose, exactly like every other file in this roadmap.
   Fill this object with "phrase or word": "data:audio/mpeg;base64,...."
   pairs later, using the exact Japanese string as the key, and every
   speaker button and listen control below starts working untouched. */
const AUDIO_DATA = {};

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  const plain = text.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, '');
  const safeText = JSON.stringify(plain).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}

/* listenBtnHtml/playListen: the same Audio_ engine above, wrapped so a
   listening item can be locked to one play in exam mode. Nothing about
   Audio_.speak itself changes, this only tracks whether a given item's
   line has already been played once. */
function listenBtnHtml(id, text){
  const locked = State.listenMode==='once' && !!State.listenPlayed[id];
  const safeText = JSON.stringify(text).replace(/"/g, '&quot;');
  const label = locked ? '✔ Played' : '🔊 Listen';
  return `<div class="listen-box">${spkBtnCustom(id, safeText, label, locked)}<div class="timer-hint">${State.listenMode==='once' ? 'Exam mode: plays once' : 'Practice mode: play as many times as you like'}</div></div>`;
}
function spkBtnCustom(id, safeText, label, locked){
  return `<button class="spk-btn no-print" ${locked?'disabled':''} onclick="playListen('${id}', ${safeText}, this)">${label}</button>`;
}
function playListen(id, text, btn){
  Audio_.speak(text, btn);
  if(State.listenMode==='once'){
    State.listenPlayed[id] = true; saveState();
    setTimeout(()=>{ btn.disabled = true; btn.textContent = '✔ Played'; }, 50);
  }
}
function playDialogue(id, list){
  const d = list.find(x=>x.id===id);
  if(!d) return;
  d.lines.forEach(l=>Audio_.speak(l.jp, null));
  if(State.listenMode==='once'){
    State.listenPlayed[id] = true; saveState();
    const btn = document.getElementById('dlgbtn-'+id);
    if(btn){ btn.disabled = true; btn.textContent = '✔ Played'; }
  }
}
function toggleListenMode(){
  State.listenMode = State.listenMode==='once' ? 'unlimited' : 'once';
  saveState();
  goTo(State.current);
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* buildQuizTracked: the same visual quiz engine used across this roadmap
   (same .quiz-q/.qopt classes, same immediate feedback), extended to
   support picture-card options, a per-item listen control, a transcript
   reveal once answered, and per-item logging into State.itemResults so
   the results screens can score by points, not just by count. */
function buildQuizTracked(containerId, items){
  const wrap = document.createElement('div');
  wrap.id = containerId;
  let idx = 0;

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const correctCount = items.filter(it=>State.itemResults[it.id]===true).length;
      const earnedPts = items.filter(it=>State.itemResults[it.id]===true).reduce((s,it)=>s+(it.points||1),0);
      const maxPts = items.reduce((s,it)=>s+(it.points||1),0);
      wrap.innerHTML = `<div class="quiz-score">${correctCount}/${items.length} correct · ${earnedPts}/${maxPts} points ${maxPts && earnedPts/maxPts>=0.7?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="goTo(State.current)">Go Through Again</button></div>`;
      checkBadges(); saveState(); updateProgress();
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const listenHtml = item.audio ? listenBtnHtml(item.id, item.audio) : '';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    const optsClass = item.optionType==='picture' ? 'qopts pic-grid' : 'qopts';
    q.innerHTML = `<div class="qtype-badge">${QTYPE_LABELS[item.qtype]||''} · ${item.points||1} pt${(item.points||1)>1?'s':''}</div>${listenHtml}<div class="${qClass}">${item.prompt}</div><div class="${optsClass}"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    const isPic = item.optionType === 'picture';
    item.options.forEach(opt=>{
      const val = isPic ? opt.label : plainText(opt);
      const b = document.createElement('button');
      b.className = isPic ? 'pic-opt' : 'qopt';
      b.innerHTML = isPic ? `<span class="pic-emoji">${opt.emoji}</span><span class="pic-label jp">${opt.label}</span>` : opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        const correct = (val === item.answer);
        State.itemResults[item.id] = correct;
        if(correct){
          b.classList.add('correct');
          fb.innerHTML = 'Correct!';
        } else {
          b.classList.add('wrong');
          [...optsEl.children].forEach(c=>{
            const cv = isPic ? c.querySelector('.pic-label').textContent : plainText(c.innerHTML);
            if(cv===item.answer) c.classList.add('correct');
          });
          fb.innerHTML = 'Not quite. Correct answer: ' + item.answer;
          const existing = State.errorLog.find(e=>e.q===item.prompt);
          if(existing){ existing.count = (existing.count||1)+1; }
          else{ State.errorLog.push({q:item.prompt, correct:item.answer, chapter:QTYPE_LABELS[item.qtype]||item.qtype}); }
        }
        if(item.transcript){
          fb.innerHTML += `<div class="transcript-reveal"><b>Transcript</b>${item.transcript}</div>`;
        }
        saveState(); checkBadges(); updateProgress();
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn secondary';
        nextBtn.style.marginTop = '10px';
        nextBtn.textContent = (idx < items.length-1) ? 'Next Question →' : 'See Score →';
        nextBtn.onclick = ()=>{ idx++; renderQ(); };
        q.appendChild(nextBtn);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

function sectionScore(items){
  const total = items.length;
  const attempted = items.filter(i=>State.itemResults[i.id]!==undefined).length;
  const correct = items.filter(i=>State.itemResults[i.id]===true).length;
  const maxPts = items.reduce((s,i)=>s+(i.points||1),0);
  const earnedPts = items.filter(i=>State.itemResults[i.id]===true).reduce((s,i)=>s+(i.points||1),0);
  return {total, attempted, correct, maxPts, earnedPts};
}
function computeExam(examId){
  const d = EXAM_DATA[examId];
  const vocab = sectionScore(d.vocab), reading = sectionScore(d.reading), listening = sectionScore(d.listening);
  const totalEarned = vocab.earnedPts + reading.earnedPts + listening.earnedPts;
  const totalMax = vocab.maxPts + reading.maxPts + listening.maxPts;
  const sectionsPass = vocab.earnedPts>=19 && reading.earnedPts>=19 && listening.earnedPts>=19;
  const pass = totalEarned>=80 && sectionsPass;
  const started = vocab.attempted>0 || reading.attempted>0 || listening.attempted>0;
  const complete = vocab.attempted===vocab.total && reading.attempted===reading.total && listening.attempted===listening.total;
  return {vocab, reading, listening, totalEarned, totalMax, pass, sectionsPass, started, complete};
}

let TIMER_HANDLES = {};
function timerHtml(id, seconds, label){
  const m = Math.floor(seconds/60), s = seconds%60;
  return `<div class="timer-box no-print">
    <button class="btn secondary" onclick="startTimer('${id}', ${seconds})">⏱ Start ${m}:${String(s).padStart(2,'0')} Timer</button>
    <span class="timer-num" id="timer-num-${id}"></span>
    <span class="timer-hint">${label||'Optional. Real exam pacing, not a hard cutoff, nothing locks when it hits zero.'}</span>
  </div>`;
}
function startTimer(id, seconds){
  if(TIMER_HANDLES[id]) clearInterval(TIMER_HANDLES[id]);
  let remaining = seconds;
  const numEl = document.getElementById('timer-num-'+id);
  function tick(){
    if(!numEl) { clearInterval(TIMER_HANDLES[id]); return; }
    if(remaining<=0){
      numEl.textContent = "Time's up";
      clearInterval(TIMER_HANDLES[id]);
      return;
    }
    const m=Math.floor(remaining/60), s=remaining%60;
    numEl.textContent = m+':'+String(s).padStart(2,'0');
    remaining--;
  }
  tick();
  TIMER_HANDLES[id] = setInterval(tick, 1000);
}
function dialogueBlockHtml(d, examId){
  const locked = State.listenMode==='once' && !!State.listenPlayed[d.id];
  return `<div class="card">

    </details>
  </div>`;
}
function pillHtml(pass){
  return pass ? `<span class="pass-pill">Pass</span>` : `<span class="fail-pill">Below Minimum</span>`;
}
function sectionScoreCard(name, score, cls){
  return `<div class="section-score-card">
    <div class="ssc-head"><h3 style="margin:0">${name}</h3><span class="ssc-pts">${score.earnedPts} / ${score.maxPts} pts</span></div>
    <div class="stat-track"><div class="stat-fill ${cls}" style="width:${score.maxPts?Math.round(score.earnedPts/score.maxPts*100):0}%"></div></div>
    <div class="timer-hint" style="margin:-8px 0 6px;">${score.correct}/${score.attempted} attempted correct, out of ${score.total} questions total. Minimum to pass this section: 19 points.</div>
    ${pillHtml(score.earnedPts>=19)}
  </div>`;
}

  el.insertAdjacentHTML('beforeend', sectionScoreCard('Listening', r.listening, 'listen'));
  let advice = '';
  if(!r.started){
    advice = "Nothing recorded yet for this exam. Work through Vocabulary and Grammar, Reading, and Listening, then come back, this screen fills in as you go.";
  } else if(r.pass){
    advice = "This attempt clears both bars, 80 or more overall, and 19 or more in every section. That's a passing result under the real logic.";
  } else if(r.totalEarned<80){
    advice = "The overall total is short of 80. Look at whichever section scored lowest below, that's usually where the fastest gains are.";
  } else {
    const weak = [['Vocabulary & Grammar',r.vocab],['Reading',r.reading],['Listening',r.listening]].filter(x=>x[1].earnedPts<19).map(x=>x[0]);
    advice = "The overall total clears 80, but " + weak.join(' and ') + " fell under the 19 point minimum. Under the real pass logic, that's still a fail, the sectional minimum exists exactly to catch this pattern.";
  }
  el.insertAdjacentHTML('beforeend', `<div class="callout ${r.pass?'tip':'warn'}"><span class="callout-label">Where This Stands</span>${advice}</div>`);
  el.insertAdjacentHTML('beforeend', noteBox('exam'+examId+'-results'));
  const nextId = examId===1 ? 'exam2-intro' : 'overall-results';
  const nextLabel = examId===1 ? 'Start Mock Exam 2 →' : 'See the Overall Report →';
  el.insertAdjacentHTML('beforeend', `<div class="btn-row"><button class="btn" onclick="goTo('${nextId}')">${nextLabel}</button> <button class="btn secondary" onclick="goTo('exam${examId}-vocab')">Retake This Exam</button></div>`);
}

function renderOverallResults(el){
  chapterHeader(el, 'Finish', 'Overall Report', 'Both mock exams, side by side');
  const r1 = computeExam(1), r2 = computeExam(2);
  el.insertAdjacentHTML('beforeend', `<p>Here's how both attempts stack up against each other and against the real pass logic. Come back to this screen any time, it always reflects your latest answers on each exam.</p>`);
  el.insertAdjacentHTML('beforeend', `<div class="exam-summary-row">
    <div><b>${r1.totalEarned}/${r1.totalMax}</b><span>Mock Exam 1</span></div>
    <div><b>${r2.totalEarned}/${r2.totalMax}</b><span>Mock Exam 2</span></div>
    <div><b>${r1.pass && r2.pass ? '2/2' : (r1.pass || r2.pass ? '1/2' : '0/2')}</b><span>Passing Attempts</span></div>
  </div>`);
  el.insertAdjacentHTML('beforeend', `<div class="section-score-card"><div class="ssc-head"><h3 style="margin:0">Mock Exam 1</h3>${pillHtml(r1.pass)}</div>
  ${statLine('Vocabulary & Grammar', r1.vocab)}${statLine('Reading', r1.reading)}${statLine('Listening', r1.listening)}</div>`);
  el.insertAdjacentHTML('beforeend', `<div class="section-score-card"><div class="ssc-head"><h3 style="margin:0">Mock Exam 2</h3>${pillHtml(r2.pass)}</div>
  ${statLine('Vocabulary & Grammar', r2.vocab)}${statLine('Reading', r2.reading)}${statLine('Listening', r2.listening)}</div>`);

  const combos = [
    ['Vocabulary & Grammar', r1.vocab.earnedPts+r2.vocab.earnedPts, 'Section 13, Lesson 1 (Full Grammar Recap) and Lesson 3 (Full Vocabulary Deck)'],
    ['Reading', r1.reading.earnedPts+r2.reading.earnedPts, 'Section 13, Lesson 4 (Reading & Listening Mastery), the Reading Track'],
    ['Listening', r1.listening.earnedPts+r2.listening.earnedPts, 'Section 13, Lesson 4 (Reading & Listening Mastery), the Listening Track']
  ];
  const weakest = combos.reduce((a,b)=> b[1]<a[1] ? b : a);
  let verdict;
  if(!r1.started && !r2.started){
    verdict = "Neither mock exam has been started yet. Work through Mock Exam 1 first, then Mock Exam 2, and this report will fill in with a real verdict.";
  } else if(r1.pass && r2.pass){
    verdict = "Both attempts passed under the real logic, 80 or more overall with every section at 19 or above. That's a genuinely solid signal that you're ready to sit the actual JLPT N5.";
  } else {
    verdict = "At least one attempt fell short somewhere. Out of the three sections, " + weakest[0] + " is the lowest combined score across both exams, " + weakest[1] + " is the most direct place to revisit before trying again.";
  }
  el.insertAdjacentHTML('beforeend', `<div class="callout ${(r1.pass&&r2.pass)?'tip':'warn'}"><span class="callout-label">Verdict</span>${verdict}</div>`);
  el.insertAdjacentHTML('beforeend', noteBox('overall-results'));
  el.insertAdjacentHTML('beforeend', `<div class="btn-row"><button class="btn" onclick="goTo('homework')">Continue to Homework →</button></div>`);
}
function statLine(label, score){
  return `<div class="stat-row"><span>${label}</span><b>${score.earnedPts}/${score.maxPts} pts</b></div>
  <div class="stat-track"><div class="stat-fill" style="width:${score.maxPts?Math.round(score.earnedPts/score.maxPts*100):0}%; background:linear-gradient(90deg,var(--gold),var(--vermilion));"></div></div>`;
}

function renderHomework(el){

  el.insertAdjacentHTML('beforeend', `
  <div class="card">
  <ul>
    <li>Retake whichever mock exam scored lower, focusing only on the section that fell under 19 points, then check its results screen again to see if the number moved.</li>
    <li>Go back to the Error Log below and reread every missed question once, out loud, before looking at the correct answer again.</li>
    <li>If Vocabulary and Grammar was the weak section, spend one more pass through Section 13, Lesson 1 and Lesson 3, the grammar and vocabulary recap decks, before attempting either mock exam again.</li>
    <li>If Reading or Listening was the weak section, go back to Section 13, Lesson 4 and redo just that track, then return here for a fresh attempt.</li>
    <li>Switch Listening to exam mode if you practiced in unlimited mode the first time, and see how the picture and quick-response questions hold up without replays.</li>
  </ul>
  </div>
  <div class="callout"><span class="callout-label">Before You Stop</span>Say out loud, from memory, one full sentence you got wrong somewhere in either mock exam, correctly this time. That's the whole point of this lesson, closing the specific gaps the real test would have caught too.</div>
  <h3>End-of-Lesson Checklist</h3>
  <div class="card">

function renderErrorLog(el){
  chapterHeader(el, 'Finish', 'Your Error Log');
  if(!State.errorLog.length){
    el.insertAdjacentHTML('beforeend', `<div class="callout"><span class="callout-label">Nothing here yet</span>Every question you miss across either mock exam gets logged here automatically, so you know exactly what to revisit.</div>`);
  } else {
    el.insertAdjacentHTML('beforeend', `<p>Collected automatically from missed questions across both exams. Review these first.</p>`);
    State.errorLog.forEach(e=>{
      el.insertAdjacentHTML('beforeend', `<div class="err-item"><b>${e.q.split('\\n')[0]}</b><br>Correct answer: ${e.correct} <span style="color:var(--text-faint)">· missed ${e.count||1}x · ${e.chapter}</span></div>`);
    });
  }
  el.insertAdjacentHTML('beforeend', `<h3>Additional Notes</h3>` + noteBox('error-log'));
}

function renderLessonComplete(el){
  chapterHeader(el, 'Finish', 'Roadmap Complete 🎉');
  const r1 = computeExam(1), r2 = computeExam(2);
  el.insertAdjacentHTML('beforeend', `<p>Two full mock exams, 72 questions, 360 points possible across both attempts, all of it built from material you'd already met before this lesson even started. That's every lesson in this roadmap, from hiragana on day one through to a scored practice test that follows the real JLPT N5 pass logic. Here's where your badges stand:</p>
  <div class="badge-grid">${BADGE_DEFS.map(b=>`<div class="badge ${State.badges[b.id]?'earned':''}"><div class="bicon">${b.icon}</div><div class="bname">${b.name}</div></div>`).join('')}</div>
  <div class="callout tip"><span class="callout-label">Where This Fits</span>Mock Exam 1: ${r1.started ? r1.totalEarned+'/180' : 'not started'}. Mock Exam 2: ${r2.started ? r2.totalEarned+'/180' : 'not started'}. This was the final lesson of Section 13, and the final lesson of the roadmap.</div>

  <h3>What Comes Next</h3>
  <div class="callout"><span class="callout-label">Beyond This Roadmap</span>If both mock exams are passing consistently, the material here matches what the real JLPT N5 expects. The best next step is simply registering for the actual test and keeping up light review, a few minutes of the kanji or vocabulary decks a week, so none of this gets rusty before test day.</div>
  <div class="btn-row"><button class="btn secondary" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('overall-results')">Back to Overall Report</button> <button class="btn secondary" onclick="goTo('cover')">Back to Cover</button></div>
  `);
}

const RENDERERS = {
  'cover': renderCover,
  'intro': renderIntro,
  'exam1-intro': (el)=>renderExamIntro(el,1),
  'exam1-vocab': (el)=>renderExamVocab(el,1),
  'exam1-reading': (el)=>renderExamReading(el,1),
  'exam1-listening': (el)=>renderExamListening(el,1),

  {id:'exam1-pass', icon:'✅', name:'Passed Mock Exam 1', test:()=>computeExam(1).pass},

  {id:'exam2-pass', icon:'✅', name:'Passed Mock Exam 2', test:()=>computeExam(2).pass},
  {id:'high-scorer', icon:'🌟', name:'150+ on Either Exam', test:()=>computeExam(1).totalEarned>=150 || computeExam(2).totalEarned>=150},

/* ============================================================
   6. NAVIGATION
   ============================================================ */
function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'error-log'){
      html += `<a class="nav-item" href="../jlptn5roadmap.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">🗺️ Roadmap</span></a>`;
    }
  });
  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const el = document.getElementById('nav-'+c.id);
    if(el) el.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

/* ============================================================
   7. INIT
   ============================================================ */
applyTheme();
applyFurigana();
document.documentElement.style.setProperty('--fs-scale', State.fontScale);
buildSidebar();
goTo(State.last && CHAPTERS.find(c=>c.id===State.last) ? State.last : 'cover');
window.addEventListener('keydown', e=>{
  const idx = CHAPTERS.findIndex(c=>c.id===State.current);
  if(e.key==='ArrowRight' && idx<CHAPTERS.length-1) goTo(CHAPTERS[idx+1].id);
  if(e.key==='ArrowLeft' && idx>0) goTo(CHAPTERS[idx-1].id);
});

/* Share button: uses the native OS share sheet on mobile (and any
   desktop browser that supports it); falls back to copying the
   lesson's canonical link to the clipboard everywhere else. */
(function initShareButton(){
  const btn = document.getElementById('shareBtn');
  if(!btn) return;
  const canonicalEl = document.querySelector('link[rel="canonical"]');
  const shareUrl = (canonicalEl && canonicalEl.href) || window.location.href;
  const shareData = {
    title: document.title,
    text: 'Come learn Japanese with me — free, self-contained JLPT lessons from Hookitlingo.',
    url: shareUrl
  };
  btn.addEventListener('click', async ()=>{
    if(navigator.share){
      try{ await navigator.share(shareData); } catch(err){ /* user cancelled, nothing to do */ }
      return;
    }
    const original = btn.textContent;
    try{
      await navigator.clipboard.writeText(shareUrl);
      btn.textContent = '✓ Link copied!';
    } catch(err){
      btn.textContent = shareUrl;
    }
    setTimeout(()=>{ btn.textContent = original; }, 2200);
  });
})();

/* Drifting cherry blossom petals, purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
