<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* Furigana: on by default for a beginner-focused lesson. Toggling is a pure
   CSS class flip on #main, no re-render, so it is instant on the chapter
   currently open and on every chapter opened afterward through goTo(). */
ruby{ruby-position:over; ruby-align:center;}
rt{font-family:var(--sans); font-size:.52em; font-weight:500; color:var(--text-faint); user-select:none; letter-spacing:0;}
#main.furigana-off rt{display:none;}
.topbtn.furi-btn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}
.kofi-footer{max-width:var(--maxw); margin:0 auto; padding:8px 20px 40px; text-align:center;}
.support-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.kofi-banner{
  display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff !important; font-weight:600; font-size:.92em; text-decoration:none; border:none;
  box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 35%, transparent); transition:filter .15s;
  font-family:var(--sans);
}
.kofi-banner:hover{filter:brightness(1.07);}
.share-banner{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--inkblue) 45%));
  box-shadow:0 10px 26px color-mix(in srgb, var(--celadon) 30%, transparent);
  min-width:290px; justify-content:center;
}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px; display:inline-block; margin:4px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-example{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin:12px 0;}
.gram-example .ge-jp{font-family:var(--jp); font-size:1.15em; margin-bottom:4px;}
.gram-example .ge-en{color:var(--text-dim); font-size:.88em;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sound-map{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;}
.sound-map .sm-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;}
.sound-map .sm-arrow{color:var(--text-faint); font-size:.85em;}
.sound-map .sm-jp{font-family:var(--jp); font-size:1.3em;}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}

<script>
/* ============================================================
   1. STATE
   ============================================================ */
const PREFIX = 'tjs13l3_';
function loadState(){
  const defaults = {current:null, last:null, visited:{}, quizzes:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[], speedRounds:0, furiganaOn:true};
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return Object.assign({}, defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}
function applyFurigana(){
  const on = !!State.furiganaOn;
  document.getElementById('main').classList.toggle('furigana-off', !on);
  const btn = document.getElementById('furiBtn');
  btn.textContent = '🈶 Furigana: ' + (on ? 'On' : 'Off');
  btn.classList.toggle('active-toggle', on);
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  State.theme = State.theme==='light' ? 'dark' : 'light'; saveState(); applyTheme();
});
document.getElementById('furiBtn').addEventListener('click', ()=>{
  State.furiganaOn = !State.furiganaOn; saveState(); applyFurigana();
});
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
document.getElementById('focusBtn').addEventListener('click', ()=>{
  document.body.classList.toggle('focus-mode');
});
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlayBg').classList.toggle('show');
});
document.getElementById('overlayBg').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
});

/* ============================================================
   2. AUDIO
   ============================================================ */
/* Left empty on purpose. Fill this object with "phrase or word": "data:audio/mpeg;base64,...."
   pairs later, using the exact Japanese string as the key, and every speaker button
   below will start working without touching any other code. */
const AUDIO_DATA = {};

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  /* Strip furigana readings (the <rt> content) completely before stripping the
     remaining tags, so the audio lookup key is always the plain kanji/kana
     sentence exactly as written, never the kanji with the reading appended. */
  const plain = text.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, '');
  const safeText = JSON.stringify(plain).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}
/* ============================================================
   3. QUIZ BUILDER
   ============================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

function buildQuiz(id, items, chapterId, isFinal){
  const wrap = document.createElement('div');
  wrap.id = id;
  let idx = 0, correct = 0;
  const missed = [];

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const pct = Math.round((correct/items.length)*100);
      State.quizzes[id] = {pct, total:items.length, correct};
      missed.forEach(m=>{
        const existing = State.errorLog.find(e=>e.q===m.q);
        if(existing){ existing.count = (existing.count||1)+1; }
        else{ State.errorLog.push({q:m.q, correct:m.answer, chapter:chapterId}); }
      });
      checkBadges(); saveState(); updateProgress();
      wrap.innerHTML = `<div class="quiz-score">${pct}% - ${correct}/${items.length} correct ${pct>=70?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="location.reload()">Restart Quiz</button></div>`;
      if(isFinal){
        wrap.innerHTML += `<div class="btn-row"><button class="btn" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('lesson-complete')">Finish Lesson</button></div>`;
      }
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    q.innerHTML = `<div class="${qClass}">${item.q}</div><div class="qopts"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    item.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        if(opt === item.answer){
          b.classList.add('correct'); correct++;
          fb.textContent = 'Correct!';
        } else {
          b.classList.add('wrong');
          missed.push(item);
          [...optsEl.children].forEach(c=>{ if(c.textContent===item.answer) c.classList.add('correct'); });
          fb.textContent = `Not quite, correct answer: ${item.answer}`;
        }
        setTimeout(()=>{ idx++; renderQ(); }, 900);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

/* THEMES: 18 vocabulary themes covering all 729 words taught across
   Sections 2 through 12. "meta"/"title"/"subtitle" feed the chapter
   header, "intro" is the short framing paragraph at the top of each
   chapter, "note"/"note_type" drives a single teacher-tip or fun-fact
   callout per theme, and "nav" is the sidebar group it sits under. */
const THEMES = [{"id": "identity", "meta": "Theme 1 of 18", "title": "People & Identity", "subtitle": "Countries, nationalities, jobs, and the school and people words from your very first self-introduction", "nav": "People & Places", "intro": "This is the vocabulary you built your first sentences on: where someone is from, what they do, and who they are at school. A lot of these words share the same ending pattern, じん for a person's nationality, せい for a student, so once one word in the pattern clicks, the rest tend to follow quickly.", "note_type": "tip", "note": "Notice how many of these words are just a country name plus 人. Learn the country, and the nationality word is nearly free."}, {"id": "family", "meta": "Theme 2 of 18", "title": "Family", "subtitle": "Two full sets of family words, one for talking about your own family, one for talking about someone else's", "nav": "People & Places", "intro": "Japanese splits family vocabulary into two tracks depending on whose family you mean, a plain or humble word for your own relatives, an honorific word for someone else's. That split trips up a lot of learners at first, so this theme keeps both sets side by side instead of scattered across two different sections.", "note_type": "warn", "note": "お父さん is how you address your own father directly, and how you refer to someone else's father. But when talking about your own father to someone outside the family, 父 is the humble word to reach for instead."}, {"id": "animals", "meta": "Theme 3 of 18", "title": "Animals", "subtitle": "Pets curled up at home, and the farm and wild animals that show up in reading passages", "nav": "People & Places", "intro": "Animal words rarely carry any grammar of their own, they mostly just show up as the subject of sentences about existence, います and あります. That makes this theme a good low-pressure place to drill straight recall without a grammar pattern competing for your attention.", "note_type": "fact", "note": "子犬 and 子猫 both use the same 子 prefix to mean baby animal. Once that prefix is familiar, a lot of other baby-animal words become guessable rather than needing to be memorized from scratch."}, {"id": "places", "meta": "Theme 4 of 18", "title": "Places & Directions", "subtitle": "Where things sit relative to each other, and the buildings and stations you'd actually walk to", "nav": "People & Places", "intro": "This theme gathers the vocabulary behind giving and understanding directions, near, far, corner, straight ahead, right alongside the buildings those directions usually point toward. Reading passages about finding a place lean on this exact set constantly.", "note_type": "tip", "note": "こちら, そちら, and どちら are the polite cousins of こっち, そっち, and どっち. Expect the polite set at shops and information desks, and the plain set with friends."}, {"id": "home", "meta": "Theme 5 of 18", "title": "School & Home Objects", "subtitle": "Everything sitting in a classroom, a pencil case, or a living room", "nav": "Home, School & Shopping", "intro": "Classroom objects and home furniture end up grouped together here because they behave the same way grammatically, mostly still, mostly nouns that simply exist somewhere in a room. This also happens to be the single biggest theme in this deck, so it's worth taking in a few sittings rather than all at once.", "note_type": "fact", "note": "本棚, bookshelf, is literally book plus shelf. A lot of the compound nouns in this theme work the exact same way, so reading them as two smaller pieces is usually faster than memorizing them whole."}, {"id": "shopping", "meta": "Theme 6 of 18", "title": "Shops & Shopping", "subtitle": "The shops themselves, and the words you need once you're actually standing inside one", "nav": "Home, School & Shopping", "intro": "This theme pairs the names of shops, bookstore, bakery, supermarket, with the practical vocabulary of buying something once you're there: discounts, cash, the checkout line. Between the two sets, you should be able to walk through most shopping scenes in a reading passage.", "note_type": "tip", "note": "屋 turns a lot of these shop names into a pattern: 本屋, 花屋, パン屋. Once that suffix clicks, new shop names become guessable instead of needing to be memorized one at a time."}, {"id": "money", "meta": "Theme 7 of 18", "title": "Numbers & Money", "subtitle": "Counting from one to ten, and the words that show up whenever a price is involved", "nav": "Home, School & Shopping", "intro": "Numbers were some of the very first words this roadmap taught, and they never really leave, they just keep showing up dressed as prices, dates, and counters. This theme keeps the raw digits right next to the money vocabulary that leans on them the most.", "note_type": "warn", "note": "四, 七, and 九 each carry two readings. よん, なな, and きゅう are the safe default for counting and prices, while し, しち, and く mostly survive today in fixed expressions."}, {"id": "language", "meta": "Theme 8 of 18", "title": "Language & Media", "subtitle": "The names of languages themselves, and the books, letters, and screens people use them on", "nav": "Language & Feelings", "intro": "Every language name in this theme ends in the same 語 suffix, and every reading or writing verb from that same lesson clusters right alongside them. It's a compact theme, but a useful one for reading and listening material about study habits and media.", "note_type": "fact", "note": "外国語, foreign language, is built from 外, outside, 国, country, and 語, language, literally the language of an outside country. Once 外国 registers as its own unit, 外国人 and 海外 both become a lot easier to parse on sight."}, {"id": "feelings", "meta": "Theme 9 of 18", "title": "Greetings & Feelings", "subtitle": "The set phrases you use on autopilot, and the words for how something made you feel", "nav": "Language & Feelings", "intro": "Greetings are usually the very first Japanese anyone memorizes, and this theme keeps them right next to the feeling words and connectors taught later, since both categories are really about steering a conversation smoothly rather than describing an object.", "note_type": "tip", "note": "はじめまして only ever gets said once, the very first time you meet someone. Say it a second time to the same person and it sounds like you've forgotten the two of you already met."}, {"id": "invitations", "meta": "Theme 10 of 18", "title": "Invitations & Plans", "subtitle": "The vocabulary of proposing plans, and reacting once someone else proposes one", "nav": "Language & Feelings", "intro": "This theme is small but it earns its keep, it's roughly the exact set of words a real invitation conversation runs on: a plan, an excuse, an acceptance, a bit of disappointment if the answer turns out to be no.", "note_type": "fact", "note": "残念, unfortunate, and 楽しみ, something to look forward to, sit at basically opposite ends of how an invitation can land. Learning them as a pair makes both a good deal easier to recall later."}, {"id": "body", "meta": "Theme 11 of 18", "title": "Body & Health", "subtitle": "The parts of the body, and the words for being unwell or getting better", "nav": "Body, Food & Nature", "intro": "Body part vocabulary and illness vocabulary overlap constantly in real conversation, someone names where it hurts using a body part word, then reaches for an illness word to explain why. This theme keeps that pairing intact instead of separating the two.", "note_type": "warn", "note": "痛い describes pain in general, while お腹が痛い specifically means a stomachache. The pattern of body part plus 痛い covers almost any ache you'd need to describe at this level."}, {"id": "food", "meta": "Theme 12 of 18", "title": "Food & Drink", "subtitle": "What ends up on the table, from rice and vegetables to the loanwords for cake and curry", "nav": "Body, Food & Nature", "intro": "A good chunk of this theme is loanwords borrowed from other languages and then reshaped to fit Japanese sounds, so quite a few of these should already feel a little familiar the first time you meet them.", "note_type": "fact", "note": "カレー, curry, and ケーキ, cake, are both loanwords that arrived by slightly unexpected routes, curry by way of British India, cake by way of English baking. Neither one started out as a Japanese word."}, {"id": "nature", "meta": "Theme 13 of 18", "title": "Nature & Weather", "subtitle": "Mountains, rivers, and rain, plus the four seasons that shape so much small talk", "nav": "Body, Food & Nature", "intro": "Weather and season vocabulary works as small-talk fuel in Japanese the same way it does in English, and this theme keeps the two together since they tend to come up in the very same breath.", "note_type": "tip", "note": "夏, 冬, 春, and 秋 are worth locking in as a set. Comparison grammar, より and 一番, reaches for the four seasons as its go-to practice topic constantly."}, {"id": "verbs", "meta": "Theme 14 of 18", "title": "Verbs & Actions", "subtitle": "The everyday actions this whole roadmap has been building sentences around", "nav": "Actions & Time", "intro": "This theme collects action verbs from three different sections that all ended up teaching some flavor of doing something, speaking, reading, standing, sitting. Reviewing them together makes it clearer just how much of N5 grammar is really different tenses stacked on top of a fairly small, steady set of verbs.", "note_type": "warn", "note": "話す, to speak, and 聞く, to listen or to ask, get mixed up constantly since both involve a conversation. 話す always has the speaker doing the talking, 聞く always has them on the receiving end."}, {"id": "time", "meta": "Theme 15 of 18", "title": "Time & Calendar", "subtitle": "Days, months, dates, clock time, frequency, and the daily and weekly rhythm words tying them together", "nav": "Actions & Time", "intro": "This is the largest theme in the whole deck by a wide margin, since time vocabulary in Japanese is dense with irregular readings that don't follow the neat number patterns from earlier themes. It's broken into smaller subsections below, weekdays, months, dates, clock time, and more, so you can work through one slice at a time instead of all of it at once.", "note_type": "warn", "note": "二十日, the twentieth of the month, is read はつか, breaking the otherwise regular pattern every other date past ten follows. It's the one exception in this whole set worth memorizing on its own."}, {"id": "transport", "meta": "Theme 16 of 18", "title": "Transportation", "subtitle": "The trains, buses, and other ways people get from one place to another", "nav": "Actions & Time", "intro": "This theme is short, but it earns its keep constantly, since almost every travel-related reading passage or listening dialogue in this roadmap leans on some combination of these words.", "note_type": "fact", "note": "地下鉄, subway, is built from 地下, underground, plus 鉄, iron or rail. Reading it as underground rail makes the whole word click at once instead of it needing to be memorized as one unfamiliar block."}, {"id": "adjectives", "meta": "Theme 17 of 18", "title": "Adjectives & Colors", "subtitle": "Every descriptive word from both adjective families, plus the colors that so often pair with them", "nav": "Description & Leisure", "intro": "い-adjectives and な-adjectives conjugate in completely different ways under the hood, but they describe the exact same kinds of things, so this theme mixes both families together the way you'd actually use them in conversation, right alongside the colors that frequently modify them.", "note_type": "warn", "note": "きれい looks like it should be an い-adjective since it ends in い, but it actually conjugates as a な-adjective. Watch for that one, it's one of the most common mix-ups at this level."}, {"id": "hobbies", "meta": "Theme 18 of 18", "title": "Hobbies & Sports", "subtitle": "Free time activities, sports, and the vocabulary for talking about skill and experience", "nav": "Description & Leisure", "intro": "This theme closes out the deck with the vocabulary people actually use to talk about themselves outside of school or work, hobbies, sports, and how good they are at either one. It pairs naturally with the ability and experience grammar taught in Section 12.", "note_type": "tip", "note": "上手 and 得意 both translate as good at, but they're not quite interchangeable. 上手 tends to describe a skill from an outside, complimenting point of view, while 得意 more often describes your own confident strong point."}];

/* VOCAB_POOL: all 729 words, each tagged with the theme it now lives
   under, the original category label from its source lesson (used to
   build subheadings inside a theme chapter), and the exact Section and
   Lesson that first taught it. No new vocabulary appears anywhere in

/* One word-card per vocabulary entry: the Japanese word, its romaji, its
   reading and English meaning, a speaker button, and a small tag naming
   the Section and Lesson that first taught it, exactly the way a grammar
   block in Lesson 1 links back to its own source. */
function wordCardHtml(item){
  return `<div class="word-card" id="item-${item.id}">
    <div class="wc-top">
      <div><div class="wc-jp jp">${item.jp}</div><div class="wc-rom">${item.romaji}</div></div>
      ${spkBtn(item.jp)}
    </div>
    <div class="wc-meaning"><span class="jp">${item.kana}</span> · ${item.en}</div>
    <div class="tag">First taught: ${item.section}</div>
  </div>`;
}
/* Auto-generates a quiz from a list of vocabulary words. Even-indexed
   items ask for the English meaning of a Japanese word, odd-indexed
   items flip it around and ask for the Japanese word behind an English
   meaning, so recognition runs both directions instead of only one.
   wrongPool supplies the distractor answers, pass the same theme for
   tighter distractors, or the full pool for a broader final test. */
function vocabQuestionSet(items, wrongPool){
  return items.map((it,idx)=>{
    if(idx%2===0){
      const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.en);
      return {q:it.jp, isJp:true, options:shuffle([it.en,...wrongs]), answer:it.en};
    }
    const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.jp);
    return {q:it.en, options:shuffle([it.jp,...wrongs]), answer:it.jp};
  });
}
function buildFlashcards(words){
  const wrap = document.createElement('div');
  wrap.className = 'flash-wrap';
  let i = 0;
  function render(){
    const w = words[i];
    wrap.innerHTML = `
    <div class="flashcard" id="fcCard">
      <div class="fc-front"><div class="fc-face jp">${w.jp}</div><div class="fc-sub">${w.rom||''} - tap to flip</div></div>
      <div class="fc-back"><div class="fc-face">${w.en||w.rom}</div><div class="fc-sub jp">${w.jp}</div></div>
    </div>
    <div class="flash-controls">
      <button class="btn secondary" id="fcPrev">← Prev</button>
      <span class="flash-counter">${i+1} / ${words.length}</span>
      <button class="btn secondary" id="fcNext">Next →</button>
    </div>`;
    wrap.querySelector('#fcCard').onclick = (e)=>{ e.currentTarget.classList.toggle('flipped'); };
    wrap.querySelector('#fcPrev').onclick = ()=>{ i = (i-1+words.length)%words.length; render(); };
    wrap.querySelector('#fcNext').onclick = ()=>{ i = (i+1)%words.length; render(); };
  }
  render();
  return wrap;
}

/* Word Match: a simple two-column matching game replacing the sentence
   builder puzzle from the grammar recap, since matching a word to its
   meaning fits a vocabulary deck better than reordering a sentence.
   Six random words spawn as two shuffled columns, tap one Japanese chip
   then one English chip, a correct pair locks in green, a wrong pair
   flashes red and resets. Clearing all six starts a fresh round. */
function buildWordMatch(pool){
  const wrap = document.createElement('div');
  let words = [], matchedCount = 0, selJp = null, selEn = null;
  function newRound(){
    words = sample(pool, 6);
    matchedCount = 0; selJp = null; selEn = null;
    render();
  }
  function render(){
    const jpOrder = shuffle(words);
    const enOrder = shuffle(words);
    wrap.innerHTML = `<div class="match-grid">
      <div class="match-col">${jpOrder.map(w=>`<button class="match-chip jp" data-id="${w.id}">${w.jp}</button>`).join('')}</div>
      <div class="match-col">${enOrder.map(w=>`<button class="match-chip" data-id="${w.id}">${w.en}</button>`).join('')}</div>
    </div>
    <div class="sb-result" id="mResult">${matchedCount} / ${words.length} matched</div>
    <div class="btn-row"><button class="btn secondary" id="mNext">New Set of Words →</button></div>`;
    wrap.querySelectorAll('.match-col')[0].querySelectorAll('.match-chip').forEach(btn=>btn.onclick=()=>pick('jp', btn));
    wrap.querySelectorAll('.match-col')[1].querySelectorAll('.match-chip').forEach(btn=>btn.onclick=()=>pick('en', btn));
    wrap.querySelector('#mNext').onclick = newRound;
  }
  function pick(side, btn){
    if(btn.classList.contains('matched')) return;
    if(side==='jp'){
      if(selJp) selJp.classList.remove('selected');
      selJp = btn; btn.classList.add('selected');
    } else {
      if(selEn) selEn.classList.remove('selected');
      selEn = btn; btn.classList.add('selected');
    }
    if(selJp && selEn){
      if(selJp.dataset.id === selEn.dataset.id){
        selJp.classList.add('matched'); selEn.classList.add('matched');
        selJp.classList.remove('selected'); selEn.classList.remove('selected');
        matchedCount++;
        const a = selJp, b = selEn;
        selJp = null; selEn = null;
        wrap.querySelector('#mResult').textContent = `${matchedCount} / ${words.length} matched`;
        if(matchedCount === words.length){
          State.puzzleSolved = true; saveState(); checkBadges();
          wrap.querySelector('#mResult').innerHTML = '<span style="color:var(--celadon)">All matched! ✓</span>';
        }
      } else {
        const a = selJp, b = selEn;
        a.classList.add('wrong'); b.classList.add('wrong');
        selJp = null; selEn = null;
        setTimeout(()=>{ a.classList.remove('selected','wrong'); b.classList.remove('selected','wrong'); }, 500);
      }
    }
  }
  newRound();
  return wrap;
}

/* Generic renderer shared by all 18 theme chapters. Everything about a
   theme, its intro paragraph, its callout, its word-cards grouped by
   original source category, and its quiz, is pulled straight from
   THEMES and VOCAB_POOL, so adding or editing a word never means
   touching a render function by hand. */
function renderThemeChapter(el, themeId){
  const t = THEMES.find(x=>x.id===themeId);
  const items = VOCAB_POOL.filter(x=>x.theme===themeId);
  chapterHeader(el, t.meta, t.title, t.subtitle);
  el.insertAdjacentHTML('beforeend', `<p>${t.intro}</p>`);
  el.insertAdjacentHTML('beforeend', `<div class="callout ${t.note_type}"><span class="callout-label">${themeNoteLabel(t.note_type)}</span>${t.note}</div>`);
  const cats = [...new Set(items.map(x=>x.cat))];
  cats.forEach(c=>{
    const sub = items.filter(x=>x.cat===c);
    el.insertAdjacentHTML('beforeend', `<h3>${c} <span class="cat-count">${sub.length} words</span></h3>`);
    el.insertAdjacentHTML('beforeend', `<div class="word-grid">${sub.map(wordCardHtml).join('')}</div>`);
  });
  el.insertAdjacentHTML('beforeend', '<h3>Quick Check</h3>');
  const qCount = Math.min(items.length, 15);
  el.appendChild(buildQuiz(themeId+'-quiz', shuffle(vocabQuestionSet(sample(items, qCount), items)), themeId));
  el.insertAdjacentHTML('beforeend', noteBox(themeId));
}

function renderBrowse(el){
  chapterHeader(el, 'Practice', 'Search the Full Deck', 'All 729 words in one flat list, filterable by theme or by the Section and Lesson that first taught them');
  el.insertAdjacentHTML('beforeend', `
  <p>Type to search by Japanese, reading, romaji, or English meaning, or narrow things down with the two dropdowns below. This is the exact same pool of words used across all 18 theme chapters, just laid out as one searchable list instead of split by topic.</p>
  <div class="filter-card">
    <input type="text" id="searchBox" class="filter-input" placeholder="Search... try 'eki', 'station', or 駅">
    <div class="filter-row">
      <select id="themeFilter" class="filter-select">
        <option value="">All Themes</option>
        ${THEMES.map(t=>`<option value="${t.id}">${t.title}</option>`).join('')}
      </select>
      <select id="sectionFilter" class="filter-select">
        <option value="">All Sections</option>
        ${[...new Set(VOCAB_POOL.map(w=>w.section))].map(s=>`<option value="${s}">${s}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="result-count" id="resultCount"></div>
  <div class="word-grid" id="browseResults"></div>
  `);
  const box = el.querySelector('#searchBox');
  const themeSel = el.querySelector('#themeFilter');
  const sectionSel = el.querySelector('#sectionFilter');
  const resultsEl = el.querySelector('#browseResults');
  const countEl = el.querySelector('#resultCount');
  function update(){
    const q = box.value.trim().toLowerCase();
    const th = themeSel.value, sec = sectionSel.value;
    const filtered = VOCAB_POOL.filter(w=>{
      if(th && w.theme!==th) return false;
      if(sec && w.section!==sec) return false;
      if(q && !(w.jp.includes(q) || w.kana.includes(q) || w.romaji.toLowerCase().includes(q) || w.en.toLowerCase().includes(q))) return false;
      return true;
    });
    let label = `${filtered.length} word${filtered.length===1?'':'s'}`;
    const shown = filtered.slice(0,300);
    if(filtered.length>300) label += ' · showing the first 300, narrow your search to see the rest';
    countEl.textContent = label;
    resultsEl.innerHTML = shown.map(wordCardHtml).join('');
  }
  box.addEventListener('input', update);
  themeSel.addEventListener('change', update);
  sectionSel.addEventListener('change', update);
  update();
}

function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'daily-test'){
      html += `<a class="nav-item nav-item-support" href="../supporters.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">💛 Support</span></a>`;
      html += `<a class="nav-item" href="../jlptn5roadmap.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">🗺️ Roadmap</span></a>`;
    }
  });
  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>!c.isSupport && c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const el = document.getElementById('nav-'+c.id);
    if(el) el.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

/* Share button: uses the native OS share sheet on mobile (and any
   desktop browser that supports it); falls back to copying the
   lesson's canonical link to the clipboard everywhere else. */
(function initShareButton(){
  const btn = document.getElementById('shareBtn');
  if(!btn) return;
  const canonicalEl = document.querySelector('link[rel="canonical"]');
  const shareUrl = (canonicalEl && canonicalEl.href) || window.location.href;
  const shareData = {
    title: document.title,
    text: 'Come learn Japanese with me — free, self-contained JLPT lessons from Hookitlingo.',
    url: shareUrl
  };
  btn.addEventListener('click', async ()=>{
    if(navigator.share){
      try{ await navigator.share(shareData); } catch(err){ /* user cancelled, nothing to do */ }
      return;
    }
    const original = btn.textContent;
    try{
      await navigator.clipboard.writeText(shareUrl);
      btn.textContent = '✓ Link copied!';
    } catch(err){
      btn.textContent = shareUrl;
    }
    setTimeout(()=>{ btn.textContent = original; }, 2200);
  });
})();

/* Drifting cherry blossom petals, purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
