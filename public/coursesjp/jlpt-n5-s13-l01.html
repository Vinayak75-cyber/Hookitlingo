<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* Furigana: on by default for a beginner-focused lesson. Toggling is a pure
   CSS class flip on #main, no re-render, so it is instant on the chapter
   currently open and on every chapter opened afterward through goTo(). */
ruby{ruby-position:over; ruby-align:center;}
rt{font-family:var(--sans); font-size:.52em; font-weight:500; color:var(--text-faint); user-select:none; letter-spacing:0;}
#main.furigana-off rt{display:none;}
.topbtn.furi-btn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}
.kofi-footer{max-width:var(--maxw); margin:0 auto; padding:8px 20px 40px; text-align:center;}
.support-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.kofi-banner{
  display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff !important; font-weight:600; font-size:.92em; text-decoration:none; border:none;
  box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 35%, transparent); transition:filter .15s;
  font-family:var(--sans);
}
.kofi-banner:hover{filter:brightness(1.07);}
.share-banner{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--inkblue) 45%));
  box-shadow:0 10px 26px color-mix(in srgb, var(--celadon) 30%, transparent);
  min-width:290px; justify-content:center;
}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px; display:inline-block; margin:4px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-example{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin:12px 0;}
.gram-example .ge-jp{font-family:var(--jp); font-size:1.15em; margin-bottom:4px;}
.gram-example .ge-en{color:var(--text-dim); font-size:.88em;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sound-map{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;}
.sound-map .sm-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;}
.sound-map .sm-arrow{color:var(--text-faint); font-size:.85em;}
.sound-map .sm-jp{font-family:var(--jp); font-size:1.3em;}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}
.sb-chip{background:var(--surface3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-family:var(--jp); font-size:1.1em;}
.sb-chip:hover{border-color:var(--vermilion);}
.sb-chip.used{opacity:.3; pointer-events:none;}
.sb-eng{color:var(--text-faint); font-size:.85em; margin-top:2px;}
.sb-result{margin-top:8px; font-size:.85em; min-height:1.2em;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}

.passage-jp{font-family:var(--jp); font-size:1.2em; white-space:pre-line; line-height:2.1;}
.passage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;}

/* ============================================================

/* R() wraps a kanji-bearing string in a ruby tag with its furigana reading.
   Used on example sentences, grammar titles, and puzzle chips, exactly like
   every other lesson file's engine. Pattern chips and quiz options are left
   as plain text on purpose, since some of them double as answer strings and
   the answer-matching logic (an exact string comparison) needs to keep
   working unchanged. */
function R(kanji, kana){ return '<ruby>'+kanji+'<rt>'+kana+'</rt></ruby>'; }

/* GROUPS: 12 functional clusters that reorganize every grammar point taught
   across Sections 2 through 12. "nav" buckets them further for the sidebar,
   "meta"/"title"/"subtitle" feed the chapter header, "intro" is the short
   framing paragraph at the top of each chapter, and "section" is the single
   Section/Lesson where every point inside that group was first taught. */
const GROUPS = [{"id": "foundations", "meta": "Function Group 1 of 12", "title": "The です System", "subtitle": "Statements, negatives, questions, also, and possession", "section": "Section 2, Lesson 1", "intro": "Every single sentence you have built across this whole roadmap leans on the five patterns in this group somewhere. They are the absolute floor of Japanese sentence structure, so this is the right place to start a recap even though nothing here is new.", "nav": "Sentence Basics"}, {"id": "pointers", "meta": "Function Group 2 of 12", "title": "Pointing and Asking", "subtitle": "Demonstratives and question words for objects and places", "section": "Section 3, Lesson 1", "intro": "これ/それ/あれ, この/その/あの, and ここ/そこ/あそこ all share the exact same three-way distance logic: near the speaker, near the listener, far from both. Once that triangle clicks for one family, it clicks for all three.", "nav": "Sentence Basics"}, {"id": "numbers", "meta": "Function Group 3 of 12", "title": "Numbers and Counters", "subtitle": "From one to ten thousand, plus the four core N5 counters", "section": "Section 4, Lesson 1", "intro": "Numbers rarely get a second glance once they feel automatic, which is exactly why they belong in a recap. The counters below are worth reading out loud one more time, since the sound changes buried inside them are the part that slips first.", "nav": "Numbers & Space"}, {"id": "existence", "meta": "Function Group 4 of 12", "title": "Existence and Location", "subtitle": "What exists, where it sits, and how to get there", "section": "Section 4, Lessons 1 and 2", "intro": "This group merges existence itself, あります and います, with the full location and direction toolkit from Section 4's second lesson, since both answer some version of the question where.", "nav": "Numbers & Space"}, {"id": "masuverbs", "meta": "Function Group 5 of 12", "title": "Polite Verbs, the ます System", "subtitle": "Present, past, negative, objects, and destinations", "section": "Section 5, Lesson 1", "intro": "ます-form is the verb shape you reached for constantly through the middle of this roadmap. This group gathers its full conjugation set alongside the particles that decide what gets acted on and where the action happens.", "nav": "Verbs"}, {"id": "adjectives", "meta": "Function Group 6 of 12", "title": "Adjectives, い and な", "subtitle": "Description, negation, past tense, likes, and dislikes", "section": "Section 6, Lesson 1", "intro": "い-adjectives and な-adjectives conjugate in completely different ways under the hood, even though they can look similar at a glance. This group lines both families up side by side so the differences stay sharp.", "nav": "Description"}, {"id": "teform", "meta": "Function Group 7 of 12", "title": "The て-Form Family", "subtitle": "Requests, permission, prohibition, and ongoing action", "section": "Section 7, Lesson 1", "intro": "て-form is arguably the single most reused verb shape in the entire language, and every pattern in this group is built directly on top of it. If て-form formation itself feels shaky, that is the one thing worth drilling before anything else here.", "nav": "Verbs"}, {"id": "calendar", "meta": "Function Group 8 of 12", "title": "Time Words, Calendar and Frequency", "subtitle": "Weekdays, months, dates, and last/this/next", "section": "Section 8, Lesson 1", "intro": "Calendar vocabulary is dense with irregular readings packed into a small space, which makes it a natural place for memory to slip quietly without you noticing. Treat this group as a spot check.", "nav": "Time"}, {"id": "plainform", "meta": "Function Group 9 of 12", "title": "Plain Form and Casual Speech", "subtitle": "The register underneath every polite sentence you have built so far", "section": "Section 9, Lesson 1", "intro": "Every ます-form verb you know has a plain form hiding underneath it, and that plain form is the register real friends and family actually speak in. This group also carries the plain-form dependent patterns, ないでください and と"+R('思','おも')+"います, that only work correctly once the plain forms themselves are solid.", "nav": "Verbs"}, {"id": "comparison", "meta": "Function Group 10 of 12", "title": "Comparison and Desire", "subtitle": "より, の"+R('方','ほう')+"が, どちらが, で"+R('一番','いちばん')+", and たいです", "section": "Section 10, Lesson 1", "intro": "This group covers every way this roadmap teaches you to stack one thing against another, plus the pattern for saying what you want to do, which tends to show up in the same conversations naturally.", "nav": "Advanced Patterns"}, {"id": "connectors", "meta": "Function Group 11 of 12", "title": "Reasons, Timing, and Invitations", "subtitle": "から, とき, the full ましょう family, and そして/それから", "section": "Section 11, Lesson 1", "intro": "から and とき both attach a supporting clause onto a main sentence, one explaining why, the other marking when, and both are worth reviewing together since learners commonly reach for the wrong one under pressure.", "nav": "Advanced Patterns"}, {"id": "ability", "meta": "Function Group 12 of 12", "title": "Ability and Experience", "subtitle": "こと, ことができます, ことがあります, and the full past tense chart", "section": "Section 12, Lesson 1", "intro": "The most recent grammar you learned before this recap, and the perfect closing group, since こと quietly ties back into the plain dictionary form from Section 9 and the past tense chart it leans on.", "nav": "Advanced Patterns"}];

/* GRAMMAR_POOL: all 59 points, in the same order they were originally taught,
   each tagged with the function group it now lives under. "pattern" is the
   chip text, "ex_jp"/"ex_en" is the one recap example, "note"/"note_type"

   the original Section/Lesson link for that point. No new grammar appears
   anywhere in this array, every single entry is a pure recap. */
const GRAMMAR_POOL = [
 {id:'g01', group:'foundations', section:'Section 2, Lesson 1', title:'Saying is: Noun + です', pattern:'Xは Yです。', desc:'Basic affirmative sentence, X is Y', ex_jp:'わたしは がくせいです。', ex_en:'I am a student.', note_type:'tip', note:'You can drop わたしは once the meaning is obvious from context, and a name can stand alone right in front of です.'},
 {id:'g02', group:'foundations', section:'Section 2, Lesson 1', title:'Saying is not: じゃありません', pattern:'Xは Yじゃありません。', desc:'Basic negative sentence, X is not Y', ex_jp:'わたしは せんせいじゃありません。', ex_en:'I am not a teacher.', note_type:'tip', note:'ではありません is the more formal written twin of じゃありません. Same meaning, just dressier.'},
 {id:'g03', group:'foundations', section:'Section 2, Lesson 1', title:'Yes or no questions: か', pattern:'Xは Yですか。', desc:'Turns any です sentence into a yes or no question', ex_jp:'がくせいですか。', ex_en:'Are you a student?', note_type:'tip', note:'か does the grammatical work of a question mark, so word order never has to change, and no rising pitch is required.'},
 {id:'g04', group:'foundations', section:'Section 2, Lesson 1', title:'Also, too: も', pattern:'Xも Yです。', desc:'Replaces は to mean also or too', ex_jp:'わたしも だいがくの がくせいです。', ex_en:'I am also a university student.', note_type:'warn', note:'も replaces は outright. It never sits alongside it in the same slot.'},
 {id:'g05', group:'foundations', section:'Section 2, Lesson 1', title:'Possession and modification: の', pattern:'AのB', desc:'Links two nouns the way an apostrophe s does in English', ex_jp:'たなかさんの ともだち', ex_en:'Tanaka\'s friend', note_type:'tip', note:'Read の as of. だいがくの がくせい becomes student of university, a university student.'},
 {id:'g06', group:'pointers', section:'Section 3, Lesson 1', title:'This, that, that over there: これ・それ・あれ', pattern:'これ／それ／あれ', desc:'Stand-alone pronouns for objects, chosen by distance from speaker and listener', ex_jp:'これは わたしの ほんです。', ex_en:'This is my book.', note_type:'tip', note:'これ sits near the speaker, それ near the listener, あれ far from both. The same triangle repeats across この/その/あの and ここ/そこ/あそこ.'},
 {id:'g07', group:'pointers', section:'Section 3, Lesson 1', title:'This, that + noun: この・その・あの', pattern:'この／その／あの ＋ Noun', desc:'Modifiers that must sit directly in front of a noun, unlike これ/それ/あれ which stand alone', ex_jp:'この '+R('本','ほん')+'は わたしのです。', ex_en:'This book is mine.', note_type:'warn', note:'これ means this thing on its own, but この needs a noun glued right after it. この 本, never この by itself.'},
 {id:'g08', group:'pointers', section:'Section 3, Lesson 1', title:'Which one, which: どれ・どの', pattern:'どれ／どの ＋ Noun', desc:'Asks which one, used when choosing among three or more items', ex_jp:'どの ペンが わたしのですか。', ex_en:'Which pen is mine?', note_type:'tip', note:'Once someone answers a どの question, the answer switches back to この/その/あの to point at the specific item meant.'},
 {id:'g09', group:'pointers', section:'Section 3, Lesson 1', title:'Here, there, where: ここ・そこ・あそこ・どこ', pattern:'ここ／そこ／あそこ／どこ', desc:'Place words that work exactly like これ/それ/あれ, but for locations rather than objects', ex_jp:'コンビニは どこですか。', ex_en:'Where is the convenience store?', note_type:'tip', note:'どちら works as a more polite stand-in for どこ or どれ once a slightly more formal tone is needed.'},
 {id:'g10', group:'pointers', section:'Section 3, Lesson 1', title:'What: なに vs なん', pattern:'なに／なん', desc:'Two pronunciations of what, chosen by whatever sound follows', ex_jp:'これは '+R('何','なん')+'ですか。', ex_en:'What is this?', note_type:'tip', note:'When in doubt, reach for なん right before の or です, and なに everywhere else.'},
 {id:'g11', group:'pointers', section:'Section 3, Lesson 1', title:'Both, neither: も…も', pattern:'Aも Bも', desc:'Doubling も to mean both A and B, or neither once the sentence turns negative', ex_jp:R('辞書','じしょ')+'も ノートも わたしのです。', ex_en:'Both the dictionary and the notebook are mine.', note_type:'tip', note:'Think of Aも Bも as a pair of bookends. Whatever the sentence ends with applies equally to both items.'},
 {id:'g12', group:'numbers', section:'Section 4, Lesson 1', title:'Numbers 1 to 99', pattern:'一・二・三 … 十・十一 … 九十九', desc:'The ten digit building blocks that assemble every two digit number in Japanese', ex_jp:R('二十五','にじゅうご'), ex_en:'twenty-five (two-ten-five)', note_type:'warn', note:'四, 七, and 九 carry a second reading each. Default to よん, なな, and きゅう when counting, and save し, しち, and く for fixed words like the month names.'},
 {id:'g13', group:'numbers', section:'Section 4, Lesson 1', title:'Hundreds, thousands, ten-thousands: '+R('百','ひゃく')+'・'+R('千','せん')+'・'+R('万','まん'), pattern:'百・千・万', desc:'The three counting words that take over past ninety-nine, with several sound changes along the way', ex_jp:R('一万五千八百円','いちまんごせんはっぴゃくえん'), ex_en:'15,800 yen', note_type:'warn', note:'Japanese resets its counting unit at 万, ten thousand, not at a thousand the way English does. One hundred thousand is 十万, ten times ten-thousand.'},
 {id:'g14', group:'numbers', section:'Section 4, Lesson 1', title:'Generic counter and people counter: つ・'+R('人','にん'), pattern:'〜つ／〜人', desc:'Two counters with irregular readings for the low numbers, つ for generic objects and 人 for people', ex_jp:R('学生','がくせい')+'が '+R('三人','さんにん')+' います。', ex_en:'There are three students.', note_type:'warn', note:'Four people is よにん, not よんにん. The ん from よん quietly drops.'},
 {id:'g15', group:'numbers', section:'Section 4, Lesson 1', title:'Flat, long, and small object counters: '+R('枚','まい')+'・'+R('本','ほん')+'・'+R('個','こ'), pattern:'〜枚／〜本／〜個', desc:'Counters for flat thin things, long cylindrical things, and small compact things', ex_jp:'えんぴつが '+R('五本','ごほん')+' あります。', ex_en:'There are five pencils.', note_type:'warn', note:'本 shifts sound more than any other N5 counter. One, three, six, eight, and ten all change, worth drilling out loud on their own.'},
 {id:'g16', group:'existence', section:'Section 4, Lesson 1', title:'Existence: があります・がいます', pattern:'〜が あります／います。', desc:'States that something exists, split cleanly between inanimate things and living things', ex_jp:'つくえの'+R('上','うえ')+'に '+R('本','ほん')+'が あります。', ex_en:'There is a book on the desk.', note_type:'tip', note:'Reach for が, not は, when announcing that something exists for the first time. が marks brand new information.'},
 {id:'g17', group:'existence', section:'Section 4, Lesson 2', title:'Location of existence vs location of action: に and で', pattern:'〜に あります ／ 〜で します', desc:'に marks where something exists, で marks where an action happens', ex_jp:R('図書館','としょかん')+'で '+R('勉強','べんきょう')+'します。', ex_en:'I study at the library.', note_type:'tip', note:'If in or at can be swapped for there is, use に. If it can be swapped for I do X at, use で.'},
 {id:'g18', group:'existence', section:'Section 4, Lesson 2', title:'Spatial nouns: '+R('上','うえ')+'・'+R('下','した')+'・'+R('中','なか')+'・'+R('外','そと')+'・'+R('前','まえ')+'・'+R('後','うし')+'ろ・'+R('隣','となり'), pattern:'〜の上／下／中／外／前／後ろ／隣に', desc:'Nouns describing where something sits relative to something else, always linked with の', ex_jp:'ベッドの'+R('下','した')+'に '+R('猫','ねこ')+'が います。', ex_en:'There is a cat under the bed.', note_type:'warn', note:'Every spatial noun needs の to link it. つくえの上に is correct, つくえ上に is not.'},
 {id:'g19', group:'existence', section:'Section 4, Lesson 2', title:'Compass directions and left, right: '+R('東','ひがし')+'・'+R('西','にし')+'・'+R('南','みなみ')+'・'+R('北','きた')+'・'+R('左','ひだり')+'・'+R('右','みぎ'), pattern:'〜の東／西／南／北／左／右に', desc:'Four fixed compass directions plus two relative directions for describing where something is', ex_jp:R('銀行','ぎんこう')+'は '+R('駅','えき')+'の'+R('右','みぎ')+'に あります。', ex_en:'The bank is to the right of the station.', note_type:'tip', note:'These follow the exact same の pattern as the spatial nouns above: place の direction に.'},
 {id:'g20', group:'existence', section:'Section 4, Lesson 2', title:'Toward a destination: へ', pattern:'〜へ 行きます。', desc:'Marks the direction someone or something is heading, written へ but read え', ex_jp:R('駅','えき')+'へ '+R('行','い')+'きます。', ex_en:'I am going to the station.', note_type:'tip', note:'へ and に are often interchangeable with movement verbs. へ leans toward direction, に leans toward the specific target.'},
 {id:'g21', group:'existence', section:'Section 4, Lesson 2', title:'Asking where: どこ・どちら・まっすぐ', pattern:'どこ／どちら ／ まっすぐ', desc:'Question words for location, plus the word for straight ahead', ex_jp:R('駅','えき')+'は '+R('近','ちか')+'くですか。まっすぐです。', ex_en:'Is the station near? It is straight ahead.', note_type:'tip', note:'どちら is the more polite version of どこ, the one that turns up constantly in direction-asking dialogues.'},
 {id:'g22', group:'masuverbs', section:'Section 5, Lesson 1', title:'The masu-form: present affirmative', pattern:'〜ます。', desc:'The polite, present tense, affirmative verb ending used in everyday speech', ex_jp:R('毎日','まいにち')+'、'+R('学校','がっこう')+'に '+R('行','い')+'きます。', ex_en:'I go to school every day.', note_type:'tip', note:'ます-form is polite, not the dictionary form. It is what you reach for with strangers, teachers, and colleagues.'},
 {id:'g23', group:'masuverbs', section:'Section 5, Lesson 1', title:'The direct object particle: を', pattern:'〜を', desc:'Marks the thing receiving the action of a verb', ex_jp:R('本','ほん')+'を '+R('読','よ')+'みます。', ex_en:'I read a book.', note_type:'tip', note:'を is always pronounced お in speech even though it is written を.'},
 {id:'g24', group:'masuverbs', section:'Section 5, Lesson 1', title:'Goal of movement and means of transport: に and で', pattern:'〜に 行きます ／ 〜で 行きます', desc:'に marks a destination, で marks the method of transport or where an action happens', ex_jp:'バスで '+R('行','い')+'きます。', ex_en:'I go by bus.', note_type:'tip', note:'に answers where to, で answers how or where doing. Try swapping in to or by/at in English to test which one fits.'},
 {id:'g25', group:'masuverbs', section:'Section 5, Lesson 1', title:'Negative and past tense: ません・ました・ませんでした', pattern:'〜ません／〜ました／〜ませんでした', desc:'The three endings covering present negative, past affirmative, and past negative for masu-form verbs', ex_jp:R('昨日','きのう')+'、テレビを '+R('見','み')+'ました。', ex_en:'I watched television yesterday.', note_type:'tip', note:'All three attach directly to the verb stem, exactly the way ます itself does.'},
 {id:'g26', group:'masuverbs', section:'Section 5, Lesson 1', title:'Invitations and suggestions, first pass: ませんか and ましょう', pattern:'〜ませんか／〜ましょう', desc:'ませんか invites, ましょう suggests or agrees, both attach to the verb stem', ex_jp:R('一緒','いっしょ')+'に '+R('晩','ばん')+'ご'+R('飯','はん')+'を '+R('食','た')+'べませんか。はい、'+R('食','た')+'べましょう。', ex_en:'Won\'t you eat dinner together? Yes, let\'s eat.', note_type:'fact', note:'This is the first appearance of these two endings. Section 11 later builds a fuller set of invitation grammar right on top of them.'},
 {id:'g27', group:'adjectives', section:'Section 6, Lesson 1', title:'i-adjectives: present affirmative', pattern:'〜いです。', desc:'Descriptive words ending in い that sit directly in front of です', ex_jp:R('新','あたら')+'しいです。', ex_en:'It is new.', note_type:'warn', note:'いい is the one common exception. Its stem is よ, from an older form よい, so it conjugates as よくない and よかった.'},
 {id:'g28', group:'adjectives', section:'Section 6, Lesson 1', title:'na-adjectives: present affirmative and the な/だ distinction', pattern:'〜です ／ 〜な＋Noun', desc:'Descriptive words that take です at a sentence end but な directly in front of a noun', ex_jp:R('静','しず')+'かな'+R('部屋','へや'), ex_en:'a quiet room', note_type:'tip', note:'好き and 嫌い behave like na-adjectives grammatically even though they describe a feeling rather than a trait.'},
 {id:'g29', group:'adjectives', section:'Section 6, Lesson 1', title:'Adjective negative and past', pattern:'〜くない／〜かった／〜じゃない／〜でした', desc:'The four conjugation endings covering negative and past for both i-adjectives and na-adjectives', ex_jp:R('高','たか')+'くないです。', ex_en:'It is not expensive.', note_type:'warn', note:'い-adjectives change their own ending directly, な-adjectives never do. All their past tense work happens on だ or です instead, the cleanest way to tell the two families apart.'},

const PREFIX = 'tjs13l1_';
function loadState(){
  const defaults = {current:null, last:null, visited:{}, quizzes:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[], speedRounds:0, furiganaOn:true};
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return Object.assign({}, defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}
function applyFurigana(){
  const on = !!State.furiganaOn;
  document.getElementById('main').classList.toggle('furigana-off', !on);
  const btn = document.getElementById('furiBtn');
  btn.textContent = '🈶 Furigana: ' + (on ? 'On' : 'Off');
  btn.classList.toggle('active-toggle', on);
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  State.theme = State.theme==='light' ? 'dark' : 'light'; saveState(); applyTheme();
});
document.getElementById('furiBtn').addEventListener('click', ()=>{
  State.furiganaOn = !State.furiganaOn; saveState(); applyFurigana();
});

   2. AUDIO
   ============================================================ */
/* Left empty on purpose. Fill this object with "phrase or word": "data:audio/mpeg;base64,...."
   pairs later, using the exact Japanese string as the key, and every speaker button
   below will start working without touching any other code. */
const AUDIO_DATA = {};

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  /* Strip furigana readings (the <rt> content) completely before stripping the
     remaining tags, so the audio lookup key is always the plain kanji/kana
     sentence exactly as written, never the kanji with the reading appended. */
  const plain = text.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, '');
  const safeText = JSON.stringify(plain).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

function buildQuiz(id, items, chapterId, isFinal){
  const wrap = document.createElement('div');
  wrap.id = id;
  let idx = 0, correct = 0;
  const missed = [];

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const pct = Math.round((correct/items.length)*100);
      State.quizzes[id] = {pct, total:items.length, correct};
      missed.forEach(m=>{
        const existing = State.errorLog.find(e=>e.q===m.q);
        if(existing){ existing.count = (existing.count||1)+1; }
        else{ State.errorLog.push({q:m.q, correct:m.answer, chapter:chapterId}); }
      });
      checkBadges(); saveState(); updateProgress();
      wrap.innerHTML = `<div class="quiz-score">${pct}% - ${correct}/${items.length} correct ${pct>=70?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="location.reload()">Restart Quiz</button></div>`;
      if(isFinal){
        wrap.innerHTML += `<div class="btn-row"><button class="btn" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('lesson-complete')">Finish Lesson</button></div>`;
      }
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    q.innerHTML = `<div class="${qClass}">${item.q}</div><div class="qopts"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    item.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        if(opt === item.answer){
          b.classList.add('correct'); correct++;
          fb.textContent = 'Correct!';
        } else {
          b.classList.add('wrong');
          missed.push(item);
          [...optsEl.children].forEach(c=>{ if(c.textContent===item.answer) c.classList.add('correct'); });
          fb.textContent = `Not quite, correct answer: ${item.answer}`;
        }
        setTimeout(()=>{ idx++; renderQ(); }, 900);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

function chapterHeader(el, meta, title, subtitle){
  el.innerHTML = `<div class="eyebrow">Section 13 · Lesson 1</div><h2>${title}</h2>
  <div class="chapter-meta"><span>${meta}</span>${subtitle?`<span>${subtitle}</span>`:''}</div>`;
}
function noteBox(chapterId){
  const val = (State.notes[chapterId]||'').replace(/"/g,'&quot;');
  return `<div class="card"><h3>Your Notes</h3><textarea class="note-area" placeholder="Jot down anything you want to remember..." oninput="State.notes['${chapterId}']=this.value; saveState();">${val}</textarea></div>`;
}
/* One recap block per grammar point: the pattern chip doubles as the source
   link, showing the Section/Lesson that first taught it right under the
   pattern itself, exactly as the roadmap calls for. */
function grammarBlockHtml(item){
  const noteLabel = item.note_type==='warn' ? 'Common Mistake' : (item.note_type==='fact' ? 'Fun Fact' : 'Teacher Tip');
  const noteClass = item.note_type==='warn' ? 'warn' : (item.note_type==='fact' ? 'fact' : 'tip');
  return `<div class="gram-block" id="item-${item.id}">
    <span class="gnum">Grammar Point</span>
    <h3 class="jp">${item.title}</h3>
    <div class="gsub">${item.desc}</div>
    ${gramChip(item.pattern, 'First taught: '+item.section)}
    <div class="gram-example"><div class="ge-jp jp">${item.ex_jp}</div><div class="ge-en">${item.ex_en}</div>${spkBtn(item.ex_jp)}</div>
    <div class="callout ${noteClass}"><span class="callout-label">${noteLabel}</span>${item.note}</div>
  </div>`;
}
/* Auto-generates a quiz from a list of grammar points. Even-indexed items
   ask pattern to function (shown in Japanese), odd-indexed items flip it
   around and ask function to pattern, so recognition runs both directions
   instead of only one. wrongPool supplies the distractor answers, pass the
   same group for tighter, more testing distractors, or the full pool for
   a broader final test. */
function questionSet(items, wrongPool){
  return items.map((it,idx)=>{
    if(idx%2===0){
      const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.desc);
      return {q:it.pattern, isJp:true, options:shuffle([it.desc,...wrongs]), answer:it.desc};
    }
    const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.pattern);
    return {q:it.desc, options:shuffle([it.pattern,...wrongs]), answer:it.pattern};
  });
}
function gramChip(jp,tag,isParticle){
  return `<div class="gram-chip${isParticle?' is-particle':''}"><div class="gc-jp jp">${jp}</div><div class="gc-tag">${tag}</div></div>`;
}
function gramExample(jp,en){
  return `<div class="gram-example"><div class="ge-jp jp">${jp}</div><div class="ge-en">${en}</div>${spkBtn(jp)}</div>`;
}

function buildFlashcards(words){
  const wrap = document.createElement('div');
  wrap.className = 'flash-wrap';
  let i = 0;
  function render(){
    const w = words[i];
    wrap.innerHTML = `
    <div class="flashcard" id="fcCard">
      <div class="fc-front"><div class="fc-face jp">${w.jp}</div><div class="fc-sub">${w.rom||''} - tap to flip</div></div>
      <div class="fc-back"><div class="fc-face">${w.en||w.rom}</div><div class="fc-sub jp">${w.jp}</div></div>
    </div>
    <div class="flash-controls">
      <button class="btn secondary" id="fcPrev">← Prev</button>
      <span class="flash-counter">${i+1} / ${words.length}</span>
      <button class="btn secondary" id="fcNext">Next →</button>
    </div>`;
    wrap.querySelector('#fcCard').onclick = (e)=>{ e.currentTarget.classList.toggle('flipped'); };
    wrap.querySelector('#fcPrev').onclick = ()=>{ i = (i-1+words.length)%words.length; render(); };
    wrap.querySelector('#fcNext').onclick = ()=>{ i = (i+1)%words.length; render(); };
  }
  render();
  return wrap;
}

function buildWordBuilder(list){
  const wrap = document.createElement('div');
  let si = 0;
  function render(){
    const s = list[si];
    const chips = shuffle(s.chips.map((c,i)=>({c,i})));
    wrap.innerHTML = `<div class="sb-box">
      <div class="sb-eng">Rebuild the sentence: ${s.en}</div>
      <div class="sb-answer" id="wbAnswer"></div>
      <div class="sb-chips">${chips.map(ch=>`<button class="sb-chip jp" data-i="${ch.i}">${ch.c}</button>`).join(' ')}</div>
      <div class="sb-result" id="wbResult"></div>
      <div class="btn-row"><button class="btn secondary" id="wbReset">Reset</button> <button class="btn secondary" id="wbNext">Next Sentence →</button></div>
    </div>`;
    const answerEl = wrap.querySelector('#wbAnswer');
    const chosen = [];
    wrap.querySelectorAll('.sb-chip').forEach(btn=>{
      btn.onclick = ()=>{
        btn.classList.add('used');
        chosen.push(parseInt(btn.dataset.i,10));
        answerEl.innerHTML = chosen.map(i=>`<span class="sb-chip jp">${s.chips[i]}</span>`).join('');
        if(chosen.length === s.chips.length){
          const ok = chosen.every((v,i)=>v===i);
          if(ok){ State.puzzleSolved = true; saveState(); checkBadges(); }
          wrap.querySelector('#wbResult').innerHTML = ok
            ? '<span style="color:var(--celadon)">Correct order! ✓</span>'
            : `<span style="color:var(--vermilion)">Not quite, the correct order is <span class="jp">${s.chips.join('')}</span></span>`;
        }
      };
    });
    wrap.querySelector('#wbReset').onclick = ()=>render();
    wrap.querySelector('#wbNext').onclick = ()=>{ si = (si+1)%list.length; render(); };
  }
  render();
  return wrap;
}

/* Generic renderer shared by all 12 function-group chapters. Everything

function renderGroupChapter(el, groupId){
  const g = GROUPS.find(x=>x.id===groupId);

  el.appendChild(buildQuiz(groupId+'-quiz', shuffle(questionSet(shuffle(items), items)), groupId));
  el.insertAdjacentHTML('beforeend', noteBox(groupId));
}

function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'daily-test'){
      html += `<a class="nav-item" href="../jlptn5roadmap.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">🗺️ Roadmap</span></a>`;
    }

  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>!c.isSupport && c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const el = document.getElementById('nav-'+c.id);
    if(el) el.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

  if(e.key==='ArrowRight' && idx<CHAPTERS.length-1) goTo(CHAPTERS[idx+1].id);

/* Share button: uses the native OS share sheet on mobile (and any
   desktop browser that supports it); falls back to copying the
   lesson's canonical link to the clipboard everywhere else. */
(function initShareButton(){
  const btn = document.getElementById('shareBtn');
  if(!btn) return;
  const canonicalEl = document.querySelector('link[rel="canonical"]');
  const shareUrl = (canonicalEl && canonicalEl.href) || window.location.href;
  const shareData = {
    title: document.title,
    text: 'Come learn Japanese with me — free, self-contained JLPT lessons from Hookitlingo.',
    url: shareUrl
  };
  btn.addEventListener('click', async ()=>{
    if(navigator.share){
      try{ await navigator.share(shareData); } catch(err){ /* user cancelled, nothing to do */ }
      return;
    }
    const original = btn.textContent;
    try{
      await navigator.clipboard.writeText(shareUrl);
      btn.textContent = '✓ Link copied!';
    } catch(err){
      btn.textContent = shareUrl;
    }
    setTimeout(()=>{ btn.textContent = original; }, 2200);
  });
})();

/* Drifting cherry blossom petals, purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
