<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JLPT N5 · Day 4 — Combination Sounds, Small っ, Long Vowels & Time</title>
<!--
  This file works completely offline once downloaded: no external scripts, no network
  calls required to function. All progress is saved to this browser's localStorage
  under the "tjd4_" prefix. The Google Fonts link below is a progressive enhancement
  only — if there's no internet on first load, the CSS fallback stacks (system serif /
  sans / Japanese fonts) are used instead and nothing breaks.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.transform-tile .trow{display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--jp); font-size:1.7em;}
.transform-tile .trow .arrow{color:var(--text-faint); font-size:.55em;}
.transform-tile .tag-rare{display:block; font-size:.62em; color:var(--vermilion); text-transform:uppercase; letter-spacing:.05em; margin-top:6px;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-formula{background:var(--surface2); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:14px 18px; margin:16px 0; text-align:center;}
.gram-formula .fpart{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-formula .fpart.particle{color:var(--vermilion); font-weight:700;}
.gram-formula .fplus{color:var(--text-faint); font-family:var(--sans); margin:0 8px; font-size:.85em;}
.gram-breakdown{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-ex-row{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:10px 0; border-bottom:1px dashed var(--border);}
.gram-ex-row:last-child{border-bottom:none;}
.gram-ex-row .jp{font-size:1.2em;}
.gram-ex-row .en{color:var(--text-dim); font-size:.88em;}
.gram-ex-row .spk-btn{margin-left:auto;}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.word-card .wc-ex{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:.88em; color:var(--text-dim);}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}
.tag.irregular{background:var(--vermilion-dim); color:var(--vermilion);}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sched-table{width:100%; border-collapse:collapse; margin:18px 0; font-size:.92em;}
.sched-table th,.sched-table td{border-bottom:1px solid var(--border); padding:9px 10px; text-align:left;}
.sched-table th{color:var(--text-faint); font-size:.78em; text-transform:uppercase; letter-spacing:.06em;}
.sched-table tr.irregular td{color:var(--vermilion);}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}
.sb-chip{background:var(--surface3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-family:var(--jp); font-size:1.1em;}
.sb-chip:hover{border-color:var(--vermilion);}
.sb-chip.used{opacity:.3; pointer-events:none;}
.sb-eng{color:var(--text-faint); font-size:.85em; margin-top:2px;}
.sb-result{margin-top:8px; font-size:.85em; min-height:1.2em;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}
.err-item b{font-family:var(--jp); font-size:1.1em;}

.clock-face{width:120px; height:120px; border-radius:50%; border:2px solid var(--border); background:var(--surface2); position:relative; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:1.4em; color:var(--gold);}

@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  #mainWrap{width:100%;}
  main{max-width:100%; padding:0;}
  body{background:#fff; color:#000;}
  .chapter{display:block !important;}
}
@media(max-width:900px){
  #sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.5); height:100vh;}
  #sidebar.open{transform:translateX(0);}
  #menuBtn{display:block;}
  main{padding:24px 18px 70px;}
  #topbar{flex-wrap:wrap; row-gap:8px;}
  .topbtn{padding:6px 8px; font-size:.8em;}
}
.focus-mode #sidebar, .focus-mode #topbar .aux{display:none;}
.overlay-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:35; display:none;}
.overlay-bg.show{display:block;}
</style>
</head>
<body>

<div class="petals no-print" id="petals" aria-hidden="true"></div>

<div id="app">
  <div class="overlay-bg" id="overlayBg"></div>

  <aside id="sidebar">
    <div class="brand">
      <div class="brand-block jp">四</div>
      <div class="brand-txt"><strong>JLPT N5 · Day 4</strong><span>84-Day Roadmap</span></div>
    </div>
    <div class="progress-mini">
      <div class="row"><span>Day 4 progress</span><span id="pctLabel">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="sideBar"></div></div>
    </div>
    <nav id="navList"></nav>
  </aside>

  <div id="mainWrap">
    <div id="topbar">
      <button id="menuBtn">☰</button>
      <div class="readbar-track"><div class="readbar-fill" id="readbarFill"></div></div>
      <div class="aux" style="display:flex; gap:8px;">
        <button class="topbtn" id="focusBtn">Focus</button>
        <button class="topbtn" id="themeBtn">☾ Dark</button>
        <button class="topbtn" id="printBtn">Print</button>
      </div>
    </div>
    <main id="main"></main>
  </div>
</div>

<script>
/* ============================================================
   0. DATA
   ============================================================ */
/* --- Days 1-3 recap (used only for today's Session 1 review) --- */
const BASIC_46 = [
 {ch:'あ',rom:'a'},{ch:'い',rom:'i'},{ch:'う',rom:'u'},{ch:'え',rom:'e'},{ch:'お',rom:'o'},

const PREFIX = 'tjd4_';
function loadState(){
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {current:null, last:null, visited:{}, quizzes:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[]};
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}
document.getElementById('themeBtn').addEventListener('click', ()=>{
  State.theme = State.theme==='light' ? 'dark' : 'light'; saveState(); applyTheme();
});
document.getElementById('printBtn').addEventListener('click', ()=>window.print());
document.getElementById('focusBtn').addEventListener('click', ()=>{
  document.body.classList.toggle('focus-mode');
});
document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlayBg').classList.toggle('show');
});
document.getElementById('overlayBg').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
});

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  const safeText = JSON.stringify(text).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}

/* ============================================================
   3. QUIZ BUILDER
   ============================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

function buildQuiz(id, items, chapterId, isFinal){
  const wrap = document.createElement('div');
  wrap.id = id;
  let idx = 0, correct = 0;
  const missed = [];

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const pct = Math.round((correct/items.length)*100);
      State.quizzes[id] = {pct, total:items.length, correct};
      missed.forEach(m=>{
        const existing = State.errorLog.find(e=>e.q===m.q);
        if(existing){ existing.count = (existing.count||1)+1; }
        else{ State.errorLog.push({q:m.q, correct:m.answer, chapter:chapterId}); }
      });
      checkBadges(); saveState(); updateProgress();
      wrap.innerHTML = `<div class="quiz-score">${pct}% — ${correct}/${items.length} correct ${pct>=70?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="location.reload()">Restart Quiz</button></div>`;
      if(isFinal){
        wrap.innerHTML += `<div class="btn-row"><button class="btn" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('day-complete')">Finish Day 4</button></div>`;
      }
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    q.innerHTML = `<div class="${qClass}">${item.q}</div><div class="qopts"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    item.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        if(opt === item.answer){
          b.classList.add('correct'); correct++;
          fb.textContent = 'Correct!';
        } else {
          b.classList.add('wrong');
          missed.push(item);
          [...optsEl.children].forEach(c=>{ if(c.textContent===item.answer) c.classList.add('correct'); });
          fb.textContent = `Not quite — correct answer: ${item.answer}`;
        }
        setTimeout(()=>{ idx++; renderQ(); }, 900);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

function buildFlashcards(words){

    wrap.innerHTML = `
    <div class="flashcard" id="fcCard">

    wrap.querySelector('#fcNext').onclick = ()=>{ i = (i+1)%words.length; render(); };

function buildPhraseBuilder(sentences){
  const wrap = document.createElement('div');
  let si = 0;
  function render(){
    const s = sentences[si];
    const chips = shuffle(s.chips.map((c,i)=>({c,i})));
    wrap.innerHTML = `<div class="sb-box">
      <div class="sb-eng">${s.en}</div>
      <div class="sb-answer" id="sbAnswer"></div>
      <div class="sb-chips">${chips.map(ch=>`<button class="sb-chip" data-i="${ch.i}">${ch.c}</button>`).join(' ')}</div>
      <div class="sb-result" id="sbResult"></div>
      <div class="btn-row"><button class="btn secondary" id="sbReset">Reset</button> <button class="btn secondary" id="sbNext">Next Sentence →</button></div>
    </div>`;
    const answerEl = wrap.querySelector('#sbAnswer');
    const chosen = [];
    wrap.querySelectorAll('.sb-chip').forEach(btn=>{
      btn.onclick = ()=>{
        btn.classList.add('used');
        chosen.push(parseInt(btn.dataset.i,10));
        answerEl.innerHTML = chosen.map(i=>`<span class="sb-chip">${s.chips[i]}</span>`).join('');
        if(chosen.length === s.chips.length){
          const ok = chosen.every((v,i)=>v===i);
          wrap.querySelector('#sbResult').innerHTML = ok
            ? `<span style="color:var(--celadon)">Correct order! ✓ Written together: <span class="jp">${s.display}</span></span>`
            : `<span style="color:var(--vermilion)">Not quite — correct order: <span class="jp">${s.chips.join(' ')}</span> (written as <span class="jp">${s.display}</span>)</span>`;
        }
      };
    });
    wrap.querySelector('#sbReset').onclick = ()=>render();
    wrap.querySelector('#sbNext').onclick = ()=>{ si = (si+1)%sentences.length; render(); };
  }
  render();
  return wrap;
}
function buildRevealGrid(list){
  const wrap = document.createElement('div');
  wrap.className = 'tile-grid';
  list.forEach(w=>{
    const tile = document.createElement('div');
    tile.className = 'letter-tile';
    tile.innerHTML = `<div class="glyph">${w.jp}</div>
      <div class="wc-meaning" style="font-size:.8em; color:var(--text-dim); margin-top:4px;">${w.en}</div>
      <div class="spk" style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px;">
        ${spkBtn(w.jp)}<button class="spk-btn no-print reveal-btn">👁 Reveal reading</button>
      </div>`;
    const revealBtn = tile.querySelector('.reveal-btn');
    revealBtn.onclick = ()=>{
      revealBtn.textContent = w.rom;
      revealBtn.disabled = true;
      revealBtn.style.color = 'var(--celadon)';
      revealBtn.style.borderColor = 'var(--celadon)';
    };
    wrap.appendChild(tile);
  });
  return wrap;
}

function renderDailyTest(el){
  chapterHeader(el, 'Finish', 'Day 4 Final Test', 'Passing mark: 70%');
  el.insertAdjacentHTML('beforeend', `<p>This combines combination sounds, the small っ, long vowels, and time expressions. Take your time.</p>`);
  const data = [];
  sample(COMBOS,4).forEach(h=>{ const wrongs=sample(COMBOS.filter(x=>x.ch!==h.ch),3).map(x=>x.rom); data.push({q:h.ch, isJp:true, options:shuffle([h.rom,...wrongs]), answer:h.rom}); });
  sample(SOKUON_WORDS_D4,3).forEach(w=>{ const wrongs=sample(SOKUON_WORDS_D4.filter(x=>x.jp!==w.jp).concat(COMBO_WORDS_D4).filter(x=>x.jp!==w.jp),3).map(x=>x.en); data.push({q:w.jp, isJp:true, options:shuffle([w.en,...wrongs]), answer:w.en}); });
  sample(LONG_VOWEL_WORDS,3).forEach(w=>{ const wrongs=sample(LONG_VOWEL_WORDS.filter(x=>x.jp!==w.jp),3).map(x=>x.en); data.push({q:w.jp, isJp:true, options:shuffle([w.en,...wrongs]), answer:w.en}); });
  sample(HOURS,4).forEach(h=>{ const wrongs=sample(HOURS.filter(x=>x.n!==h.n),3).map(x=>x.jp); data.push({q:String(h.n)+'時', isJp:false, options:shuffle([h.jp,...wrongs]), answer:h.jp}); });
  data.push({q:'きゃ is read as:', options:shuffle(['One syllable beat, "kya"','Two syllables, "ki-ya"','Silent','"kaya"']), answer:'One syllable beat, "kya"'});
  data.push({q:'What does the small っ in words like きって indicate?', options:shuffle(['A doubled consonant / brief pause','A long vowel sound','A silent letter','A question']), answer:'A doubled consonant / brief pause'});
  data.push({q:'How do you ask "What time is it now?"', options:shuffle(['いま なんじですか。','いま なんですか。','なんじは いまですか。','いま だれですか。']), answer:'いま なんじですか。'});
  data.push({q:'Which hour reading is irregular (not built from the number as expected)?', options:shuffle(['4時 → よじ','1時 → いちじ','2時 → にじ','5時 → ごじ']), answer:'4時 → よじ'});
  el.appendChild(buildQuiz('daily-test-quiz', shuffle(data), 'daily-test', true));
}

/* ============================================================
   6. NAVIGATION
   ============================================================ */
function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'daily-test'){
      html += `<a class="nav-item nav-item-support" href="supporters.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">💛 Support</span></a>`;
    }
  });
  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const elx = document.getElementById('nav-'+c.id);
    if(elx) elx.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

/* ============================================================
   7. INIT
   ============================================================ */
applyTheme();
document.documentElement.style.setProperty('--fs-scale', State.fontScale);
buildSidebar();
goTo(State.last && CHAPTERS.find(c=>c.id===State.last) ? State.last : 'cover');
window.addEventListener('keydown', e=>{
  const idx = CHAPTERS.findIndex(c=>c.id===State.current);
  if(e.key==='ArrowRight' && idx<CHAPTERS.length-1) goTo(CHAPTERS[idx+1].id);
  if(e.key==='ArrowLeft' && idx>0) goTo(CHAPTERS[idx-1].id);
});

/* Drifting cherry blossom petals — purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
