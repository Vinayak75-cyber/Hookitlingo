<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}

/* Furigana: on by default for a beginner-focused lesson. Toggling is a pure
   CSS class flip on #main, no re-render, so it is instant on the chapter
   currently open and on every chapter opened afterward through goTo(). */
ruby{ruby-position:over; ruby-align:center;}
rt{font-family:var(--sans); font-size:.52em; font-weight:500; color:var(--text-faint); user-select:none; letter-spacing:0;}
#main.furigana-off rt{display:none;}
.topbtn.furi-btn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}
.kofi-footer{max-width:var(--maxw); margin:0 auto; padding:8px 20px 40px; text-align:center;}
.support-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;}
.kofi-banner{
  display:inline-flex; align-items:center; gap:10px; padding:12px 24px; border-radius:999px;
  background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));
  color:#fff !important; font-weight:600; font-size:.92em; text-decoration:none; border:none;
  box-shadow:0 10px 26px color-mix(in srgb, var(--vermilion) 35%, transparent); transition:filter .15s;
  font-family:var(--sans);
}
.kofi-banner:hover{filter:brightness(1.07);}
.share-banner{
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--inkblue) 45%));
  box-shadow:0 10px 26px color-mix(in srgb, var(--celadon) 30%, transparent);
  min-width:290px; justify-content:center;
}

#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}

.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px; display:inline-block; margin:4px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-example{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin:12px 0;}
.gram-example .ge-jp{font-family:var(--jp); font-size:1.15em; margin-bottom:4px;}
.gram-example .ge-en{color:var(--text-dim); font-size:.88em;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sound-map{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;}
.sound-map .sm-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;}
.sound-map .sm-arrow{color:var(--text-faint); font-size:.85em;}
.sound-map .sm-jp{font-family:var(--jp); font-size:1.3em;}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--serif); font-style:italic; color:var(--text-faint); font-size:1em; letter-spacing:.03em; margin-bottom:10px;}
.cover-block{width:180px;height:180px; margin:0 auto 26px; position:relative;}
.cover-block svg{width:100%;height:100%;}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}
.sb-chip{background:var(--surface3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-family:var(--jp); font-size:1.1em;}
.sb-chip:hover{border-color:var(--vermilion);}
.sb-chip.used{opacity:.3; pointer-events:none;}

/* R() wraps a kanji-bearing string in a ruby tag with its furigana reading.

/* GROUPS: the 13 taught-order clusters this deck is built from, one per
   original Section/Lesson that introduced kanji (Sections 4 and 8 each
   split across two lessons, which is why 13 groups cover 12 sections).
   "nav" buckets them further for the sidebar, "meta"/"title"/"subtitle"
   feed the chapter header, "intro" is the framing paragraph, "tip" and
   "fact" are the Teacher Tip and Fun Fact callouts closing out each
   chapter. */
const GROUPS = [{"id": "s2l1", "meta": "Kanji Group 1 of 13", "title": "People, Time, and School", "subtitle": "The nine kanji behind every self-introduction", "section": "Section 2, Lesson 1", "nav": "Early Sections", "intro": "These were the very first nine kanji this whole roadmap ever handed you, back when the goal was just learning to say your own name. They still turn up constantly: 人 sits inside almost every word for a person or a nationality, and 先生 and 学生, teacher and student, are both built from kanji sitting right in this group.", "tip": "生 is the one to watch here. It carries at least four common readings depending on the word it lands in, せい in 先生, う.まれる in 生まれる, い.きる in 生きる, and なま when it means raw. Learn it word by word rather than trying to memorize one universal reading.", "fact": "今 pictures a small roof sitting low over a person underneath it, this very moment, right where someone happens to be standing. The idea of now, in other words, is drawn as shelter rather than as a clock or a calendar."}, {"id": "s3l1", "meta": "Kanji Group 2 of 13", "title": "Books, School, and Speech", "subtitle": "Nine kanji built around reading, writing, and talking", "section": "Section 3, Lesson 1", "nav": "Early Sections", "intro": "Every kanji in this group circles back to communication in one form or another, a book, a school, or something coming out of somebody's mouth. Three of them, 語, 話, and 読, share the speech radical 言 on the left side, which makes them easy to spot as a family once you know to look for it.", "tip": "When a new kanji feels unfamiliar, check its left-hand side first. 言 shows up in 語, 話, and 読 for a reason, that radical is the fastest hint you will get that a kanji has something to do with speaking, reading, or language itself.", "fact": "本 started out as a picture of a tree, 木, with one extra stroke marking the root. From root, the meaning stretched outward to origin, to the main thing, and eventually to a book, the origin of an idea captured on paper."}, {"id": "s4l1", "meta": "Kanji Group 3 of 13", "title": "Numbers One to Ten Thousand", "subtitle": "Fourteen kanji covering every N5 number and counter unit", "section": "Section 4, Lesson 1", "nav": "Numbers & Direction", "intro": "一, 二, and 三 are about as literal as kanji ever get, one, two, and three stacked strokes. From there the shapes stop being so predictable, and the readings start shifting depending on what gets counted next to them, which is exactly why this group rewards a second pass.", "tip": "四, 七, and 九 each carry two common readings. Default to よん, なな, and きゅう for plain counting, then switch to し, しち, and く only for fixed words like month names, 四月 and 九月 among them.", "fact": "万, ten thousand, is where Japanese counting resets its unit instead of English's one thousand. One hundred thousand is not a new word at all, it is simply 十万, ten times ten-thousand."}, {"id": "s4l2", "meta": "Kanji Group 4 of 13", "title": "Position and Direction", "subtitle": "Six spatial words and six compass points", "section": "Section 4, Lesson 2", "nav": "Numbers & Direction", "intro": "The first half of this group describes where something sits relative to something else, above, below, inside, outside, in front, behind. The second half switches to fixed compass directions, east, west, south, and north, plus left and right for good measure.", "tip": "Every spatial noun in this group needs の to link it to whatever it is describing. つくえの上に is correct, つくえ上に is not, the の is never optional.", "fact": "東, east, is a sun, 日, rising up behind a tree, 木, one of the oldest and most literal kanji pictures still in daily use, since east has always simply meant the direction the sun climbs up in."}, {"id": "s5l1", "meta": "Kanji Group 5 of 13", "title": "Daily Action Verbs", "subtitle": "Eight verb stems for going, eating, and everything between", "section": "Section 5, Lesson 1", "nav": "Verbs & Adjectives", "intro": "Every kanji here is the stem of a common daily verb, going, seeing, eating, drinking, buying, leaving, entering, and coming. These are some of the most frequently reused kanji in this entire roadmap, since almost every routine sentence leans on at least one of them.", "tip": "行 alone carries two very different readings depending on the word, い.く for going and ぎょう or こう in compounds like 旅行, travel. Learn the verb form and the compound form as two separate habits rather than one shared rule.", "fact": "買, to buy, is a net, 罒, gathering up shells, 貝, drawn at a time when shells were literally used as currency. Catching shells in a net is, quite directly, the oldest picture of buying something."}, {"id": "s6l1", "meta": "Kanji Group 6 of 13", "title": "Size, Price, and Age", "subtitle": "Eight kanji that double as full i-adjectives", "section": "Section 6, Lesson 1", "nav": "Verbs & Adjectives", "intro": "Four of these describe size and quantity, big, small, many, and few, and the other four cover price, age, and color. Every single one turns into a complete i-adjective the moment it picks up its okurigana, 大きい, 高い, 白い, and so on.", "tip": "The kanji alone is only ever the stem. 高 by itself is not a word you can drop into a sentence, it needs the い ending attached before it can actually describe anything.", "fact": "安, cheap or peaceful, draws a woman, 女, sitting safely under a roof, 宀. A household at ease became the meaning peaceful, and something that puts your mind at ease price-wise is exactly where cheap comes from."}, {"id": "s7l1", "meta": "Kanji Group 7 of 13", "title": "Body and the Senses", "subtitle": "Eight kanji for the parts you point to and the vehicle you ride", "section": "Section 7, Lesson 1", "nav": "Body & Calendar", "intro": "Standing, hearing, and four body parts, ear, eye, hand, and foot, sit alongside mouth and a vehicle to close out the set. These kanji become essential the moment requests and permission start flying back and forth in a conversation.", "tip": "耳 and 目 are two of the most directly pictographic kanji in this whole roadmap, an ear drawn from the side and an eye turned on its edge. If a kanji looks like a literal small drawing of a body part, it usually is one.", "fact": "聞, to hear or listen, places an ear, 耳, right inside a gate, 門, someone pressing their ear against the gate to catch every word on the other side before it ever reaches their face directly."}, {"id": "s8l1", "meta": "Kanji Group 8 of 13", "title": "Calendar Units and the Elements", "subtitle": "Year, month, day, and week, plus four classical elements", "section": "Section 8, Lesson 1", "nav": "Body & Calendar", "intro": "The first four kanji here are the calendar's own building blocks, year, month, day, and week. The remaining four borrow their names from the classical elements, fire, water, tree, and gold, which is also exactly where four of the seven weekday names come from.", "tip": "週, week, is one of the few kanji in this group without a common kun reading of its own, it almost always shows up glued onto other kanji rather than standing alone.", "fact": "Four of the seven Japanese weekdays are quite literally named after fire, water, wood, and gold, 火曜日, 水曜日, 木曜日, and 金曜日. The other three borrow the sun, the moon, and the earth instead."}, {"id": "s8l2", "meta": "Kanji Group 9 of 13", "title": "Clock Time and Duration", "subtitle": "Six kanji for telling time and marking the space between two points", "section": "Section 8, Lesson 2", "nav": "Body & Calendar", "intro": "時, 分, and 半 build the clock itself, hours, minutes, and the clean idea of a half. 間 marks the space between two points, 午 splits the day into morning and afternoon, and 毎 covers anything that repeats without exception.", "tip": "毎 and 午 look close enough at a glance to trip up a tired eye late at night. 午 is the narrower one built around noon, 毎 is the slightly busier one meaning every.", "fact": "毎, every, traces back to an old picture of a woman with an ornament in her hair, the same figure that appears inside 母, mother, repeated here to suggest something recurring generation after generation."}, {"id": "s9l1", "meta": "Kanji Group 10 of 13", "title": "Family and the Sky", "subtitle": "Eight kanji for family members, friendship, rest, and weather", "section": "Section 9, Lesson 1", "nav": "Family & Nature", "intro": "The first four kanji here form the core of any family, father, mother, child, and woman. The second four move outward to people beyond the immediate household, plus rest days and the sky above everyone, everything this lesson needs for talking about family, friends, and the weather.", "tip": "父 and 母 are easy to mix up under time pressure since both are short and both describe a parent. Practice them as a pair out loud, ちち for father, はは for mother, until the sound difference feels automatic.", "fact": "天, sky or heaven, is one horizontal stroke drawn above 大, a person standing with arms stretched wide. Whatever stretches out above a person's outstretched arms is, quite simply, the sky."}, {"id": "s10l1", "meta": "Kanji Group 11 of 13", "title": "Nature and Landscape", "subtitle": "Six kanji for mountains, rivers, flowers, and the weather overhead", "section": "Section 10, Lesson 1", "nav": "Family & Nature", "intro": "山, 川, and 花 form the core of any landscape, mountain, river, and flower. 長 covers the shape and length of things, 空 is the empty sky above them, and 雨 is the rain that eventually falls out of it, everything this lesson needs for describing nature and comparing it.", "tip": "山 and 川 have barely changed in thousands of years, both are close to a direct picture of the thing they mean. When a kanji looks almost too simple to be true, it is often one of the oldest ones in the entire set.", "fact": "雨, rain, is about as literal as kanji get, a horizontal line for the sky along the top, and small drops scattered underneath it caught mid-fall."}, {"id": "s11l1", "meta": "Kanji Group 12 of 13", "title": "Spirit, Repetition, and Community", "subtitle": "Three kanji for mood, routine, and the places people gather", "section": "Section 11, Lesson 1", "nav": "Late Sections", "intro": "気 is the invisible energy or mood sitting behind a huge number of everyday words, from 元気 to 天気 to 病気. 毎 returns here from the clock time group to cover anything that keeps recurring, and 社 rounds the group out with the company or shrine a community builds its life around.", "tip": "気 almost never carries a kun reading of its own, it survives almost entirely glued onto other kanji, 天気, 元気, 病気, and dozens more, so learn it through those compounds rather than in isolation.", "fact": "社 pairs an altar radical, 礻, a simplified picture of a small shrine, with 土, earth, an early shrine built directly into a patch of open ground. From a literal shrine, the meaning stretched to any organized group people build their lives around, which is exactly what a company is too."}, {"id": "s12l1", "meta": "Kanji Group 13 of 13", "title": "Travel and an Old Friend", "subtitle": "A road, a station, electricity, and one of the oldest picture kanji in the set", "section": "Section 12, Lesson 1", "nav": "Late Sections", "intro": "The first three kanji here cluster naturally around travel, a road or way, a station, and the electricity that powers both trains and telephones. The fourth, 魚, is one of the oldest picture kanji taught anywhere in this roadmap, and it shows up constantly across food and hobby vocabulary alike.", "tip": "駅, station, is built from 馬, horse, since a 駅 was originally a horse relay stop long before trains existed. Picturing that old relay stop is a faster way to remember the kanji than trying to connect it to a modern train platform.", "fact": "魚 is close to a small sketch of a fish swimming, tip your head sideways and you can still make out a head at the top, a body with fins through the middle, and a tail fanning out at the bottom."}];

/* KANJI_POOL: all 103 N5 kanji, in the exact order they were first taught.

: "北", "reading": "きた", "meaning": "north"}, {"word": "北口", "reading": "きたぐち", "meaning": "north exit"}, {"word": "東北", "reading": "とうほく", "meaning": "Tohoku region, northeast"}], "group": "s4l2", "section": "Section 4, Lesson 2", "readingType": "both"}, {"id": "k045", "kanji": "行", "meaning": "go, carry out", "on": "コウ・ギョウ", "kun": "い.く・おこな.う・ゆ.く", "strokes": 6, "memory": "A picture of a crossroads seen from above, two paths meeting and continuing on. A crossroads is exactly where you decide which way you are going.", "examples": [{"word": "行きます", "reading": "いきます", "meaning": "to go"}, {"word": "旅行", "reading": "りょこう", "meaning": "travel, trip"}, {"word": "銀行", "reading": "ぎんこう", "meaning": "bank"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k046", "kanji": "見", "meaning": "see, look", "on": "ケン", "kun": "み.る・み.える・み.せる", "strokes": 7, "memory": "An eye, 目, balanced on top of a pair of legs, 儿. Old and simple, an eye that has gotten up and walked over to get a proper look at something.", "examples": [{"word": "見ます", "reading": "みます", "meaning": "to see, watch"}, {"word": "見物", "reading": "けんぶつ", "meaning": "sightseeing"}, {"word": "花見", "reading": "はなみ", "meaning": "flower viewing"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k047", "kanji": "食", "meaning": "eat, food", "on": "ショク・ジキ", "kun": "た.べる・く.う", "strokes": 9, "memory": "A lid, 人, sitting over a full dish beneath it, a covered bowl of food waiting to be uncovered and eaten.", "examples": [{"word": "食べます", "reading": "たべます", "meaning": "to eat"}, {"word": "食堂", "reading": "しょくどう", "meaning": "dining hall, cafeteria"}, {"word": "朝食", "reading": "ちょうしょく", "meaning": "breakfast"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k048", "kanji": "飲", "meaning": "drink", "on": "イン", "kun": "の.む", "strokes": 12, "memory": "食, food, standing beside 欠, an open mouth drawing something in. This character reads as the watery cousin of food, taking something in through the mouth as a liquid instead of a solid.", "examples": [{"word": "飲みます", "reading": "のみます", "meaning": "to drink"}, {"word": "飲み物", "reading": "のみもの", "meaning": "a drink, beverage"}, {"word": "飲食店", "reading": "いんしょくてん", "meaning": "restaurant, eatery"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k049", "kanji": "買", "meaning": "buy", "on": "バイ", "kun": "か.う", "strokes": 12, "memory": "A net, 罒, gathering up shells, 貝, and shells were literally used as currency in ancient times. Catching shells in a net is, quite directly, the old picture of buying something.", "examples": [{"word": "買います", "reading": "かいます", "meaning": "to buy"}, {"word": "買い物", "reading": "かいもの", "meaning": "shopping"}, {"word": "売買", "reading": "ばいばい", "meaning": "buying and selling"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k050", "kanji": "出", "meaning": "exit, leave, put out", "on": "シュツ・スイ", "kun": "で.る・だ.す", "strokes": 5, "memory": "A foot, 山-shaped, stepping up and out past a boundary line, one stroke breaking free of the edge that used to contain it.", "examples": [{"word": "出ます", "reading": "でます", "meaning": "to leave, exit"}, {"word": "出口", "reading": "でぐち", "meaning": "exit"}, {"word": "出発", "reading": "しゅっぱつ", "meaning": "departure"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k051", "kanji": "入", "meaning": "enter, put in", "on": "ニュウ", "kun": "はい.る・い.れる・い.る", "strokes": 2, "memory": "Two strokes forming a narrow wedge, a shape that looks like it is being pushed into a tighter space, in.", "examples": [{"word": "入ります", "reading": "はいります", "meaning": "to enter"}, {"word": "入口", "reading": "いりぐち", "meaning": "entrance"}, {"word": "入学", "reading": "にゅうがく", "meaning": "entering school, enrollment"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k052", "kanji": "来", "meaning": "come", "on": "ライ", "kun": "く.る・きた.る", "strokes": 7, "memory": "An old picture of a stalk of wheat, grain that arrives at the end of a season, harvest coming in. Whatever \"comes\" in, this character has always meant arrival.", "examples": [{"word": "来ます", "reading": "きます", "meaning": "to come"}, {"word": "来週", "reading": "らいしゅう", "meaning": "next week"}, {"word": "未来", "reading": "みらい", "meaning": "the future"}], "group": "s5l1", "section": "Section 5, Lesson 1", "readingType": "both"}, {"id": "k053", "kanji": "大", "meaning": "big, large", "on": "ダイ・タイ", "kun": "おお.きい", "strokes": 3, "memory": "A person standing with both arms stretched wide apart, the oldest and simplest way anyone has ever pictured something big: hold your arms out as far as they go.", "examples": [{"word": "大きい", "reading": "おおきい", "meaning": "big, large"}, {"word": "大学", "reading": "だいがく", "meaning": "university"}, {"word": "大丈夫", "reading": "だいじょうぶ", "meaning": "alright, fine"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k054", "kanji": "小", "meaning": "small", "on": "ショウ", "kun": "ちい.さい・こ・お", "strokes": 3, "memory": "A single small object caught between two tiny flecks flying off to either side, splinters breaking off something and getting smaller as they go.", "examples": [{"word": "小さい", "reading": "ちいさい", "meaning": "small"}, {"word": "小学校", "reading": "しょうがっこう", "meaning": "elementary school"}, {"word": "小説", "reading": "しょうせつ", "meaning": "novel"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k055", "kanji": "多", "meaning": "many, much", "on": "タ", "kun": "おお.い", "strokes": 6, "memory": "Two copies of 夕, evening, stacked one on top of the other. One evening is nothing special, but evening after evening after evening starts to add up to a great many of them.", "examples": [{"word": "多い", "reading": "おおい", "meaning": "many, numerous"}, {"word": "多分", "reading": "たぶん", "meaning": "probably"}, {"word": "多数", "reading": "たすう", "meaning": "a large number, majority"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k056", "kanji": "少", "meaning": "few, a little", "on": "ショウ", "kun": "すく.ない・すこ.し", "strokes": 4, "memory": "小, small, with one extra stroke sliced off the bottom, something already small getting whittled down to even less than that.", "examples": [{"word": "少ない", "reading": "すくない", "meaning": "few, not many"}, {"word": "少し", "reading": "すこし", "meaning": "a little, a bit"}, {"word": "少々", "reading": "しょうしょう", "meaning": "just a moment, a little"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k057", "kanji": "高", "meaning": "tall, high, expensive", "on": "コウ", "kun": "たか.い", "strokes": 10, "memory": "An old drawing of a tall gate tower, a base, a body, and a peaked roof stacked up in tiers, the kind of building you would notice rising above everything around it.", "examples": [{"word": "高い", "reading": "たかい", "meaning": "tall, high, expensive"}, {"word": "高校", "reading": "こうこう", "meaning": "high school"}, {"word": "高速道路", "reading": "こうそくどうろ", "meaning": "expressway"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k058", "kanji": "安", "meaning": "cheap, peaceful, safe", "on": "アン", "kun": "やす.い", "strokes": 6, "memory": "A roof, 宀, with a woman, 女, sitting safely underneath it. A household at ease is a peaceful one, and something that puts your mind at ease price-wise is exactly what \"cheap\" means here.", "examples": [{"word": "安い", "reading": "やすい", "meaning": "cheap, inexpensive"}, {"word": "安全", "reading": "あんぜん", "meaning": "safety"}, {"word": "不安", "reading": "ふあん", "meaning": "anxiety, unease"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k059", "kanji": "古", "meaning": "old (for things, not people)", "on": "コ", "kun": "ふる.い", "strokes": 5, "memory": "A mouth, 口, with 十, ten, stacked on top of it, a story that has been told and retold for ten generations of mouths, old enough to have been passed all the way down.", "examples": [{"word": "古い", "reading": "ふるい", "meaning": "old (things)"}, {"word": "中古", "reading": "ちゅうこ", "meaning": "secondhand, used"}, {"word": "古本", "reading": "ふるほん", "meaning": "used book"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k060", "kanji": "白", "meaning": "white", "on": "ハク・ビャク", "kun": "しろ・しろ.い・しら", "strokes": 5, "memory": "A single ray of sunlight caught on top of the sun itself, a small bright point of light that gave this character its meaning of pale, radiant white.", "examples": [{"word": "白い", "reading": "しろい", "meaning": "white"}, {"word": "白色", "reading": "はくしょく", "meaning": "white color"}, {"word": "面白い", "reading": "おもしろい", "meaning": "interesting, funny"}], "group": "s6l1", "section": "Section 6, Lesson 1", "readingType": "both"}, {"id": "k061", "kanji": "立", "meaning": "stand, rise", "on": "リツ・リュウ", "kun": "た.つ・た.てる", "strokes": 5, "memory": "A stick figure planted on top of a flat horizontal line, the ground itself, both feet set firmly and refusing to fall over, about as old a picture of standing upright as any writing system has ever needed.", "examples": [{"word": "立つ", "reading": "たつ", "meaning": "to stand, to rise"}, {"word": "立派", "reading": "りっぱ", "meaning": "splendid, admirable"}, {"word": "国立", "reading": "こくりつ", "meaning": "national, state-established"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k062", "kanji": "聞", "meaning": "hear, ask, listen", "on": "ブン・モン", "kun": "き.く・き.こえる", "strokes": 14, "memory": "A gate, 門, with an ear, 耳, tucked inside it, someone pressing their ear right against the gate to catch every word being said on the other side before it ever gets said to their face.", "examples": [{"word": "聞く", "reading": "きく", "meaning": "to listen, to hear, to ask"}, {"word": "新聞", "reading": "しんぶん", "meaning": "newspaper"}, {"word": "聞こえる", "reading": "きこえる", "meaning": "to be audible, to be heard"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k063", "kanji": "耳", "meaning": "ear", "on": "ジ", "kun": "みみ", "strokes": 6, "memory": "A simple side-on sketch of the outer curve and the inner fold of an ear, one of the most literally pictographic kanji in this entire lesson, drawn almost exactly the way it looks.", "examples": [{"word": "耳", "reading": "みみ", "meaning": "ear"}, {"word": "耳鼻科", "reading": "じびか", "meaning": "ear, nose, and throat clinic"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k064", "kanji": "目", "meaning": "eye", "on": "モク・ボク", "kun": "め", "strokes": 5, "memory": "An eye turned on its side and squared off at the corners, the lashes flattened into two horizontal lines, an eye drawn as though you are looking straight into it rather than across at it.", "examples": [{"word": "目", "reading": "め", "meaning": "eye"}, {"word": "目的", "reading": "もくてき", "meaning": "purpose, goal"}, {"word": "一番目", "reading": "いちばんめ", "meaning": "the first one, in a numbered order"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k065", "kanji": "手", "meaning": "hand", "on": "シュ", "kun": "て", "strokes": 4, "memory": "A hand held up with the fingers spread and the wrist trailing off to the lower left, one of the oldest and most direct hand-drawings still used every single day.", "examples": [{"word": "手", "reading": "て", "meaning": "hand"}, {"word": "手紙", "reading": "てがみ", "meaning": "letter, something written by hand"}, {"word": "上手", "reading": "じょうず", "meaning": "skillful, good at"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k066", "kanji": "足", "meaning": "foot, leg, be sufficient", "on": "ソク", "kun": "あし・た.りる・た.す", "strokes": 7, "memory": "A knee, a shin, and a foot stacked into one shape, and because having two working legs under you once counted as having everything you truly needed, 足 also came to mean enough, sufficient.", "examples": [{"word": "足", "reading": "あし", "meaning": "foot, leg"}, {"word": "足りる", "reading": "たりる", "meaning": "to be enough, to be sufficient"}, {"word": "満足", "reading": "まんぞく", "meaning": "satisfaction"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k067", "kanji": "口", "meaning": "mouth", "on": "コウ・ク", "kun": "くち", "strokes": 3, "memory": "A single open square, the simplest possible drawing of a mouth held open, and one of the very first kanji almost anyone ever memorizes on the way into this writing system.", "examples": [{"word": "口", "reading": "くち", "meaning": "mouth"}, {"word": "入り口", "reading": "いりぐち", "meaning": "entrance"}, {"word": "人口", "reading": "じんこう", "meaning": "population"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k068", "kanji": "車", "meaning": "car, vehicle", "on": "シャ", "kun": "くるま", "strokes": 7, "memory": "A cart seen from directly above, a central axle with a wheel drawn at the top and another at the bottom, the same shape that once meant an oxcart now covers cars, trains, and every wheeled thing in between.", "examples": [{"word": "車", "reading": "くるま", "meaning": "car"}, {"word": "電車", "reading": "でんしゃ", "meaning": "train"}, {"word": "自転車", "reading": "じてんしゃ", "meaning": "bicycle"}], "group": "s7l1", "section": "Section 7, Lesson 1", "readingType": "both"}, {"id": "k069", "kanji": "年", "meaning": "year", "on": "ネン", "kun": "とし", "strokes": 6, "memory": "An old pictograph of a person carrying a full bundle of ripe grain on their back. One entire harvest, gathered from planting all the way through reaping, became the natural way early farmers marked off a single year.", "examples": [{"word": "今年", "reading": "ことし", "meaning": "this year"}, {"word": "去年", "reading": "きょねん", "meaning": "last year"}, {"word": "毎年", "reading": "まいとし", "meaning": "every year"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k070", "kanji": "月", "meaning": "month, moon", "on": "ゲツ・ガツ", "kun": "つき", "strokes": 4, "memory": "A crescent moon drawn on its side, tipped just enough to catch the curve of a thin sliver moon. The word for month and the word for moon have always shared this exact shape, since a month was originally counted out by watching the moon complete one full cycle.", "examples": [{"word": "一月", "reading": "いちがつ", "meaning": "January"}, {"word": "今月", "reading": "こんげつ", "meaning": "this month"}, {"word": "月曜日", "reading": "げつようび", "meaning": "Monday"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k071", "kanji": "日", "meaning": "day, sun", "on": "ニチ・ジツ", "kun": "ひ・か", "strokes": 4, "memory": "A simple square with one stroke through the middle, the oldest surviving drawing of the sun itself, a bright disc hanging in the sky. Since a single day is measured by the sun rising once and setting once, this same character does double duty for both ideas at once.", "examples": [{"word": "日曜日", "reading": "にちようび", "meaning": "Sunday"}, {"word": "誕生日", "reading": "たんじょうび", "meaning": "birthday"}, {"word": "毎日", "reading": "まいにち", "meaning": "every day"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k072", "kanji": "週", "meaning": "week", "on": "シュウ", "kun": "no common kun reading", "strokes": 11, "memory": "The radical on the left, 辶, means walking or movement, wrapped around 周, a complete loop or circuit. A week is exactly that, one full loop through all seven days before you start walking the same loop all over again.", "examples": [{"word": "今週", "reading": "こんしゅう", "meaning": "this week"}, {"word": "週末", "reading": "しゅうまつ", "meaning": "weekend"}, {"word": "毎週", "reading": "まいしゅう", "meaning": "every week"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "on"}, {"id": "k073", "kanji": "火", "meaning": "fire", "on": "カ", "kun": "ひ", "strokes": 4, "memory": "Two small flames caught mid-flicker, licking upward and outward from a low base. Turn the character sideways and the two curling strokes at the top still look like fire jumping off the top of a burning log.", "examples": [{"word": "火曜日", "reading": "かようび", "meaning": "Tuesday"}, {"word": "花火", "reading": "はなび", "meaning": "fireworks"}, {"word": "火事", "reading": "かじ", "meaning": "a fire, a blaze"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k074", "kanji": "水", "meaning": "water", "on": "スイ", "kun": "みず", "strokes": 4, "memory": "A flowing stream with one strong central current and two smaller currents branching off to either side. Every stroke in this character is water caught mid-motion, never sitting still for a moment.", "examples": [{"word": "水曜日", "reading": "すいようび", "meaning": "Wednesday"}, {"word": "お水", "reading": "おみず", "meaning": "water, polite"}, {"word": "水泳", "reading": "すいえい", "meaning": "swimming"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k075", "kanji": "木", "meaning": "tree, wood", "on": "モク・ボク", "kun": "き・こ", "strokes": 4, "memory": "A tree with roots reaching down and branches spreading out above it, about the plainest possible sketch of a tree standing alone in open ground. This same shape becomes the building block for dozens of other kanji connected to plants and wood.", "examples": [{"word": "木曜日", "reading": "もくようび", "meaning": "Thursday"}, {"word": "木", "reading": "き", "meaning": "tree"}, {"word": "木曜", "reading": "もくよう", "meaning": "Thursday, short form"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k076", "kanji": "金", "meaning": "gold, money", "on": "キン・コン", "kun": "かね", "strokes": 8, "memory": "A mound of ore sealed under a roof, with two small dots buried inside standing in for nuggets of raw metal. What began as a general word for metal in the ground narrowed over time to point at the single most valuable metal in it, and from there, at money itself.", "examples": [{"word": "金曜日", "reading": "きんようび", "meaning": "Friday"}, {"word": "お金", "reading": "おかね", "meaning": "money"}, {"word": "金色", "reading": "きんいろ", "meaning": "gold color"}], "group": "s8l1", "section": "Section 8, Lesson 1", "readingType": "both"}, {"id": "k077", "kanji": "時", "meaning": "clock, hour, time", "on": "ジ", "kun": "とき", "strokes": 10, "memory": "The sun 日 sitting beside 寺, a temple. Temples once struck a bell at fixed points across the day to announce the hour to everyone within earshot, so sun plus temple settled into the character for marking off a specific point in time.", "examples": [{"word": "何時", "reading": "なんじ", "meaning": "what time"}, {"word": "時間", "reading": "じかん", "meaning": "time, hours"}, {"word": "時々", "reading": "ときどき", "meaning": "sometimes"}], "group": "s8l2", "section": "Section 8, Lesson 2", "readingType": "both"}, {"id": "k078", "kanji": "分", "meaning": "minute, divide, understand", "on": "フン・ブン・プン", "kun": "わ.ける・わ.かる", "strokes": 4, "memory": "A knife 刀 cutting straight through something already split in two 八. An hour cut into sixty small pieces is exactly that idea in motion, dividing one whole stretch of time into smaller countable parts.", "examples": [{"word": "何分", "reading": "なんぷん", "meaning": "what minute"}, {"word": "十分", "reading": "じゅっぷん", "meaning": "ten minutes"}, {"word": "気分", "reading": "きぶん", "meaning": "feeling, mood"}], "group": "s8l2", "section": "Section 8, Lesson 2", "readingType": "both"}, {"id": "k079", "kanji": "半", "meaning": "half", "on": "ハン", "kun": "なか.ば", "strokes": 5, "memory": "An old picture of an ox 牛 split cleanly down the middle 八 into two equal sides. Whatever gets divided this way ends up in two matching halves, which is exactly what happens to an hour the moment the clock passes thirty minutes.", "examples": [{"word": "三時半", "reading": "さんじはん", "meaning": "half past three"}, {"word": ction 9, Lesson 1", "readingType": "both"}, {"id": "k090", "kanji": "天", "meaning": "heaven, sky, weather", "on": "テン", "kun": "あめ・あま", "strokes": 4, "memory": "The character 大, a person standing with arms spread wide, with one extra stroke drawn above the head. That stroke marks the vast space above every person, the sky, and by extension, heaven.", "examples": [{"word": "天気", "reading": "てんき", "meaning": "weather"}, {"word": "天気予報", "reading": "てんきよほう", "meaning": "weather forecast"}, {"word": "天ぷら", "reading": "てんぷら", "meaning": "tempura"}], "group": "s9l1", "section": "Section 9, Lesson 1", "readingType": "both"}, {"id": "k091", "kanji": "山", "meaning": "mountain", "on": "サン", "kun": "やま", "strokes": 3, "memory": "Three peaks rising side by side, drawn in a single small cluster of strokes. This character has stayed close to its oldest form for thousands of years, a plain picture of a mountain range on the horizon.", "examples": [{"word": "山", "reading": "やま", "meaning": "mountain"}, {"word": "富士山", "reading": "ふじさん", "meaning": "Mount Fuji"}, {"word": "山登り", "reading": "やまのぼり", "meaning": "mountain climbing, hiking"}], "group": "s10l1", "section": "Section 10, Lesson 1", "readingType": "both"}, {"id": "k092", "kanji": "川", "meaning": "river", "on": "セン", "kun": "かわ", "strokes": 3, "memory": "Three flowing lines running side by side, the middle one slightly shorter than the two banks around it. Early picture writing drew a river almost exactly this way, and the shape has barely changed since.", "examples": [{"word": "川", "reading": "かわ", "meaning": "river"}, {"word": "小川", "reading": "おがわ", "meaning": "stream, brook"}, {"word": "川下り", "reading": "かわくだり", "meaning": "river rafting, going downstream"}], "group": "s10l1", "section": "Section 10, Lesson 1", "readingType": "both"}, {"id": "k093", "kanji": "花", "meaning": "flower", "on": "カ", "kun": "はな", "strokes": 7, "memory": "The grass radical 艹 sitting on top of 化, a character that carries the idea of change or tr "examples": [{"word": "会社", "reading": "かいしゃ", "meaning": "company"}, {"word": "社長", "reading": "しゃちょう", "meaning": "company president"}, {"word": "神社", "reading": "じんじゃ", "meaning": "Shinto shrine"}], "group": "s11l1", "section": "Section 11, Lesson 1", "readingType": "both"}, {"id": "k100", "kanji": "道", "meaning": "road, way, path", "on": "ドウ", "kun": "みち", "strokes": 12, "memory": "Picture a road stretching forward from a head-shaped bend, this kanji was originally built from an old symbol for a head, leading the way, plus a mark for walking forward. A road you walk to get somewhere, and by extension, a way of doing something.", "examples": [{"word": "道", "reading": "みち", "meaning": "road, street"}, {"word": "北海道", "reading": "ほっかいどう", "meaning": "Hokkaido"}, {"word": "茶道", "reading": "さどう", "meaning": "tea ceremony"}], "group": "s12l1", "section": "Section 12, Lesson 1", "readingType": "both"}, {"id": "k101", "kanji": "駅", "meaning": "station", "on": "エキ", "kun": "(no common kun reading)", "strokes": 14, "memory": "A horse, 馬, standing beside a shape that once marked a stopping point along a route. Long before trains existed, a 駅 was a horse relay station where travelers switched mounts partway through a journey, the same idea of a stopping point along the way carried straight over into the modern train station.", "examples": [{"word": "駅", "reading": "えき", "meaning": "station"}, {"word": "駅前", "reading": "えきまえ", "meaning": "in front of the station"}, {"word": "駅員", "reading": "えきいん", "meaning": "station staff"}], "group": "s12l1", "section": "Section 12, Lesson 1", "readingType": "on"}, {"id": "k102", "kanji": "電", "meaning": "electricity", "on": "デン", "kun": "(no common kun reading)", "strokes": 13, "memory": "Rain, 雨, sitting above a shape that once traced a bolt of lightning splitting the sky. Lightning is electricity in its rawest form, and this kanji still carries that flash every time it turns up in train and telephone.", "examples": [{"word": "電車", "reading": "でんしゃ", "meaning": "train"}, {"word": "電話", "reading": "でんわ", "meaning": "telephone"}, {"word": "電気", "reading": "でんき", "meaning": "electricity, light"}], "group": "s12l1", "section": "Section 12, Lesson 1", "readingType": "on"}, {"id": "k103", "kanji": "魚", "meaning": "fish", "on": "ギョ", "kun": "さかな・うお", "strokes": 11, "memory": "A simple picture kanji, tip your head sideways and you can still make out a head at the top, a body with fins through the middle, and a tail fanning out at the bottom, practically a small sketch of a fish swimming.", "examples": [{"word": "魚", "reading": "さかな", "meaning": "fish"}, {"word": "魚屋", "reading": "さかなや", "meaning": "fish shop"}, {"word": "金魚", "reading": "きんぎょ", "meaning": "goldfish"}], "group": "s12l1", "section": "Section 12, Lesson 1", "readingType": "both"}];

const PREFIX = 'tjs13l2_';
function loadState(){
  const defaults = {current:null, last:null, visited:{}, quizzes:{}, badges:{}, notes:{}, theme:'dark', fontScale:1, errorLog:[], puzzleSolved:false, furiganaOn:true};
  try{
    const raw = localStorage.getItem(PREFIX+'state');
    if(raw) return Object.assign({}, defaults, JSON.parse(raw));
  }catch(e){}
  return defaults;
}
let State = loadState();
function saveState(){ try{ localStorage.setItem(PREFIX+'state', JSON.stringify(State)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute('data-theme', State.theme==='light'?'light':'dark');
  document.getElementById('themeBtn').textContent = State.theme==='light' ? '☀ Light' : '☾ Dark';
}
function applyFurigana(){
  const on = !!State.furiganaOn;
  document.getElementById('main').classList.toggle('furigana-off', !on);
  const btn = document.getElementById('furiBtn');
  btn.textContent = '🈶 Furigana: ' + (on ? 'On' : 'Off');

   2. AUDIO
   ============================================================ */
/* Left empty on purpose. Fill this object with "phrase or word": "data:audio/mpeg;base64,...."
   pairs later, using the exact Japanese string as the key, and every speaker button
   below will start working without touching any other code. */
const AUDIO_DATA = {};

const Audio_ = {
  queue: [], playing: false, currentAudio: null, ready: true,

  sanitize(text) {
    return text.replace(/[\\/:*?"<>|]/g, '');
  },

  lookup(text) {
    const clean = this.sanitize(text).trim();
    const candidates = [text, clean, clean + '.', clean + ' '];
    for (const c of candidates) {
      if (Object.prototype.hasOwnProperty.call(AUDIO_DATA, c)) return AUDIO_DATA[c];
    }
    return null;
  },

  speak(text, btn) {
    if (!text) return;
    if (btn) {
      if (btn.dataset.busy === '1') return;
      btn.dataset.busy = '1';
      btn.classList.add('loading');
    }
    this.queue.push({ text, btn });
    this._pump();
  },

  _pump() {
    if (this.playing || !this.queue.length) return;
    const { text, btn } = this.queue.shift();
    this.playing = true;
    const dataUri = this.lookup(text);
    const finish = (ok)=>{
      this.playing = false;
      if(btn){
        btn.dataset.busy='0'; btn.classList.remove('loading');
        if(!ok){
          const orig = btn.textContent;
          btn.textContent = '❌ Missing';
          setTimeout(()=>{ btn.textContent = orig; }, 1200);
        }
      }
      this._pump();
    };
    if(!dataUri){ finish(false); return; }
    try{
      const audio = new Audio(dataUri);
      this.currentAudio = audio;
      audio.onended = ()=>finish(true);
      audio.onerror = ()=>finish(false);
      audio.play().catch(()=>finish(false));
    }catch(e){ finish(false); }
  }
};

function spkBtn(text, label){
  label = label || '🔊 Listen';
  if (!text) return '';
  /* Strip furigana readings (the <rt> content) completely before stripping the
     remaining tags, so the audio lookup key is always the plain kanji/kana
     sentence exactly as written, never the kanji with the reading appended. */
  const plain = text.replace(/<rt>[\s\S]*?<\/rt>/g, '').replace(/<[^>]*>/g, '');
  const safeText = JSON.stringify(plain).replace(/"/g, '&quot;');
  return `<button class="spk-btn no-print" onclick="Audio_.speak(${safeText}, this)">${label}</button>`;
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }

function buildQuiz(id, items, chapterId, isFinal){
  const wrap = document.createElement('div');
  wrap.id = id;
  let idx = 0, correct = 0;
  const missed = [];

  function renderQ(){
    wrap.innerHTML = '';
    if(idx >= items.length){
      const pct = Math.round((correct/items.length)*100);
      State.quizzes[id] = {pct, total:items.length, correct};
      missed.forEach(m=>{
        const existing = State.errorLog.find(e=>e.q===m.q);
        if(existing){ existing.count = (existing.count||1)+1; }
        else{ State.errorLog.push({q:m.q, correct:m.answer, chapter:chapterId}); }
      });
      checkBadges(); saveState(); updateProgress();
      wrap.innerHTML = `<div class="quiz-score">${pct}% - ${correct}/${items.length} correct ${pct>=70?'🎉':''}</div>
        <div class="btn-row"><button class="btn secondary" onclick="location.reload()">Restart Quiz</button></div>`;
      if(isFinal){
        wrap.innerHTML += `<div class="btn-row"><button class="btn" onclick="goTo('error-log')">Review Error Log</button> <button class="btn secondary" onclick="goTo('lesson-complete')">Finish Lesson</button></div>`;
      }
      return;
    }
    const item = items[idx];
    const q = document.createElement('div');
    q.className = 'quiz-q';
    const qClass = item.isJp ? 'qtext jp' : 'qtext eng';
    q.innerHTML = `<div class="${qClass}">${item.q}</div><div class="qopts"></div><div class="qfeedback"></div>`;
    const optsEl = q.querySelector('.qopts');
    item.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className = 'qopt'; b.textContent = opt;
      b.onclick = ()=>{
        [...optsEl.children].forEach(c=>c.disabled=true);
        const fb = q.querySelector('.qfeedback');
        if(opt === item.answer){
          b.classList.add('correct'); correct++;
          fb.textContent = 'Correct!';
        } else {
          b.classList.add('wrong');
          missed.push(item);
          [...optsEl.children].forEach(c=>{ if(c.textContent===item.answer) c.classList.add('correct'); });
          fb.textContent = `Not quite, correct answer: ${item.answer}`;
        }
        setTimeout(()=>{ idx++; renderQ(); }, 900);
      };
      optsEl.appendChild(b);
    });
    wrap.appendChild(q);
  }
  renderQ();
  return wrap;
}

function strokeBucket(n){

}

/* Auto-generates a quiz from a list of kanji. Cycles through three question
   shapes so recognition gets tested from every direction: given the kanji
   glyph, name the meaning; given the meaning, pick the correct glyph; given
   an on/kun reading, pick the glyph it belongs to. wrongPool supplies the
   distractor answers, pass the same group for tighter distractors, or the
   full pool for a broader final test. */
function kanjiQuestionSet(items, wrongPool){
  return items.map((it,idx)=>{
    const mode = idx%3;
    if(mode===0){
      const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.meaning);
      return {q:it.kanji, isJp:true, options:shuffle([it.meaning,...wrongs]), answer:it.meaning};
    }
    if(mode===1){
      const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.kanji);
      return {q:`Which kanji means "${it.meaning}"?`, options:shuffle([it.kanji,...wrongs]), answer:it.kanji};
    }
    const reading = hasKun(it) ? it.kun.split('・')[0].replace('.','') : it.on.split('・')[0];
    const wrongs = sample(wrongPool.filter(x=>x.id!==it.id),3).map(x=>x.kanji);
    return {q:`Which kanji is read "${reading}"?`, options:shuffle([it.kanji,...wrongs]), answer:it.kanji};
  });
}

function buildWordBuilder(list){
  const wrap = document.createElement('div');
  let si = 0;
  function render(){
    const s = list[si];
    const chips = shuffle(s.chips.map((c,i)=>({c,i})));
    wrap.innerHTML = `<div class="sb-box">
      <div class="sb-eng">Rebuild the word: ${s.en}</div>
      <div class="sb-answer" id="wbAnswer"></div>
      <div class="sb-chips">${chips.map(ch=>`<button class="sb-chip jp" data-i="${ch.i}">${ch.c}</button>`).join(' ')}</div>
      <div class="sb-result" id="wbResult"></div>
      <div class="btn-row"><button class="btn secondary" id="wbReset">Reset</button> <button class="btn secondary" id="wbNext">Next Word →</button></div>
    </div>`;
    const answerEl = wrap.querySelector('#wbAnswer');
    const chosen = [];
    wrap.querySelectorAll('.sb-chip').forEach(btn=>{
      btn.onclick = ()=>{
        btn.classList.add('used');
        chosen.push(parseInt(btn.dataset.i,10));
        answerEl.innerHTML = chosen.map(i=>`<span class="sb-chip jp">${s.chips[i]}</span>`).join('');
        if(chosen.length === s.chips.length){
          const ok = chosen.every((v,i)=>v===i);
          if(ok){ State.puzzleSolved = true; saveState(); checkBadges(); }
          wrap.querySelector('#wbResult').innerHTML = ok
            ? `<span style="color:var(--celadon)">Correct order! ✓ (${s.reading})</span>`
            : `<span style="color:var(--vermilion)">Not quite, the correct order is <span class="jp">${s.chips.join('')}</span></span>`;
        }
      };
    });
    wrap.querySelector('#wbReset').onclick = ()=>render();
    wrap.querySelector('#wbNext').onclick = ()=>{ si = (si+1)%list.length; render(); };
  }
  render();
  return wrap;
}

const DeckState = {q:'', section:'all', reading:'all', strokes:'all', openId:null};

function deckFiltered(){
  return KANJI_POOL.filter(k=>{
    if(DeckState.section!=='all' && k.group!==DeckState.section) return false;
    if(DeckState.reading!=='all' && (DeckState.reading==='both' ? !hasKun(k) : hasKun(k))) return false;
    if(DeckState.strokes!=='all' && strokeBucket(k.strokes)!==DeckState.strokes) return false;
    if(DeckState.q){
      const needle = DeckState.q.toLowerCase();
      const hay = (k.kanji+' '+k.meaning+' '+k.on+' '+k.kun+' '+k.examples.map(e=>e.word+e.reading+e.meaning).join(' ')).toLowerCase();
      if(hay.indexOf(needle)===-1) return false;
    }
    return true;
  });
}

function deckTileHtml(k){
  return `<div class="kanji-tile${DeckState.openId===k.id?' open':''}" data-id="${k.id}">
    <div class="kt-front">

}

  el.insertAdjacentHTML('beforeend', `<p>Flip through all 103 kanji until you can name the meaning and both readings without hesitating. The deck reshuffles itself every time you open this chapter, so the order is never quite the same twice.</p>`);
  const deck = KANJI_POOL.map(x=>({jp:x.kanji, en:x.meaning+' ・ '+x.on+' ・ '+x.kun+' ('+x.section+')'}));
  el.appendChild(buildFlashcards(shuffle(deck)));
  el.insertAdjacentHTML('beforeend', noteBox('flashcards'));
}

function renderPuzzle(el){
  chapterHeader(el, 'Practice', 'Compound Word Puzzle', 'Rebuild real N5 words from their individual kanji, drawing from every group in this deck');
  el.insertAdjacentHTML('beforeend', `<p>Tap the kanji in the correct order to rebuild each word. Every single one of these is a real compound built entirely out of kanji you already own, so a correct answer here means you are starting to recognize how this whole set combines, not just each character on its own.</p>`);
  el.appendChild(buildWordBuilder(shuffle(PUZZLES)));
  el.insertAdjacentHTML('beforeend', noteBox('puzzle'));
}

function renderReview(el){
  chapterHeader(el, 'Finish', 'Review Without Looking at Your Notes');
  GROUPS.forEach(g=>{
    const items = KANJI_POOL.filter(x=>x.group===g.id);
    el.insertAdjacentHTML('beforeend', `<div class="card"><h3>${g.title}</h3><p>Can you produce the meaning and both readings for every kanji in this group from memory, ${items.map(i=>i.kanji).join(' ')}, without opening the chapter to check? If any single one hesitates, that is exactly the one worth reopening.</p></div>`);
  });
  el.insertAdjacentHTML('beforeend', `<div class="callout tip"><span class="callout-label">Teacher's Advice</span>A recap deck does its job the moment you can produce a reading without opening the page it lives on. If a whole group still feels shaky, that is useful information, not a failure, it tells you exactly where to spend the next study session before Section 13's vocabulary deck arrives.</div>`);
  el.insertAdjacentHTML('beforeend', noteBox('review'));
}

function renderDailyTest(el){
  chapterHeader(el, 'Finish', 'Lesson Final Test', 'Passing mark: 70%, drawn from all 13 taught-order groups');
  el.insertAdjacentHTML('beforeend', `<p>This test samples across every group in this deck, not just one. Take your time, and remember that the question direction rotates, some ask you to name a kanji's meaning, others ask you to pick the correct kanji for a given meaning or reading.</p>`);
  const sampled = sample(KANJI_POOL, 30);
  const data = kanjiQuestionSet(sampled, KANJI_POOL);
  el.appendChild(buildQuiz('daily-test-quiz', shuffle(data), 'daily-test', true));
}

function renderErrorLog(el){
  chapterHeader(el, 'Finish', 'Your Error Log');
  if(!State.errorLog.length){
    el.insertAdjacentHTML('beforeend', `<div class="callout"><span class="callout-label">Nothing here yet</span>Every question you miss in a quiz gets logged here automatically, so you know exactly what to review before moving on to the vocabulary deck.</div>`);
  } else {
    el.insertAdjacentHTML('beforeend', `<p>These are auto-collected from quiz misses. Review these first before moving on.</p>`);
    State.errorLog.forEach(e=>{
      el.insertAdjacentHTML('beforeend', `<div class="err-item"><b>${e.q.split('\\n')[0]}</b><br>Correct answer: ${e.correct} <span style="color:var(--text-faint)">· missed ${e.count||1}x · ${e.chapter}</span></div>`);
    });
  }
  el.insertAdjacentHTML('beforeend', `<h3>Additional Notes</h3>` + noteBox('error-log'));
}

const RENDERERS = Object.assign(
  {
    'cover': renderCover,
    'intro': renderIntro,
    'deck': renderDeck,

    'puzzle': renderPuzzle,
    'review': renderReview,

    'daily-test': renderDailyTest,
    'error-log': renderErrorLog,
    'lesson-complete': renderLessonComplete,
  },
  Object.fromEntries(GROUPS.map(g=>[g.id, (el)=>renderGroupChapter(el, g.id)]))

/* ============================================================
   7. NAVIGATION
   ============================================================ */
function buildSidebar(){
  const nav = document.getElementById('navList');
  let html = ''; let lastGroup = undefined;
  CHAPTERS.forEach(c=>{
    if(c.group !== lastGroup && c.group){
      html += `<div class="nav-group-label">${c.group}</div>`;
      lastGroup = c.group;
    }
    html += `<button class="nav-item" id="nav-${c.id}" onclick="goTo('${c.id}')"><span class="dot"></span><span class="lbl">${c.label}</span></button>`;
    if(c.id === 'daily-test'){
      html += `<a class="nav-item nav-item-support" href="../supporters.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">💛 Support</span></a>`;
      html += `<a class="nav-item" href="../jlptn5roadmap.html" style="text-decoration:none"><span class="dot"></span><span class="lbl">🗺️ Roadmap</span></a>`;
    }
  });
  nav.innerHTML = html;
}
function updateProgress(){
  const trackable = CHAPTERS.filter(c=>!c.isSupport && c.id!=='cover');
  const done = trackable.filter(c=>State.visited[c.id]).length;
  const pct = Math.round((done/trackable.length)*100);
  document.getElementById('pctLabel').textContent = pct+'%';
  document.getElementById('sideBar').style.width = pct+'%';
  CHAPTERS.forEach(c=>{
    const el = document.getElementById('nav-'+c.id);
    if(el) el.classList.toggle('done', !!State.visited[c.id]);
  });
}
function goTo(id){
  if(window.Audio_) { Audio_.queue = []; Audio_.playing = false; }
  State.current = id; State.last = id; State.visited[id] = true;
  saveState();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'chapter active'; el.id = 'chapter-'+id;
  main.appendChild(el);
  (RENDERERS[id]||function(e){e.innerHTML='<p>Coming soon.</p>';})(el);
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
  window.scrollTo({top:0, behavior:'instant'});
  updateProgress();
  checkBadges();
}
window.addEventListener('scroll', ()=>{
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h>0 ? (window.scrollY/h)*100 : 0;
  document.getElementById('readbarFill').style.width = Math.min(100,pct)+'%';
});
function checkBadges(){ BADGE_DEFS.forEach(b=>{ if(!State.badges[b.id] && b.test()){ State.badges[b.id]=true; } }); saveState(); }

/* ============================================================
   8. INIT
   ============================================================ */
applyTheme();
applyFurigana();
document.documentElement.style.setProperty('--fs-scale', State.fontScale);
buildSidebar();
goTo(State.last && CHAPTERS.find(c=>c.id===State.last) ? State.last : 'cover');
window.addEventListener('keydown', e=>{
  const idx = CHAPTERS.findIndex(c=>c.id===State.current);
  if(e.key==='ArrowRight' && idx<CHAPTERS.length-1) goTo(CHAPTERS[idx+1].id);
  if(e.key==='ArrowLeft' && idx>0) goTo(CHAPTERS[idx-1].id);
});

/* Share button: uses the native OS share sheet on mobile (and any
   desktop browser that supports it); falls back to copying the
   lesson's canonical link to the clipboard everywhere else. */
(function initShareButton(){
  const btn = document.getElementById('shareBtn');
  if(!btn) return;
  const canonicalEl = document.querySelector('link[rel="canonical"]');
  const shareUrl = (canonicalEl && canonicalEl.href) || window.location.href;
  const shareData = {
    title: document.title,
    text: 'Come learn Japanese with me — free, self-contained JLPT lessons from Hookitlingo.',
    url: shareUrl
  };
  btn.addEventListener('click', async ()=>{
    if(navigator.share){
      try{ await navigator.share(shareData); } catch(err){ /* user cancelled, nothing to do */ }
      return;
    }
    const original = btn.textContent;
    try{
      await navigator.clipboard.writeText(shareUrl);
      btn.textContent = '✓ Link copied!';
    } catch(err){
      btn.textContent = shareUrl;
    }
    setTimeout(()=>{ btn.textContent = original; }, 2200);
  });
})();

/* Drifting cherry blossom petals, purely decorative, respects prefers-reduced-motion via CSS */
(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12;
    const left = Math.random()*100;
    const dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur);
    const drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)];
    const rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();
</script>
