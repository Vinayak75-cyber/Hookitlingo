<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Your Profile | Hookitlingo</title>
<meta name="description" content="Edit your Hookitlingo community profile.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941; --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a; --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e; --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Inter",-apple-system,sans-serif; --jp:"Noto Serif JP",serif;
  --maxw:640px;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6; --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2; --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2; --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans); line-height:1.6; min-height:100vh;
  background:radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%), radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%), var(--ink);
  background-attachment:fixed;
}
h1,h2,h3{font-family:var(--serif); font-weight:600; margin:0 0 .4em;}
a{color:var(--celadon); text-decoration:none;}
button{font-family:var(--sans); cursor:pointer;}
label{font-size:.82em; font-weight:600; color:var(--text-dim); display:block; margin-bottom:6px;}

/* Petals */
.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; animation:petal-fall linear infinite;}
@keyframes petal-fall{0%{transform:translate(0,-10vh) rotate(0deg);} 100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

#topbar{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:18px 5vw 22px; max-width:1080px; margin:0 auto;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:7px 14px; font-size:.85em;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}

.wrap{position:relative; z-index:2; max-width:var(--maxw); margin:0 auto; padding:0 5vw 80px;}
.eyebrow{font-size:.75em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.wrap h1{font-size:clamp(1.6em,4vw,2.1em); margin-bottom:6px;}
.wrap .sub{color:var(--text-dim); font-size:.94em; margin-bottom:18px;}

.status-banner{
  display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:12px; margin-bottom:26px; font-size:.86em;
}
.status-banner.pending{background:var(--gold-dim); color:var(--gold); border:1px solid color-mix(in srgb, var(--gold) 40%, transparent);}
.status-banner.approved{background:var(--celadon-dim); color:var(--celadon); border:1px solid color-mix(in srgb, var(--celadon) 40%, transparent);}
.status-banner.rejected{background:var(--vermilion-dim); color:var(--vermilion); border:1px solid color-mix(in srgb, var(--vermilion) 40%, transparent);}

.form-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px;
  display:flex; flex-direction:column; gap:16px;
}
.field-group{display:flex; flex-direction:column; gap:4px;}
.field-hint{font-size:.74em; color:var(--text-faint); margin-top:2px;}
input[type=text], input[type=url], textarea{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text); font-size:.95em; font-family:var(--sans);
}
input[type=file]{
  width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text-dim); font-size:.86em; font-family:var(--sans);
}
input:focus, textarea:focus{outline:none; border-color:var(--celadon); box-shadow:0 0 0 3px color-mix(in srgb, var(--celadon) 22%, transparent);}
input:disabled{color:var(--text-faint); background:var(--surface); cursor:not-allowed; opacity:.75;}
textarea{resize:vertical; min-height:90px;}
.required-mark{color:var(--vermilion);}
.image-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.image-preview-wrap{position:relative; display:inline-block; flex-shrink:0;}
.image-preview-wrap img{display:block; width:88px; height:88px; object-fit:cover; border-radius:50%; border:2px solid var(--border);}
.image-remove-btn{
  position:absolute; top:-4px; right:-4px; width:24px; height:24px; border-radius:50%;
  background:var(--vermilion); color:#fff; border:2px solid var(--surface); font-size:.78em; line-height:1;
  display:flex; align-items:center; justify-content:center; padding:0; font-weight:700;
}
.image-remove-btn:hover{filter:brightness(1.1);}
.image-picker{flex:1; min-width:180px;}

.section-title{font-size:.72em; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); margin:8px 0 -4px;}
.links-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:520px){ .links-grid{grid-template-columns:1fr;} }

.chip-grid{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface2);
  color:var(--text-dim); font-size:.84em; font-family:var(--sans);
}
.chip:hover:not(:disabled){border-color:var(--celadon); color:var(--text);}
.chip.selected{background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%)); border-color:transparent; color:#fff; font-weight:600;}
.chip:disabled{opacity:.4; cursor:default;}

.tab-toggle{
  display:flex; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:999px;
  padding:4px; margin-bottom:22px;
}
.tab-btn{
  flex:1; padding:10px 16px; border-radius:999px; border:none; background:none; color:var(--text-dim);
  font-size:.88em; font-weight:600; font-family:var(--sans); transition:background .2s ease, color .2s ease;
}
.tab-btn.active{background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%)); color:#fff;}
.tab-btn:hover:not(.active){color:var(--text);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

.form-actions{display:flex; gap:10px; align-items:center; margin-top:6px; flex-wrap:wrap;}
.save-btn{
  padding:12px 26px; border-radius:999px; font-weight:700; font-size:.9em; color:#fff; border:none;
  background:linear-gradient(135deg,var(--celadon), color-mix(in srgb, var(--celadon) 55%, var(--gold) 45%));
}
.save-btn:hover{filter:brightness(1.06);}
.save-btn:disabled{opacity:.6; cursor:default;}
.preview-link{font-size:.85em; color:var(--text-dim); text-decoration:underline;}
.form-error{color:var(--vermilion); font-size:.85em; min-height:1.2em;}

/* ---- Progress meter ---- */
.progress-row{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
.progress-track{flex:1; height:6px; border-radius:999px; background:var(--surface2); overflow:hidden;}
.progress-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--celadon), var(--gold)); transition:width .4s ease;}
.progress-label{font-size:.78em; color:var(--text-dim); white-space:nowrap;}

/* ---- Accordion sections ---- */
.accordion{display:flex; flex-direction:column; gap:12px;}
.accordion-item{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;
}
.accordion-item.pinned{border-color:color-mix(in srgb, var(--celadon) 45%, var(--border));}
.accordion-head{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:none; border:none; padding:20px 22px; text-align:left; color:var(--text);
}
.accordion-head-text h2{font-family:var(--sans); font-size:1em; font-weight:600; margin:0 0 2px;}
.accordion-meta{font-size:.8em; color:var(--text-faint);}
.accordion-chevron{
  flex-shrink:0; width:20px; height:20px; color:var(--text-faint); transition:transform .2s ease;
}
.accordion-item.open .accordion-chevron{transform:rotate(180deg);}
.accordion-body{
  max-height:0; overflow:hidden; transition:max-height .3s ease;
}
.accordion-item.open .accordion-body{max-height:none;}
.accordion-body-inner{padding:0 22px 24px; display:flex; flex-direction:column; gap:16px;}
.accordion-item:not(.open) .accordion-body-inner{padding-bottom:0;}

/* ---- Sticky save bar ---- */
.save-bar{
  position:sticky; bottom:0; z-index:5; margin:26px -5vw 0; padding:16px 5vw;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:color-mix(in srgb, var(--ink) 88%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
}
.save-bar .form-error{flex:1; min-width:160px; margin:0;}
@media(max-width:640px){ .save-bar{margin-left:calc(-1 * 5vw); margin-right:calc(-1 * 5vw);} }

.state-msg{
  position:relative; z-index:2; max-width:480px; margin:100px auto; padding:0 5vw; text-align:center; color:var(--text-faint); font-size:.92em;
}

.toast{
  position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); z-index:90;
  background:var(--surface3); border:1px solid var(--border); color:var(--text); padding:10px 18px;
  border-radius:999px; font-size:.85em; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  box-shadow:0 10px 30px rgba(0,0,0,.3);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---- Teacher announcement section ---- */
.announcement-note{color:var(--text-dim); font-size:.86em; margin:-8px 0 4px;}
.duration-chip.selected{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%));}
.glass-preview{
  padding:26px 20px; border-radius:14px; display:flex; justify-content:center; align-items:center;
  background:radial-gradient(600px 300px at 30% 0%, color-mix(in srgb, var(--celadon) 30%, transparent), transparent 60%), var(--surface3);
  border:1px solid var(--border);
}
.glass-btn{
  display:inline-block; padding:11px 26px; border-radius:999px; font-weight:700; font-size:.88em;
  color:#fff; text-decoration:none; letter-spacing:.01em;
  background:rgba(255,255,255,0.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.4); box-shadow:0 6px 24px rgba(0,0,0,0.18);
}
.announcement-status-line{font-size:.86em; color:var(--text-dim); margin-bottom:4px;}
.announcement-status-line.live{color:var(--celadon);}
.take-down-btn{
  padding:11px 20px; border-radius:999px; font-weight:600; font-size:.87em; color:var(--vermilion);
  background:var(--vermilion-dim); border:1px solid color-mix(in srgb, var(--vermilion) 40%, transparent);
}
.take-down-btn:hover{filter:brightness(1.08);}
.take-down-btn:disabled{opacity:.6; cursor:default;}

/* Pending-approval overlay: same pattern as profile.html - the form
   renders normally underneath but blurred, with a small lock card on
   top saying it can't be edited until the first review is done. This
   is purely the visual side of it; the actual rule is enforced by
   the server refusing the save either way, so this can't be gotten
   around by hiding the overlay in dev tools. */
.pending-blur{filter:blur(14px) brightness(.55); pointer-events:none; user-select:none;}
.pending-overlay{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  padding:24px; background:rgba(18,12,20,.35);
}
.pending-card{
  max-width:340px; width:100%; text-align:center; border-radius:var(--radius);
  background:var(--surface2); border:1px solid var(--border);
  padding:28px 26px; box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.pending-icon{font-size:1.8em; margin-bottom:10px;}
.pending-card h2{font-family:var(--serif); font-weight:600; font-size:1.4em; margin:0 0 8px;}
.pending-card p{margin:0; color:var(--text-dim); font-size:.92em;}
</style>
</head>
<body>

<div class="petals" id="petals" aria-hidden="true"></div>

<div id="topbar">
  <a class="topbtn" id="backLink" href="japanese-learners.html">← Back</a>
  <button class="topbtn" id="themeBtn">☾ Dark</button>
</div>

<div class="wrap" id="pageHost">
  <div class="state-msg">Loading your profile...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// Social links share one combined cap (MAX_SOCIAL_LINKS) - unlike
// the three dedicated Website slots, there's no per-platform limit,
// just a ceiling on how many of these can be filled in at once.
// This mirrors the same limit enforced server-side in server.js, so
// this is just a friendlier heads-up, not the only line of defense.
const SOCIAL_FIELD_IDS = ['fInstagram', 'fDiscord', 'fWhatsapp', 'fTwitter', 'fFacebook', 'fTiktok', 'fYoutube', 'fTelegram', 'fLine'];
const MAX_SOCIAL_LINKS = 6;

function enforceSocialLinkLimit(){
  const fields = SOCIAL_FIELD_IDS.map(id => document.getElementById(id)).filter(Boolean);
  if(!fields.length) return;
  const filledCount = fields.filter(f => f.value.trim()).length;
  fields.forEach(f => {
    f.disabled = !f.value.trim() && filledCount >= MAX_SOCIAL_LINKS;
  });
  const hint = document.getElementById('socialLinksHint');
  if(hint){
    hint.textContent = filledCount >= MAX_SOCIAL_LINKS
      ? `You've reached the limit of ${MAX_SOCIAL_LINKS} social links.`
      : `Instagram is required. Add up to ${MAX_SOCIAL_LINKS} total (${filledCount}/${MAX_SOCIAL_LINKS} used).`;
  }
}

const ThemeState = { theme: localStorage.getItem('hkl_site_theme') || 'dark' };

// Interests & Hobbies - the pick-list itself lives only in
// server.js (INTEREST_OPTIONS) so there's one place to edit it.
// loadInterestOptions() fetches that list once at page-load and
// renderForm() builds the chip buttons from it, instead of
// hardcoding a second copy here that could silently drift out of
// sync.
let INTEREST_OPTIONS = [];
let MAX_INTERESTS = 5; // overwritten with the server's value once fetched

async function loadInterestOptions(){
  try {
    const res = await fetch('/api/interest-options');
    const data = await res.json();
    if(data && Array.isArray(data.options)) INTEREST_OPTIONS = data.options;
    if(data && typeof data.max === 'number') MAX_INTERESTS = data.max;
  } catch (err) {
    // Leave INTEREST_OPTIONS empty - interests are optional, so the
    // rest of the form still works fine even if this fetch fails;
    // the chip grid just renders with nothing in it.
  }
}

function enforceInterestLimit(){
  const chips = Array.from(document.querySelectorAll('#interestsGrid .chip'));
  if(!chips.length) return;
  const selectedCount = chips.filter(c => c.classList.contains('selected')).length;
  chips.forEach(c => {
    c.disabled = !c.classList.contains('selected') && selectedCount >= MAX_INTERESTS;
  });
  const hint = document.getElementById('interestsHint');
  if(hint){
    hint.textContent = selectedCount >= MAX_INTERESTS
      ? `You've reached the limit of ${MAX_INTERESTS} interests.`
      : `Pick up to ${MAX_INTERESTS} (${selectedCount}/${MAX_INTERESTS} used).`;
  }
}

// Photo upload - uploads straight to R2 (via POST /api/upload-image)
// the moment a file is chosen. The returned public URL is stashed
// in the hidden #fImage input, which is what saveProfile() actually
// reads - so that code didn't need to change at all, it just gets a
// real R2 URL now instead of a pasted one.
// Deletes a photo from R2, but only if it's actually a fresh upload
// from this editing session (not the one still live on the saved
// profile) - see ORIGINAL_IMAGE_URL above. Fire-and-forget: nothing
// the user is doing should wait on this, and nothing about it should
// ever surface as an error to them.
function deleteStagedImage(url){
  if(!url || url === ORIGINAL_IMAGE_URL) return;
  fetch('/api/delete-image', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  }).catch(() => {});
}

async function handleImageFileChange(){
  const fileInput = document.getElementById('fImageFile');
  const hiddenInput = document.getElementById('fImage');
  const hint = document.getElementById('imageUploadHint');
  const previewWrap = document.getElementById('imagePreviewWrap');
  const preview = document.getElementById('imagePreview');
  const file = fileInput.files[0];
  if(!file) return;

  // Picking a new file replaces whatever was staged before - if that
  // was itself a fresh upload from this session (not the original
  // saved photo), it's now orphaned, so clean it up.
  deleteStagedImage(hiddenInput.value);

  preview.src = URL.createObjectURL(file);
  previewWrap.style.display = 'inline-block';
  hiddenInput.value = '';
  hint.textContent = 'Uploading...';

  const formData = new FormData();
  formData.append('image', file);
  try {
    const res = await fetch('/api/upload-image', { method: 'POST', body: formData });
    const data = await res.json();
    if(res.ok && data.ok){
      hiddenInput.value = data.url;
      hint.textContent = 'Uploaded ✓';
    } else {
      hint.textContent = (data && data.error) ? data.error : 'Upload failed. Please try a different image.';
      previewWrap.style.display = 'none';
      fileInput.value = '';
    }
  } catch (err) {
    hint.textContent = 'Upload failed. Please try a different image.';
    previewWrap.style.display = 'none';
    fileInput.value = '';
  }
}

// The ✕ button lets someone cancel/remove a chosen or already-saved
// photo before saving - clears the file input, the hidden R2 URL, and
// the preview so the form goes back to "no photo selected". If what's
// being cleared was a fresh upload from this session, it also gets
// deleted from R2 - the original saved photo (if that's what's
// showing) is left alone, since the profile is still using it until
// something else actually gets saved over it.
function removeImage(){
  const fileInput = document.getElementById('fImageFile');
  const hiddenInput = document.getElementById('fImage');
  const previewWrap = document.getElementById('imagePreviewWrap');
  const preview = document.getElementById('imagePreview');
  const hint = document.getElementById('imageUploadHint');
  deleteStagedImage(hiddenInput.value);
  fileInput.value = '';
  hiddenInput.value = '';
  preview.src = '';
  previewWrap.style.display = 'none';
  hint.textContent = 'JPG, PNG, WEBP, or GIF, up to 5MB. Required.';
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', ThemeState.theme);
  document.getElementById('themeBtn').textContent = ThemeState.theme === 'dark' ? '☾ Dark' : '☀ Light';
}
document.getElementById('themeBtn').onclick = () => {
  ThemeState.theme = ThemeState.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('hkl_site_theme', ThemeState.theme);
  applyTheme();
};
applyTheme();

(function spawnPetals(){
  const host = document.getElementById('petals');
  if(!host) return;
  const colors = ['var(--petal)','var(--vermilion)','var(--gold)'];
  const count = window.innerWidth < 700 ? 10 : 18;
  for(let i=0;i<count;i++){
    const size = 10 + Math.random()*12, left = Math.random()*100, dur = 10 + Math.random()*12;
    const delay = -(Math.random()*dur), drift = Math.round(Math.random()*90-45)+'px';
    const fill = colors[Math.floor(Math.random()*colors.length)], rotStart = Math.round(Math.random()*360);
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s; --drift:${drift}; transform:rotate(${rotStart}deg);`;
    p.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 1c5 4.5 5 10.5 0 14-5-3.5-5-9.5 0-14Z" fill="${fill}" opacity="0.75"/></svg>`;
    host.appendChild(p);
  }
})();

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2800);
}

// Works out which directory page ("japanese-learners.html",
// "korean-teachers.html", etc.) this user's own profile belongs in,
// so the back link and preview links always point somewhere that
// actually matches their type/course instead of assuming learner.
function listingPage(course, type){
  const coursePrefix = course === 'kr' ? 'korean' : 'japanese';
  const typeSuffix = type === 'teacher' ? 'teachers' : 'learners';
  return `${coursePrefix}-${typeSuffix}.html`;
}

function statusBanner(status, id, previewHref){
  if(status === 'Approved'){
    return `<div class="status-banner approved">🌸 Your profile is live.</div>`;
  }
  if(status === 'Rejected'){
    return `<div class="status-banner rejected">Your last submission wasn't approved. Update your details below and resubmit.</div>`;
  }
  return `<div class="status-banner pending">⏳ Your profile is pending review. It'll appear on the site once approved. <a class="preview-link" href="${previewHref}">Preview →</a></div>`;
}

// The photo already saved on this profile when the page loaded.
// handleImageFileChange/removeImage check against this so they only
// ever ask R2 to delete a fresh upload from *this* editing session -
// never this original, still-live photo, even if someone clicks
// around without saving. The server is what cleans that one up,
// once a save actually replaces it (see PUT /api/profile).
let ORIGINAL_IMAGE_URL = '';

function renderForm(me){
  const p = me.profile || {};
  const links = p.links || {};
  const listing = listingPage(p.course, p.type);
  const previewHref = `profile.html?id=${encodeURIComponent(me.id)}&type=${encodeURIComponent(p.type || 'learner')}`;
  const audience = p.type === 'teacher' ? 'learners' : 'fellow learners';
  ORIGINAL_IMAGE_URL = p.imageUrl || '';

  document.getElementById('backLink').href = listing;

  document.getElementById('pageHost').innerHTML = `
    <div class="eyebrow jp">日本語 · プロフィール</div>
    <h1>Edit Your Profile</h1>
    <div class="sub">This is what ${audience} see once it's approved.</div>

// Accordion sections - purely a display convenience over the
// same fields and IDs the rest of the script already reads and
// writes. Sections that already have something filled in (or
// that hold a required field) start open; empty optional
// sections start collapsed so the page doesn't read as one long
// form. Nothing here changes what gets saved.
function initAccordions(){
  document.querySelectorAll('#profileAccordion .accordion-head').forEach(head => {
    head.onclick = () => {
      head.closest('.accordion-item').classList.toggle('open');
    };
  });
  updateInterestsMeta();
  updateSocialMeta();
  updateWebsitesMeta();
}

function updateInterestsMeta(){
  const meta = document.getElementById('interestsMeta');
  if(!meta) return;
  const count = document.querySelectorAll('#interestsGrid .chip.selected').length;
  meta.textContent = count ? `${count} selected` : 'Optional, pick up to 5';
}

function updateSocialMeta(){
  const meta = document.getElementById('socialMeta');
  if(!meta) return;
  const filled = SOCIAL_FIELD_IDS.filter(id => document.getElementById(id).value.trim()).length;
  meta.textContent = filled > 1 ? `${filled} links added` : 'Instagram is required';
}

function updateWebsitesMeta(){
  const meta = document.getElementById('websitesMeta');
  if(!meta) return;
  const count = ['fWebsite1','fWebsite2','fWebsite3'].filter(id => document.getElementById(id).value.trim()).length;
  meta.textContent = count ? `${count} of 3 added` : 'Optional, up to 3 links';
}

// Profile progress meter - a rough, purely visual sense of how
// filled-in the form is, so the page gives some feedback instead
// of feeling like an open-ended list. It doesn't gate saving or
// affect what gets sent to the server.
function updateProfileProgress(){
  const fill = document.getElementById('profileProgressFill');
  const label = document.getElementById('profileProgressLabel');
  if(!fill || !label) return;

  const weightedFields = [
    document.getElementById('fName').value.trim(),
    document.getElementById('fImage').value.trim(),
    document.getElementById('fInstagram').value.trim(),
    document.getElementById('fTagline').value.trim(),
    document.getElementById('fAbout').value.trim()
  ];
  const bonusPoints = [
    document.querySelectorAll('#interestsGrid .chip.selected').length > 0,
    SOCIAL_FIELD_IDS.filter(id => document.getElementById(id).value.trim()).length > 1,
    ['fWebsite1','fWebsite2','fWebsite3'].some(id => document.getElementById(id).value.trim())
  ];

  const core = weightedFields.filter(Boolean).length;
  const bonus = bonusPoints.filter(Boolean).length;
  const pct = Math.min(100, Math.round((core / weightedFields.length) * 80 + (bonus / bonusPoints.length) * 20));

  fill.style.width = pct + '%';
  updateInterestsMeta();
  updateSocialMeta();
  updateWebsitesMeta();

  if(pct >= 100) label.textContent = 'Profile complete';
  else if(pct >= 60) label.textContent = 'Almost there';
  else if(pct > 0) label.textContent = 'Getting started';
  else label.textContent = 'Fill in your details';
}

// Switches between the "Edit Profile" and "Create Announcement" panels
// without navigating anywhere - both panels are already rendered in
// the DOM (so nothing needs re-fetching when you switch back and
// forth), CSS just shows one and hides the other.
function bindEditTabToggle(){
  const profileBtn = document.getElementById('tabBtnProfile');
  const announcementBtn = document.getElementById('tabBtnAnnouncement');
  const profilePanel = document.getElementById('profilePanel');
  const announcementPanel = document.getElementById('announcementPanel');

  function activate(tab){
    const showAnnouncement = tab === 'announcement';
    profileBtn.classList.toggle('active', !showAnnouncement);
    announcementBtn.classList.toggle('active', showAnnouncement);
    profilePanel.classList.toggle('active', !showAnnouncement);
    announcementPanel.classList.toggle('active', showAnnouncement);
  }
  profileBtn.onclick = () => activate('profile');
  announcementBtn.onclick = () => activate('announcement');
}

// Teacher announcements - a single, temporary post a teacher can
// put up on their own listing page (japanese-teachers.html or
// korean-teachers.html). Lives in its own card below the main
// profile form since it saves via its own endpoint
// (/api/announcements), independently of "Save Changes" above.
// Only rendered at all when p.type === 'teacher'.
const ANNOUNCEMENT_DURATIONS_HOURS = [12, 18, 24, 30, 36, 42, 48];
const ANNOUNCEMENT_MAX_WORDS = 150;
let currentAnnouncement = null; // filled in by loadAnnouncement() once fetched

function announcementCardHtml(){
  return `
    <div class="form-card" id="announcementCard">
      <h2 style="margin-bottom:0;">Announcement</h2>
      <div class="announcement-note">Post one live announcement on your listing page. It disappears automatically once your chosen duration is up.</div>
      <div id="announcementStatus"></div>

      <div class="field-group">
        <label for="aImageFile">Image <span class="required-mark">*</span></label>
        <input type="file" id="aImageFile" accept="image/jpeg,image/png,image/webp,image/gif">
        <input type="hidden" id="aImage" value="">
        <div class="field-hint" id="aImageHint">JPG, PNG, WEBP, or GIF, up to 5MB. Required.</div>
        <div class="image-preview-wrap" id="aImagePreviewWrap" style="display:none;">
          <img id="aImagePreview" src="" alt="Preview">
          <button type="button" class="image-remove-btn" id="aImageRemoveBtn" title="Remove image" aria-label="Remove image">✕</button>
        </div>
      </div>

      <div class="field-group">
        <label for="aText">Announcement text <span class="required-mark">*</span></label>
        <textarea id="aText" maxlength="1500" placeholder="What do you want learners to know?"></textarea>
        <div class="field-hint" id="aTextHint">0/${ANNOUNCEMENT_MAX_WORDS} words</div>
      </div>

      <div class="links-grid">
        <div class="field-group"><label for="aButtonText">Button text <span class="required-mark">*</span></label><input type="text" id="aButtonText" maxlength="40" placeholder="e.g. Join Now"></div>
        <div class="field-group"><label for="aButtonLink">Button link <span class="required-mark">*</span></label><input type="text" id="aButtonLink" maxlength="300" placeholder="https://..."></div>
      </div>

      <div class="section-title">Duration</div>
      <div class="field-hint" style="margin:-4px 0 4px;">How long this should stay up before it disappears on its own.</div>
      <div class="chip-grid" id="aDurationGrid">
        ${ANNOUNCEMENT_DURATIONS_HOURS.map(h => `<button type="button" class="chip duration-chip" data-hours="${h}">${h}h</button>`).join('')}
      </div>

      <div class="field-group" style="margin-top:4px;">
        <label>Preview</label>
        <div class="glass-preview">
          <a href="#" id="aButtonPreview" class="glass-btn" onclick="return false;">Button text</a>
        </div>
      </div>

      <div class="form-error" id="announcementError"></div>
      <div class="form-actions">
        <button class="save-btn" id="announcementSaveBtn">Post Announcement</button>
        <button type="button" class="take-down-btn" id="announcementDeleteBtn" style="display:none;">Take Down Now</button>
      </div>
    </div>
  `;
}

function countWords(str){
  const trimmed = String(str || '').trim();
  return trimmed ? trimmed.split(/\s+/).length : 0;
}

function updateAnnouncementWordCount(){
  const hint = document.getElementById('aTextHint');
  if(!hint) return;
  const words = countWords(document.getElementById('aText').value);
  hint.textContent = `${words}/${ANNOUNCEMENT_MAX_WORDS} words`;
  hint.style.color = words > ANNOUNCEMENT_MAX_WORDS ? 'var(--vermilion)' : '';
}

function updateAnnouncementButtonPreview(){
  const preview = document.getElementById('aButtonPreview');
  if(!preview) return;
  preview.textContent = document.getElementById('aButtonText').value.trim() || 'Button text';
}

function selectedAnnouncementDuration(){
  const chip = document.querySelector('#aDurationGrid .chip.selected');
  return chip ? Number(chip.dataset.hours) : null;
}

async function handleAnnouncementImageChange(){
  const fileInput = document.getElementById('aImageFile');
  const hiddenInput = document.getElementById('aImage');
  const hint = document.getElementById('aImageHint');
  const previewWrap = document.getElementById('aImagePreviewWrap');
  const preview = document.getElementById('aImagePreview');
  const file = fileInput.files[0];
  if(!file) return;

  preview.src = URL.createObjectURL(file);
  previewWrap.style.display = 'inline-block';
  hiddenInput.value = '';
  hint.textContent = 'Uploading...';

  const formData = new FormData();
  formData.append('image', file);
  try {
    const res = await fetch('/api/upload-image', { method: 'POST', body: formData });
    const data = await res.json();
    if(res.ok && data.ok){
      hiddenInput.value = data.url;
      hint.textContent = 'Uploaded ✓';
    } else {
      hint.textContent = (data && data.error) ? data.error : 'Upload failed. Please try a different image.';
      previewWrap.style.display = 'none';
      fileInput.value = '';
    }
  } catch (err) {
    hint.textContent = 'Upload failed. Please try a different image.';
    previewWrap.style.display = 'none';
    fileInput.value = '';
  }
}

function removeAnnouncementImage(){
  document.getElementById('aImageFile').value = '';
  document.getElementById('aImage').value = '';
  document.getElementById('aImagePreview').src = '';
  document.getElementById('aImagePreviewWrap').style.display = 'none';
  document.getElementById('aImageHint').textContent = 'JPG, PNG, WEBP, or GIF, up to 5MB. Required.';
}

function formatExpiry(iso){
  try {
    return new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  } catch (err) {
    return '';
  }
}

function resetAnnouncementForm(){
  currentAnnouncement = null;
  removeAnnouncementImage();
  document.getElementById('aText').value = '';
  document.getElementById('aButtonText').value = '';
  document.getElementById('aButtonLink').value = '';
  document.querySelectorAll('#aDurationGrid .chip').forEach(c => c.classList.remove('selected'));
  document.getElementById('announcementSaveBtn').textContent = 'Post Announcement';
  document.getElementById('announcementDeleteBtn').style.display = 'none';
  document.getElementById('announcementStatus').innerHTML = '<div class="announcement-status-line">No announcement live right now.</div>';
  updateAnnouncementWordCount();
  updateAnnouncementButtonPreview();
}

async function loadAnnouncement(){
  const statusBox = document.getElementById('announcementStatus');
  if(!statusBox) return;
  try {
    const res = await fetch('/api/my-announcement', { credentials: 'include' });
    const data = await res.json();
    const a = data && data.announcement;
    if(a && !data.expired){
      currentAnnouncement = a;
      statusBox.innerHTML = `<div class="announcement-status-line live">🔔 Your announcement is live until ${escapeHtml(formatExpiry(a.expiresAt))}.</div>`;
      document.getElementById('aImage').value = a.imageUrl || '';
      document.getElementById('aImagePreview').src = a.imageUrl || '';
      document.getElementById('aImagePreviewWrap').style.display = a.imageUrl ? 'inline-block' : 'none';
      document.getElementById('aText').value = a.text || '';
      document.getElementById('aButtonText').value = a.buttonText || '';
      document.getElementById('aButtonLink').value = a.buttonLink || '';
      document.querySelectorAll('#aDurationGrid .chip').forEach(c => {
        c.classList.toggle('selected', Number(c.dataset.hours) === a.durationHours);
      });
      document.getElementById('announcementSaveBtn').textContent = 'Update Announcement';
      document.getElementById('announcementDeleteBtn').style.display = 'inline-block';
    } else {
      statusBox.innerHTML = '<div class="announcement-status-line">No announcement live right now.</div>';
      document.getElementById('announcementDeleteBtn').style.display = 'none';
    }
    updateAnnouncementWordCount();
    updateAnnouncementButtonPreview();
  } catch (err) {
    statusBox.innerHTML = '<div class="announcement-status-line">Could not load your announcement status.</div>';
  }
}

async function saveAnnouncement(){
  const btn = document.getElementById('announcementSaveBtn');
  const errorBox = document.getElementById('announcementError');
  const imageUrl = document.getElementById('aImage').value.trim();
  const text = document.getElementById('aText').value.trim();
  const buttonText = document.getElementById('aButtonText').value.trim();
  const buttonLink = document.getElementById('aButtonLink').value.trim();
  const durationHours = selectedAnnouncementDuration();

  if(document.getElementById('aImageFile').files[0] && !imageUrl){
    errorBox.textContent = 'Please wait for your image to finish uploading before posting.';
    return;
  }
  if(!imageUrl){
    errorBox.textContent = 'Please add an image for your announcement.';
    return;
  }
  if(!text){
    errorBox.textContent = 'Please add some text for your announcement.';
    return;
  }
  if(countWords(text) > ANNOUNCEMENT_MAX_WORDS){
    errorBox.textContent = `Please keep your announcement text to ${ANNOUNCEMENT_MAX_WORDS} words or fewer.`;
    return;
  }
  if(!buttonText){
    errorBox.textContent = 'Please add text for your button.';
    return;
  }
  if(!buttonLink){
    errorBox.textContent = 'Please add a link for your button.';
    return;
  }
  if(!durationHours){
    errorBox.textContent = 'Please choose how long this should stay up.';
    return;
  }

  errorBox.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Posting...';

  try {
    const res = await fetch('/api/announcements', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ imageUrl, text, buttonText, buttonLink, durationHours })
    });
    const data = await res.json();
    if(res.ok && data.ok){
      toast('Your announcement is live');
      await loadAnnouncement();
    } else if(res.status === 401){
      window.location.href = 'japanese-learners.html?login=1';
    } else {
      errorBox.textContent = (data && data.error) ? data.error : 'Something went wrong posting your announcement.';
    }
  } catch (err) {
    errorBox.textContent = 'Something went wrong posting your announcement. Please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = currentAnnouncement ? 'Update Announcement' : 'Post Announcement';
  }
}

async function deleteAnnouncement(){
  if(!confirm('Take down your announcement now?')) return;
  const btn = document.getElementById('announcementDeleteBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/announcements', { method: 'DELETE', credentials: 'include' });
    const data = await res.json();
    if(res.ok && data.ok){
      toast('Announcement taken down');
      resetAnnouncementForm();
    } else {
      toast((data && data.error) || 'Could not take down your announcement.');
    }
  } catch (err) {
    toast('Could not take down your announcement.');
  } finally {
    btn.disabled = false;
  }
}

function bindAnnouncementCard(){
  document.getElementById('announcementSaveBtn').onclick = saveAnnouncement;
  document.getElementById('announcementDeleteBtn').onclick = deleteAnnouncement;
  document.getElementById('aImageFile').addEventListener('change', handleAnnouncementImageChange);
  document.getElementById('aImageRemoveBtn').addEventListener('click', removeAnnouncementImage);
  document.getElementById('aText').addEventListener('input', updateAnnouncementWordCount);
  document.getElementById('aButtonText').addEventListener('input', updateAnnouncementButtonPreview);
  document.querySelectorAll('#aDurationGrid .chip').forEach(chip => {
    chip.onclick = () => {
      document.querySelectorAll('#aDurationGrid .chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
    };
  });
}

function escapeAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function saveProfile(){
  const saveBtn = document.getElementById('saveBtn');
  const errorBox = document.getElementById('formError');
  const name = document.getElementById('fName').value.trim();
  if(!name){
    errorBox.textContent = 'Please enter your name.';
    return;
  }
  const socialCount = SOCIAL_FIELD_IDS.filter(id => document.getElementById(id).value.trim()).length;
  if(socialCount > MAX_SOCIAL_LINKS){
    errorBox.textContent = `Please limit yourself to ${MAX_SOCIAL_LINKS} social links.`;
    return;
  }
  const selectedInterestCount = document.querySelectorAll('#interestsGrid .chip.selected').length;
  if(selectedInterestCount > MAX_INTERESTS){
    errorBox.textContent = `Please select up to ${MAX_INTERESTS} interests.`;
    return;
  }
  const imageFile = document.getElementById('fImageFile').files[0];
  if(imageFile && !document.getElementById('fImage').value.trim()){
    errorBox.textContent = 'Please wait for your photo to finish uploading (or remove it) before saving.';
    return;
  }
  if(!document.getElementById('fImage').value.trim()){
    errorBox.textContent = 'Please upload your profile picture.';
    return;
  }
  if(!document.getElementById('fInstagram').value.trim()){
    errorBox.textContent = 'Instagram is required, please add your Instagram handle.';
    return;
  }
  errorBox.textContent = '';
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';

  const payload = {
    name,
    country: document.getElementById('fCountry').value.trim(),
    tagline: document.getElementById('fTagline').value.trim(),
    about: document.getElementById('fAbout').value.trim(),
    imageUrl: document.getElementById('fImage').value.trim(),
    interests: Array.from(document.querySelectorAll('#interestsGrid .chip.selected')).map(c => c.dataset.interest),
    links: {
      instagram: document.getElementById('fInstagram').value.trim(),
      discord: document.getElementById('fDiscord').value.trim(),
      whatsapp: document.getElementById('fWhatsapp').value.trim(),
      website1: document.getElementById('fWebsite1').value.trim(),
      website1Label: document.getElementById('fWebsite1Label').value.trim(),
      website2: document.getElementById('fWebsite2').value.trim(),
      website2Label: document.getElementById('fWebsite2Label').value.trim(),
      website3: document.getElementById('fWebsite3').value.trim(),
      website3Label: document.getElementById('fWebsite3Label').value.trim(),
      twitter: document.getElementById('fTwitter').value.trim(),
      facebook: document.getElementById('fFacebook').value.trim(),
      tiktok: document.getElementById('fTiktok').value.trim(),
      youtube: document.getElementById('fYoutube').value.trim(),
      telegram: document.getElementById('fTelegram').value.trim(),
      line: document.getElementById('fLine').value.trim()
    }
  };

  try {
    const res = await fetch('/api/profile', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(res.ok && data.ok){
      toast('Your changes are saved');
      renderForm({ id: data.id, name: data.name, status: data.status, profile: data.profile });
    } else if(res.status === 401){
      window.location.href = 'japanese-learners.html?login=1';
    } else {
      errorBox.textContent = (data && data.error) ? data.error : 'Something went wrong saving your profile.';
    }
  } catch (err) {
    errorBox.textContent = 'Something went wrong saving your profile. Please try again.';
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Changes';
  }
}

async function init(){
  const pageHost = document.getElementById('pageHost');
  try {
    const [, res] = await Promise.all([loadInterestOptions(), fetch('/api/me', { credentials: 'include' })]);
    const data = await res.json();
    if(!data || !data.loggedIn){
      window.location.href = 'japanese-learners.html?login=1';
      return;
    }
    renderForm(data);
  } catch (err) {
    pageHost.innerHTML = '<div class="state-msg">Could not load your profile right now. Please try again shortly.</div>';
  }
}

init();
</script>
