<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  --maxw:880px;
  --fs-scale:1;
}

  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}
ruby rt{font-size:.6em; color:var(--text-dim); user-select:none;}
.furigana-off rt{display:none;}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}
#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}
.next-lesson-card{margin:22px 0; padding:22px; border-radius:16px; background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 10%, var(--surface2)), color-mix(in srgb, var(--gold) 14%, var(--surface2))); border:1px solid color-mix(in srgb, var(--vermilion) 25%, var(--border));}
.next-lesson-card .nlc-eyebrow{font-size:.75em; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--vermilion); margin-bottom:6px;}
.next-lesson-card .nlc-title{font-size:1.15em; font-weight:700; margin-bottom:6px;}
.next-lesson-card .nlc-desc{margin-bottom:14px; color:var(--text); opacity:.85; font-size:.95em; line-height:1.5;}
.next-lesson-card .nlc-progress{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:.85em; opacity:.75;}
.next-lesson-card .nlc-dots{display:flex; gap:5px;}
.next-lesson-card .nlc-dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
.next-lesson-card .nlc-dot.done{background:var(--vermilion);}
.btn.big{padding:13px 28px; font-size:1em;}


.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px; display:inline-block; margin:4px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-example{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin:12px 0;}
.gram-example .ge-jp{font-family:var(--jp); font-size:1.15em; margin-bottom:4px;}
.gram-example .ge-en{color:var(--text-dim); font-size:.88em;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sound-map{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;}
.sound-map .sm-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;}
.sound-map .sm-arrow{color:var(--text-faint); font-size:.85em;}
.sound-map .sm-jp{font-family:var(--jp); font-size:1.3em;}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--sans); font-style:normal; color:var(--text-faint); font-size:.72em; letter-spacing:.28em; text-transform:uppercase; margin-bottom:10px;}
.cover-brand{font-family:"Rampart One",var(--sans); font-weight:400; font-size:4.6em; line-height:1; letter-spacing:.02em; margin:0; color:var(--gold); text-shadow:0 3px 0 color-mix(in srgb, var(--vermilion) 75%, transparent), 0 8px 20px color-mix(in srgb, var(--vermilion) 40%, transparent); display:flex; justify-content:center;}
.cover-brand span{display:inline-block;}
.cover-brand span:nth-child(1){transform:rotate(-6deg) translateY(2px);}
.cover-brand span:nth-child(2){transform:rotate(3deg) translateY(-4px);}
.cover-brand span:nth-child(3){transform:rotate(-2deg) translateY(3px);}
.cover-brand span:nth-child(4){transform:rotate(5deg) translateY(-2px);}
.cover-brand span:nth-child(5){transform:rotate(-4deg) translateY(4px);}
.cover-brand span:nth-child(6){transform:rotate(2deg) translateY(-3px);}
.cover-brand-jp{font-family:var(--jp); font-weight:600; font-size:1.85em; letter-spacing:.28em; color:var(--text-dim); margin:16px 0 34px; padding-left:.28em; display:flex; justify-content:center;}
.cover-brand-jp span{display:inline-block;}
.cover-brand-jp span:nth-child(1){transform:rotate(5deg) translateY(-2px);}
.cover-brand-jp span:nth-child(2){transform:rotate(-4deg) translateY(3px);}
.cover-brand-jp span:nth-child(3){transform:rotate(3deg) translateY(-3px);}
.cover-brand-jp span:nth-child(4){transform:rotate(-5deg) translateY(2px);}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}
.sb-chip{background:var(--surface3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-family:var(--jp); font-size:1.1em;}
.sb-chip:hover{border-color:var(--vermilion);}
.sb-chip.used{opacity:.3; pointer-events:none;}
.sb-eng{color:var(--text-faint); font-size:.85em; margin-top:2px;}
.sb-result{margin-top:8px; font-size:.85em; min-height:1.2em;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}
.err-item b{font-family:var(--jp); font-size:1.1em;}

.dialogue-line{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:10px 0;}
.dialogue-line .dl-speaker{flex:none; width:88px; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.9em; padding-top:2px;}
.dialogue-line .dl-jp{flex:1; font-family:var(--jp); font-size:1.15em;}
.dialogue-line .dl-spk{margin-top:8px;}
details.passage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:16px 0;}
details.passage summary{cursor:pointer; color:var(--celadon); font-size:.85em; text-transform:uppercase; letter-spacing:.05em;}
details.passage .passage-en{margin-top:10px; color:var(--text-dim); font-size:.92em;}
.passage-jp{font-family:var(--jp); font-size:1.2em; white-space:pre-line; line-height:1.9;}
.passage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;}

.num-chart{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin:16px 0;}
.num-chart .nc-cell{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 8px; text-align:center;}
.num-chart .nc-cell.change{border-color:var(--vermilion);}
.num-chart .nc-jp{font-family:var(--jp); font-size:1.2em;}
.num-chart .nc-rom{font-size:.72em; color:var(--text-faint); margin-top:2px;}
.num-chart .nc-val{font-size:.7em; color:var(--gold); text-transform:uppercase; letter-spacing:.04em;}

n r(){const a=e[t];n.innerHTML=`\n    <div class="flashcard" id="fcCard">\n      <div class="fc-front"><div class="fc-face jp">${a.jp}</div><div class="fc-sub">${a.rom||""} - tap to flip</div></div>\n      <div class="fc-back"><div class="fc-face">${a.en||a.rom}</div><div class="fc-sub jp">${a.jp}</div></div>\n    </div>\n    <div class="flash-controls">\n      <button class="btn secondary" id="fcPrev">← Prev</button>\n      <span class="flash-counter">${t+1} / ${e.length}</span>\n      <button class="btn secondary" id="fcNext">Next →</button>\n    </div>`,n.querySelector("#fcCard").onclick=e=>{e.currentTarget.classList.toggle("flipped")},n.querySelector("#fcPrev").onclick=()=>{t=(t-1+e.length)%e.length,r()},n.querySelector("#fcNext").onclick=()=>{t=(t+1)%e.length,r()}}(),n}function buildWordBuilder(e){const n=document.createElement("div");let t=0;return function r(){const a=e[t],s=shuffle(a.chips.map((e,n)=>({c:e,i:n})));n.innerHTML=`<div class="sb-box">\n      <div class="sb-eng">Spell: ${a.en}</div>\n      <div class="sb-answer" id="wbAnswer"></div>\n      <div class="sb-chips">${s.map(e=>`<button class="sb-chip" data-i="${e.i}">${e.c}</button>`).join(" ")}</div>\n      <div class="sb-result" id="wbResult"></div>\n      <div class="btn-row"><button class="btn secondary" id="wbReset">Reset</button> <button class="btn secondary" id="wbNext">Next Word →</button></div>\n    </div>`;const o=n.querySelector("#wbAnswer"),i=[];n.querySelectorAll(".sb-chip").forEach(e=>{e.onclick=()=>{if(e.classList.add("used"),i.push(parseInt(e.dataset.i,10)),o.innerHTML=i.map(e=>`<span class="sb-chip">${a.chips[e]}</span>`).join(""),i.length===a.chips.length){const e=i.every((e,n)=>e===n);n.querySelector("#wbResult").innerHTML=e?'<span style="color:var(--celadon)">Correct order! ✓</span>':`<span style="color:var(--vermilion)">Not quite, the correct spelling is <span class="jp">${a.chips.join("")}</span></span>`}}}),n.querySelector("#wbReset").onclick=()=>r(),n.querySelector("#wbNext").onclick=()=>{t=(t+1)%e.length,r()}}(),n}const CHAPTERS=[{id:"cover",label:"Cover",group:null},{id:"intro",label:"Counting the World",group:"Foundations"},{id:"grammar-1",label:"一〜二十, The Building Blocks",group:"Grammar"},{id:"grammar-2",label:"百〜一万, Where Sounds Change",group:"Grammar"},{id:"grammar-3",label:"つ and 人, Irregular Counters",group:"Grammar"},{id:"grammar-4",label:"枚・本・個, Three More Counters",group:"Grammar"},{id:"grammar-5",label:"〜があります・〜がいます",group:"Grammar"},{id:"kanji-1",label:"Kanji 一・二・三・四・五・六・七",group:"Kanji"},{id:"kanji-2",label:"Kanji 八・九・十・百・千・万・円",group:"Kanji"},{id:"vocab-pets",label:"Pets & Companion Animals",group:"Vocabulary"},{id:"vocab-animals",label:"Farm & Wild Animals",group:"Vocabulary"},{id:"vocab-money",label:"Money & Prices",group:"Vocabulary"},{id:"vocab-shopping",label:"Shopping Words & Questions",group:"Vocabulary"},{id:"full-review",label:"Full Chart Flashcards",group:"Mastery"},{id:"reading",label:"Reading: How Many, How Much",group:"Mastery"},{id:"listening",label:"Listening: At the Shop",group:"Mastery"},{id:"review",label:"Review",group:"Finish"},{id:"homework",label:"Homework",group:"Finish"},{id:"daily-test",label:"Lesson Final Test",group:"Finish"},{id:"lesson-complete",label:"Lesson Complete",group:"Finish"}];function renderCover(e){e.innerHTML='\n  <div class="cover">\n    <div class="presents">presents</div>\n    <div class="cover-brand"><span>K</span><span>A</span><span>I</span><span>D</span><span>A</span><span>N</span></div>\n    <div class="cover-brand-jp jp"><span>か</span><span>い</span><span>だ</span><span>ん</span></div>\n    <h1>Numbers & Counting</h1>\n    <div class="sub">Numbers from one all the way to ten thousand, the sound changes hiding inside hundreds and thousands, five counters you will use in nearly every sentence from here on, and how to say what exists with があります and がいます, plus the next fourteen N5 kanji and around forty-eight new words for animals, pets, and money.</div>\n    <div class="cover-stats">\n      <div><b>5</b><span>Grammar Points</span></div>\n      <div><b>14</b><span>New Kanji</span></div>\n      <div><b>48</b><span>New Vocabulary</span></div>\n      <div><b>5</b><span>Reading Passages</span></div>\n      <div><b>0</b><span>Romaji Crutches In The Final Test</span></div>\n    </div>\n    <button class="btn" onclick="goTo(\'intro\')">Begin Lesson →</button>\n  </div>'}function renderIntro(e){chapterHeader(e,"Warm-up","Counting the World","Moving from naming things to counting them and saying where they are"),e.insertAdjacentHTML("beforeend",'\n  <p>Sections 2 and 3 taught you how to name people and things. Section 4 teaches you how to count them and say whether they even exist in the first place. By the end of this lesson you will be able to say how many pencils are on a desk, how many students are in a room, how much something costs down to the yen, and whether a shop even has the thing you are looking for.</p>\n  <p>Numbers 1 through 10 already showed up back in Section 2 in spoken form only. This lesson finally hands you the kanji that go with them, and then keeps building, past twenty, past a hundred, all the way to ten thousand, using nothing but the same ten building blocks combined in new ways. On top of that, you will meet five small counting words, つ, 人, 枚, 本, and 個, each one attaching to a different kind of thing, and two new verbs, あります and います, that finally let you say what is actually in a room.</p>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>Do not try to memorize every sound change in this lesson in one sitting. Learn the plain, regular pattern first for each counter, then come back a second time just for the exceptions, さんびゃく, ろっぴゃく, はっぴゃく, and the handful of others. Almost every learner finds the exceptions stick far better once the regular pattern is already solid underneath them.</div>\n  <p>You will also meet all fourteen number kanji this lesson, one through ten, then 百, 千, 万, and 円, the currency kanji that almost every one of these numbers ends up attached to sooner or later in real life. That makes this the single densest kanji lesson in the entire N5 roadmap, and also one of the most immediately useful, since numbers show up in nearly every conversation from here on.</p>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>The reading passages later in this lesson only ever count things using the exact counters taught in this lesson, つ, 人, 枚, and 本, nothing borrowed from later lessons. A few counters you will eventually want, like 匹 for small animals, get their own proper treatment further down the roadmap, so this lesson quietly steers around counting animals by number and sticks to simply saying whether they exist.</div>\n  '),e.insertAdjacentHTML("beforeend",noteBox("intro"))}function renderGrammar1(e){chapterHeader(e,"Grammar 1 of 5","一 to 二十, The Building Blocks","A tiny set of ten digits that assembles into every number that follows"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>一 through 十, the ten building blocks</h3>\n    <div class="gsub">Every Japanese number, no matter how large, is built from these ten shapes.</div>\n    <div>${gramChip("一","いち, 1")}${gramChip("二","に, 2")}${gramChip("三","さん, 3")}${gramChip("四","よん, 4")}${gramChip("五","ご, 5")}${gramChip("六","ろく, 6")}${gramChip("七","なな, 7")}${gramChip("八","はち, 8")}${gramChip("九","きゅう, 9")}${gramChip("十","じゅう, 10")}</div>\n    ${gramExample("一、二、三、四、五。","One, two, three, four, five.","<ruby>一<rt>いち</rt></ruby>、<ruby>二<rt>に</rt></ruby>、<ruby>三<rt>さん</rt></ruby>、<ruby>四<rt>よん</rt></ruby>、<ruby>五<rt>ご</rt></ruby>。")}\n    <p>Two of these digits carry a second common reading worth knowing early: 四 can be read よん or し, and 九 can be read きゅう or く. This course leads with よん and きゅう, the safer default in most modern speech, but し and く still show up constantly in fixed words, 四月 (しがつ, April) and 九月 (くがつ, September) among them. 七 works the same way, なな is the default here, しち shows up in 七月 (しちがつ, July).</p>\n  </div>\n  <div class="callout warn"><span class="callout-label">Common Mistake</span>Mixing よん and し, or きゅう and く, mid-sentence trips up nearly every beginner at some point. The safe rule while this course is still new to you: default to よん and きゅう whenever you are counting or attaching a counter, and only reach for し or く when a specific memorized word calls for it, such as 四月 or 九月.</div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>十一 through 十九, ten plus a digit</h3>\n    <div class="gsub">Eleven through nineteen need no new vocabulary at all, just 十 followed by the ones digit.</div>\n    ${gramExample("十一",'eleven, literally "ten one"',"<ruby>十<rt>じゅう</rt></ruby><ruby>一<rt>いち</rt></ruby>")}\n    ${gramExample("十五",'fifteen, literally "ten five"',"<ruby>十<rt>じゅう</rt></ruby><ruby>五<rt>ご</rt></ruby>")}\n    ${gramExample("十九",'nineteen, literally "ten nine"',"<ruby>十<rt>じゅう</rt></ruby><ruby>九<rt>きゅう</rt></ruby>")}\n    <p>Every number from eleven to nineteen is simply 十 followed directly by whatever ones digit comes next, ten-one, ten-two, all the way to ten-nine. English secretly does something similar, "thirteen" is really just "three" and "ten" stitched together in reverse order, but Japanese keeps that exact order every single time and never breaks the pattern with an irregular word the way English does with eleven and twelve.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>二十 through 九十, counting by tens</h3>\n    <div class="gsub">Twenty through ninety flip the order from the teens: digit first, then 十.</div>\n    ${gramExample("二十",'twenty, literally "two ten"',"<ruby>二<rt>に</rt></ruby><ruby>十<rt>じゅう</rt></ruby>")}\n    ${gramExample("二十五",'twenty-five, literally "two ten five"',"<ruby>二<rt>に</rt></ruby><ruby>十<rt>じゅう</rt></ruby><ruby>五<rt>ご</rt></ruby>")}\n    ${gramExample("九十九",'ninety-nine, literally "nine ten nine"',"<ruby>九<rt>きゅう</rt></ruby><ruby>十<rt>じゅう</rt></ruby><ruby>九<rt>きゅう</rt></ruby>")}\n    <p>Multiples of ten flip the order the teens used, the digit now comes first, then 十, then, if there is one, the ones digit tacked directly onto the end, exactly like the teens did. Once tens and teens both feel automatic, any two-digit number becomes pure assembly, no new vocabulary needed past what is already in this chapter.</p>\n  </div>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>Japanese never treats round decades as if they need a brand-new word the way "twenty" can sometimes feel separate from "two" in English. 二十一 is exactly as transparent as 十一 is, tens plus a digit plus a digit, all the way up. This regularity is a big part of why Japanese numbers up to ninety-nine are usually easier for learners than English numbers are, once the ten building blocks above are solid.</div>\n  <h3>Quick Check</h3>\n  `);const n=[{q:'Which kanji number means "fifteen"?',isJp:!0,options:shuffle(["十五","十四","五十","十九"]),answer:"十五"},{q:'Which kanji number means "twenty-five"?',isJp:!0,options:shuffle(["二十五","五十二","二十四","十二五"]),answer:"二十五"},{q:"How is 十一 built, in plain terms?",options:shuffle(["Ten plus one","One plus ten in reverse order","A completely separate word","Ten multiplied by one"]),answer:"Ten plus one"},{q:"Which reading of 四 is the safer default when counting?",options:shuffle(["よん","し","Both are equally safe","Neither is used for counting"]),answer:"よん"},{q:"九十九 means:",options:shuffle(["Ninety-nine","Nine hundred nine","Nineteen","Ninety"]),answer:"Ninety-nine"}];e.appendChild(buildQuiz("grammar-1-quiz",shuffle(n),"grammar-1")),e.insertAdjacentHTML("beforeend",noteBox("grammar-1"))}function renderGrammar2(e){chapterHeader(e,"Grammar 2 of 5","百 to 一万, Where the Sounds Start Changing","Three new counting words, and the handful of digits that reshape themselves next to them"),e.insertAdjacentHTML("beforeend",`\n  <p>Past ninety-nine, three new counting words take over, 百 for hundred, 千 for thousand, and 万 for ten thousand. This is exactly where a handful of digits quietly change their sound for smoother pronunciation, a pattern worth learning on purpose rather than picking up by accident later.</p>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>百, hundreds, with three sound changes</h3>\n    <div class="gsub">Hyaku, hundred. Three of the nine hundreds shift sound for easier pronunciation.</div>\n    <div class="num-chart">\n      ${numCell("百","hyaku","100")}${numCell("二百","nihyaku","200")}${numCell("三百","sanbyaku","300",!0)}${numCell("四百","yonhyaku","400")}${numCell("五百","gohyaku","500")}${numCell("六百","roppyaku","600",!0)}${numCell("七百","nanahyaku","700")}${numCell("八百","happyaku","800",!0)}${numCell("九百","kyuuhyaku","900")}\n    </div>\n    ${gramExample("三百円","300 yen, さんびゃくえん, never さんひゃくえん","<ruby>三<rt>さん</rt></ruby><ruby>百<rt>びゃく</rt></ruby><ruby>円<rt>えん</rt></ruby>")}\n    ${gramExample("六百円","600 yen, ろっぴゃくえん","<ruby>六<rt>ろっ</rt></ruby><ruby>百<rt>ぴゃく</rt></ruby><ruby>円<rt>えん</rt></ruby>")}\n    ${gramExample("八百円","800 yen, はっぴゃくえん","<ruby>八<rt>はっ</rt></ruby><ruby>百<rt>ぴゃく</rt></ruby><ruby>円<rt>えん</rt></ruby>")}\n    <p>Three hundred, six hundred, and eight hundred each reshape 百 for smoother pronunciation, さんびゃく, ろっぴゃく, and はっぴゃく. Every other hundred stays perfectly predictable, just the digit plus ひゃく.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>千, thousands, with two sound changes</h3>\n    <div class="gsub">Sen, thousand. Only two of the nine thousands shift sound.</div>\n    <div class="num-chart">\n      ${numCell("千","sen","1,000")}${numCell("二千","nisen","2,000")}${numCell("三千","sanzen","3,000",!0)}${numCell("四千","yonsen","4,000")}${numCell("五千","gosen","5,000")}${numCell("六千","rokusen","6,000")}${numCell("七千","nanasen","7,000")}${numCell("八千","hassen","8,000",!0)}${numCell("九千","kyuusen","9,000")}\n    </div>\n    ${gramExample("三千円","3000 yen, さんぜんえん","<ruby>三<rt>さん</rt></ruby><ruby>千<rt>ぜん</rt></ruby><ruby>円<rt>えん</rt></ruby>")}\n    ${gramExample("八千円","8000 yen, はっせんえん","<ruby>八<rt>はっ</rt></ruby><ruby>千<rt>せん</rt></ruby><ruby>円<rt>えん</rt></ruby>")}\n    <p>Only two thousands shift sound, 三千 becomes さんぜん and 八千 becomes はっせん, everything else stays the plain digit plus せん.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>万, ten thousand, the unit Japanese actually counts in</h3>\n    <div class="gsub">Where Japanese resets its counting unit, and it is not at one thousand.</div>\n    <div>${gramChip("一万","いちまん, 10,000")}${gramChip("十万","じゅうまん, 100,000")}${gramChip("百万","ひゃくまん, 1,000,000")}</div>\n    <p>English resets its counting words every thousand, thousand, then million. Japanese resets every ten thousand instead, 万. One hundred thousand is not a brand-new word, it is 十万, ten times ten-thousand, and one million is 百万, a hundred times ten-thousand. This single difference is exactly why large numbers can feel awkward to translate on the fly between the two languages, the units simply do not line up.</p>\n  </div>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>Price tags and receipts across Japan lean on this 万 unit constantly. A price of 15,800円 gets read aloud in full as 一万五千八百円, いちまんごせんはっぴゃくえん, one ten-thousand, five thousand, eight hundred. It looks like a mouthful written out, but native speakers process it as three or four small chunks in a row, not one long number.</div>\n  <h3>Quick Check</h3>\n  `);const n=[{q:"How is 三百 correctly read?",isJp:!0,options:shuffle(["さんびゃく","さんひゃく","さんぴゃく","みひゃく"]),answer:"さんびゃく"},{q:"How is 六百 correctly read?",isJp:!0,options:shuffle(["ろっぴゃく","ろくひゃく","ろくびゃく","ろっひゃく"]),answer:"ろっぴゃく"},{q:"How is 八百 correctly read?",isJp:!0,options:shuffle(["はっぴゃく","はちひゃく","はちびゃく","はっひゃく"]),answer:"はっぴゃく"},{q:"How is 三千 correctly read?",isJp:!0,options:shuffle(["さんぜん","さんせん","みせん","さんてん"]),answer:"さんぜん"},{q:"100,000 (one hundred thousand) is built as:",options:shuffle(["十万, ten times ten-thousand","百千, hundred times thousand","千万, thousand times ten-thousand",'A completely separate word, like English "hundred thousand"']),answer:"十万, ten times ten-thousand"}];e.appendChild(buildQuiz("grammar-2-quiz",shuffle(n),"grammar-2")),e.insertAdjacentHTML("beforeend",noteBox("grammar-2"))}function renderGrammar3(e){chapterHeader(e,"Grammar 3 of 5","つ and 人, The Two Irregular Counters","A generic all-purpose counter, and the counter for people"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>つ, the generic counter, one through nine</h3>\n    <div class="gsub">Used for almost any small object that does not have a more specific counter of its own.</div>\n    <div class="num-chart">\n      ${numCell("一つ","hitotsu","1")}${numCell("二つ","futatsu","2")}${numCell("三つ","mittsu","3")}${numCell("四つ","yottsu","4")}${numCell("五つ","itsutsu","5")}${numCell("六つ","muttsu","6")}${numCell("七つ","nanatsu","7")}${numCell("八つ","yattsu","8")}${numCell("九つ","kokonotsu","9")}${numCell("十","too","10")}\n    </div>\n    ${gramExample("りんごが 三つ あります。","There are three apples.","りんごが <ruby>三<rt>みっ</rt></ruby>つ あります。")}\n    <p>This entire set of ten readings is irregular and simply has to be memorized on its own, they do not reuse the いち、に、さん readings from the earlier chapter at all. Notice that 10 breaks the pattern completely, it is just とお, not じゅうつ, and past ten this counter is not used at all, bigger quantities switch to plain numbers plus じゅう, にじゅう, and so on with no つ attached.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>人, the counter for people</h3>\n    <div class="gsub">One and two are irregular, everything else is the plain number plus にん.</div>\n    <div class="num-chart">\n      ${numCell("一人","hitori","1",!0)}${numCell("二人","futari","2",!0)}${numCell("三人","sannin","3")}${numCell("四人","yonin","4",!0)}${numCell("五人","gonin","5")}${numCell("六人","rokunin","6")}${numCell("七人","nananin","7")}${numCell("八人","hachinin","8")}${numCell("九人","kyuunin","9")}${numCell("十人","juunin","10")}\n    </div>\n    ${gramExample("学生が 三人 います。","There are three students.","<ruby>学生<rt>がくせい</rt></ruby>が <ruby>三<rt>さん</rt></ruby><ruby>人<rt>にん</rt></ruby> います。")}\n    <p>一人 and 二人 are fully irregular, ひとり and ふたり, and both are worth memorizing as whole words rather than pieces. From three onward the pattern regularizes to number plus にん, with one quiet exception: four people is 四人, よにん, not よんにん, the ん from よん simply gets dropped.</p>\n  </div>\n  <div class="callout warn"><span class="callout-label">Common Mistake</span>よんにん for four people is one of the single most common counter mistakes beginners make, since every other number in this set just tacks にん straight onto the number you already know. Four people is simply 四人, よにん, memorize that one exception on its own.</div>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>Lost the exact counter for something? つ works as a safe emergency fallback for almost any physical object up to nine, apples, chairs, bags, small boxes. It sounds slightly less precise than the exact counter, but native speakers understand it instantly and it is never actually wrong.</div>\n  <h3>Quick Check</h3>\n  `);const n=[{q:'How do you count "three apples" using the generic counter?',isJp:!0,options:shuffle(["りんごが 三つ あります。","りんごが 三人 います。","りんごが 三本 あります。","りんごが 三個です あります。"]),answer:"りんごが 三つ あります。"},{q:'What is the correct reading for "one person"?',isJp:!0,options:shuffle(["ひとり","いちにん","いちじん","ひとつ"]),answer:"ひとり"},{q:'What is the correct reading for "four people"?',isJp:!0,options:shuffle(["よにん","よんにん","しにん","よったり"]),answer:"よにん"},{q:"Which number, using つ, is completely irregular and does not sound like とお when written differently?",options:shuffle(["十, とお","九つ, ここのつ","五つ, いつつ","三つ, みっつ"]),answer:"十, とお"},{q:"If you forget the exact counter for a small object, which counter is the safest fallback?",options:shuffle(["つ","人","枚","本"]),answer:"つ"}];e.appendChild(buildQuiz("grammar-3-quiz",shuffle(n),"grammar-3")),e.insertAdjacentHTML("beforeend",noteBox("grammar-3"))}function renderGrammar4(e){chapterHeader(e,"Grammar 4 of 5","枚・本・個, Three More Counters","Flat things, long things, and small compact things, each with its own word"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>枚, flat, thin objects</h3>\n    <div class="gsub">Paper, tickets, shirts, plates, anything you could slide under a door. Fully regular.</div>\n    <div class="num-chart">\n      ${numCell("一枚","ichimai","1")}${numCell("二枚","nimai","2")}${numCell("三枚","sanmai","3")}${numCell("四枚","yonmai","4")}${numCell("五枚","gomai","5")}${numCell("六枚","rokumai","6")}${numCell("七枚","nanamai","7")}${numCell("八枚","hachimai","8")}${numCell("九枚","kyuumai","9")}${numCell("十枚","juumai","10")}\n    </div>\n    ${gramExample("かみが 十枚 あります。","There are ten sheets of paper.","かみが <ruby>十<rt>じゅう</rt></ruby><ruby>枚<rt>まい</rt></ruby> あります。")}\n    <p>枚 is the easiest of the three counters in this chapter, the plain number simply attaches to まい every time, no sound changes at all to memorize.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>本, long, thin, cylindrical objects</h3>\n    <div class="gsub">Pencils, bottles, trees, even movies and phone calls. Four sound changes to learn.</div>\n    <div class="num-chart">\n      ${numCell("一本","ippon","1",!0)}${numCell("二本","nihon","2")}${numCell("三本","sanbon","3",!0)}${numCell("四本","yonhon","4")}${numCell("五本","gohon","5")}${numCell("六本","roppon","6",!0)}${numCell("七本","nanahon","7")}${numCell("八本","happon","8",!0)}${numCell("九本","kyuuhon","9")}${numCell("十本","juppon","10",!0)}\n    </div>\n    ${gramExample("えんぴつが 五本 あります。","There are five pencils.","えんぴつが <ruby>五<rt>ご</rt></ruby><ruby>本<rt>ほん</rt></ruby> あります。")}\n    <p>本 reshapes for one, three, six, eight, and ten, いっぽん, さんぼん, ろっぽん, はっぽん, and じゅっぽん. Notice a small pattern: 三本 softens to a b-sound, ぼん, while the others harden into a p-sound, ぽん, right after a small つ. This is one of the most classically tricky N5 counters, and it is worth drilling out loud on its own.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>個, small, compact objects</h3>\n    <div class="gsub">Apples, eggs, boxes, anything roughly round or cube-shaped that does not have a more specific counter.</div>\n    <div class="num-chart">\n      ${numCell("一個","ikko","1",!0)}${numCell("二個","niko","2")}${numCell("三個","sanko","3")}${numCell("四個","yonko","4")}${numCell("五個","goko","5")}${numCell("六個","rokko","6",!0)}${numCell("七個","nanako","7")}${numCell("八個","hakko","8",!0)}${numCell("九個","kyuuko","9")}${numCell("十個","jukko","10",!0)}\n    </div>\n    ${gramExample("たまごが 六個 あります。","There are six eggs.","たまごが <ruby>六<rt>ろっ</rt></ruby><ruby>個<rt>こ</rt></ruby> あります。")}\n    <p>個 changes sound at one, six, eight, and ten, いっこ, ろっこ, はっこ, and じゅっこ, the same small つ doubling the consonant that follows it. 個 heavily overlaps with つ in everyday use, apples and eggs can be counted either way, but 個 is the more common choice once you are actually shopping or cooking.</p>\n  </div>\n  <div class="callout warn"><span class="callout-label">Common Mistake</span>All three sound-change counters in this lesson, 本, 個, and the hundreds and thousands from the last chapter, follow a loose family resemblance: one, six, eight, and sometimes three or ten tend to be the numbers that shift. Do not try to derive the exact change from a rule on the fly, memorize each chart above the way it is written and the pattern will click into place on its own over time.</div>\n  <h3>Quick Check</h3>\n  `);const n=[{q:'How do you count "five pencils" with the correct counter?',isJp:!0,options:shuffle(["えんぴつが 五本です あります。","えんぴつが 五本 あります。","えんぴつが 五枚 あります。","えんぴつが 五つ あります。"]),answer:"えんぴつが 五本 あります。"},{q:"What is the correct reading for 一本?",isJp:!0,options:shuffle(["いっぽん","いちほん","いちぼん","ひとほん"]),answer:"いっぽん"},{q:"What is the correct reading for 六個?",isJp:!0,options:shuffle(["ろっこ","ろくこ","ろくご","むっこ"]),answer:"ろっこ"},{q:"Which counter is used for flat, thin objects like paper or tickets?",options:shuffle(["枚","本","個","人"]),answer:"枚"},{q:"Which counter never changes sound, no matter which digit comes before it?",options:shuffle(["枚","本","個","十本"]),answer:"枚"}];e.appendChild(buildQuiz("grammar-4-quiz",shuffle(n),"grammar-4")),e.insertAdjacentHTML("beforeend",noteBox("grammar-4"))}function renderGrammar5(e){chapterHeader(e,"Grammar 5 of 5","〜があります and 〜がいます","Saying what exists, split cleanly between things and living things"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>Xが あります, for things</h3>\n    <div class="gsub">Existence for anything that is not alive, objects, plants, buildings.</div>\n    <div>${gramChip("X","the thing")}${gramChip("が","subject marker",!0)}${gramChip("あります","exists")}</div>\n    ${gramExample("つくえの上に 本が あります。","There is a book on the desk.","つくえの<ruby>上<rt>うえ</rt></ruby>に <ruby>本<rt>ほん</rt></ruby>が あります。")}\n    ${gramExample("かみが 十枚 あります。","There are ten sheets of paper.","かみが <ruby>十<rt>じゅう</rt></ruby><ruby>枚<rt>まい</rt></ruby> あります。")}\n    ${gramExample("えんぴつは ありません。","There is no pencil.")}\n    <p>あります covers anything without a heartbeat, books, desks, money, buildings, even plants and trees. The negative simply swaps です-style logic for ありません, no sound changes, no exceptions.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>Xが います, for living, moving things</h3>\n    <div class="gsub">Existence for people and animals, anything that can walk, fly, or swim on its own.</div>\n    <div>${gramChip("X","the person / animal")}${gramChip("が","subject marker",!0)}${gramChip("います","exists")}</div>\n    ${gramExample("教室に 学生が います。","There are students in the classroom.","<ruby>教室<rt>きょうしつ</rt></ruby>に <ruby>学生<rt>がくせい</rt></ruby>が います。")}\n    ${gramExample("あそこに 猫が います。","There is a cat over there.","あそこに <ruby>猫<rt>ねこ</rt></ruby>が います。")}\n    ${gramExample("犬は いません。","There is no dog.","<ruby>犬<rt>いぬ</rt></ruby>は いません。")}\n    <p>います covers people and animals, and only people and animals, for N5 purposes this split is completely reliable. The negative works exactly like あります did, います simply becomes いません.</p>\n  </div>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>When answering a "what is there" question, reach for が, not は. が marks brand-new information being introduced into the conversation for the first time, exactly the situation you are in the moment you announce that something exists. は comes back once that thing is already the established topic being discussed further.</div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>Asking what exists, and how many</h3>\n    <div class="gsub">何が, いくつ, and 何人 turn this pattern into a real question.</div>\n    ${gramExample("きょうしつに 何が ありますか。","What is in the classroom?","きょうしつに <ruby>何<rt>なに</rt></ruby>が ありますか。")}\n    ${gramExample("つくえは いくつ ありますか。","How many desks are there?")}\n    ${gramExample("学生は 何人 いますか。","How many students are there?","<ruby>学生<rt>がくせい</rt></ruby>は <ruby>何<rt>なん</rt></ruby><ruby>人<rt>にん</rt></ruby> いますか。")}\n    <p>何が asks what exists in the first place, いくつ asks how many using the generic counter from this lesson, and 何人 asks how many people specifically, swapping in whichever counter actually fits the thing being asked about, 何本, 何枚, and so on.</p>\n  </div>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>A small handful of set expressions bend this rule for stylistic reasons, a company can be described with あります even though it is obviously run by people, since the sentence is really about the institution existing, not the people inside it. Do not worry about these exceptions yet, for everything this course tests you on, animate uses います and inanimate uses あります, no exceptions.</div>\n  <h3>Quick Check</h3>\n  `);const n=[{q:'つくえの上に 本が ＿。 (fill the blank, "There is a book on the desk.")',isJp:!0,options:shuffle(["あります","います","です","あった"]),answer:"あります"},{q:'教室に 学生が ＿。 (fill the blank, "There are students in the classroom.")',isJp:!0,options:shuffle(["います","あります","いる","でした"]),answer:"います"},{q:"Which verb pairs with living, moving things like people and animals?",options:shuffle(["います","あります","です","ありません"]),answer:"います"},{q:"犬は いません。 means:",options:shuffle(["There is no dog.","There is a dog.","Is there a dog?","The dog is here."]),answer:"There is no dog."},{q:"Why does 何が ありますか use が instead of は?",options:shuffle(["が introduces brand-new information being asked about","は is grammatically incorrect in questions","が only works with animals","There is no real difference between the two"]),answer:"が introduces brand-new information being asked about"}];e.appendChild(buildQuiz("grammar-5-quiz",shuffle(n),"grammar-5")),e.insertAdjacentHTML("beforeend",noteBox("grammar-5"))}function renderKanji1(e){chapterHeader(e,"Kanji 1 of 2","Kanji: 一・二・三・四・五・六・七","The first seven numbers, from one to seven"),e.insertAdjacentHTML("beforeend","<p>Fourteen kanji show up in this lesson, more than any other single lesson in the entire roadmap, but they are also some of the most forgiving to learn, since most of them are built from a small handful of simple strokes. This first set covers one through seven. Each kanji below comes with its readings, its meaning, a memory hook, and real compound words, several of which reuse kanji you already know from Sections 2 and 3.</p>"),e.insertAdjacentHTML("beforeend",kanjiTileGrid(KANJI_SET_1)),e.insertAdjacentHTML("beforeend","<h3>Kanji Details</h3>"+kanjiDetails(KANJI_SET_1)),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const n=KANJI_SET_1.map(e=>{const n=sample(ALL_KANJI.filter(n=>n.ch!==e.ch),3).map(e=>e.meaning);return{q:e.ch,isJp:!0,options:shuffle([e.meaning,...n]),answer:e.meaning}});e.appendChild(buildQuiz("kanji-1-quiz",shuffle(n),"kanji-1")),e.insertAdjacentHTML("beforeend",noteBox("kanji-1"))}function renderKanji2(e){chapterHeader(e,"Kanji 2 of 2","Kanji: 八・九・十・百・千・万・円","The second half, eight through ten, then the three big counting words and yen"),e.insertAdjacentHTML("beforeend",'<div class="callout fact"><span class="callout-label">Fun Fact</span>百, 千, and 万 are the exact three kanji that decide how any large Japanese number gets chunked apart, and 円 is the kanji that follows almost all of them the moment a number turns into a price. Learn these seven well and you can already read most price tags in Japan.</div>'),e.insertAdjacentHTML("beforeend",kanjiTileGrid(KANJI_SET_2)),e.insertAdjacentHTML("beforeend","<h3>Kanji Details</h3>"+kanjiDetails(KANJI_SET_2)),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const n=KANJI_SET_2.map(e=>{const n=sample(ALL_KANJI.filter(n=>n.ch!==e.ch),3).map(e=>e.meaning);return{q:e.ch,isJp:!0,options:shuffle([e.meaning,...n]),answer:e.meaning}});e.appendChild(buildQuiz("kanji-2-quiz",shuffle(n),"kanji-2")),e.insertAdjacentHTML("beforeend",noteBox("kanji-2"))}function renderVocabChapter(e,n,t,r,a,s,o,i){chapterHeader(e,n,t,r),e.insertAdjacentHTML("beforeend",`<p>${a}</p>`),e.insertAdjacentHTML("beforeend",wordCards(s)),i&&e.insertAdjacentHTML("beforeend",i),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const l=s.map(e=>{const n=sample(s.filter(n=>n.jp!==e.jp),3).map(e=>e.en);return{q:e.jp,isJp:!0,options:shuffle([e.en,...n]),answer:e.en}});e.appendChild(buildQuiz(o+"-quiz",shuffle(l),o)),e.insertAdjacentHTML("beforeend",noteBox(o))}function renderVocabPets(e){renderVocabChapter(e,"Vocabulary 1 of 4","Pets & Companion Animals","12 words for the animals people actually keep at home","動物 combines with 園 to build 動物園, zoo, a word you will see again once this lesson’s reading passages take you there. Everything else here is exactly the kind of vocabulary that pairs naturally with 〜が います, since every single one of these is alive.",VOCAB_PETS,"vocab-pets",'<div class="callout tip"><span class="callout-label">Teacher Tip</span>Try building a full sentence for three animals here using います, "うちに 猫が います," at my house there is a cat. Attaching a real sentence pattern to a new word is one of the fastest ways to make it stick.</div>')}function renderVocabAnimals(e){renderVocabChapter(e,"Vocabulary 2 of 4","Farm & Wild Animals","12 animals you are more likely to meet at a farm or a zoo than in someone’s living room","Notice that none of these twelve words use kanji, animal names in everyday Japanese lean heavily on kana even when a kanji technically exists, since many of these kanji are considered too advanced for daily use and get skipped even by native speakers.",VOCAB_ANIMALS,"vocab-animals",null)}function renderVocabMoney(e){renderVocabChapter(e,"Vocabulary 3 of 4","Money & Prices","12 words for talking about cost, cash, and value","円, the kanji for yen, is one of the fourteen you just learned this lesson, and it is about to show up constantly for the rest of this course. 高い and 安い are technically full adjectives, expensive and cheap, and get their complete grammatical treatment in Section 6, for now just learn them as vocabulary you can recognize on sight.",VOCAB_MONEY,"vocab-money",'<div class="callout fact"><span class="callout-label">Fun Fact</span>Japan still relies heavily on physical 現金, cash, for smaller everyday purchases, far more than many other developed countries, even though カード, card payment, has grown quickly in recent years. Carrying coins for small change, おつり, remains completely normal daily life.</div>')}function renderVocabShopping(e){renderVocabChapter(e,"Vocabulary 4 of 4","Shopping Words & Questions","12 words and question phrases built f
