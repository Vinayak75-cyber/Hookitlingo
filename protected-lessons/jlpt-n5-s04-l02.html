<style>
:root{
  --ink:#1c1420; --surface:#26192b; --surface2:#2f2035; --surface3:#3b2941;
  --border:#4a3550;
  --text:#f6ecec; --text-dim:#c7b2c4; --text-faint:#8f7a91;
  --vermilion:#e58aa2; --vermilion-dim:#5a2c3a;
  --celadon:#5fa688; --celadon-dim:#2a4a3d;
  --gold:#d9ab5c; --gold-dim:#5c471e;
  --inkblue:#a084c9; --inkblue-dim:#3a2c50;
  --petal:#f3b6c6;
  --radius:16px; --radius-sm:10px;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
  --maxw:880px;
  --fs-scale:1;
}
html[data-theme="light"]{
  --ink:#fdf3ef; --surface:#fffaf6; --surface2:#fbeee6; --surface3:#f5dfd6;
  --border:#eccabb;
  --text:#3a2530; --text-dim:#79576a; --text-faint:#a98a9c;
  --vermilion:#c8546f; --vermilion-dim:#f6dae2;
  --celadon:#3f7d63; --celadon-dim:#d9ece2;
  --gold:#a4762b; --gold-dim:#f2e2c2;
  --inkblue:#75509f; --inkblue-dim:#e7ddf2;
  --petal:#e59fb2;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; color:var(--text); font-family:var(--sans);
  font-size:calc(16px*var(--fs-scale)); line-height:1.65; transition:background .3s,color .3s;
  background:
    radial-gradient(1100px 620px at 12% -8%, color-mix(in srgb, var(--vermilion) 16%, transparent), transparent 58%),
    radial-gradient(900px 520px at 104% 6%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 55%),
    var(--ink);
  background-attachment:fixed;
}
body.print-mode{background:#fff;color:#111;}
::selection{background:var(--vermilion); color:#fff;}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; letter-spacing:.2px; margin:0 0 .5em;}
h1{font-size:2.1em;} h2{font-size:1.5em;} h3{font-size:1.22em;} h4{font-size:1.03em;}
p{margin:0 0 1em;}
a{color:var(--celadon);}
.jp{font-family:var(--jp);}
button{font-family:var(--sans); cursor:pointer;}
.hidden{display:none !important;}
ruby rt{font-size:.6em; color:var(--text-dim); user-select:none;}
.furigana-off rt{display:none;}

#app{display:flex; min-height:100vh; position:relative; z-index:2;}
#sidebar{
  width:280px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh; overflow-y:auto; padding:18px 14px 40px;
  transition:transform .3s; z-index:40;
}
#sidebar::-webkit-scrollbar{width:6px;} #sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 18px; border-bottom:1px solid var(--border); margin-bottom:14px;}
.brand-block{
  width:44px;height:44px;border-radius:50%; flex:none; position:relative;
  background:radial-gradient(circle at 33% 28%, color-mix(in srgb, var(--vermilion) 88%, #fff 12%), var(--vermilion) 72%);
  display:flex;align-items:center;justify-content:center; font-family:var(--jp); font-weight:700; font-size:16px; color:#fff9f7;
  transform:rotate(-7deg);
  box-shadow:0 4px 12px color-mix(in srgb, var(--vermilion) 50%, transparent), inset 0 0 0 2px color-mix(in srgb, #fff 22%, transparent);
}
.brand-txt strong{display:block; font-family:var(--serif); font-size:1.1em; letter-spacing:.2px;}
.brand-txt span{display:block; font-size:.68em; color:var(--text-faint); letter-spacing:.1em; text-transform:uppercase;}

.progress-mini{margin:0 8px 16px; padding:10px 12px; background:var(--surface2); border-radius:var(--radius-sm); border:1px solid var(--border);}
.progress-mini .row{display:flex; justify-content:space-between; font-size:.78em; color:var(--text-dim); margin-bottom:6px;}
.bar-track{height:6px; background:var(--surface3); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,var(--vermilion),var(--gold)); width:0%; transition:width .4s;}

.nav-group-label{font-size:.66em; text-transform:uppercase; letter-spacing:.1em; color:var(--text-faint); padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:8px 10px; border-radius:8px;
  background:transparent; border:none; color:var(--text-dim); font-size:.86em; margin-bottom:1px;
}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{background:var(--vermilion-dim); color:var(--vermilion); font-weight:600;}
html[data-theme="light"] .nav-item.active{color:#8a2c4a;}
.nav-item .dot{width:6px;height:6px;border-radius:50%; background:var(--border); flex:none;}
.nav-item.done .dot{background:var(--celadon);}
.nav-item .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.nav-item-support{
  background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
  margin-top:4px;
}
#mainWrap{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:10px 20px 14px; background:color-mix(in srgb, var(--ink) 85%, transparent); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
#menuBtn{display:none; background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 10px;}
.readbar-track{flex:1; height:4px; background:var(--surface2); border-radius:3px; overflow:hidden;}
.readbar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--celadon),var(--inkblue)); transition:width .15s;}
.topbtn{background:var(--surface2); border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:.85em; display:flex; align-items:center; gap:5px;}
.topbtn:hover{color:var(--text); border-color:var(--celadon);}
.topbtn.active-toggle{color:var(--gold); border-color:var(--gold-dim);}

main{flex:1; padding:36px 40px 80px; max-width:var(--maxw); margin:0 auto; width:100%;}
.chapter{display:none; animation:fadeIn .35s ease;}
.chapter.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
.eyebrow{font-size:.74em; letter-spacing:.14em; text-transform:uppercase; color:var(--vermilion); font-weight:700; margin-bottom:8px;}
.chapter-meta{display:flex; gap:14px; color:var(--text-faint); font-size:.82em; margin-bottom:26px; flex-wrap:wrap;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin:18px 0;}
.callout{border-left:3px solid var(--celadon); background:var(--celadon-dim); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 18px; margin:18px 0; color:var(--text);}
.callout.warn{border-color:var(--vermilion); background:var(--vermilion-dim);}
.callout.tip{border-color:var(--gold); background:var(--gold-dim);}
.callout.fact{border-color:var(--inkblue); background:var(--inkblue-dim);}
.callout-label{font-weight:700; font-size:.78em; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; display:block;}

.tile-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; margin:20px 0;}
.letter-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px;
  text-align:center; position:relative; transition:border-color .2s, transform .2s;
}
.letter-tile:hover{border-color:var(--celadon); transform:translateY(-2px);}
.letter-tile .glyph{font-family:var(--jp); font-size:2.4em; line-height:1; margin-bottom:6px; color:var(--text);}
.letter-tile .rom{font-family:var(--serif); font-style:italic; color:var(--gold); font-size:1.02em;}
.letter-tile .spk{margin-top:10px;}

.spk-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
  border-radius:20px; padding:5px 12px; font-size:.78em; display:inline-flex; align-items:center; gap:6px;
}
.spk-btn:hover{border-color:var(--vermilion); color:var(--vermilion);}
.spk-btn.loading{opacity:.6;}
.spk-btn.playing{border-color:var(--celadon); color:var(--celadon);}

.letter-detail{
  display:grid; grid-template-columns:180px 1fr; gap:24px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; margin:20px 0; align-items:start;
}
.letter-detail .big-glyph{font-family:var(--jp); font-size:5em; text-align:center; line-height:1; color:var(--text); background:var(--surface2); border-radius:var(--radius-sm); padding:20px 0;}
.letter-detail .facts{font-size:.92em;}
.letter-detail .facts dt{color:var(--text-faint); font-size:.75em; text-transform:uppercase; letter-spacing:.06em; margin-top:10px;}
.letter-detail .facts dd{margin:2px 0 0; color:var(--text);}
@media(max-width:640px){.letter-detail{grid-template-columns:1fr;}}

.petals{position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden;}
.petal{position:absolute; top:-8%; will-change:transform; animation:petal-fall linear infinite;}
.petal svg{display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));}
@keyframes petal-fall{
  0%{transform:translate(0,-10vh) rotate(0deg);}
  100%{transform:translate(var(--drift,50px), 112vh) rotate(340deg);}
}
@media (prefers-reduced-motion: reduce){ .petals{display:none;} }
@media print{ .petals{display:none;} }
@media(max-width:900px){ .petals .petal:nth-child(even){display:none;} }

.btn{background:linear-gradient(135deg,var(--vermilion), color-mix(in srgb, var(--vermilion) 55%, var(--gold) 45%)); color:#fff; border:none; border-radius:999px; padding:11px 22px; font-size:.9em; font-weight:600; letter-spacing:.2px;}
.btn:hover{filter:brightness(1.06); box-shadow:0 6px 18px color-mix(in srgb, var(--vermilion) 35%, transparent);}
.btn.secondary{background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:999px;}
.btn.secondary:hover{border-color:var(--celadon); color:var(--celadon);}
.btn:disabled{opacity:.4; cursor:default;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0;}
.next-lesson-card{margin:22px 0; padding:22px; border-radius:16px; background:linear-gradient(135deg, color-mix(in srgb, var(--vermilion) 10%, var(--surface2)), color-mix(in srgb, var(--gold) 14%, var(--surface2))); border:1px solid color-mix(in srgb, var(--vermilion) 25%, var(--border));}
.next-lesson-card .nlc-eyebrow{font-size:.75em; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--vermilion); margin-bottom:6px;}
.next-lesson-card .nlc-title{font-size:1.15em; font-weight:700; margin-bottom:6px;}
.next-lesson-card .nlc-desc{margin-bottom:14px; color:var(--text); opacity:.85; font-size:.95em; line-height:1.5;}
.next-lesson-card .nlc-progress{display:flex; align-items:center; gap:8px; margin-bottom:14px; font-size:.85em; opacity:.75;}
.next-lesson-card .nlc-dots{display:flex; gap:5px;}
.next-lesson-card .nlc-dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
.next-lesson-card .nlc-dot.done{background:var(--vermilion);}
.btn.big{padding:13px 28px; font-size:1em;}


.flash-wrap{max-width:420px; margin:20px auto;}
.flashcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); height:220px;
  display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px;
  cursor:pointer; user-select:none; position:relative;
}
.flashcard .fc-face{font-family:var(--jp); font-size:2.8em;}
.flashcard .fc-sub{color:var(--text-faint); font-size:.8em; margin-top:10px;}
.flashcard .fc-back{display:none;}
.flashcard.flipped .fc-front{display:none;} .flashcard.flipped .fc-back{display:flex; flex-direction:column; align-items:center;}
.flash-controls{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
.flash-counter{color:var(--text-faint); font-size:.85em;}

.quiz-q{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin:16px 0;}
.quiz-q .qtext{font-family:var(--jp); font-size:1.3em; margin-bottom:14px; white-space:pre-line;}
.quiz-q .qtext.eng{font-family:var(--sans); font-size:1.02em;}
.qopts{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){.qopts{grid-template-columns:1fr;}}
.qopt{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; text-align:left; color:var(--text); font-size:.95em;}
.qopt:hover{border-color:var(--celadon);}
.qopt.correct{background:var(--celadon-dim); border-color:var(--celadon); color:var(--celadon);}
.qopt.wrong{background:var(--vermilion-dim); border-color:var(--vermilion); color:var(--vermilion);}
.qopt:disabled{pointer-events:none;}
.qfeedback{margin-top:10px; font-size:.85em; color:var(--text-dim); min-height:1.2em;}
.quiz-score{font-family:var(--serif); font-size:1.4em; text-align:center; margin:20px 0;}

.gram-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px 26px; margin:22px 0;}
.gram-block .gnum{display:inline-block; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.95em; margin-bottom:2px;}
.gram-block h3{margin-bottom:4px;}
.gram-block .gsub{color:var(--text-dim); font-size:.92em; margin-bottom:16px;}
.gram-chip{background:var(--surface3); border-radius:10px; padding:8px 12px; text-align:center; min-width:70px; display:inline-block; margin:4px;}
.gram-chip .gc-jp{font-family:var(--jp); font-size:1.15em; color:var(--text);}
.gram-chip.is-particle .gc-jp{color:var(--vermilion);}
.gram-chip .gc-tag{display:block; font-family:var(--sans); font-size:.62em; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
.gram-example{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin:12px 0;}
.gram-example .ge-jp{font-family:var(--jp); font-size:1.15em; margin-bottom:4px;}
.gram-example .ge-en{color:var(--text-dim); font-size:.88em;}

.word-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:12px 0;}
.word-card .wc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
.word-card .wc-jp{font-family:var(--jp); font-size:1.5em;}
.word-card .wc-rom{color:var(--gold); font-family:var(--serif); font-style:italic;}
.word-card .wc-meaning{color:var(--text-dim); font-size:.92em; margin-top:4px;}
.tag{display:inline-block; font-size:.66em; text-transform:uppercase; letter-spacing:.06em; padding:2px 8px; border-radius:12px; background:var(--surface3); color:var(--text-faint); margin-right:6px;}

.badge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px; margin:18px 0;}
.badge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 10px; text-align:center; opacity:.35;}
.badge.earned{opacity:1; border-color:var(--gold);}
.badge .bicon{font-size:2em; margin-bottom:6px;}
.badge .bname{font-size:.76em; color:var(--text-dim);}

.sound-map{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:16px 0;}
.sound-map .sm-row{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 12px;}
.sound-map .sm-arrow{color:var(--text-faint); font-size:.85em;}
.sound-map .sm-jp{font-family:var(--jp); font-size:1.3em;}

.cover{min-height:calc(100vh - 60px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.presents{font-family:var(--sans); font-style:normal; color:var(--text-faint); font-size:.72em; letter-spacing:.28em; text-transform:uppercase; margin-bottom:10px;}
.cover-brand{font-family:"Rampart One",var(--sans); font-weight:400; font-size:4.6em; line-height:1; letter-spacing:.02em; margin:0; color:var(--gold); text-shadow:0 3px 0 color-mix(in srgb, var(--vermilion) 75%, transparent), 0 8px 20px color-mix(in srgb, var(--vermilion) 40%, transparent); display:flex; justify-content:center;}
.cover-brand span{display:inline-block;}
.cover-brand span:nth-child(1){transform:rotate(-6deg) translateY(2px);}
.cover-brand span:nth-child(2){transform:rotate(3deg) translateY(-4px);}
.cover-brand span:nth-child(3){transform:rotate(-2deg) translateY(3px);}
.cover-brand span:nth-child(4){transform:rotate(5deg) translateY(-2px);}
.cover-brand span:nth-child(5){transform:rotate(-4deg) translateY(4px);}
.cover-brand span:nth-child(6){transform:rotate(2deg) translateY(-3px);}
.cover-brand-jp{font-family:var(--jp); font-weight:600; font-size:1.85em; letter-spacing:.28em; color:var(--text-dim); margin:16px 0 34px; padding-left:.28em; display:flex; justify-content:center;}
.cover-brand-jp span{display:inline-block;}
.cover-brand-jp span:nth-child(1){transform:rotate(5deg) translateY(-2px);}
.cover-brand-jp span:nth-child(2){transform:rotate(-4deg) translateY(3px);}
.cover-brand-jp span:nth-child(3){transform:rotate(3deg) translateY(-3px);}
.cover-brand-jp span:nth-child(4){transform:rotate(-5deg) translateY(2px);}
.cover h1{font-size:2.7em; margin-bottom:6px;}
.cover .sub{color:var(--text-dim); font-size:1.1em; max-width:520px; margin:0 auto 26px;}
.cover-stats{display:flex; gap:30px; margin:26px 0; flex-wrap:wrap; justify-content:center;}
.cover-stats div{text-align:center;}
.cover-stats b{display:block; font-family:var(--serif); font-size:1.5em; color:var(--gold);}
.cover-stats span{color:var(--text-faint); font-size:.76em; text-transform:uppercase; letter-spacing:.06em;}

textarea.note-area{width:100%; min-height:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:10px; font-family:var(--sans); font-size:.9em; resize:vertical;}

.sb-box{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin:16px 0;}
.sb-answer{min-height:56px; border:1px dashed var(--border); border-radius:10px; padding:10px; display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; background:var(--surface2);}
.sb-chip{background:var(--surface3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-family:var(--jp); font-size:1.1em;}
.sb-chip:hover{border-color:var(--vermilion);}
.sb-chip.used{opacity:.3; pointer-events:none;}
.sb-eng{color:var(--text-faint); font-size:.85em; margin-top:2px;}
.sb-result{margin-top:8px; font-size:.85em; min-height:1.2em;}

.err-item{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--vermilion); border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:10px 14px; margin:10px 0; font-size:.9em;}
.err-item b{font-family:var(--jp); font-size:1.1em;}

.dialogue-line{display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 16px; margin:10px 0;}
.dialogue-line .dl-speaker{flex:none; width:88px; font-family:var(--serif); font-style:italic; color:var(--gold); font-size:.9em; padding-top:2px;}
.dialogue-line .dl-jp{flex:1; font-family:var(--jp); font-size:1.15em;}
.dialogue-line .dl-spk{margin-top:8px;}
details.passage{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; margin:16px 0;}
details.passage summary{cursor:pointer; color:var(--celadon); font-size:.85em; text-transform:uppercase; letter-spacing:.05em;}
details.passage .passage-en{margin-top:10px; color:var(--text-dim); font-size:.92em;}
.passage-jp{font-family:var(--jp); font-size:1.2em; white-space:pre-line; line-height:1.9;}
.passage-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:8px;}

.num-chart{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin:16px 0;}
.num-chart .nc-cell{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 8px; text-align:center;}
.num-chart .nc-cell.change{border-color:var(--vermilion);}
.num-chart .nc-jp{font-family:var(--jp); font-size:1.2em;}
.num-chart .nc-rom{font-size:.72em; color:var(--text-faint); margin-top:2px;}
.num-chart .nc-val{font-size:.7em; color:var(--gold); text-transform:uppercase; letter-spacing:.04em;}

<script>
const KANJI_SET_1=[{ch:"上",on:"ジョウ・ショウ",kun:"うえ・うわ・あ.げる・のぼ.る",meaning:"above, up",strokes:3,memory:'A short flag planted on a baseline, one stroke rising straight up off the line beneath it, about as literal a picture of "up" as a character gets.',ex:[["上","うえ","above, on top"],["上がる","あがる","to rise, go up"],["屋上","おくじょう","rooftop"]]},{ch:"下",on:"カ・ゲ",kun:"した・さ.げる・くだ.さる",meaning:"below, down",strokes:3,memory:"The mirror image of 上, the same flag now hanging beneath the baseline instead of above it. Once one of the pair clicks, the other tends to follow fast.",ex:[["下","した","below, under"],["下さい","ください","please give me"],["地下","ちか","underground"]]},{ch:"中",on:"チュウ",kun:"なか",meaning:"inside, middle",strokes:4,memory:"A box with a single line drawn straight through its center, the simplest possible picture of something passing right through the middle of something else.",ex:[["中","なか","inside, middle"],["中国","ちゅうごく","China"],["中学校","ちゅうがっこう","middle school"]]},{ch:"外",on:"ガイ・ゲ",kun:"そと・ほか・はず.れる",meaning:"outside",strokes:5,memory:"夕, evening, standing next to ト, a divination stroke used long ago outdoors after dark. Whatever the original story, it settled into meaning anything beyond the inside.",ex:[["外","そと","outside"],["外国","がいこく","foreign country"],["外国人","がいこくじん","foreigner"]]},{ch:"前",on:"ゼン",kun:"まえ",meaning:"front, before",strokes:9,memory:"A boat, 舟, tucked under a moving foot at the top, the picture of a boat pushing steadily forward, always toward whatever lies ahead of it.",ex:[["前","まえ","front, before"],["名前","なまえ","name"],["午前","ごぜん","morning, a.m."]]},{ch:"後",on:"ゴ・コウ",kun:"うし.ろ・あと・のち",meaning:"behind, after",strokes:9,memory:"A short step, 彳, a small thread, 幺, and a slow foot, 夂, dragging along at the very end, three pieces that together read as someone trailing behind the group.",ex:[["後ろ","うしろ","behind"],["午後","ごご","afternoon, p.m."],["後で","あとで","later, afterward"]]}],KANJI_SET_2=[{ch:"左",on:"サ",kun:"ひだり",meaning:"left",strokes:5,memory:"A hand, 工 t >`}function numCell(e,t,n,a){return`<div class="nc-cell${a?" change":""}"><div class="nc-jp">${e}</div><div class="nc-rom">${t}</div><div class="nc-val">${n}</div></div>`}function buildFlashcards(e){const t=document.createElement("div");t.className="flash-wrap";let n=0;return function a(){const r=e[n];t.innerHTML=`\n    <div class="flashcard" id="fcCard">\n      <div class="fc-front"><div class="fc-face jp">${r.jp}</div><div class="fc-sub">${r.rom||""} - tap to flip</div></div>\n      <div class="fc-back"><div class="fc-face">${r.en||r.rom}</div><div class="fc-sub jp">${r.jp}</div></div>\n    </div>\n    <div class="flash-controls">\n      <button class="btn secondary" id="fcPrev">← Prev</button>\n      <span class="flash-counter">${n+1} / ${e.length}</span>\n      <button class="btn secondary" id="fcNext">Next →</button>\n    </div>`,t.querySelector("#fcCard").onclick=e=>{e.currentTarget.classList.toggle("flipped")},t.querySelector("#fcPrev").onclick=()=>{n=(n-1+e.length)%e.length,a()},t.querySelector("#fcNext").onclick=()=>{n=(n+1)%e.length,a()}}(),t}function buildWordBuilder(e){const t=document.createElement("div");let n=0;return function a(){const r=e[n],i=shuffle(r.chips.map((e,t)=>({c:e,i:t})));t.innerHTML=`<div class="sb-box">\n      <div class="sb-eng">Spell: ${r.en}</div>\n      <div class="sb-answer" id="wbAnswer"></div>\n      <div class="sb-chips">${i.map(e=>`<button class="sb-chip" data-i="${e.i}">${e.c}</button>`).join(" ")}</div>\n      <div class="sb-result" id="wbResult"></div>\n      <div class="btn-row"><button class="btn secondary" id="wbReset">Reset</button> <button class="btn secondary" id="wbNext">Next Word →</button></div>\n    </div>`;const o=t.querySelector("#wbAnswer"),s=[];t.querySelectorAll(".sb-chip").forEach(e=>{e.onclick=()=>{if(e.classList.add("used"),s.push(parseInt(e.dataset.i,10)),o.innerHTML=s.map(e=>`<span class="sb-chip">${r.chips[e]}</span>`).join(""),s.length===r.chips.length){const e=s.every((e,t)=>e===t);t.querySelector("#w her they exist. に versus で for the location of things and the location of actions, seven spatial nouns for above, below, inside, and behind, the compass directions east, west, south, and north, and へ, the particle that points toward a destination, plus the next twelve N5 kanji and around forty-eight new words for furniture, rooms, and buildings.</div>\n    <div class="cover-stats">\n      <div><b>5</b><span>Grammar Points</span></div>\n      <div><b>12</b><span>New Kanji</span></div>\n      <div><b>48</b><span>New Vocabulary</span></div>\n      <div><b>5</b><span>Reading Passages</span></div>\n      <div><b>0</b><span>Romaji Crutches In The Final Test</span></div>\n    </div>\n    <button class="btn" onclick="goTo(\'intro\')">Begin Lesson →</button>\n  </div>'}function renderIntro(e){chapterHeader(e,"Warm-up","Placing Things in Space","Moving from saying that something exists to saying exactly where it is"),e.insertAdjacentHTML("beforeend",'\n  <p>Section 4, Lesson 1 taught you how to count things and how to say whether they exist at all, が あります for objects, が います for people and animals. This lesson takes the next natural step. It is one thing to say a cat exists, and another thing entirely to say where that cat actually is, on the sofa, under the chair, or out in the yard. By the end of this lesson you will be able to place anything exactly where it belongs, and describe where an action happens rather than just where a thing sits.</p>\n  <p>Two small particles carry most of the weight in this lesson. に marks the location of something that simply exists, sitting still, and で marks the location where an action takes place. Both attach to the same kind of location word, but they answer two different questions, is versus does. On top of that, you will meet seven spatial nouns, 上, 下, 中, 外, 前, and 後ろ, the words that describe position relative to something else, and the four compass directions, 東, 西, 南, and 北, fixed points that never shift depending on which way you happen to be facing. Finally, へ arrives as the particle that points a sentence toward a destination, the piece that lets you say where you are headed.</p>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>に and で are the two particles beginners mix up most often in this stretch of N5 grammar, since both can follow the exact same location word. The test that never fails: if the sentence ends in あります or います, the particle is に. If the sentence ends in almost any other verb, an action actually being done, the particle is で. Come back to that single rule any time the two feel blurry.</div>\n  <p>You will also meet all twelve of this lesson\'s kanji, six that describe position, 上, 下, 中, 外, 前, 後, and six more for left, right, and the four compass points, 左, 右, 東, 西, 南, 北. Several of these are visually related in pairs, 上 and 下 mirror each other, and so do 左 and 右, which makes this one of the more approachable kanji lessons in the roadmap despite covering a full dozen characters.</p>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>The reading passages later in this lesson only ever use grammar and vocabulary already taught by this exact point in the course, this lesson\'s spatial nouns, に and で, へ, and the counting and existence patterns from Section 4, Lesson 1. Nothing is borrowed from later sections, so every sentence should feel fully within reach.</div>\n  '),e.insertAdjacentHTML("beforeend",noteBox("intro"))}function renderGrammar1(e){chapterHeader(e,"Grammar 1 of 5","に, Marking Where Something Exists","The particle that answers the question is, not the question does"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>[Location] に [Thing/Person] が あります・います</h3>\n    <div class="gsub">に attaches directly to a place, then the thing or person being located follows with が, then あります or います closes the sentence.</div>\n    <div>${gramChip("へや","room")}${gramChip("に","location marker",!0)}${gramChip("ねこ","cat")}${gramChip("が","subject marker",!0)}${gramChip("います","exists")}</div>\n    ${gramExample("つくえの上に 本が あります。","There is a book on top of the desk.","つくえの<ruby>上<rt>うえ</rt></ruby>に <ruby>本<rt>ほん</rt></ruby>が あります。")}\n    ${gramExample("部屋に ベッドが あります。","There is a bed in the room.","<ruby>部屋<rt>へや</rt></ruby>に ベッドが あります。")}\n    ${gramExample("公園に 猫が います。","There is a cat in the park.","<ruby>公園<rt>こうえん</rt></ruby>に <ruby>猫<rt>ねこ</rt></ruby>が います。")}\n    <p>This pattern should feel familiar, Section 4, Lesson 1 already used it constantly, きょうしつに 学生が います among others. The difference this lesson makes is drawing full attention to what に is actually doing in that sentence, marking the fixed spot where something simply sits, with no action involved at all.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>Negating existence in a place</h3>\n    <div class="gsub">に does not change in the negative, only あります and います do.</div>\n    ${gramExample("へやに テレビは ありません。","There is no television in the room.")}\n    ${gramExample("庭に 犬は いません。","There is no dog in the yard.","<ruby>庭<rt>にわ</rt></ruby>に <ruby>犬<rt>いぬ</rt></ruby>は いません。")}\n    <p>Swap は in for が when the thing being talked about is already the topic, especially in the negative, exactly the pattern Section 2 introduced. に itself never moves, it always sits right after the location, no matter what the rest of the sentence is doing around it.</p>\n  </div>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>Think of に as a pin dropped on a map. It marks one fixed point and nothing more, it never describes movement and it never describes an action happening at that point, only the plain fact that something is sitting there.</div>\n  <h3>Quick Check</h3>\n  `);const t=[{q:"つくえの上＿ 本が あります。 (fill the blank)",isJp:!0,options:shuffle(["に","で","を","は"]),answer:"に"},{q:"公園＿ 猫が います。 (fill the blank)",isJp:!0,options:shuffle(["に","で","と","も"]),answer:"に"},{q:"Which particle marks the fixed location of something that simply exists?",options:shuffle(["に","で","を","が"]),answer:"に"},{q:"庭に 犬は いません。 means:",options:shuffle(["There is no dog in the yard.","There is a dog in the yard.","Is there a dog in the yard?","The dog left the yard."]),answer:"There is no dog in the yard."},{q:"What never changes about に, even in a negative sentence?",options:shuffle(["It stays fixed right after the location","It becomes では","It disappears entirely","It moves to the end of the sentence"]),answer:"It stays fixed right after the location"}];e.appendChild(buildQuiz("grammar-1-quiz",shuffle(t),"grammar-1")),e.insertAdjacentHTML("beforeend",noteBox("grammar-1"))}function renderGrammar2(e){chapterHeader(e,"Grammar 2 of 5","で, Marking Where Something Happens","The same kind of location word, but now something is actually being done there"),e.insertAdjacentHTML("beforeend",`\n  <div class="callout"><span class="callout-label">Preview Note</span>Full ます-form action verbs get their complete treatment in Section 5. For this one chapter, borrow just three verbs early, 話します (to speak), 勉強します (to study), and 買い物します (to shop), purely to see で in action. Nothing about their conjugation is tested until Section 5.</div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>[Location] で [Action]</h3>\n    <div class="gsub">で marks the place where an action happens, not where something sits still.</div>\n    <div>${gramChip("こうえん","park")}${gramChip("で","action location",!0)}${gramChip("話します","speak")}</div>\n    ${gramExample("公園で 話します。","I talk at the park.","<ruby>公園<rt>こうえん</rt></ruby>で <ruby>話<rt>はな</rt></ruby>します。")}\n    ${gramExample("図書館で 勉強します。","I study at the library.","<ruby>図書館<rt>としょかん</rt></ruby>で <ruby>勉強<rt>べんきょう</rt></ruby>します。")}\n    ${gramExample("店で 買い物します。","I shop at the store.","<ruby>店<rt>みせ</rt></ruby>で <ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>します。")}\n    <p>Every one of these sentences describes something actively happening, talking, studying, shopping, and every one of them uses で instead of に. Swap in あります or います at the end of any of these and で would be wrong, に would take over immediately.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>The に versus で minimal pair</h3>\n    <div class="gsub">Same location word, same surface meaning, two different jobs.</div>\n    ${gramExample("公園に 猫が います。","There is a cat in the park. (existence, に)","<ruby>公園<rt>こうえん</rt></ruby>に <ruby>猫<rt>ねこ</rt></ruby>が います。")}\n    ${gramExample("公園で 話します。","I talk in the park. (action, で)","<ruby>公園<rt>こうえん</rt></ruby>で <ruby>話<rt>はな</rt></ruby>します。")}\n    <p>Both sentences are about the same park, but they are answering two different questions. The first says what is there. The second says what happens there. Once that distinction clicks, choosing between に and で stops being a guessing game.</p>\n  </div>\n  <div class="callout warn"><span class="callout-label">Common Mistake</span>The single most common に and で mix-up among beginners is reaching for に out of habit any time a place word shows up, even in front of an action verb. Run the check every time, does the sentence end in あります or います? に. Does it end in almost anything else? で.</div>\n  <h3>Quick Check</h3>\n  `);const t=[{q:'図書館＿ 勉強します。 (fill the blank, "I study at the library.")',isJp:!0,options:shuffle(["で","に","を","へ"]),answer:"で"},{q:'公園＿ 猫が います。 (fill the blank, "There is a cat in the park.")',isJp:!0,options:shuffle(["に","で","を","と"]),answer:"に"},{q:"Which particle marks the location where an action is actively happening?",options:shuffle(["で","に","が","の"]),answer:"で"},{q:"店で 買い物します。 means:",options:shuffle(["I shop at the store.","There is a store.","I go to the store.","The store is closed."]),answer:"I shop at the store."},{q:"What is the fastest way to decide between に and で?",options:shuffle(["Check whether the sentence ends in あります・います or in another verb","Always use に with buildings","Always use で with animals","There is no real difference between them"]),answer:"Check whether the sentence ends in あります・います or in another verb"}];e.appendChild(buildQuiz("grammar-2-quiz",shuffle(t),"grammar-2")),e.insertAdjacentHTML("beforeend",noteBox("grammar-2"))}function renderGrammar3(e){chapterHeader(e,"Grammar 3 of 5","の上・下・中・前・後ろ, Naming the Exact Spot","Seven small nouns that turn a vague location into a precise one"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>[Noun] の [spatial noun] に</h3>\n    <div class="gsub">Attach a spatial noun to any object with の, then follow with に or で exactly as before.</div>\n    <div>${gramChip("上","うえ, above")}${gramChip("下","した, below")}${gramChip("中","なか, inside")}${gramChip("外","そと, outside")}${gramChip("前","まえ, front")}${gramChip("後ろ","うしろ, behind")}${gramChip("右","みぎ, right")}${gramChip("左","ひだり, left")}</div>\n    ${gramExample("つくえの上に 本が あります。","There is a book on top of the desk.","つくえの<ruby>上<rt>うえ</rt></ruby>に <ruby>本<rt>ほん</rt></ruby>が あります。")}\n    ${gramExample("いすの下に 猫が います。","There is a cat under the chair.","いすの<ruby>下<rt>した</rt></ruby>に <ruby>猫<rt>ねこ</rt></ruby>が います。")}\n    ${gramExample("はこの中に お金が あります。","There is money inside the box.","はこの<ruby>中<rt>なか</rt></ruby>に お<ruby>金<rt>かね</rt></ruby>が あります。")}\n    ${gramExample("学校の前に 公園が あります。","There is a park in front of the school.","<ruby>学校<rt>がっこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に <ruby>公園<rt>こうえん</rt></ruby>が あります。")}\n    ${gramExample("たなの後ろに かがみが あります。","There is a mirror behind the shelf.","たなの<ruby>後<rt>うし</rt></ruby>ろに かがみが あります。")}\n    <p>Every one of these spatial nouns works the same way, [something] の [spatial noun], then に or で. の here is doing exactly what it always does, connecting two nouns, the object and the position relative to it, into a single phrase before the particle attaches.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>後ろ takes an extra syllable that 上, 下, and 中 do not</h3>\n    <div class="gsub">後 alone usually means "after," 後ろ specifically means "behind, spatially."</div>\n    ${gramExample("午後",'afternoon, ごご, uses 後 alone for "after noon"',"<ruby>午後<rt>ごご</rt></ruby>")}\n    ${gramExample("たなの後ろ","behind the shelf, うしろ, needs the extra ろ for the spatial meaning","たなの<ruby>後<rt>うし</rt></ruby>ろ")}\n    <p>上, 下, and 中 stand on their own as spatial nouns exactly as written. 後 is the one exception in this set, reach for 後ろ, with the extra ろ, whenever the meaning is physically behind something, and save plain 後 for time-based meanings like after or later, which Section 8 covers in full.</p>\n  </div>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>Picture a single object, a box, and walk all seven spatial nouns around it in your head, on top, underneath, inside, outside, in front, behind, to the right, to the left. Running through the full set on one imaginary object is a fast way to make all seven stick together instead of drilling them one at a time.</div>\n  <h3>Quick Check</h3>\n  `);const t=[{q:"つくえの上に 本が あります。 means:",isJp:!0,options:shuffle(["There is a book on top of the desk.","There is a book under the desk.","There is a book inside the desk.","There is a book in front of the desk."]),answer:"There is a book on top of the desk."},{q:'How do you say "under the chair" as a spatial phrase?',isJp:!0,options:shuffle(["いすの下","いすの上","いすの中","いすの後ろ"]),answer:"いすの下"},{q:"Which spatial noun needs an extra syllable, ろ, to mean physically behind something?",isJp:!0,options:shuffle(["後ろ","前","中","外"]),answer:"後ろ"},{q:"たなの後ろに かがみが あります。 means:",isJp:!0,options:shuffle(["There is a mirror behind the shelf.","There is a mirror in front of the shelf.","There is a mirror inside the shelf.","There is a mirror above the shelf."]),answer:"There is a mirror behind the shelf."},{q:"What role does の play in a phrase like つくえの上?",options:shuffle(["It connects the object and the spatial noun into one phrase","It marks the subject of the sentence","It negates the sentence","It marks the location of an action"]),answer:"It connects the object and the spatial noun into one phrase"}];e.appendChild(buildQuiz("grammar-3-quiz",shuffle(t),"grammar-3")),e.insertAdjacentHTML("beforeend",noteBox("grammar-3"))}function renderGrammar4(e){chapterHeader(e,"Grammar 4 of 5","東西南北・右左, Two Kinds of Direction","Directions that shift with you, and directions that never do"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>右 and 左, relative direction</h3>\n    <div class="gsub">Right and left depend entirely on which way you happen to be facing.</div>\n    ${gramExample("郵便局は 銀行の右に あります。","The post office is to the right of the bank.","<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>は <ruby>銀行<rt>ぎんこう</rt></ruby>の<ruby>右<rt>みぎ</rt></ruby>に あります。")}\n    ${gramExample("図書館は 銀行の左に あります。","The library is to the left of the bank.","<ruby>図書館<rt>としょかん</rt></ruby>は <ruby>銀行<rt>ぎんこう</rt></ruby>の<ruby>左<rt>ひだり</rt></ruby>に あります。")}\n    <p>右 and 左 work exactly like the spatial nouns from the last chapter, [object] の 右・左 に. Their one quirk is that they are relative, turn around to face the opposite way and what was on your right is now on your left, the words themselves never change, only your position does.</p>\n  </div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>東西南北, absolute direction</h3>\n    <div class="gsub">The compass points never shift, no matter which way anyone is facing.</div>\n    <div>${gramChip("東","ひがし, east")}${gramChip("西","にし, west")}${gramChip("南","みなみ, south")}${gramChip("北","きた, north")}</div>\n    ${gramExample("郵便局は 駅の東に あります。","The post office is to the east of the station.","<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>は <ruby>駅<rt>えき</rt></ruby>の<ruby>東<rt>ひがし</rt></ruby>に あります。")}\n    ${gramExample("東京は 日本の東に あります。","Tokyo is in the east of Japan.","<ruby>東京<rt>とうきょう</rt></ruby>は <ruby>日本<rt>にほん</rt></ruby>の<ruby>東<rt>ひがし</rt></ruby>に あります。")}\n    <p>Turn around completely and east is still east, these four words describe fixed points on a map rather than anything relative to the speaker. Station exits in Japan are almost always labeled this way, 東口, 西口, 南口, and 北口, the east, west, south, and north exits, exactly the kind of signage this vocabulary prepares you to read.</p>\n  </div>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>右 and 左 are relative, but 東西南北 are absolute, and this distinction genuinely trips up travelers in real Japanese train stations, where a sign might say 東口 while a person giving directions says 右, and both can be correct at once depending on which way that person is currently facing.</div>\n  <h3>Quick Check</h3>\n  `);const t=[{q:"郵便局は 銀行の右に あります。 means:",isJp:!0,options:shuffle(["The post office is to the right of the bank.","The post office is to the left of the bank.","The post office is behind the bank.","The post office is inside the bank."]),answer:"The post office is to the right of the bank."},{q:"Which pair of direction words is relative, and changes depending on which way you are facing?",options:shuffle(["右・左","東・西","南・北","中・外"]),answer:"右・左"},{q:"Which pair of direction words is absolute, and never changes no matter which way you face?",options:shuffle(["東・西","右・左","上・下","前・後ろ"]),answer:"東・西"},{q:"東京は 日本の東に あります。 means:",isJp:!0,options:shuffle(["Tokyo is in the east of Japan.","Tokyo is in the west of Japan.","Tokyo is south of Japan.","Tokyo is north of Japan."]),answer:"Tokyo is in the east of Japan."},{q:"Station exit signs in Japan are most often labeled using which set of direction words?",options:shuffle(["東西南北","右左","上下","前後ろ"]),answer:"東西南北"}];e.appendChild(buildQuiz("grammar-4-quiz",shuffle(t),"grammar-4")),e.insertAdjacentHTML("beforeend",noteBox("grammar-4"))}function renderGrammar5(e){chapterHeader(e,"Grammar 5 of 5","へ, Pointing Toward a Destination","The particle that answers where you are headed, not where you already are"),e.insertAdjacentHTML("beforeend",`\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>[Destination] へ 行きます・来ます</h3>\n    <div class="gsub">へ marks the direction or destination of movement, used with a movement verb.</div>\n    <div>${gramChip("学校","school")}${gramChip("へ","toward, direction",!0)}${gramChip("行きます","go")}</div>\n    ${gramExample("学校へ 行きます。","I go to school.","<ruby>学校<rt>がっこう</rt></ruby>へ <ruby>行<rt>い</rt></ruby>きます。")}\n    ${gramExample("駅へ 行きます。","I go to the station.","<ruby>駅<rt>えき</rt></ruby>へ <ruby>行<rt>い</rt></ruby>きます。")}\n    <p>行きます, to go, and 来ます, to come, are two of the movement verbs Section 5 covers in full. This lesson only needs them long enough to show へ doing its one job, pointing a sentence toward wherever it is headed.</p>\n  </div>\n  <div class="callout fact"><span class="callout-label">Fun Fact</span>Written anywhere else in a sentence, へ is pronounced he, exactly like it looks. Used as this particle, it is pronounced e instead, silently dropping the h sound, one of a small handful of Japanese particles that are pronounced differently from how they are normally read.</div>\n  <div class="gram-block">\n    <span class="gnum">Pattern</span>\n    <h3>へ and に, close cousins</h3>\n    <div class="gsub">For a simple destination, the two are largely interchangeable at N5 level.</div>\n    ${gramExample("学校へ 行きます。","I go to school. (direction, slightly emphasizing the journey)","<ruby>学校<rt>がっこう</rt></ruby>へ <ruby>行<rt>い</rt></ruby>きます。")}\n    ${gramExample("学校に 行きます。","I go to school. (destination, slightly emphasizing the arrival point)","<ruby>学校<rt>がっこう</rt></ruby>に <ruby>行<rt>い</rt></ruby>きます。")}\n    <p>Both sentences translate the same way and both are correct. へ leans very slightly toward the path or direction being traveled, while に leans very slightly toward the destination itself as a fixed point. The difference is subtle enough that native speakers use both constantly and interchangeably in everyday conversation, this course simply wants you comfortable recognizing either one.</p>\n  </div>\n  <div class="callout tip"><span class="callout-label">Teacher Tip</span>If a sentence has a place followed immediately by 行きます or 来ます, either へ or に will almost always sound natural. Save your energy for the harder particle decision this lesson actually tests, に versus で, and treat へ versus に as the much smaller, more forgiving choice that it is.</div>\n  <h3>Quick Check</h3>\n  `);const t=[{q:'学校＿ 行きます。 (fill the blank, "I go to school.")',isJp:!0,options:shuffle(["へ","を","が","で"]),answer:"へ"},{q:"How is へ pronounced when it is used as this particle?",options:shuffle(["e","he","we","ye"]),answer:"e"},{q:"What does へ mark in a sentence?",options:shuffle(["The direction or destination of movement","The location where an action happens","The location where something exists","The direct object of a verb"]),answer:"The direction or destination of movement"},{q:"Which two verbs did this chapter preview to demonstrate へ?",isJp:!0,options:shuffle(["行きます・来ます","あります・います","食べます・飲みます","話します・買います"]),answer:"行きます・来ます"},{q:"At N5 level, how do へ and に generally compare when marking a simple destination?",options:shuffle(["Largely interchangeable, both are correct","Completely different meanings","へ is only for people, に is only for places","に is always wrong before 行きます"]),answer:"Largely interchangeable, both are correct"}];e.appendChild(buildQuiz("grammar-5-quiz",shuffle(t),"grammar-5")),e.insertAdjacentHTML("beforeend",noteBox("grammar-5"))}function renderKanji1(e){chapterHeader(e,"Kanji 1 of 2","Kanji: 上・下・中・外・前・後","Six kanji that describe position, above, below, inside, outside, front, and behind"),e.insertAdjacentHTML("beforeend","<p>These six kanji describe position relative to something else, and several of them are visually built as mirrored pairs, 上 and 下 especially. Each kanji below comes with its readings, its meaning, a memory hook, and real compound words, several of which reuse kanji you already know from Sections 2 and 3.</p>"),e.insertAdjacentHTML("beforeend",kanjiTileGrid(KANJI_SET_1)),e.insertAdjacentHTML("beforeend","<h3>Kanji Details</h3>"+kanjiDetails(KANJI_SET_1)),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const t=KANJI_SET_1.map(e=>{const t=sample(ALL_KANJI.filter(t=>t.ch!==e.ch),3).map(e=>e.meaning);return{q:e.ch,isJp:!0,options:shuffle([e.meaning,...t]),answer:e.meaning}});e.appendChild(buildQuiz("kanji-1-quiz",shuffle(t),"kanji-1")),e.insertAdjacentHTML("beforeend",noteBox("kanji-1"))}function renderKanji2(e){chapterHeader(e,"Kanji 2 of 2","Kanji: 左・右・東・西・南・北","Left, right, and the four fixed points of the compass"),e.insertAdjacentHTML("beforeend",'<div class="callout fact"><span class="callout-label">Fun Fact</span>左 and 右 share the exact same reaching hand at their core, just mirrored, and all four compass kanji, 東, 西, 南, and 北, are among the oldest and most recognizable characters in the entire writing system, largely unchanged for well over a thousand years. Learn these six well and station signage across Japan becomes instantly readable.</div>'),e.insertAdjacentHTML("beforeend",kanjiTileGrid(KANJI_SET_2)),e.insertAdjacentHTML("beforeend","<h3>Kanji Details</h3>"+kanjiDetails(KANJI_SET_2)),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const t=KANJI_SET_2.map(e=>{const t=sample(ALL_KANJI.filter(t=>t.ch!==e.ch),3).map(e=>e.meaning);return{q:e.ch,isJp:!0,options:shuffle([e.meaning,...t]),answer:e.meaning}});e.appendChild(buildQuiz("kanji-2-quiz",shuffle(t),"kanji-2")),e.insertAdjacentHTML("beforeend",noteBox("kanji-2"))}function renderVocabChapter(e,t,n,a,r,i,o,s){chapterHeader(e,t,n,a),e.insertAdjacentHTML("beforeend",`<p>${r}</p>`),e.insertAdjacentHTML("beforeend",wordCards(i)),s&&e.insertAdjacentHTML("beforeend",s),e.insertAdjacentHTML("beforeend","<h3>Quick Check</h3>");const l=i.map(e=>{const t=sample(i.filter(t=>t.jp!==e.jp),3).map(e=>e.en);return{q:e.jp,isJp:!0,options:shuffle([e.en,...t]),answer:e.en}});e.appendChild(buildQuiz(o+"-quiz",shuffle(l),o)),e.insertAdjacentHTML("beforeend",noteBox(o))}function renderVocabFurniture(e){renderVocabChapter(e,"Vocabulary 1 of 4","Furniture & Room Items","12 words for the everyday objects sitting inside any room","Every one of these words pairs naturally with the spatial nouns from this lesson, たなの隣に まどが あります, the shelf is next to the window, is exactly the kind of sentence this vocabulary was built for.",VOCAB_FURNITURE,"vocab-furniture",'<div class="callout tip"><span class="callout-label">Teacher Tip</span>Look around whatever room you are in right now and try labeling three real objects using this list, then place each one using a spatial noun from Grammar 3, いすは つくえの前に あります. Real objects stick far better than a list read in isolation.</div>')}function renderVocabRooms(e){renderVocabChapter(e,"Vocabulary 2 of 4","Rooms of a House","12 words for the rooms and spaces that make up a home",'部屋 is the general word for room and shows up constantly attached to other words, 寝室, literally "sleeping room," and 居間, literally "living room," both build directly off concepts you already recognize. アパート and マンション both translate loosely to apartment in English, but アパート usually describes a smaller, older building while マンション describes a larger, more modern one.',VOCAB_ROOMS,"vocab-rooms",null)}function renderVocabLocation(e){renderVocabChapter(e,"Vocabulary 3 of 4","Location & Direction Words","12 words for describing position beyond the seven core spatial nouns","近く and 遠く are used constantly as their own small phrases, 駅の近くに あります, it is near the station, without needing anything more elaborate attached. あちら, こちら, and どちら are the polite cousins of あれ, これ, and どれ from Section 3, same core logic, softer register.",VOCAB_LOCATION,"vocab-location",'<div class="callout warn"><span class="callout-label">Common Mistake</span>近く means "nearby" as a place itself, not an adjective describing something as close. 近くに 公園が あります, there is a park nearby, works, but reaching for 近く the way you would reach for an adjective like "close" in English will produce an odd sentence. That fuller adjective use waits until Section 6.</div>')}function renderVocabBuildings(e){renderVocabChapter(e,"Vocabulary 4 of 4","Buildings & Landmarks","12 common landmarks worth being able to name and locate","These are exactly the kind of places a traveler ends up asking directions to constantly, 駅, 銀行, and 郵便局 especially. 店 is one of the nine kanji from Section 3, and now it slots directly into every spatial and direction pattern this lesson has taught.",VOCAB_BUILDINGS,"vocab-buildings",'<div class="callout fact"><span class="callout-label">Fun Fact</span>交番, the small neighborhood police box, is a genuinely useful landmark to know by name while traveling in Japan, since asking for directions at one is extremely common and officers stationed there are used to fielding exactly that kind of question from lost visitors.</div>')}function renderFullReview(e){chapterHeader(e,"Mastery","Full Chart Flashcards","Every kanji from this lesson, one deck"),e.insertAdjacentHTML("beforeend","<p>Flip through all twelve kanji from this lesson until you can name the meaning of each one without hesitating.</p>");const t=ALL_KANJI.map(e=>({jp:e.ch,rom:e.on+" / "+e.kun,en:e.meaning}));e.appendChild(buildFlashcards(shuffle(t))),e.insertAdjacentHTML("beforeend","<h3>Word Builder Puzzle</h3><p>Spell each word by tapping its scrambled kana chips in the right order.</p>"),e.appendChild(buildWordBuilder(WORD_BUILD)),e.insertAdjacentHTML("beforeend",noteBox("full-review"))}function renderReading(e){chapterHeader(e,"Mastery","Reading: Where Is It?","Five short passages, built only from grammar and kanji this lesson has taught"),e.insertAdjacentHTML("beforeend","<p>Read each passage aloud before checking the English underneath. Kanji only appears here when it has already been taught, everything else stays in kana on purpose, and only the particles and spatial nouns this lesson actually teaches get used for describing location.</p>"),READING_PASSAGES.forEach(t=>{e.insertAdjacentHTML("beforeend",`<details class="passage">\n      <div class="passage-head"><h4 style="margin:0">${t.who}</h4>${spkBtn(t.jp.replace(/\n/g," "))}</div>\n      <div class="passage-jp jp">${t.furi||t.jp}</div>\n      <summary>Show English</summary>\n      <div class="passage-en">${t.en}</div>\n    </details>`)}),e.insertAdjacentHTML("beforeend",'<div class="callout tip"><span class="callout-label">Practice Steps</span>Cover the English translation, read the Japanese aloud line by line, then open it to check yourself. Try reading all five passages out loud a second time before moving to the quiz below.</div>'),e.insertAdjacentHTML("beforeend","<h3>Comprehension Check</h3>"),e.appendChild(buildQuiz("reading-quiz",shuffle(READING_QUIZ.map(e=>({q:e.q,options:shuffle(e.options),answer:e.answer}))),"reading")),e.insertAdjacentHTML("beforeend",noteBox("reading"))}function renderListening(e){chapterHeader(e,"Mastery","Listening: Asking Directions","A traveler stopping a local resident to find the post office"),e.insertAdjacentHTML("beforeend","<p>Play each line and follow along, then read the same line back out loud yourself before moving to the next one.</p>"),LISTENING_DIALOGUE.forEach(t=>{e.insertAdjacentHTML("beforeend",`<div class="dialogue-line"><div class="dl-speaker">${t.speaker}</div><div><div class="dl-jp">${t.furi||t.jp}</div><div class="dl-spk">${spkBtn(t.jp)}</div></div></div>`)}),e.insertAdjacentHTML("beforeend",'<div class="callout fact"><span class="callout-label">Fun Fact</span>どういたしまして, you\'re welcome, is used a little more sparingly in natural Japanese than its English equivalent, plenty of native speakers simply smile, nod, or say nothing at all after being thanked for small favors like directions. Using it after ありがとうございます is still completely correct and exactly what this course teaches.</div>'),e.insertAdjacentHTML("beforeend","<h3>Comprehension Check</h3>"),e.appendChild(buildQuiz("listening-quiz",shuffle(LISTENING_QUIZ.map(e=>({q:e.q,options:shuffle(e.options),answer:e.answer}))),"listening")),e.insertAdjacentHTML("beforeend",noteBox("listening"))}function renderReview(e){chapterHeader(e,"Finish","Review Without Looking at Your Notes"),e.insertAdjacentHTML("beforeend",'\n  <div class="card"><h3>に and で</h3><p>Can you explain, in your own words, when to use に and when to use で, and build one correct example sentence with each?</p></div>\n  <div class="card"><h3>Spatial Nouns</h3><p>Can you name all seven spatial nouns from this lesson, 上, 下, 中, 外, 前, and 後ろ, right and left included, and use each one in a sentence with の?</p></div>\n  <div class="card"><h3>Direction Words</h3><p>Can you explain the difference between relative direction, 右 and 左, and absolute direction, 東西南北, and give one real example of each?</p></div>\n  <div class="card"><h3>へ</h3><p>Can you build a sentence that uses へ to point toward a destination, and explain how it is pronounced when used this way?</p></div>\n  <div class="card"><h3>Kanji</h3><p>Can you read and give the meaning of all twelve kanji from this lesson, <span class="jp">上 下 中 外 前 後 左 右 東 西 南 北</span>, on sight?</p></div>\n  <div class="card"><h3>Vocabulary and Reading</h3><p>Can you name at least one furniture word, one room word, and one building from this lesson, and read all five reading passages aloud without stumbling?</p></div>\n  <div class="callout tip"><span class="callout-label">Teacher\'s Advice</span>に versus で is the single grammar point most worth drilling until it feels automatic, everything else in this lesson builds directly on top of it. Practice describing the room you are sitting in right now, out loud, using this lesson\'s spatial nouns, and the rest tends to fall into place quickly.</div>\n  '),e.insert
